         SPREAD ACROSS THE WHOLE COMPARTMENT: a bank of it mid-frame reads as
         ions already gathered, and nothing gathers them until a pore does. */
      for (let i = 0; i < 28; i++)
        traveller('CL', { x:rnd(-SPREAD*0.92, SPREAD*0.92), z:rnd(-10,10),
                          y:inCompartment(1), shell:true,
                          walk:true, speed:ION_SPEED, conducts:LANE,
                          blocked:true, bounded:true });

      /* THE ONE THAT DOES NOT GET IN, or "a hole with a preference" is a
         caption over a picture of a hole. Na⁺'s BARE radius is smaller than
         K⁺'s and is drawn that way: the exclusion is about what an ion
         arrives WEARING, not what it measures, and it ARRIVES DRESSED AND
         STAYS DRESSED because only K⁺ can trade its shell for the filter.

         TURNED AWAY BY BOTH PORES, on fit at one and charge at the other.
         NO KEEPOUT — it is drawn to a mouth and turned back AT the filter
         (refuseAt()), so the claim is in the picture. Counts keep the
         compartment neutral: 16 K⁺ + 12 Na⁺ against 28 Cl⁻. */
      for (let i = 0; i < 11; i++)
        traveller('NA', { x:rnd(-SPREAD*0.9, SPREAD*0.9), z:rnd(-10,10),
                          y:inCompartment(1), shell:true, seeks:true,
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      /* THE LABELLED ONE IS PLACED, not drawn from the scatter — the
         compartment runs past the top of the frame, so a random pick starts
         off-screen more often than not. */
      const firstNa = traveller('NA', { x:-SPREAD*0.42, z:rnd(-6,6),
                          y:HALF + 20, shell:true, seeks:true,
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      /* NAME THE TWO PORES, anchored at each mouth rather than on a
         traveller: a label on an ion reads as a label FOR that ion. */
      const mouthY = () => T.height * 0.95;
      /* NO DIRECTION IN THE NAME: "out" states a direction as a property of
         the channel, the misconception the caption exists to kill — and for
         chloride it is near false at rest. Direction belongs to the corner
         tally, counted off transits that happened. */
      NOTES.add({ text:'K⁺ channel', offset:[-40, -30],
                  at:() => _np.set(-LANE, mouthY(), 0),
                  card:'A water-lined pore straight through, so a K⁺ crosses ' +
                       'without ever touching the oil. It is open, it is ' +
                       'free, and nothing about it is switched on.' });
      NOTES.add({ text:'Cl⁻ channel', offset:[ 40, -30],
                  at:() => _np.set( LANE, mouthY(), 0),
                  card:'Chloride is high outside, so it runs inward — the ' +
                       'opposite way to the K⁺ beside it. Direction is set ' +
                       'by the gradient, never by the protein.' });
      /* FLUID MOSAIC BELONGS HERE: both halves of the name are on screen for
         the first time. Anchored well right of the pores, so it reads as a
         fact about the SHEET and not a third label on the channels. */
      NOTES.add({ text:'fluid mosaic', offset:[44, 44],
                  at:() => _np.set(150, -HALF, 0),
                  card:'The lipids slide against each other — the sheet is a ' +
                       'liquid, not a wall. <b>Mosaic</b> is these proteins ' +
                       'set into it, drifting in the same liquid.' });
      /* ON AN ION, NOT ON A SPOT. This is the one label naming something
         HAPPENING rather than something built: riding a seeking Na⁺ means
         the student watches the labelled ion go to a mouth and come away. */
      noteOn(firstNa, 'Na⁺ passes neither', [34, -26],
             'Smaller than K⁺, and it still cannot use the K⁺ filter: it ' +
             'holds its water too tightly to trade the shell for the pore. ' +
             'The Cl⁻ pore turns it away on charge.');

      mV = 0; chargeOut = 0; crossed.K = crossed.CL = 0;
      voltBox.checked = voltOn;         // a re-entered step keeps the choice
      /* Water stays out of the pore. It does cross the bilayer, but that is
         step 3's point — here it would look like a second thing the channel
         passes. Enough of it to read as liquid: the ions are what the
         student is following, but a near-empty stage is not a solution. */
      for (let i = 0; i < 34; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             keepout:CHANNEL_KEEPOUT,
                             y:(i % 2 ? 1 : -1) * rnd(HALF + 3, OFFSCREEN * 0.85),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
    },
  },

  {
    id:'pump',
    tab:'the pump',
    cap:'<b>Active transport uses ATP to move substances against their ' +
        'concentration gradient through membrane pumps.</b>',
    enter() {
      clearTravellers();
      showProtein(PUMP); showMembrane('pump'); setCut(true);

      /* THE CELL THE CHANNEL STEP LEFT BEHIND — same cast, but levelled,
         which is where that tab ends when nothing opposes the leak. The
         student watched channels spend a gradient; this step answers who
         bought it. Levelled means 0 mV, not by staging: equal concentrations
         have no diffusion potential to have. */
      const half = (kind, n, opts) => {
        for (let i = 0; i < n; i++)
          traveller(kind, Object.assign({
            x:rndClear(SPREAD*0.75), z:rnd(-10,10),
            y:inCompartment(i % 2 ? 1 : -1),
            shell:true, walk:true, speed:ION_SPEED,
            blocked:true, bounded:true,
          }, opts));
      };
      half('K', 16); half('NA', 12); half('CL', 28);
      /* WATER STAYS OUT OF THE PUMP: this step's claim is that what crosses
         is chosen and paid for. rndClear() places it clear and `keepout`
         holds it there, both off the pore list. */
      for (let i = 0; i < 34; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             y:inCompartment(i % 2 ? 1 : -1),
                             keepout:CHANNEL_KEEPOUT,
                             walk:true, bounded:true, coreSpeed:WATER_CORE });

      /* Parked at the start of the cycle, not looping: a pump that runs for
         free contradicts the one thing this step teaches. The student spends
         the ATP, and one ATP buys exactly one turn. */
      pumpT = 0; running = false;
      for (const t of travellers) t.aboard = false;
      cargo.NA.length = 0; cargo.K.length = 0; lastPhase = '';
      atpSpent = 0;
      mV = 0; chargeOut = 0; crossed.K = crossed.CL = 0;
      spendEl.hidden = false; spendEl.disabled = false;

      /* STATIC, while the caption runs live off the cycle. These name the
         parts, which do not change — the caption already rewrites itself
         every phase, and that is enough moving text. */
      noteAt(0, T.height * 0.98, 'a carrier, not a pore', [-46, -30],
             'It binds its cargo and changes shape, so it is never open to ' +
             'both sides at once. A pore cannot do that, which is why a ' +
             'pore can never push anything uphill.');
      /* ON THE BUTTON, in pixels — the one anchor not in the scene, because
         the claim is about the TRANSACTION, not a part of the protein. Solved
         each frame: placeControls() moves the button. */
      NOTES.add({ text:'1 ATP = 1 turn', offset:[-40, -26],
                  atPx: () => {
                    if (spendEl.hidden) return null;
                    const b = spendEl.getBoundingClientRect();
                    /* The LAYER's box, not the stage's — the layer is the
                       coordinate frame annotate.js places into. */
                    const st = NOTES.el.getBoundingClientRect();
                    return [b.left - st.left + b.width / 2, b.top - st.top];
                  },
                  card:'One press buys one turn: 3 Na⁺ out and 2 K⁺ in, both ' +
                       'against their gradients. Uphill is the thing the ATP ' +
                       'is paying for.' });
    },
  },

  {
    id:'rest',
    tab:'a cell at rest',
    cap:'',                             // written live, below
    enter() {
      clearTravellers();
      showProtein('rest'); showMembrane('rest'); setCut(true);

      /* THE CELL AS IT ACTUALLY IS: a channel and a pump in one sheet, both
         running, the counts holding still while ATP burns. That standing
         still is the point, and it is NOT equilibrium — stop paying and it
         comes apart, which is what the switch is for.

         K⁺ leaks out through the channel and the pump brings it back: a
         loop, and the reason the cell never finishes paying. Na⁺ is on the
         wrong side and the pump throws it out three at a time, with nothing
         bringing it back — a clean-up, not a cycle, and the copy does not
         call it one. The ANIONS never move across, and that is exactly their
         contribution. */
      for (let i = 0; i < 20; i++)
        traveller('K', { x:rndClear(SPREAD*0.7), z:rnd(-10,10),
                         y:inCompartment(-1), shell:true,
                         walk:true, speed:ION_SPEED, conducts:-REST_LANE,
                         blocked:true, bounded:true });
      for (let i = 0; i < 4; i++)
        traveller('K', { x:rndClear(SPREAD*0.7), z:rnd(-10,10),
                         y:inCompartment(1), shell:true,
                         walk:true, speed:ION_SPEED, conducts:-REST_LANE,
                         blocked:true, bounded:true });
      /* MOSTLY OUTSIDE, as it is in a real cell (~145 mM out against ~12 in)
         and as steps 2 and 3 already draw it. The four inside are the leak
         the pump is clearing, not the population — seed them inside and the
         tally states that a resting cell is sodium-loaded.

         Four inside is also what makes the cytosol add up: 20 K⁺ + 4 Na⁺
         against 24 A⁻. */
      for (let i = 0; i < 14; i++)
        traveller('NA', { x:rndClear(SPREAD*0.7), z:rnd(-10,10),
                          y:inCompartment(1), shell:true,
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      for (let i = 0; i < 4; i++)
        traveller('NA', { x:rndClear(SPREAD*0.7), z:rnd(-10,10),
                          y:inCompartment(-1), shell:true,
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      /* DOWN IN THE CYTOSOL, not up against the membrane — protein and
         phosphate anions are the bulk of the interior, not a layer lining
         the surface, and at the inner face they sit exactly where the pump
         and channel are working. `yband` keeps them down. */
      for (let i = 0; i < 24; i++)
        traveller('A', { x:rndClear(SPREAD*0.85), z:rnd(-11,11),
                         y:rnd(-farY(), -farY() * 0.42),
                         yband:[-farY(), -farY() * 0.38],
                         walk:true, speed:[2, 5],       // heavy and slow
                         blocked:true, bounded:true });
      for (let i = 0; i < 28; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             y:inCompartment(i % 2 ? 1 : -1),
                             keepout:CHANNEL_KEEPOUT,
                             walk:true, bounded:true, coreSpeed:WATER_CORE });

      pumpOn = true; pumpBox.checked = true;
      pumpT = 0; running = false;
      for (const t of travellers) t.aboard = false;
      cargo.NA.length = 0; cargo.K.length = 0; lastPhase = '';
      atpSpent = 0; chargeOut = 0; mV = 0;
      spendEl.hidden = true;

      /* Both halves of the lesson are on stage at once here, so the callouts
         are the ones that say which half is which. */
      noteAt(-REST_LANE, T.height * 0.98, 'K⁺ leaks out, free', [-40, -30],
             'K⁺ is high inside, so it drifts out through the channel and ' +
             'nothing stops it. Downhill costs nothing.');
      noteAt(REST_PUMP_X, T.height * 0.98, 'pumps K⁺ back, paid', [42, -30],
             'The pump carries K⁺ back in and Na⁺ out, burning one ATP a ' +
             'turn. It is undoing the leak next door, over and over.');
      /* ON THE TALLY IT IS ABOUT, in pixels — the corner tallies are chrome,
         not scene (annotate.js's atPx). AND IT NAMES K⁺, not "the counts":
         paintIons() tallies K⁺ and Cl⁻ only, and the sodium, the most visible
         ion on screen, is not counted at all. NO NUMBERS IN THE LABEL — it is
         pinned to the tally, so a number here is the same fact twice. */
      NOTES.add({
        text:'K⁺ holds', offset:[44, -26],
        atPx: () => {
          if (ionsInEl.hidden || ionsInEl.parentElement.hidden) return null;
          const b = ionsInEl.getBoundingClientRect();
          const st = NOTES.el.getBoundingClientRect();
          return [b.right - st.left, b.top - st.top + b.height / 2];
        },
        card:'Nothing here has settled — a leak and a pump are running flat ' +
             'out and cancelling. Switch the pump off and watch what ' +
             'equilibrium actually looks like.' });
    },
  },
];

/* ATP IS NOT AN OBJECT ON STAGE: at this scale its shape reads as nothing,
   and a lilac blob invites "what is that molecule". The transaction is what
   matters, and the student performs it — a chip flies from the button. */
/* ---- the pump's cargo is REAL IONS ----
   A spend RECRUITS travellers out of the solution, the same objects the rest
   of the page walks around, so setting them down on the far side changes the
   counts and moves the voltage. A private cargo pool makes "3 Na⁺ out, 2 K⁺
   in" an animation instead of a result. membrane/pump.js owns the
   choreography; this only decides WHICH ions ride. */
let pumpT = 0, running = false, atpSpent = 0;
/* THE PUMP RUNS ITSELF at rest, because a resting cell's does: here the
   lesson is the standing cost, and a cost you have to click for is not one.
   The pump step keeps its one-turn-per-press rule, where the transaction IS
   the lesson. */
let pumpOn = true;
const cargo = { NA: [], K: [] };
const PUMP_LOAD = { NA:-1, K:1 };       // the side each is picked up from

/* Nearest to the pump's axis, on the required side, not already aboard. */
function recruit(kind, n) {
  const side = PUMP_LOAD[kind];
  const pool = travellers
    .filter(t => t.kind === kind && !t.aboard && Math.sign(t.y) === side)
    .sort((a, b) => ((a.x - pumpX) ** 2 + a.y * a.y) -
                    ((b.x - pumpX) ** 2 + b.y * b.y));
  /* ALL OR NOTHING: the resting step calls this every frame, and a short list
     with its ions already flagged aboard strands them — aboard ions are not
     advanced, so they freeze while the next frame grabs more. */
  if (pool.length < n) return [];
  const took = pool.slice(0, n);
  for (const t of took) t.aboard = true;
  return took;
}

/* Where a rider sits this frame. `u` is membrane/pump.js's coordinate, mapped
   to the PROTEIN and not the frame: these ions arrive under their own steam,
   so the path ends at the two mouths. */
function seatRider(t, c, i, n) {
  const rr = n > 1 ? ionRadius(t.kind) * 1.15 : 0;
  const th = (i / n) * Math.PI * 2;
  const tx = pumpX + Math.cos(th) * rr, tz = Math.sin(th) * rr;
  const ty = c.u * T.height;
  /* Eased, not snapped: a recruit is somewhere in the cytosol when it is
     called, and it has to be seen arriving at the mouth. */
  const k = 0.16;
  t.x += (tx - t.x) * k; t.z += (tz - t.z) * k; t.y += (ty - t.y) * k;
  t.obj.position.set(t.x, t.y, t.z);
}

/* Set down on the FAR side and let go — ONE SPECIES AT A TIME, on the cycle's
   own boundaries. Unloading both at the end of a turn parks the sodium back
   at the mouth it came in by, pushed into the cell it just left. */
function deliver(kind) {
  const to = -PUMP_LOAD[kind];
  for (const t of cargo[kind]) {
    t.aboard = false;
    t.y = to * T.height * 1.15;
    t.x = pumpX + rnd(-18, 18); t.z = rnd(-8, 8);
    t.obj.position.set(t.x, t.y, t.z);
    repick(t);
    t.vy = Math.abs(t.vy) * to;         // moving away from the pump, not into it
  }
  cargo[kind].length = 0;
}
/* PAID UP FRONT, so the counter moves when the ATP does. A real pump
   phosphorylates itself at the START of the cycle — the hydrolysis is what
   drives the conformational change, not a receipt issued once the cargo has
   landed — and on screen the chip flies in, the count ticks, and the turn
   begins as one event. Counted at the end instead, the student presses Spend
   and watches eleven seconds of pumping against a readout still saying 0.
   Both places a turn can start go through here. */
function startTurn() {
  pumpT = 0; running = true; lastPhase = '';
  atpSpent++;
}
function finishCycle() {
  /* ELECTROGENIC: one net charge out per turn, so the pump builds part of
     the voltage too. */
  chargeOut += 1;
  mV = Math.max(-95, MV_PER_ION * chargeOut);
}

/* Which phase we were in last frame, so a boundary can be acted on once. */
let lastPhase = '';

/* ---- one frame of the cycle ----
   Shared by the pump step and the resting step. They differ in what STARTS a
   turn — a button there, the pump's own appetite here — and in nothing else,
   which is the point: the machine is the same machine. */
function runPumpCycle(dt) {
  if (running) {
    pumpT += dt / 11;                   // seconds for one full turn
    if (pumpT >= 1) {                   // one ATP bought exactly one turn
      pumpT = 0; running = false;
      deliver('K');                     // the last drop-off of the turn
      finishCycle();
      lastPhase = '';
      spendEl.disabled = false;
    }
  }
  const st = Pump.at(pumpT);
  T.setGates(st.gates.top, st.gates.bottom);

  /* THE HANDOVER, ON THE CYCLE'S OWN BOUNDARY: sodium is outside by the time
     load-k begins, so it is set down there and the potassium called then —
     one cargo at a time. Read off the phase name, so membrane/pump.js decides
     when and this only decides who. */
  if (running && st.phase !== lastPhase) {
    if (st.phase === 'load-k') {
      deliver('NA');                    // three sodiums land outside
      cargo.K = recruit('K', 2);        // and only now are two K⁺ called
    }
    lastPhase = st.phase;
  }

  /* FAN THE CARGO ROUND THE AXIS: membrane/pump.js spreads ions in normalised
     units and cannot know how big one is drawn, so at this exaggeration they
     fuse. Sideways, not further along the path — the site is a pocket. */
  const used = { NA:0, K:0 };
  const seats = st.cargo.reduce((a, c) => (a[c.species] = (a[c.species] || 0) + 1, a), {});
  for (const c of st.cargo) {
    const i = used[c.species]++;
    const t = cargo[c.species][i];
    if (!t) continue;                   // nothing recruited: nothing rides
    seatRider(t, c, i, seats[c.species]);
  }
}

/* ---- spending an ATP ----
   The chip flies from the BUTTON to the pump, so the press and the phosphate
   arriving are one event. A DOM chip because it starts on a DOM button. */
function flyATP(done) {
  const b = spendEl.getBoundingClientRect();
  const chip = document.createElement('div');
  chip.className = 'fly';
  chip.textContent = 'ATP';
  chip.style.left = (b.left + b.width / 2) + 'px';
  chip.style.top  = (b.top + b.height / 2) + 'px';
  document.body.appendChild(chip);

  /* The pump in page pixels, projected: the chip lands on the protein
     wherever the camera has put it. */
  const p = new THREE.Vector3(0, -HALF * 0.6, 0).project(L.camera);
  const r = canvas.getBoundingClientRect();
  const x = r.left + (p.x * .5 + .5) * r.width;
  const y = r.top + (-p.y * .5 + .5) * r.height;

  requestAnimationFrame(() => {
    chip.style.left = x + 'px';
    chip.style.top = y + 'px';
    chip.style.opacity = '0';
  });
  /* Fires on the transition, timer as backstop: a backgrounded tab never
     runs it, and the pump must still start. */
  let fired = false;
  const go1 = () => { if (fired) return; fired = true; chip.remove(); done(); };
  chip.addEventListener('transitionend', go1);
  setTimeout(go1, 1000);
}

spendEl.addEventListener('click', () => {
  if (running) return;
  spendEl.disabled = true;
  flyATP(() => {
    /* RECRUITED WHEN THE ATP LANDS, so the press and the loading are one
       event. Each cargo comes from the side its own gradient would carry it
       AWAY from — what "uphill" means. SODIUM ONLY: the potassium is called
       at the load-k boundary, or the site holds five ions at once. */
    cargo.NA = recruit('NA', 3);
    startTurn();
  });
});

/* ---- the osmosis overlay ----
   EVERY NUMBER HERE IS COUNTED, not typed: the totals are the travellers
   actually on each side this frame, so the two converge on their own, which
   is the point of the step. */
const _op = new THREE.Vector3();
function paintOsmo() {
  /* "water", not "free water": with no shells on this step there is no bound
     water to distinguish it from. */
  let inside = 0, outside = 0;
  for (const t of travellers) {
    if (t.kind !== 'water') continue;
    if (t.y < 0) inside++; else outside++;
  }
  osmoOutEl.firstElementChild.textContent = outside;
  osmoInEl.firstElementChild.textContent = inside;

  /* THE WORD IS READ FROM THE COUNT: a typed "hypertonic" is WRONG by the end
     of the run, since the two sides finish isotonic. Tonicity is a RELATION,
     not a property one side owns — the same salt water is hypertonic to a
     cell and hypotonic to seawater — so the labels flip together. */
  const gap = outside - inside;
  const tone = Math.abs(gap) <= 3 ? ['isotonic', 'isotonic']
             : gap < 0 ? ['hypertonic', 'hypotonic']   // less water outside
                       : ['hypotonic', 'hypertonic'];
  setHTML(osmoOutEl.lastElementChild, 'water · outside<br><em>' + tone[0] + '</em>');
  setHTML(osmoInEl.lastElementChild, 'water · inside<br><em>' + tone[1] + '</em>');

  /* The membrane IN PIXELS, projected rather than assumed: the chrome reserve
     pushes world y=0 above the canvas centre, so a tally at a fixed 25%/75%
     lands in the wrong compartment at some window sizes. */
  const r = canvas.getBoundingClientRect();
  const mid = _op.set(0, 0, 0).project(L.camera);
  const midY = (1 - (mid.y * .5 + .5)) * r.height;
  const x = r.width * 0.20;
  osmoOutEl.style.left = osmoInEl.style.left = x + 'px';
  osmoOutEl.style.top = clampY(midY * 0.5, 70) + 'px';
  osmoInEl.style.top = clampY(midY + (r.height - midY) * 0.5, 70) + 'px';

  /* The arrow states the NET, and only once the net has said something, or
     it spins on every molecule. It points the way the counter went; nothing
     tells it which way osmosis "should" go. */
  const net = netRecent;
  const on = Math.abs(net) >= 3;
  /* FADES WITH THE NET, from a floor high enough to stay legible — a
     conclusion at 20% opacity reads as a rendering fault. Keep the ramp tied
     to NET_HALFLIFE: a longer half-life settles netRecent proportionally
     larger, and a stale divisor pins the arrow at full strength. */
  osmoArrowEl.style.opacity =
    on ? Math.min(0.95, 0.62 + Math.abs(net) / (NET_HALFLIFE * 6)) : 0;
  if (on) {
    /* up = out of the cell. The SVG points up, so a downward net flips it
       rather than being drawn twice. */
    osmoArrowG.setAttribute('transform', net > 0 ? '' : 'rotate(180 23 75)');
    osmoNetEl.textContent = 'net ' + Math.abs(net).toFixed(0) + (net > 0 ? ' out' : ' in');
  }
  osmoArrowEl.style.left = (r.width * 0.78) + 'px';
  osmoArrowEl.style.top = midY + 'px';
}

/* THE BAND THE OVERLAYS MAY USE. Their vertical placement is solved from the
   projected membrane, which knows nothing about the caption floating over the
   TOP of the stage, so a high tally lands behind the text. */
function clampY(y, pad) {
  const top = chromeEl.offsetHeight + pad, bot = canvas.clientHeight - pad;
  return Math.max(top, Math.min(bot, y));
}

/* ---- the voltage overlay ----
   NO CHARGE SKINS: rows of + and − along the faces are a bar gauge drawn with
   characters, which looks like a COUNT and is not one. The tallies carry the
   fact and the caption carries the surface part in words. */
function paintVolt() {
  const r = canvas.getBoundingClientRect();
  const mid = _op.set(0, 0, 0).project(L.camera);
  const midY = (1 - (mid.y * .5 + .5)) * r.height;
  const face = _op.set(0, HALF, 0).project(L.camera);
  const faceY = (1 - (face.y * .5 + .5)) * r.height;
  const half = Math.max(6, Math.abs(midY - faceY));

  /* BOTH NUMBERS ARE COUNTED: the transit count is the voltage's own working.
     THE UNIT RIDES THE NUMBER — two 46px figures stacked read as one
     instrument in one unit, so "mV" belongs in the figure, not the label. */
  setHTML(voltReadEl.firstElementChild, Math.round(mV) + '<small> mV</small>');
  /* "balanced", not "stopped". At equilibrium the pore is still open and
     ions still move through it both ways — what has gone is the NET, and
     "stopped" teaches that the channel shut. Name the ion, too: "leaking"
     names none and reads as a fault. */
  const stepId = STEPS[cur] && STEPS[cur].id;
  setHTML(voltReadEl.lastElementChild, 'inside<br><em>' +
    (stepId === 'rest'
      ? (pumpOn ? 'held by the pump' : 'running down')
      : stepId === 'pump'
      ? (atpSpent ? atpSpent + ' ATP spent building this' : 'nothing spent yet')
      : drive('K') <= 0.001 ? 'balanced · no net flow' : 'K⁺ still leaving') + '</em>');
  setHTML(voltRefEl.firstElementChild, '0<small> mV</small>');
  setHTML(voltRefEl.lastElementChild, 'outside<br><em>reference</em>');

  /* THE BILL ON THE PUMP STEPS, THE TRAFFIC ON THE CHANNEL. Where a pump is
     running, what it costs is the number the step is about, and the cargo
     tallies beside it are the same fact multiplied by 3 and 2. The channel
     has nothing to spend, so there it is an arrow PER CURRENT, pointing the
     way that ion actually went (up is out, the page's convention). */
  setHTML(voltCountEl, stepId === 'rest' || stepId === 'pump'
    ? '<span>ATP spent</span><b>' + atpSpent + '</b>'
    : '<span>ions crossed</span><b>' + chargeOut + '</b> · ' +
      'K⁺ ↑ ' + crossed.K + ' · Cl⁻ ↓ ' + crossed.CL);

  /* THE VOLTAGE SITS INSIDE, the BOTTOM half — membrane/pump.js's u = −1 is
     the cytoplasmic mouth and every step follows it. THE PAIR ON THE LEFT, THE
     TALLY ON THE RIGHT: reading and reference are one measurement across the
     membrane, so they face each other, and the running total sits clear
     rather than reading as a third value in that comparison. */
  const x = r.width * 0.17;
  voltReadEl.style.left = voltRefEl.style.left = x + 'px';
  voltReadEl.style.top = clampY(midY + half + 74, 64) + 'px';   // inside, below
  voltRefEl.style.top  = clampY(midY - half - 74, 64) + 'px';   // outside, above
  /* No positioning: pinned to the stage's bottom-right corner in CSS, not
     solved against the membrane, because it measures nothing about a side. */
}

/* ---- the ion census ----
   COUNTED OFF THE TRAVELLERS every frame, by the side each is actually on —
   ions in a pore included. Nothing here knows the starting numbers, so the
   corners cannot disagree with the scene they describe. */
function paintIons() {
  const n = { out:{ K:0, CL:0 }, in:{ K:0, CL:0 } };
  for (const t of travellers) {
    if (t.kind !== 'K' && t.kind !== 'CL') continue;
    n[t.y >= 0 ? 'out' : 'in'][t.kind]++;
  }
  const line = c => '<b>K⁺ ' + c.K + '</b> · <b>Cl⁻ ' + c.CL + '</b>';
  setHTML(ionsOutEl, '<span>outside</span>' + line(n.out));
  setHTML(ionsInEl, line(n.in) + '<span>inside</span>');
}

/* ---- has it arrived? ----
   TWO MODES, TWO EQUILIBRIA, and saying which is the point of the badge. No
   voltage: the flow stops when the concentrations level, gradient spent.
   Voltage: it stops far earlier, where the electrical pull cancels the
   concentration push and the gradient is still standing. Read off the same
   state the traffic reads, so the badge cannot claim an equilibrium over a
   pore still passing ions. */
function equilibrium() {
  /* Not "no current" — two currents that cancel. */
  if (voltOn) return Math.abs(netPush()) < 0.04;
  return crowdedSide('K') === 0 && crowdedSide('CL') === 0;
}
function paintEqBadge() {
  const on = equilibrium();
  eqBadgeEl.classList.toggle('is-on', on);
  if (on) {
    /* TWO DIFFERENT EQUILIBRIA, and the word alone cannot tell them apart:
       diffusion (stored energy gone) against electrochemical, for the two
       ions with pores only. Neither means the cell is finished — both mean
       it has finished LEAKING. */
    eqBadgeEl.firstElementChild.textContent = voltOn
      ? 'K⁺ and Cl⁻ at equilibrium'
      : 'Concentrations at equilibrium';
    eqBadgeEl.lastElementChild.textContent = voltOn
      ? 'two currents cancelling · the gradient survives'
      : 'levelled out · the stored gradient is gone';
  }
}

/* WHAT THE CHROME DISPLACES, now that it is at the top: everything anchored
   to the TOP edge has to clear it, and nothing anchored to the bottom does.
   Measured, never typed — the block's height is whatever the tallest caption
   made it, and a fixed offset is right for one caption and wrong on the next
   tab. The bottom row is free of it entirely, so those are plain constants. */
function placeControls() {
  const h = chromeEl.offsetHeight;
  ionsOutEl.style.top = (h + 12) + 'px';
  eqBadgeEl.style.top = (h + 12) + 'px';
  /* The stage's own bottom edge, with the switches above the buttons so a
     setting never sits between the reader and the action. */
  ctlEl.style.bottom = '16px';
  launchEl.style.bottom = '16px';
  spendEl.style.bottom = '62px';
  ionsInEl.style.bottom = '14px';
  shellsTogEl.style.bottom = '14px';
  /* THE LEDGER SITS OPPOSITE THE OUTSIDE TALLY, both under the chrome: the
     two corner readouts are the same kind of thing — a running count of what
     the step has done — so they belong on the same line. That leaves the
     bottom-right to the shells switch alone, with nothing to stack around. */
  voltCountEl.style.top = (h + 12) + 'px';
}

/* WRITE ONLY ON CHANGE. Assigning innerHTML rebuilds the node's children, so
   reassigning the same string sixty times a second reflows and flickers.
   Every live caption on this page goes through here. */
function setHTML(el, html) {
  if (el._html !== html) { el._html = html; el.innerHTML = html; }
}

/* ---- step machinery ---- */
let cur = -1;
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pill pill--ghost';
  b.textContent = s.tab;
  b.addEventListener('click', () => go(i));
  stepsEl.appendChild(b);
});

function go(i) {
  cur = i;
  const s = STEPS[i];
  s.enter();
  setHTML(capEl, s.cap);
  [...stepsEl.children].forEach((b, j) =>
    j === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
  stepBox = (s.id === 'bilayer' || s.id === 'through') ? CLOSE_BOX : WIDE_BOX;
  const from = L.cam.r;
  L.fit();
  liftScene();
  /* fit() moves the camera, so the offscreen line is only knowable after it.
     Re-enter, and the molecules land against the frame that is drawn. SOLVED
     AT THE DESTINATION, not part-way through the ease: a molecule spawned
     during the move belongs to the frame the step is settling into. */
  solveOffscreen();
  /* The first fit is a cut — there is nothing to ease from. */
  if (camWant != null) { camWant = L.cam.r; L.cam.r = from; liftScene(); }
  else camWant = L.cam.r;
  s.enter();
  /* GLOBAL MEANS EVERY STEP: enter() has just built a cast that knows nothing
     about the setting. Applied here once — a step that has to remember is a
     step where the corner switch silently stops working. */
  syncShells();
  /* THE CLOSE-UP BELONGS TO ONE STEP, and it is driven from here for the same
     reason the toggle above is: a step that has to remember to hide someone
     else's box is a step that eventually forgets. Step 1 is the only one that
     names the parts of a lipid; after that the lesson is about what CROSSES
     the sheet, and a ball-and-stick in the corner is competing with it.
     kit/molbox.js stops rendering on its own when this goes hidden. */
  lipidBox.hidden = s.id !== 'bilayer';
}

/* ---------- the close-up's callout (annotate.js) ----------
 * GLYCOLYSIS' CONTRACT, not molecule-viewer's: the SPEC says where the kink
 * is and this page says only that it wants it and what to call it. `cis` is
 * POPC's own handle — the same four atoms check-molecules.js measures the
 * torsion across — so a spec that were re-baked and renumbered moves this
 * callout with it instead of leaving it pointing at a carbon in the middle
 * of a straight chain.
 *
 * AND THE BOND IS DERIVED, not typed as a second index that can go stale
 * against the first (glycolysis-lab's spotPair, same reasoning): the kink is
 * the ONE order-2 bond among those four atoms, found from the spec's own
 * bond list. Nothing here knows that it is C9=C10.
 */
function cisDoubleBond(spec) {
  if (!spec || !spec.cis || !spec.cis.atoms) return null;
  const set = new Set(spec.cis.atoms);
  return (spec.bonds || []).find(
    b => b[2] === 2 && set.has(b[0]) && set.has(b[1])) || null;
}
const _kinkA = new THREE.Vector3(), _kinkB = new THREE.Vector3(),
      _kinkM = new THREE.Vector3();
/* The MESHES, not the spec's coordinates: buildMolecule centres the atoms and
   bakes the spec's `view:` into them, so raw spec positions would land the dot
   a plausible distance from the bond it names — the trap lobes-test documents
   as `like:`. Returning null hides the note rather than parking it at the
   origin, which is what annotate.js does with a falsy anchor. */
function kinkAnchor() {
  const g = lipidInset && lipidInset.group;
  const b = g && cisDoubleBond(lipidInset.spec);
  if (!b) return null;
  const A = g.userData.atomMeshes[b[0]], B = g.userData.atomMeshes[b[1]];
  if (!A || !B) return null;
  return _kinkM.copy(A.getWorldPosition(_kinkA))
               .add(B.getWorldPosition(_kinkB)).multiplyScalar(0.5);
}

let LIPID_NOTES = null;      // assigned below; afterFrame can fire before it

/* ---------- what the close-up is a close-up OF ----------
 * A REAL SEAT, asked of the membrane rather than typed: the lattice starts at
 * -reach and the protein steps carve seats out of it, so a coordinate picked
 * by eye here would eventually name a lipid that is not there. Upper leaflet,
 * out on the right where the box hangs, and on the mid-plane in z so the
 * marked lipid is one of the near ones the student is actually looking at.
 *
 * Asked of MEM, which is whichever sheet the current step shows — the solid
 * one here, and step 1 is the only step this box appears on anyway. */
const _lipidPt = new THREE.Vector3();
function lipidLeaderAt() {
  /* WELL LEFT OF THE BOX, and that is a legibility choice rather than a
     chemical one: every seat in the sheet is the same lipid, so the one
     worth marking is the one that makes the wedge read as a wedge. A seat
     directly under the frame gives two lines a few pixels apart. */
  const seat = MEM.seatNear(24, 0, +1);
  if (!seat) return null;
  const p = _lipidPt.copy(seat).project(L.camera);
  if (p.z < -1 || p.z > 1) return null;      // behind the camera: no line
  const host = document.getElementById('stage');
  return [(p.x + 1) / 2 * host.clientWidth, (1 - p.y) / 2 * host.clientHeight];
}

/* ONE inset for the page, not one per entry into step 1. A second WebGL
   context is a real resource and the browser drops the OLDEST when a page
   passes its cap, so a box rebuilt per step would eventually blank the main
   stage with no error at all. `show()` is how it would change molecule. */
const lipidInset = Molbox.create({
  mount: document.getElementById('lipidView'),
  spec: MolLib.MOLECULES.popc,
  /* NO TURNTABLE, now that a callout points into the box. A label tracks a
     spinning molecule correctly and still reads badly: in 152 px the words
     swing around the frame, and the kink they name spends half of every turn
     behind the tails. The declared `view:` was chosen to show that bond, so
     the box holds it — and Stage.create's orbit is still on, which leaves
     turning it something the student can do rather than something that
     happens at them. */
  /* Guarded because Molbox.create draws ONE frame synchronously, to leave the
     box non-blank before rAF starts — and at that moment the notes below do
     not exist yet. */
  afterFrame: () => LIPID_NOTES && LIPID_NOTES.step(),
  /* The page projects, because the SCENE's camera is the page's — the inset's
     own camera is looking at the close-up, never at where it came from. */
  leader: { host: document.getElementById('stage'), at: lipidLeaderAt, markR: 9 },
});

/* Into `view`, which is the canvas's own box — the frame is 25 px taller
   because of the caption, and projecting into that skews every dot. */
LIPID_NOTES = Annot.create(THREE, lipidInset.view, lipidInset.stage.camera,
                           { mode:'on' });
LIPID_NOTES.add({
  text:'the kink',
  /* LEFT, because the kinked tail is the right-hand one — a label thrown the
     same way as the bond it names has to cross the molecule to get clear. */
  offset:[-27, -18],
  /* NO `card:`. The words are in the caption under the title instead — a card
     needs room to open and this box has none, and annotate.js only makes the
     dot clickable when there is one, so the label stays a label. */
  at: kinkAnchor,
});

function tick(dt) {
  const s = STEPS[cur]; if (!s) return;
  kit.faceCamera(L.camera);               // badges are sprites; they must turn
  /* Only the sheet on stage: stirring the hidden ones is work nobody sees,
     and they are most of the lipid in the scene. */
  MEM.tick(dt);                           // the bilayer is a liquid, so it moves
  tickBirth(dt);                          // step 2's launches, scaling up
  /* Exponential, so it arrives without a hard stop, and cut off at a distance
     no one can see — an ease that never finishes calls applyCam() forever. */
  if (camWant != null && Math.abs(L.cam.r - camWant) > 0.05) {
    L.cam.r += (camWant - L.cam.r) * (1 - Math.pow(0.002, dt / CAM_EASE));
    liftScene();
  }

  if (s.id === 'rest') {
    /* THE PUMP FEEDS ITSELF HERE, re-arming the moment a turn ends — no
       button, because the point is that it never stops while the cell is
       alive. */
    if (pumpOn && !running && cargo.NA.length === 0) {
      const got = recruit('NA', 3);
      if (got.length) { cargo.NA = got; startTurn(); }
    }
    runPumpCycle(dt);

    for (const t of travellers) if (!t.aboard) advance(t, dt);
    keepClear(travellers.filter(t => (ELEMENT_OF[t.kind] || t.kind === 'A') && !t.aboard));
    for (const t of travellers) keepOutOfPores(t);

    setHTML(capEl, pumpOn
      ? '<b>Even at rest, a cell constantly uses energy to maintain the proper flow of ions that is key to their function.</b>'
      : '<b>The pump is off — watch the counts level and the voltage fade.</b>');
  } else if (s.id === 'pump') {
    runPumpCycle(dt);
    /* Everything NOT aboard is ordinary solution and keeps walking — the pump
       is a machine standing in a crowd, not the only thing on stage. */
    for (const t of travellers) if (!t.aboard) advance(t, dt);
    keepClear(travellers.filter(t => ELEMENT_OF[t.kind] && !t.aboard));
    for (const t of travellers) keepOutOfPores(t);
    spendEl.hidden = false;
  } else {
    spendEl.hidden = true;
    for (const t of travellers) {
      const was = t.y;
      advance(t, dt);
      if (s.id === 'osmosis' && !t.blocked) {
        if (was > 0 && t.y <= 0) { crossings.down++; netRecent -= 1; }
        if (was < 0 && t.y >= 0) { crossings.up++;   netRecent += 1; }
      }
    }
    if (s.id === 'osmosis')
      netRecent *= Math.pow(0.5, dt / NET_HALFLIFE);
    if (s.id === 'channel') {
      /* WALL EXCLUSION RUNS LAST: keepClear() knows nothing about the
         proteins, so run first it undoes the wall correction. Whatever moves
         a traveller last decides where it is. */
      keepClear(travellers.filter(t => ELEMENT_OF[t.kind]));
      for (const t of travellers) keepOutOfPores(t);
      /* WHERE THE COAT COMES OFF: at the mouth, or the ion entered the filter
         wearing a shell that does not fit. Off the protein's own height. */
      const mouth = T.height * 0.9;
      for (const t of travellers) {
        if (!shellsOn) continue;
        /* An ion that LEFT the pore still has a shell to get back and is no
           longer in a lane: gate on `lane` alone and every conducted ion
           wanders the cytosol stripped, which nothing in a cell is. */
        if (t.lane == null && !t.shellOff) continue;
        if (!t.shellOff && Math.abs(t.y) < mouth) shedShell(t);
        /* Re-dressed on the far side, whichever way it travelled — the K⁺
           queue runs out, the Cl⁻ queue in — so "past the mouth" is about
           DISTANCE from the membrane, not sign. */
        else if (t.shellOff && Math.abs(t.y) > mouth) growShell(t);
      }
    }
    tickShells(dt);
  }
  /* CHROME BELONGS OUT HERE, past the per-step branches above: a toggle
     hidden inside one branch stays on screen over the steps that return
     early. */
  sweepGone();                            // step 2's launches, once they exit
  placeControls();
  /* Hidden where the row would be empty — an empty pill row still reserves
     height and reads as a control that failed to load. */
  ctlEl.hidden = s.id !== 'channel' && s.id !== 'rest';
  launchEl.hidden = s.id !== 'through';
  /* THE CHANNEL STEP'S SWITCH, AND ONLY ITS. The potential is in play on
     both protein steps whether or not anyone asks, so there is nothing to
     decide and a dead control invites a click that does nothing — they print
     the mV on stage instead. voltOn is NOT forced here: nothing downstream
     reads the box (see potentialOn()), and re-entering the channel step
     restores the student's own choice. */
  voltBox.parentElement.hidden = s.id !== 'channel';
  voltBox.parentElement.classList.remove('is-fixed');
  voltBox.disabled = false;
  /* The pump switch is the resting step's whole argument — stop paying and
     watch it come apart — so it belongs nowhere else. */
  pumpBox.parentElement.hidden = s.id !== 'rest';
  /* THE SAME INSTRUMENTS AS THE CHANNEL STEP, deliberately: the student
     watched these numbers fall, the pump step is them going back up, and a
     second set of readouts would hide that it is the same quantity. */
  ionsEl.hidden = s.id !== 'channel' && s.id !== 'pump' && s.id !== 'rest';
  if (!ionsEl.hidden) paintIons();
  if (s.id === 'channel') paintEqBadge();      // a pumped cell is never at one
  else eqBadgeEl.classList.remove('is-on');
  voltEl.hidden = (s.id === 'pump' || s.id === 'rest') ? false
                : s.id !== 'channel' || !voltOn;
  if (!voltEl.hidden) paintVolt();
  NOTES.step();                           // trap 1: in the RENDER loop
  osmoEl.hidden = s.id !== 'osmosis';
  if (!osmoEl.hidden) paintOsmo();
}

/* ---- ?step=N, the same jump as a URL. Clamped, so ?step=99 opens the last
 * step rather than an empty stage. 1-based over STEPS, matching krebs-lab:
 * ?step=3 is osmosis, which is what the node graph's osmosis card links to. */
go((() => {
  const m = /[?&]step=(\d+)/.exec(location.search);
  return m ? Math.max(1, Math.min(STEPS.length, +m[1])) - 1 : 0;
})());
L.start();
</script>
</body>
</html>
