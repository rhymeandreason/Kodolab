<style>
  /* WHAT THIS PAGE OWNS. Everything else is pathways.css.

     NO TRAY. Both siblings stand their carriers in a column beside the stage,
     because there a carrier is what a step SPENDS and the column is where spent
     things go. Here the carrier is what the pathway is FOR, so NADH stands in
     the lanes as a molecule and hands its hydride over in frame. That leaves
     the left inset free, which is why nothing below reserves it. */

  /* THE BRANCH TABS, in the rail bar beside the numbers. A branch is not a
     step, so it cannot be a rail stop; and it is not a mode either — both are
     the same pathway answering the same question, which is what putting them on
     one bar says. */
  #branchtabs{display:flex;gap:6px;position:absolute;right:22px;top:50%;
    transform:translateY(-50%)}
  .btab{font-family:var(--font-ui);font-weight:600;font-size:13px;
    letter-spacing:.3px;color:var(--muted);background:transparent;
    border:1px solid var(--hair);border-radius:var(--radius);
    padding:6px 15px;cursor:pointer}
  .btab:hover{color:var(--ink);border-color:var(--ink)}
  .btab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);
    color:var(--paper);cursor:default}
  /* THE CONDITION THE BRANCH RUNS UNDER, under its own tab, and the only place
     the page says it. What sends pyruvate down either branch is the ABSENCE of
     oxygen — a precondition, not a reaction, so it has no step to live on. */
  /* UNDER THE RAIL, NOT UNDER THE TABS. It sat at the bar's right edge, which
     is the column the ledger sticker occupies — and the ledger is up by default
     now, so it covered the one place the page states the precondition. Centred,
     it reads with the rail it qualifies: these steps, under this condition. */
  #branchwhen{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(50% + 19px);white-space:nowrap;
    font-family:var(--font-sans);font-size:12.5px;letter-spacing:.2px;
    color:var(--muted);text-align:center;pointer-events:none}
  #railbar{padding-bottom:24px}

  /* THE ENZYME'S NAME, BOTTOM-RIGHT: a caption on the blob it names, so it
     leaves pathways.css's place in the readout column and takes #tools'
     corner — on the SIDEBAR'S left margin, not the screen's right edge, since
     it is the bottom of that column. The two numbers are pathways.css's 316px
     sidebar and its 20px padding; move either and this stops lining up. */
  #tools #enzname{position:static;max-width:100%;text-align:left}
  @media (min-width:921px){
    #tools{right:20px;width:calc(316px - 40px);align-items:flex-start}
  }

  /* AIR AT THE TOP OF THE COLUMN, so the verdicts start clear of the rail. */
  #side{padding-top:26px}

  /* THE HEAD OF THE SIDEBAR'S COLUMN: the step's verdicts, then its takeaway.
     Both leave pathways.css's absolute placement over the stage and stack here
     instead, so the verdicts and the panel they open read down one column and
     nothing lands on anything. LEFT-ALIGNED with the panels under them;
     #enzmeta carries its own flex-end from there, so it is turned round too. */
  #enzrail{display:flex;flex-direction:column;align-items:flex-start;gap:18px;
    margin:0 0 18px;text-align:left;pointer-events:none}
  #enzrail #enzmeta{align-items:flex-start;max-width:100%}
  #enzmeta,#enznote{position:static;right:auto;bottom:auto}
  /* pathways.css sets these on the ids, so inheriting left is not enough */
  #enzrail #enznote{text-align:left}
  /* the verdicts are pressable; the rail itself is not (see drawEnzMeta) */
  #enzmeta{pointer-events:auto}

  /* THE SIDEBAR IS AN ACCORDION. The section is the card, so the two readouts
     give up their own paper inside it — but only inside it: the ledger keeps
     its card when drawTally moves it into the closing grid. */
  #acc{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
  #acc[hidden],.accsec[hidden],.accb[hidden]{display:none}
  .accsec{background:var(--surface-card);border:1px solid var(--border-hair);
    border-radius:var(--radius-md);box-shadow:var(--shadow-panel);overflow:hidden}
  .acch{display:flex;width:100%;align-items:center;justify-content:space-between;
    gap:10px;background:none;border:0;padding:12px 15px;cursor:pointer;
    text-align:left;text-transform:uppercase;
    font-family:var(--font-display);font-size:var(--cap-sm);
    font-weight:var(--cap-weight);letter-spacing:var(--cap-track);
    color:var(--text-muted)}
  .acch:hover{color:var(--text-strong)}
  .accc{font-size:12px;transition:transform .18s ease}
  .acch[aria-expanded="true"]{color:var(--text-strong)}
  .acch[aria-expanded="true"] .accc{transform:rotate(180deg)}
  .accb{padding:0 15px 14px}
  #acc #ledger,#acc #couplebox{position:static;margin:0;padding:0;background:none;
    border:0;box-shadow:none;transform:none}
  /* the header says both of these already */
  #acc #ledger .lhead,#acc #couplebox .cx,#acc #couplebox .cpl-h{display:none}
  /* NO ENTRY ANIMATION IN A PANEL. #couplebox.in and #ledger.pin both wait and
     hold the opening keyframe through the wait, which is right for a note
     arriving with the molecule and wrong for a section you just pressed open:
     it reads as the header doing nothing. */
  #acc #couplebox.in,#acc #ledger.pin{animation:none}
  /* THE CLOSING LINE IS NOT A CONTROL: same slot, same place, nothing to press.
     The lesson is over and this says what it showed. */
  #actbtn.done{background:transparent;border-color:transparent;color:var(--text-strong);
    font-family:var(--font-editorial);font-size:19px;font-weight:600;
    letter-spacing:-.01em;cursor:default;box-shadow:none}

  /* THE VERDICT LINE, where glycolysis's ledger puts its net total. Not a row:
     it has no number and no right-hand column, and it is the sentence the two
     rows above it add up to. Same dashed rule they are separated by. */
  .sticky .lsquare{border-top:1px solid var(--border-hair);
    margin-top:7px;padding-top:8px;
    font-family:var(--font-editorial);font-size:14px;line-height:1.35;
    color:var(--energy-nad)}

  /* THE CLOSING TALLY: one row, three cells. Two steps do not make a 2×2. */

    grid-template-rows:1fr;gap:10px 22px;padding:14px 6% 0}
  #tally #ledger{position:static;margin:0 auto;height:auto;width:auto;
    max-width:100%;overflow:hidden;padding:16px 18px}

<script>
"use strict";
/* =============================================================================
 *  FERMENTATION — what happens to pyruvate with no oxygen, and why
 * =============================================================================
 *  PARADIGM: pathway, the third one. Same record shape as glycolysis and the
 *  cycle, same verbs, same rail.
 *
 *  THE CLAIM: THE PRODUCT IS THE BYPRODUCT. Fermentation exists to turn NADH
 *  back into NAD⁺ so glycolysis can keep running. A student who leaves thinking
 *  the point was making lactate has learned the thing every textbook
 *  accidentally teaches by drawing this as a dead-end appendix. So the carrier
 *  is the subject: it stands in the lanes rather than in a tray, the ledger's
 *  first three rows are about nothing else, and the closing tally puts NAD⁺
 *  first and the product second.
 *
 *  A BRANCH, NOT A SEQUENCE, which is what neither sibling is. Two destinations
 *  hang off one pyruvate, so `STEPS` is keyed by branch and every fold walks the
 *  selected array. The tabs are how the two get compared: run one, run the
 *  other, and the arithmetic at the end is identical while the chemistry
 *  between them is not.
 *
 *  THE CONDITION IS NOT A STEP. What sends pyruvate down either branch is the
 *  absence of O₂, and this record shape's unit is a reaction — so it lives on
 *  the branch, as one line under its tab, and nowhere else.
 *
 *  NO ΔG NUMBERS, glycolysis's rule and for a stronger reason here: published
 *  figures for the two reductions disagree by 10 kJ/mol between sources.
 *  Reversibility is the claim this page can back.
 *
 *  DERIVED STATE, NOT MUTATED STATE. `branch` and a `done` per branch are the
 *  only mutable lesson state; species, pools and ledger are pure functions of
 *  them, so stepping backward and switching tabs are both free.
 * ========================================================================== */

const canvas=document.getElementById('gl');
const OPEN_THETA=0.10;
const L=Lesson.create(canvas,{
  // Orthographic and unswung, glycolysis's reasons exactly: four lanes side by
  // side have to stay comparable, and every figure on this stage is placed in
  // screen pixels off a projection.
  ortho:true,
  cam:{theta:OPEN_THETA,phi:1.30,r:34}, phiMin:0.4, phiMax:2.6, rMin:9, rMax:120,
  zoom:false, orbit:false, focus:false,
  onResize:()=>{ computeFit(); },
});
const {scene,camera,renderer,root,cam,applyCam,resize}=L;
const FXi=L.fx, MO=L.motion;
const KIT=AtomKit.create(THREE);
const M=MolLib.MOLECULES, PAL=MolLib.PALETTE;
/* THE CARRIER IS THE IDEALIZED NADH (`nadhSkel`, mol-carriers.js), not the
 * PubChem conformer (`nadh`) — glycolysis's choice, and the reason is sharper
 * here. A conformer folds its tail over the nicotinamide C4, and C4 is the atom
 * every step on this page is about: the hydride leaves from it. Same molecule,
 * same scale family, same `gly` block, so switching is one name. Declared
 * schematic (MolecularGeometry.md §1.6); both derivations canonicalise to the
 * same PubChem record under tools/check-handedness.js, so no stereochemistry is
 * traded for legibility. molecule-viewer.html shows the two side by side. */
const NADH=M.nadhSkel;

/* NAD⁺ IS NADH MINUS ONE C4 HYDROGEN — the same declared schematic
 * (MolecularGeometry.md §1.6) glycolysis's tray makes, moved onto the stage.
 * A second KEY over the same spec rather than a second spec: identical atoms,
 * so the camera fit cannot tell the two apart and the molecule does not change
 * size when it discharges. The names come off `gly.spent`, which
 * mol-pathways.js put there for exactly this. */
const NADP=Object.assign(Object.create(NADH), {
  name:NADH.gly.spent.name, short:NADH.gly.spent.short,
  formula:NADH.gly.spent.formula });
const SPECS=k=>k==='nad'?NADP:M[k];
const carrierKeys=new Set(['nadhSkel','nad']);

/* =============================================================
 *  THE LESSON SCRIPT
 * ============================================================= */

/* ONE GLUCOSE GAVE TWO PYRUVATE, AND THE STAGE SHOWS ONE OF THEM.
 * Glycolysis shows its ×2 with two lanes and never labels it. That is not
 * available here: NADH is 21 Å across against pyruvate's 6, so two pairs put
 * four molecules in one frame and the substrate ends up 9% of the width, which
 * is the reaction the page is about rendered as a speck. Standing the carrier
 * on the stage is worth more than hiding the ×2, so the doubling becomes
 * arithmetic — and it happens HERE, once, rather than in any step's numbers.
 * Every step below counts what is on screen: one reaction, one carrier.
 *
 * THE OPENING BALANCE, CARRIED IN FROM GLYCOLYSIS. That page's POOL0 is chosen
 * so NAD⁺ runs to exactly 0 and 2 NADH are held at the end (glycolysis-lab.html),
 * and this page opens there. A COMMENTED LITERAL: nothing checks that the two
 * pages agree, so if glycolysis-lab.html's POOL0 changes, change this with it.
 * OWED then falls out of it — glycolysis spends one NAD⁺ per G3P at its step 6,
 * and PER_GLUCOSE is how many G3P a glucose makes. */
const PER_GLUCOSE=2;
const OWED=PER_GLUCOSE;

/* THE TWO DESTINATIONS. `when` is the precondition. `who` is inside it, because
 * what makes the pair worth showing is that the same problem gets the same
 * solution in organisms that share nothing else. */
const BRANCHES=[
  { key:'lactic', tab:'Lactate', when:'No O₂ · muscle under load, and lactic acid bacteria',
    product:'lactate' },
  { key:'alcoholic', tab:'Ethanol', when:'No O₂ · yeast, and flooded plant roots',
    product:'ethanolSkel' },
];

/* ONE ENTRY PER USER ACTION, keyed by branch. `species` is what the REACTING
 * lanes hold afterwards and `hold` is what the CARRIER lanes hold — two lists,
 * because a carrier here is a lane and its state changes without anyone
 * clicking it. */
const STEPS={
lactic:[
  { n:1, enz:'Lactate dehydrogenase', hook:'One step, and that is the branch',
    species:['lactate'], hold:['nad'],
    // near equilibrium: which way it runs is decided by how much NADH is about,
    // which is the same fact the branch exists to change
    rev:true,
    // ONE REACTION'S WORTH. The ledger multiplies by PER_GLUCOSE; a step that
    // counted the doubling itself would say 2 while the stage showed 1.
    nad:1, made:0,
    fx:'red', perLane:true,
    /* NO `couple`, and this is the second step on the page whose missing couple
     * is load-bearing. energy/energy.js draws a coupled step as "a real drop,
     * part of it banked into a carrier" — true of glycolysis's GAPDH, where the
     * oxidation genuinely stores energy in NADH, and backwards here: NAD⁺ is
     * the DISCHARGED form and this reaction banks nothing. Declaring it coupled
     * drew the spent carrier as though it were the charged one. Uncoupled and
     * `rev:true`, the card draws both sides at nearly the same energy, which is
     * what near-equilibrium means and what the verdict beneath it already says.
     * The carrier turning over is the stage's claim and the ledger's, not this
     * figure's. */
    /* THE CLICK IS ON NADH, not on the pyruvate. Every hotspot in this repo
     * marks the bond that BREAKS, and here that is C4–H on the carrier: the
     * hydride leaves NADH and lands on pyruvate's carbonyl. Pointing at the
     * carbonyl asked the student to click the molecule that RECEIVES while the
     * atom departed from the one beside it. It is also the better gesture:
     * emptying the carrier is the thing this pathway exists to do. */
    act:'Take the hydride off NADH',
    spot:{ at:'hydride', say:'Take the hydride off NADH' },
    takeaway:`One hydride back, and glycolysis can run again`,
    msg:`<b>Lactate dehydrogenase</b> gives pyruvate the hydride NADH has been
      carrying since glycolysis step 6. Pyruvate becomes <b>lactate</b> and NADH
      becomes <b>NAD⁺</b>. No carbon leaves and no ATP is made: the only thing
      this reaction makes that the cell was short of is the empty carrier. The
      lactate leaves the muscle, and the liver builds glucose back out of it.` },
],
alcoholic:[
  { n:1, enz:'Pyruvate decarboxylase', hook:'A carbon leaves first',
    species:['acetaldehyde'], hold:['nadhSkel'],
    // a decarboxylation whose product leaves as a gas does not come back
    rev:false,
    // `carbonOut`, where the cycle's step record spells the same field `co2`:
    // tools/check-pages.js reads a quoted spec name as a page drawing that
    // molecule, and this page must NOT load a CO₂ spec — `decarb` assembles the
    // gas out of the substrate's own carbon and its two oxygens.
    carbonOut:1, made:0,
    /* NO `couple`, and that is load-bearing rather than an omission:
     * reaction/reaction.js's `decarb` reads exactly this to know it must not
     * mint an NADH. The cycle's decarboxylations are oxidative and bank a
     * carrier; this one banks nothing. */
    fx:'decarb', anchor:'decarb', perLane:true,
    act:'Take C1 off as CO₂', spot:{ at:'decarb', say:'Take the carbon off' },
    takeaway:`A carbon leaves as CO₂. No carrier moves`,
    msg:`<b>Pyruvate decarboxylase</b> takes C1 off as <b>CO₂</b>, leaving
      <b>acetaldehyde</b>. This is the step yeast has and muscle does not, and it
      is why bread rises. Nothing is oxidised and nothing is banked — it only
      makes the carbonyl that the next step can reduce.` },

  { n:2, enz:'Alcohol dehydrogenase', hook:'The same event as lactate',
    species:['ethanolSkel'], hold:['nad'],
    // liver alcohol dehydrogenase runs this one the other way, which is what
    // makes "reversible" worth saying here
    rev:true,
    nad:1, made:0,
    // uncoupled for the reason step 1 of the other branch gives
    fx:'red', perLane:true,
    // on the carrier, for the reason the lactate branch's step gives
    act:'Take the hydride off NADH',
    spot:{ at:'hydride', say:'Take the hydride off NADH' },
    takeaway:`The same hydride, one step later`,
    msg:`<b>Alcohol dehydrogenase</b> gives acetaldehyde the hydride, exactly as
      lactate dehydrogenase gave it to pyruvate one branch over. Acetaldehyde
      becomes <b>ethanol</b> and NADH becomes <b>NAD⁺</b>. Two steps instead of
      one, a carbon lighter, and the same NAD⁺ at the end.` },
]};

/* =============================================================
 *  DERIVED STATE — a function of `branch` and that branch's `done`
 * ============================================================= */
let branch='lactic';
/* A `done` PER BRANCH, not one shared. A tab is a view, and coming back to a
 * branch you were half way through to find it reset would say the two are one
 * pathway with a switch on it. */
const progress={lactic:0, alcoholic:0};
let intro=true;
const steps=()=>STEPS[branch];
const nSteps=()=>steps().length;
const done=()=>progress[branch];
const setDone=v=>{ progress[branch]=v; };
const stepAt=i=>steps()[i];
const branchOf=k=>BRANCHES.find(b=>b.key===k);

/* THE STAGE IS ONE PAIR — substrate on the left, carrier on the right. `weave`
 * survives the drop from two pairs to one and is still the right shape: it
 * pairs each substrate with its own carrier, which is what keeps
 * reaction/reaction.js's nearest-donor rule honest if a fourth pathway ever
 * does fit two.
 */
const BASE=['pyruvate'];
const weave=(subs,cars)=>subs.flatMap((k,j)=>cars&&cars[j]!=null?[k,cars[j]]:[k]);
/* THE CARRIER IS ON STAGE FROM THE FIRST FRAME, on both branches, including the
 * ethanol branch's step 1 which does not touch it. Two reasons, and the first is
 * structural: a lane count that changes DURING a step breaks the per-lane
 * mapping from lane j to product j. The second is the lesson — an NADH standing
 * there unspent through the decarboxylation is the tension the branch resolves,
 * so it is the one molecule that has earned standing through a step it has no
 * part in. */
const OPENING=weave(BASE, ['nadhSkel']);
function speciesAt(i){
  if(i===0) return OPENING;
  const prev=steps()[i-1];
  return weave(prev.species, prev.hold);
}
/* WHICH LANES A STEP ACTS ON — the ones with a target on them, asked of the
 * spec. glycolysis could say "every lane", because every lane held a substrate;
 * here one of the two is a carrier, and a step waiting for a click that cannot
 * happen never lands. */
const actsOn=(st,key)=>!!st&&!!st.spot&&!!spotPair(SPECS(key), st.spot.at);
/* …off the step's INCOMING species, never off the lanes as they now stand. A
 * lane that has already run holds the product and stops answering, so asking
 * the stage would shrink the count mid-step and land a per-lane step on its
 * first click. */
const actingLanes=(st,i)=>speciesAt(i==null?done():i)
  .map((k,j)=>actsOn(st,k)?j:-1).filter(j=>j>=0);

let laneDone=new Set();
const isPerLane=st=>!!st&&!!st.perLane;
// Fraction of the current step already run, as REACTING lanes — the carrier
// lanes are not clicks and must not be in the denominator.
function halfRun(){
  const st=stepAt(done()), n=st?actingLanes(st).length:0;
  return (isPerLane(st) && n && laneDone.size) ? laneDone.size/n : 0;
}
/* THE LEDGER, PER GLUCOSE. Every row is a sum over the steps run, never a typed
 * number — `owed` is the one exception and it is the carried-in literal above.
 * The steps count ONE reaction because that is what the stage shows, and the ×2
 * is applied here, in the one place: a ledger that is per glucose and a stage
 * that is per pyruvate is the trade this page made (see PER_GLUCOSE), and the
 * multiply has to be visible in the code that does it.
 * `carbonOut` is summed on both branches but gets a ROW only where the selected
 * branch actually declares it (branchHas), so the lactate branch does not print
 * "CO₂ 0" and invite a comparison the page is not making. ATP is the deliberate
 * exception; see drawLedger. */
function ledgerAt(i){ const L={nad:0, made:0, carbonOut:0}, S=steps();
  for(let k=0;k<i;k++){ const s=S[k];
    L.nad+=s.nad||0; L.made+=s.made||0; L.carbonOut+=s.carbonOut||0; }
  if(i===done()){ const f=halfRun(), s=S[i]||{};
    L.nad+=(s.nad||0)*f; L.made+=(s.made||0)*f; L.carbonOut+=(s.carbonOut||0)*f; }
  for(const q of ['nad','made','carbonOut']) L[q]*=PER_GLUCOSE;
  /* NO NET ROW. Subtracting the two into a zero is glycolysis's shape, where a
   * running ATP total genuinely is the lesson because it dips below zero before
   * it recovers. Here it backfires: "Net NAD⁺ 0" reads as nothing happened,
   * which is the misreading this page exists to prevent. What the pair of rows
   * has to land is that the repayment MATCHES the debt, and that is a sentence,
   * not a number — see drawLedger. */
  L.owed=OWED;
  L.square=L.nad>=OWED;
  return L; }
const branchHas=f=>steps().some(s=>s[f]!=null);
// …per glucose too, so the row cannot say 3 carbons beside a balance that is
// counting two pyruvate.
const carbonsAt=i=>speciesAt(i).filter(k=>!carrierKeys.has(k))
                    .reduce((s,k)=>s+SPECS(k).gly.carbons,0)*PER_GLUCOSE;
/* A CARBON COUNT IS ONLY WORTH A ROW WHERE IT MOVES. The lactate branch starts
 * and ends at six, so the row would sit there all lesson repeating itself; the
 * ethanol branch goes 6 → 4 and the row is the receipt for the CO₂ above it.
 * Asked of the branch rather than typed, so this follows the data. */
const carbonsMove=()=>carbonsAt(0)!==carbonsAt(nSteps());

/* =============================================================
 *  3D: lanes, labels, transitions
 * ============================================================= */
/* THE LANE SEPARATION IS MEASURED, NOT TYPED. Both siblings can pick a number
 * by eye because their lanes hold molecules of one size; here a carrier drawn
 * at full scale is five times its substrate's width, and a hand-picked gap is
 * right only for the pair it was picked on: swapping the NADH conformer for
 * the idealized build widened the carrier by half again and the two molecules
 * overlapped, with nothing in the file saying why. No width is written down
 * here, because `drawnWidth` below is the thing that knows them.
 * Measured the way kit/lanes.js measures, which is the extent the student sees:
 * the spec's `view:` applied and the optional hydrogens dropped. Duplicated
 * here rather than asked of the module, because the module needs the answer to
 * be constructed. */
const CLEAR=3.0;                            // world units of daylight between them
function drawnWidth(spec){
  const opt=new Set(spec.optH||[]);
  const q=spec.view ? new THREE.Quaternion().setFromEuler(
    new THREE.Euler(spec.view[0]||0, spec.view[1]||0, spec.view[2]||0, 'ZYX')) : null;
  let lo=Infinity, hi=-Infinity;
  spec.atoms.forEach((a,i)=>{
    if(opt.has(i)) return;
    const v=new THREE.Vector3(a.pos[0],a.pos[1],a.pos[2]);
    if(q) v.applyQuaternion(q);
    const r=PAL.radii[a.el]||0.7;
    lo=Math.min(lo,v.x-r); hi=Math.max(hi,v.x+r);
  });
  return isFinite(lo)?hi-lo:0;
}
/* Over every molecule EITHER branch stands in a lane, so the two tabs share one
 * separation — a gap that changed with the tab would read as the stage moving
 * rather than the chemistry. Half-separation, because kit/lanes.js spaces n
 * lanes evenly about the centre line: the two centres end up 2×LANE apart, and
 * what has to fit between them is half of each molecule plus the daylight. */
const LANE=(()=>{
  const subs=new Set(['pyruvate']), cars=new Set(['nadhSkel']);
  Object.values(STEPS).forEach(b=>b.forEach(st=>{
    (st.species||[]).forEach(k=>subs.add(k));
    (st.hold||[]).forEach(k=>cars.add(k==='nad'?'nadhSkel':k)); }));
  const widest=set=>Math.max(...[...set].map(k=>drawnWidth(M[k])));
  return (widest(cars)+widest(subs))/4 + CLEAR/2;
})();
let lanes=[];
let busy=false;
let reviewing=false;
let shownReview=false;
const focusStep=()=>reviewing?done()-1:done();

const platesEl=document.getElementById('plates');
const LANES=Lanes.create({
  root, camera, canvas, host:platesEl, specOf:SPECS, radii:PAL.radii,
  spread:LANE,
  build:spec=>{ const g=Stage.buildMolecule(spec);
                Stage.setOptionalH(g,false);
                /* NAD⁺ IS BUILT DISCHARGED, and NADH built holding its hydride.
                 * Both C4 hydrogens are in the spec's `optH`, so setOptionalH
                 * has just hidden them — without putting them back the two keys
                 * render identically and the step the page is about shows
                 * nothing. `nic.h[0]` was always there; `nic.h[1]` is the one
                 * GAPDH put on and the one this pathway takes off. */
                if(spec.gly && spec.gly.nic){
                  const h=spec.gly.nic.h, am=g.userData.atomMeshes;
                  if(am[h[0]]) am[h[0]].visible=true;
                  if(am[h[1]]) am[h[1]].visible = spec!==NADP;
                }
                return g; },
  plateHTML:spec=>`<div class="pn">${spec.short||spec.name}</div><div class="pf">${spec.formula}</div>`,
  /* THE CARRIER IS CALLED WHAT THE REST OF THE PAGE CALLS IT. kit/lanes.js
   * defaults both spellings to the spec's own `name`/`short`, and `nadhSkel`'s
   * are "Nicotinamide adenine dinucleotide (reduced)" and "NADH (idealized)" —
   * right for molecule-viewer.html, which teaches about the derivation, and
   * wrong on a stage where the ledger, the takeaway and the intro all say
   * NADH. Neither sibling hits this: both keep this spec in a tray, not a lane.
   * BOTH spellings, not just the narrow one: the systematic name is 43
   * characters and runs under the ledger card at a laptop width, and this
   * molecule is the one thing on stage the student has to be able to name in
   * the same words the ledger uses. The formula line under it carries the
   * detail. */
  label:spec=>spec.gly && spec.gly.nic
    ? (k=>({full:k, abbr:k}))(spec===NADP?'NAD⁺':'NADH')
    : { full:spec.name, abbr:spec.short||spec.name },
});
const laneX=(i,n)=>LANES.xOf(i,n);
const laneShift=key=>LANES.shift(key);
const laneLift=key=>LANES.lift(key);
const laneOffset=l=>LANES.offset(l);
const visibleAtoms=spec=>LANES.visibleAtoms(spec);
const plateY=keys=>LANES.plateY(keys);
const plateHeightPx=()=>LANES.heightPx();

/* ---------- the hotspot on the bond (kit/hotspot.js) ----------
 * Same two spellings the siblings use: an ARRAY is the bond itself (`redBond`,
 * the C=O a reduction attacks), a NUMBER is an atom whose DEPARTURE names the
 * bond (`decarb`, the carboxylate carbon that leaves as CO₂). */
function spotPair(spec, at){
  const v=spec.gly && spec.gly[at];
  if(Array.isArray(v)) return v;
  if(typeof v!=='number') return null;
  return MolGraph.leavingBond(spec, v);
}
const spotsEl=document.getElementById('spots');
const glowEl=document.getElementById('spotglow');
const SPOTS=Hotspot.create({ canvas, camera, host:spotsEl, glowHost:glowEl,
  onPick:it=>press(()=>runLane(it.lane)),
});
const NOTES=Annot.create(THREE, document.getElementById('stage'), camera, {mode:'on'});
let hintAt=null;
const hintNote=NOTES.add({ text:'', at:()=>hintAt&&hintAt(), offset:[30,-26] });
const _hintV=new THREE.Vector3();
// THE CALLOUT'S OWN WIDTH, measured, plus the 30px it hangs off its dot. The
// label is display:none until it has text, which measures 0 — so the last real
// measurement stands, and 200 covers the first frame of the first hint.
let _hintW=0;
function hintWidth(){
  const w=hintNote.label.getBoundingClientRect().width;
  if(w) _hintW=w+30;
  return _hintW||200;
}
const laneBondMid=(l,pair)=>{
  if(!l||!pair) return null;
  const u=l.g.userData;
  return _hintV.copy(u.atomWorld(pair[0])).add(u.atomWorld(pair[1])).multiplyScalar(0.5);
};
function drawHint(){
  const st=(!intro && done()<nSteps()) ? stepAt(done()) : null;
  let text=''; hintAt=null;
  if(st && st.spot && st.spot.say && !busy && !reviewing){
    // the first target still standing carries the one note
    const j=actingLanes(st).find(i=>!laneDone.has(i));
    if(j!=null){ const pair=spotPair(SPECS(lanes[j].key), st.spot.at);
      text=st.spot.say; hintAt=()=>laneBondMid(lanes[j], pair); }
  }
  if(text!==hintNote.el.dataset.t){ hintNote.el.dataset.t=text; hintNote.set(text); }
  /* THE LABEL FLIPS RATHER THAN RUNNING UNDER THE COLUMN. The camera keeps the
   * molecules out of the sidebar's strip (see sideReservePx), but a callout is
   * screen-space and hangs 30px off its dot, so a target near the strip's edge
   * puts the words behind the panel. HINT_W is the label's own measure, not a
   * guess at the sentence. */
  if(text && hintAt){
    const p=hintAt();
    if(p){ const c=canvas.getBoundingClientRect();
      const x=(_hintV.copy(p).project(camera).x*0.5+0.5)*c.width;
      const room=c.width-sideReservePx();
      hintNote.setOffset([x+hintWidth()>room ? -30 : 30, -26]); }
  }
  NOTES.show(!!text); NOTES.step();
}
function drawSpots(){
  const st=(!intro && done()<nSteps()) ? stepAt(done()) : null;
  const live = !!st && !!st.spot && !busy && !reviewing;
  const act=live?actingLanes(st):[];
  SPOTS.update(!live ? [] : lanes.map((l,i)=>
    (laneDone.has(i) || !act.includes(i)) ? null : {
      group:l.g, pair:spotPair(SPECS(l.key), st.spot.at), lane:i,
      hint:'', label:'run this step',
    }));
}
let platesOff=false;
function drawPlates(){ platesEl.classList.toggle('mute', platesOff); LANES.draw(); }

// ---- framing ---------------------------------------------------------------
function barReservePx(){
  const e=document.getElementById('bottombar');
  if(!e) return 106;
  const cs=getComputedStyle(e);
  return (parseFloat(cs.getPropertyValue('--barh'))||0)+(parseFloat(cs.bottom)||0);
}
// Only while the band is up, which is the intro. The height is the DECLARED
// --caph and never the live box, so a longer caption eats the room set aside
// rather than re-framing the shot.
function capReservePx(){
  const e=document.getElementById('rxmsg');
  if(!e||!e.classList.contains('show')) return 0;
  return parseFloat(getComputedStyle(e).getPropertyValue('--caph'))||0;
}
/* THE SIDEBAR IS OVER THE CANVAS. pathways.css gives the stage the full width
 * at the wide breakpoint and lays the readout column on top of it; both siblings
 * already buy that room back with their tray's reserve on the other side, and
 * this page has no tray, so its molecules ran under the panels. Measured, not
 * typed: the column's width is a layout number, the same in every state, and an
 * open accordion does not change it. Stacked clear of the stage on a narrow
 * screen the column is not over the canvas at all, so the reserve is nothing
 * there — ASKED AS A BOX INTERSECTION rather than a second copy of the
 * breakpoint, and both axes have to overlap: stacked, the two boxes still share
 * every column of x. Fit pays a side reserve SYMMETRICALLY, so this keeps the
 * subject on the page's centre line instead of sliding it left. */
const GUTTER=28;                    // air between the scene and the column
function sideReservePx(){
  const el=document.getElementById('side'); if(!el) return 0;
  const r=el.getBoundingClientRect(), c=canvas.getBoundingClientRect();
  if(!r.width||!c.height) return 0;
  const over = r.left<c.right && r.right>c.left && r.top<c.bottom && r.bottom>c.top;
  return over ? r.width+GUTTER : 0;
}
// NO LEFT RESERVE: there is no tray (see the stylesheet's header).
const RESERVES=()=>({ top:plateHeightPx(), bottom:barReservePx()+capReservePx(),
                      left:0, right:sideReservePx() });
const FIT=Fit.create({canvas, camera, cam, reserve:()=>RESERVES()});
const orthoFrustum=()=>FIT.frustum();
let fitR=34, fitY=0;
const TOP_PULL=0.5;
let _pathTop=null;
/* ONE FRAME FOR THE WHOLE BRANCH, solved over every state it passes through, so
 * ethanol losing a carbon reads as the molecule getting smaller rather than as
 * the camera moving in. Re-solved on a tab change (`_pathTop` cleared with it),
 * because the two branches are different pathways and nothing is being compared
 * across the switch. */
function allStates(){
  const out=[speciesAt(0)];
  steps().forEach((s,i)=>out.push(speciesAt(i+1)));
  return out;
}
function fitFor(states){
  let lo=0, hi=0, wide=0;
  states.forEach(keys=>{
    const n=keys.length;
    keys.forEach((k,j)=>{ const spec=SPECS(k);
      const x=Math.abs(laneX(j,n)), xc=laneShift(k), yc=laneLift(k);
      visibleAtoms(spec).forEach(a=>{ const r=PAL.radii[a.el]||0.7;
        lo=Math.min(lo,a.pos[1]-yc-r); hi=Math.max(hi,a.pos[1]-yc+r);
        wide=Math.max(wide, x+Math.abs(a.pos[0]-xc)+r); }); });
  });
  const Y=(lo+hi)/2;
  const halfNeeded=Math.max(hi-Y, Y-lo);
  const {R,Y:Yfit}=FIT.solve({halfNeeded, wide, centerY:Y, pad:1.10, min:15, max:140});
  return { Y:Yfit, R };
}
function computeFit(){
  const states=allStates();
  const f=fitFor(states);
  const top=_pathTop??(_pathTop=Math.max(...states.map(plateY)));
  fitR=f.R; fitY=FIT.anchorTop(f.R, f.Y, top, TOP_PULL);
}

function renderLanes(i){
  platesOff=false; platesEl.classList.remove('mute');
  LANES.render(speciesAt(i));
  onLanes();
}
function onLanes(){ lanes=LANES.lanes; computeFit(); }
function swapLane(j,key){ LANES.swapOne(j,key); onLanes(); }

/* ---- page-local effects ---- */
const RUN='run';
const GO=Leaving.create({root, camera, motion:MO, tag:RUN});
const cancelTimers=()=>{ MO.cancel(RUN); GO.clear(); clearFlyers(); };

/* =============================================================
 *  THE VERBS — reaction/reaction.js
 * =============================================================
 * `red` is the verb this page needed and it went into the module, not here.
 * The host below answers only stage questions; there is no carrier tray, so the
 * three carrier entries answer null rather than inventing a point off screen.
 */
const RX=Reaction.create({
  three:THREE, root, camera, canvas,
  motion:MO, fx:FXi, leaving:GO, kit:KIT, stage:Stage, palette:PAL,
  molgraph:MolGraph, molLib:MolLib, skelLib:SkelLib, tag:RUN,
  flyersEl:document.getElementById('flyers'),
  specOf:SPECS,
  ...Reaction.stageHost({lanes:LANES, carriers:()=>null, onLanes}),
  // `ox` and `join` aim a hydride at a carrier TILE; `red` aims it at a lane,
  // so nothing here is ever asked. Overridden anyway: stageHost's popCarrier
  // would dereference the column this page does not have.
  carrierPoint:()=>null,
  carrierBond:()=>null,
  onCarrierTaken:()=>{},
  popCarrier:()=>{},
});
const later=RX.later, drawFlyers=RX.drawFlyers, clearFlyers=RX.clearFlyers;

/* =============================================================
 *  RUNNING A STEP
 * ============================================================= */
/* EVERY STEP HERE IS PER-LANE. Both branches run one reaction on two pyruvate,
 * and glycolysis's argument holds: one click reporting "+2" is the version a
 * student reads and never counts.
 *
 * BOTH LANES OF A PAIR TURN OVER ON ONE CLICK. The clicked lane becomes its
 * product and the molecule it reacted with becomes its own, on the same beat.
 * WHICH ONE, by the same nearest-lane rule `red` uses, since the page and the
 * verb must not disagree about which two molecules just reacted. Which KIND is
 * asked of the specs rather than assumed: the click lands on the carrier at a
 * reduction and on the substrate at the decarboxylation. */
function partnerLane(j){
  const mine=SPECS(lanes[j].key).gly||{};
  const wants = mine.nic ? (g=>g.oxC!=null) : (g=>!!g.nic);
  const cs=lanes.map((l,k)=>k).filter(k=>wants(SPECS(lanes[k].key).gly||{}));
  if(!cs.length) return -1;
  const x=lanes[j].g.position.x;
  return cs.reduce((a,b)=>
    Math.abs(lanes[b].g.position.x-x)<Math.abs(lanes[a].g.position.x-x)?b:a);
}
function runLane(j){
  if(busy || intro || done()>=nSteps()) return;
  const st=stepAt(done());
  if(!isPerLane(st) || laneDone.has(j) || !lanes[j] || !actsOn(st,lanes[j].key)) return;
  const to=done()+1, keys=speciesAt(to), n=actingLanes(st).length;
  const mate=partnerLane(j);
  busy=true;
  platesOff=true; platesEl.classList.add('mute');
  RX.lane(st, j, keys);
  later(()=>{
    laneDone.add(j);
    swapLane(j, keys[j]);
    // …and the carrier that paid, IF this step spent one. Read off the keys, so
    // a step that leaves NADH alone (the decarboxylation) swaps nothing.
    if(mate>=0 && lanes[mate] && keys[mate]!==lanes[mate].key) swapLane(mate, keys[mate]);
    platesOff=false; platesEl.classList.remove('mute');
    // THE LAST REACTING LANE LANDS THE STEP.
    if(laneDone.size>=n){ setDone(to); reviewing=true; laneDone.clear(); }
    busy=false; refresh();
  }, RX.durOf(st));
}
function rewind(){
  if(busy) return;
  if(reviewing){ reviewing=false; refresh(); return; }
  if(laneDone.size){ laneDone.clear(); renderLanes(done()); refresh(); return; }
  if(done()===0){ intro=true; refresh(); return; }
  setDone(done()-1); renderLanes(done()); refresh();
}
/* RESTART IS THE LESSON, NOT THE BRANCH. `done` is per branch so that a tab
 * switch keeps your place; the one control that means "put it all back" has to
 * see past that, or finishing lactate and restarting ethanol leaves the rail
 * filled on a branch you just reset and the end-of-lesson button hidden. */
function restart(){ cancelTimers(); busy=false; pressing=false; reviewing=false;
  Object.keys(progress).forEach(k=>{ progress[k]=0; });
  intro=true; laneDone.clear();
  // the sidebar goes back to how it loads: the ledger open, the card shut
  prevLedger=null; shownReview=false; panel='ledger'; metaStep=null; shownCplStep=null;
  renderLanes(0); refresh(); cam.theta=OPEN_THETA; }

/* =============================================================

/* ---- the ledger: the balance first, the products under it ------------------

const ledgerEl=document.getElementById('ledger');

/* ON BY DEFAULT, which is the opposite of glycolysis and for the reason that

const INSET=/[?&]view=inset\b/.test(location.search);
document.documentElement.classList.toggle('inset',INSET);
let panel='ledger';
const setPanel=p=>{ panel=(panel===p?null:p); refresh(); };
const cplOpen=()=>panel==='energy';
const ledgerOn=()=>panel==='ledger'||tallyOn();
const accEl=document.getElementById('acc');

accEl.addEventListener('click',e=>{

/* WHICH SECTIONS EXIST, and which one is open. The ledger has nothing to add at

let metaStep=null;

function placeLedger(){

function drawLedger(){

  const prev=prevLedger;
  const bumped=k=>prev && prev[k]!==L[k] ? ' bump':'';
  // typographic minus, not a hyphen
  ledgerEl.innerHTML=
     `<div class="lhead">NAD⁺ balance</div>`
    +`<div class="row"><span>Spent by glycolysis</span><span class="v" data-row="owed">−${L.owed}</span></div>`
    +`<div class="row"><span>Regenerated here</span><span class="v${bumped('nad')}" data-row="nad">+${L.nad}</span></div>`
    // THE VERDICT, ONLY ONCE IT IS EARNED. A line that stood there from the
    // first frame would be a promise; appearing when the second NAD⁺ lands
    // makes it the thing the click just did.
    +(L.square ? `<div class="lsquare">Glycolysis can run again</div>` : '')
    // THE PRODUCTS, under the balance and not beside it: they are what the
    // reaction leaves behind, not what it was for.
    // ATP IS SHOWN EVEN THOUGH IT IS ALWAYS ZERO, and that is the exception to
    // the rule below rather than an oversight: "no ATP" is a claim this page
    // makes, and a row that disappears cannot make it. Gating it on branchHas
    // would be a no-op dressed as a decision — both branches declare `made:0`.
    +`<div class="row prod"><span>ATP made</span><span class="v" data-row="made">${L.made}</span></div>`
    /* THE BYPRODUCT ROWS ARRIVE WHEN THEY HAVE SOMETHING TO SAY. "CO₂ out 0"
     * before the decarboxylation is the same defect as the net row was: a zero
     * that reads as a fact when it is a not-yet. The two balance rows above are
     * different and stay from the first frame — the debt has to be visible for
     * the repayment to mean anything, and watching "+0" fill to "+2" IS the
     * lesson. */
    +(branchHas('carbonOut') && L.carbonOut
      ? `<div class="row"><span>CO₂ out</span><span class="v${bumped('carbonOut')}" data-row="carbonOut">${L.carbonOut}</span></div>` : '')
    +(carbonsMove()
      ? `<div class="row carb"><span>Carbons</span><span class="v">${c}</span></div>` : '');
  prevLedger=L;
}

/* =============================================================
 *  THE CLOSING TALLY — NAD⁺ first, the product second
 * =============================================================
 *  Molecules in the scene, not pictures (kit/carriers.js), under the same
 *  camera as the lanes. The ORDER is the argument: the thing the branch was for
 *  is on the left, the thing it is named after is on the right, and the ledger
 *  between them says the net is zero.
 */
const tallyEl=document.getElementById('tally');
const TALLY=[
  // counts read from the same ledger the sidebar prints, never typed
  { k:'nad',  spec:()=>NADP, name:()=>NADP.short, n:L=>L.nad },
  { k:'prod', spec:()=>M[branchOf(branch).product],
    name:()=>M[branchOf(branch).product].short, n:()=>PER_GLUCOSE },
];
TALLY.forEach(t=>{
  t.host=tallyEl.querySelector(`[data-cell="${t.k}"]`);
  t.car=Carriers.create({ root, camera, canvas, host:t.host,
    visClass:'tvis', slotClass:'tslot', slotHTML:()=>'<div class="tslot"></div>',
    build:spec=>{ const g=Stage.buildMolecule(spec,{center:true});
                  Stage.setOptionalH(g,false);
                  // NAD⁺ keeps the one C4 hydrogen it still has — the lanes'
                  // build makes the same repair, for the same reason.
                  if(spec.gly && spec.gly.nic){
                    const m=g.userData.atomMeshes[spec.gly.nic.h[0]];
                    if(m) m.visible=true;
                  }
                  return g; } });
});
const tallyOn=()=>!intro && !reviewing && done()>=nSteps();
function drawTally(){
  const on=tallyOn();
  tallyEl.hidden=!on;
  /* Nothing to switch on either end screen: on the tally the molecules are
   * gone and the ledger stands in the grid whatever the checkbox says, and at
   * the intro there is no step to have an enzyme and no arithmetic yet. */
  /* THE CORNER GOES DOWN WITH THE STAGE, and is not up at the intro either:
   * there is no step at either end, so no enzyme for the caption to name. */
  document.getElementById('tools').hidden=on||intro;
  // THE STICKER MOVES, never a second copy — drawLedger keeps writing into the
  // same element wherever it is standing.
  const home=on?document.getElementById('tledger')
               :document.querySelector('#acc-ledger .accb');
  if(ledgerEl.parentNode!==home) home.appendChild(ledgerEl);
  lanes.forEach(l=>{ l.g.visible=!on; });
  platesEl.style.visibility = on ? 'hidden' : '';
  const L=ledgerAt(done());
  TALLY.forEach(t=>{
    if(!on){ t.car.show(0,t.spec()); return; }
    t.car.show(1,t.spec());
    t.host.querySelector('.tcount').textContent='×'+t.n(L);
    t.host.querySelector('.tname').textContent=t.name();
  });
  placeTallyMols();
}
function placeTallyMols(){ const on=tallyOn(); TALLY.forEach(t=>t.car.place(on)); }

/* =============================================================
 *  THE ENZYME — a blob behind the substrate, and its name
 * =============================================================
 *  Deliberately not a protein, as in both siblings: one path, no claim about
 *  fold, size or active site.
 *
 *  ONE BLOB PER REACTION, NOT PER LANE. A dehydrogenase binds its substrate and
 *  its cofactor at the same time, so the two lanes of a reduction get ONE shape
 *  spanning both; two would say there are two enzymes. The decarboxylation takes
 *  one molecule and gets one blob. Derived from the lanes the step CHANGES, and
 *  deliberately not from the hotspot's lane — that one sits on the carrier now,
 *  and would drag the enzyme onto the cofactor alone. */
const enzEl=document.getElementById('enzymes');
const enzNameEl=document.getElementById('enzname');
const enzMetaEl=document.getElementById('enzmeta');
const enzNoteEl=document.getElementById('enznote');
// ON except in the inset view. The blob is what the step's catalyst does, not
// a view of it, and a lesson about enzymes that opens with them switched off
// argues the reverse; the inset is the view that leaves the enzyme out.
const showEnz=!INSET;
const enzOf=()=>{ const i=focusStep(); return (!intro && i<nSteps()) ? stepAt(i) : null; };
const enzLive=()=>showEnz && !!enzOf() && !tallyOn();
const enzLanes=i=>{ const b=speciesAt(i), a=speciesAt(i+1);
  return b.map((k,j)=>k===a[j]?-1:j).filter(j=>j>=0); };
const ENZ=EnzymeBlob.create({camera, canvas, host:enzEl});
function drawEnz(){
  const st=enzLive()?enzOf():null;
  enzEl.hidden=!st; enzNameEl.hidden=!st;
  if(st) enzNameEl.innerHTML=`<div class="ek">Enzyme</div><div class="en">${st.enz}</div>`;
  else enzEl.innerHTML='';
  drawEnzMeta();
}
function placeEnz(){
  if(enzEl.hidden || !lanes.length) return;
  const st=enzOf(); if(!st) return;
  // THE KEY CARRIES THE BRANCH. Both branches have a step 1, and without it the
  // blob would hold a measurement taken on the other branch's molecule.
  // on the REVIEW beat too, which is why the index is passed: the lanes hold
  // products by then and would answer that the step acts on none of them.
  const grp=enzLanes(focusStep()).filter(j=>lanes[j]).map(j=>lanes[j].g);
  ENZ.update(grp.length?[grp]:[], {key:branch+':'+focusStep()});
}

/* WHAT KIND OF STEP THIS IS — coupled or not, one-way or not — read off the
 * step, never typed, and both a door into the energy card. The pair is worth
 * more here than in either sibling: the ethanol branch's two steps are one of
 * each, side by side. */
function drawEnzMeta(){
  const i=focusStep();
  const st=(!intro && i<nSteps() && !tallyOn()) ? stepAt(i) : null;
  enzMetaEl.hidden=!st || INSET;
  enzNoteEl.hidden=!(st&&st.takeaway);
  enzNoteEl.textContent=(st&&st.takeaway)||'';
  if(!st || INSET){ enzMetaEl.innerHTML=''; return; }
  const on=cplOpen()?'true':'false';
  const first = st.couple ? 'k-cpl' : (st.rev===false ? 'k-irr' : 'k-rev');
  enzMetaEl.innerHTML=
      `<span class="east ${first}" aria-hidden="true"></span>`
    + (st.couple ? `<button class="estat k-cpl" data-cpl aria-pressed="${on}">Coupled reaction</button>` : '')
    + `<button class="estat ${st.rev===false?'k-irr':'k-rev'}" data-cpl aria-pressed="${on}">${
        st.rev===false?'Irreversible':'Reversible'}</button>`;
}
enzMetaEl.addEventListener('click',e=>{
  if(!e.target.closest('[data-cpl]') || INSET) return;
  setPanel('energy');
});

/* ---- the energy card: energy/energy.js's figure ---------------------------
 * ONE FIGURE, THE SOLO CURVE. No step here is coupled (see the `red` steps), so
 * the tab strip, the pair view and `Energy.curve` are all unreachable and this
 * page never calls them. Names are READ OFF THE MOLECULES, never typed. */
function soloSpec(st){
  const nameOf=k=>SPECS(k).short||SPECS(k).name, i=steps().indexOf(st);
  return { from:nameOf(speciesAt(i)[0]), to:nameOf(st.species[0]), drop:st.rev===false };
}
/* ONE SENTENCE PER VERDICT, because the only uncoupled step on this page is the
 * decarboxylation and that one is IRREVERSIBLE. glycolysis can state the
 * near-equilibrium line unconditionally — its five uncoupled steps are all
 * rearrangements — and copying it here put "runs either way" directly above a
 * heading reading "Irreversible in the cell" and a figure drawn as a drop.
 * krebs-lab.html already answers to `rev` for this reason. */
const soloLine=st=>st.rev===false
  ? `The product <b>leaves</b>: CO₂ comes out of solution and is gone. Nothing
     drives this one backwards.`
  : `Both sides sit at nearly the <b>same energy</b>, so the step runs either
     way.`;
// Neither reduction is uphill, so there is one sentence and not two: the drop
// pays for the carrier turning over, which is the only reason the cell bothers.
/* THE HYDRIDE AND THE PROTON, said in words rather than drawn. Both reductions
 * take an H⁺ out of solution alongside the hydride, and with the pair figure
 * gone this is the only place the page can say the reaction needs it. */
const reduceLine=`<b>NADH</b> hands over a hydride and solution supplies an
   <b>H⁺</b>. Both partners end lower: nothing is stored, and the cell is doing
   this for the empty <b>NAD⁺</b> it gets back.`;
const cplEl=document.getElementById('couplebox');
cplEl.addEventListener('click',e=>{
  if(e.target.closest('[data-cplx]')){ panel=null; refresh(); }
});
let shownCplStep=null;
function drawCouple(){
  const i=focusStep();
  const st=(cplOpen()&&!intro&&i<nSteps())?stepAt(i):null;
  if(!st){ cplEl.style.display='none'; cplEl.innerHTML=''; shownCplStep=null; return; }
  cplEl.style.display='block';
  cplEl.innerHTML=`<button class="cx" type="button" data-cplx aria-label="Close">&times;</button>`
    + `<div class="nhead cpl-h">Energy curve</div>`
    + Energy.solo(soloSpec(st))
    + `<p class="nbody">${soloLine(st)}</p>`
    + (st.fx==='red' ? `<p class="nbody">${reduceLine}</p>` : '')
    + (st.rev===false
        ? `<div class="nhead irr">Irreversible in the cell</div>`
        : `<div class="nhead rev">Near equilibrium — reversible</div>`);
  const key=branch+':'+i;
  if(key!==shownCplStep){
    shownCplStep=key;
    cplEl.classList.remove('in'); void cplEl.offsetWidth;
    cplEl.classList.add('in');
  }
}
// Nothing left for the sidebar card to say: the verdicts ride the stage and the
// balance rides the ledger. Collapsed, so it costs the column no height.
const noteEl=document.getElementById('stepnote');
function drawNote(){ noteEl.innerHTML=''; noteEl.style.display='none'; }

/* ---- the branch tabs ------------------------------------------------------
 * A TAB, NOT A RAIL STOP. The rail's numbers mean "where am I in this pathway",
 * so putting a second destination on it would make the ethanol branch look like
 * step 3 of the lactate one. Switching is free: `done` is per branch, so a
 * half-run branch is still half-run when you come back. */
const tabsEl=document.getElementById('branchtabs');
const whenEl=document.getElementById('branchwhen');
function setBranch(k){
  if(k===branch || busy) return;
  cancelTimers(); busy=false; reviewing=false; laneDone.clear();
  branch=k; _pathTop=null;
  renderLanes(done()); refresh();
}
function drawTabs(){
  tabsEl.innerHTML='';
  /* A TABLIST, NOT TWO TOGGLES. `aria-pressed` announces "Lactate, pressed",
   * which reads as a filter over one thing; these are two destinations and a
   * screen reader should say which of them is showing. */
  tabsEl.setAttribute('role','tablist');
  tabsEl.setAttribute('aria-label','Which fermentation');
  BRANCHES.forEach(b=>{
    const el=document.createElement('button');
    el.className='btab'; el.type='button';
    el.setAttribute('role','tab');
    el.textContent=b.tab;
    el.setAttribute('aria-selected', b.key===branch?'true':'false');
    el.setAttribute('aria-label', `${b.tab} fermentation`);
    el.onclick=()=>setBranch(b.key);
    tabsEl.appendChild(el);
  });
  whenEl.textContent=branchOf(branch).when;
}

/* ---- the rail, one per branch ---------------------------------------------
 * ONE OR TWO NUMBERS, and the count changes with the tab. glycolysis's rail can
 * reason that "the ten are always ten"; here the length is a fact about the
 * branch, so this is redrawn on a switch rather than filled in. */
const railEl=document.getElementById('rail');
function drawRail(){
  railEl.innerHTML='';
  const d=done(), n=nSteps();
  steps().forEach((st,idx)=>{
    const state = (!intro && !reviewing && idx===d) ? 'run'
                : (!intro && idx===d-1 && !(d>=n && !reviewing)) ? 'cur'
                : (idx < d) ? 'past' : 'future';
    const b=document.createElement('button');
    b.className='rnum '+state;
    b.textContent=st.n;
    b.setAttribute('aria-label',`Step ${st.n}`);
    if(state==='cur') b.setAttribute('aria-current','step');
    b.onclick=()=>goToStep(idx);
    railEl.appendChild(b);
  });
  const e=document.createElement('button');
  const at=!intro && !reviewing && d>=n;
  e.className='rnum rend '+(at?'cur':'future');
  e.textContent='End';
  e.setAttribute('aria-label','End of branch');
  if(at) e.setAttribute('aria-current','step');
  e.style.cursor='pointer';
  e.onclick=()=>goToStep(n);
  railEl.appendChild(e);
}
const goToStep=k=>{ if(busy) return; intro=false; reviewing=false; setDone(k);
  laneDone.clear(); renderLanes(done()); refresh(); };

const actEl=document.getElementById('actbtn');
// The button is kodo.css's .pill. Every className write below REPLACES the
// attribute, so the base has to be re-stated each time — a bare '' silently
// strips the component and leaves a UA button.
const ACT_BASE='pill';
const stepHeadEl=document.getElementById('stephead');
const stepTipEl=document.getElementById('steptip');
const BURST_MS=190;
let pressing=false;
function press(fn){
  if(pressing || busy) return;
  pressing=true;
  actEl.classList.add('burst');
  later(()=>{ pressing=false; fn(); }, BURST_MS);
}
function beginBranch(){
  if(!intro) return;
  press(()=>{ intro=false; refresh(); computeFit(); });
}
function drawAct(){
  const hi=focusStep();
  const head = intro ? ''
             : reviewing ? `Step ${stepAt(done()-1).n} complete`
             : hi<nSteps() ? headAt(hi) : '';
  // THE CAPTION HANGS OFF THE HEADING: the ⓘ carries this step's own text, so
  // there is one caption per step and one place it comes from.
  const tip = head ? captionAt(hi) : '';
  stepHeadEl.innerHTML = head + (tip
    ? `<span class="infowrap"><button class="infobtn" type="button"
         aria-describedby="steptip"
         aria-label="What happens in this step">i</button></span>` : '');
  stepTipEl.innerHTML = tip;
  stepHeadEl.classList.toggle('on', !!head);
  const entering = reviewing && !shownReview;
  shownReview = reviewing;
  if(entering){ stepHeadEl.classList.remove('revin'); void stepHeadEl.offsetWidth; }
  stepHeadEl.classList.toggle('revin', reviewing);
  if(intro){
    actEl.style.visibility='visible';
    actEl.className=ACT_BASE;
    actEl.innerHTML=`Begin <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=beginBranch;
    return;
  }
  actEl.className = reviewing ? ACT_BASE+' revin' : ACT_BASE;
  if(reviewing){
    actEl.style.visibility='visible';
    actEl.innerHTML=`Next <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=()=>{ reviewing=false; refresh(); };
    return;
  }
  /* THE END OF A BRANCH IS NOT THE END OF THE LESSON — the other tab is the
   * second half, so the last button is the way there. Once both are run there
   * is nothing left to press, and the tally is what stands. */
  if(done()>=nSteps() && !busy){
    const other=BRANCHES.find(b=>b.key!==branch);
    const bothDone=progress[other.key]>=STEPS[other.key].length;
    actEl.style.visibility='visible';
    /* BOTH BRANCHES RUN IS THE END OF THE LESSON, and this family always ends
     * with something in this slot: glycolysis asks "What's next?", the cycle
     * hands off. Hiding the button left the student on the tally with an empty
     * bar and nothing saying the lesson was over or what it had shown. So the
     * slot says the thing both branches were for. A statement, not a door. */
    if(bothDone){
      actEl.className=ACT_BASE+' done';
      actEl.innerHTML=`Two answers, one problem: NAD⁺ back either way`;
      actEl.onclick=null;
      return;
    }
    actEl.innerHTML=`Now the ${other.tab.toLowerCase()} branch <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=()=>setBranch(other.key);
    return;
  }
  /* NO BUTTON DURING A STEP, ever. Both branches' steps are clicked on the
   * molecule — the click IS the hydride crossing, or the carbon leaving — and a
   * Next in the corner would be an easier way past the lesson. `visibility`,
   * not `display`: the bar's height is reserved by the camera fit. */
  actEl.style.visibility='hidden'; actEl.onclick=null;
}

// A reload restores the boxes, not the flags: take the box as the truth.
function refresh(){ drawTabs(); drawAcc(); drawLedger(); drawTally(); drawEnz(); drawAct();
  drawRail(); drawNote(); drawCouple(); drawCaption(); computeFit(); }

document.getElementById('restart').onclick=restart;
/* → ADVANCES WHATEVER IS IN FRONT OF YOU, which in both siblings includes the
 * steps themselves. Here every step is clicked on the molecule, so the key has
 * to run the armed lane rather than a whole step — without it a student who
 * drove ten glycolysis steps with the arrow key presses → and nothing happens.
 * The FIRST lane still waiting, so the key and the callout point at the same
 * reaction. */
function advance(){
  const st=(!intro && done()<nSteps()) ? stepAt(done()) : null;
  if(!st) return;
  const j=actingLanes(st).find(i=>!laneDone.has(i));
  if(j!=null) press(()=>runLane(j));
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault();
    if(intro){ beginBranch(); }
    else if(reviewing){ reviewing=false; refresh(); }
    else advance(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); rewind(); }
});

/* =============================================================
 *  MAIN LOOP
 * ============================================================= */
L.frame=()=>{
  LANES.step();
  cam.r+=(fitR-cam.r)*0.05;
  cam.target.y+=(fitY-cam.target.y)*0.06;
  applyCam(); orthoFrustum();
  KIT.faceCamera(camera);
};
L.afterFrame=()=>{
  drawPlates();
  drawFlyers();
  drawSpots();
  drawHint();
  placeTallyMols();
  placeEnz();
};

renderLanes(done()); refresh(); applyCam(); resize();
// Re-solve after refresh(): the first computeFit runs before the caption is up,
// so it reserves nothing along the bottom and opens one frame too close.
computeFit();
cam.target.y=fitY; cam.r=fitR; applyCam(); orthoFrustum();
L.start();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(computeFit);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  const w=canvas.width, h=canvas.height, s=w/(canvas.clientWidth||w);
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const x=out.getContext('2d');
  x.drawImage(canvas,0,0);
  x.textAlign='center';
  const projV=new THREE.Vector3();
  lanes.forEach(l=>{
    const spec=SPECS(l.key);
    projV.set(l.g.position.x,l.topY+laneOffset(l),0).project(camera);
    const px=(projV.x*0.5+0.5)*w, py=(-projV.y*0.5+0.5)*h;
    x.font=`500 ${14*s}px "Zilla Slab", Georgia, serif`;
    x.fillStyle='#8a8073'; x.fillText(spec.formula, px, py-3*s);
    x.font=`700 ${19*s}px "Zilla Slab", Georgia, serif`;
    x.fillStyle='#2b2723'; x.fillText(l.nameEl.textContent, px, py-20*s);
  });
  const a=document.createElement('a'); a.download='fermentation.png';
  a.href=out.toDataURL('image/png'); a.click();
};
</script>

</body>
</html>
