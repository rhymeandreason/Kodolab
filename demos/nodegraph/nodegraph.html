       reads as belonging to its unit rather than floating between them */
    if (!n.tint) n.tint = (UNITS[m.unit] || {}).tint;
    links.push({ a: n, b: m, type: 'illustrates', rank, spine: rank === 1 });
    n.deg++; m.deg++;
  }
}

/* the reachability pass above ran before these existed, so specimens and
   content cards get their own. A protein placed only at rank 2 — collagen,
   gfp and ferritin are each the SECOND exemplar of their concept — would
   otherwise carry no spine edge at all and be unreachable. */
for (const n of nodes) {
  if (n.type !== 'specimen' && n.type !== 'content') continue;
  const mine = linksOf(n);
  if (mine.some(l => l.spine)) continue;
  const best = Math.min(...mine.map(l => l.rank));
  for (const l of mine) if (l.rank === best) l.spine = true;
}

/* ---- edge grammar -------------------------------------------------------
   The type dictionaries below drive BOTH the x-layering and the why/so-what
   grouping, so the layout and the affordances cannot disagree.

   FORWARD: a explains / becomes / builds b — a sits left of b.
   BACKWARD: a acts on / instantiates b — b sits left of a.
   Everything else (contrasts-with, describes, answers, preserves, spends,
   supplies) imposes no order.

   `spends` and `supplies` are the deliberate pair, and the map has now
   earned them three times: active transport's ATP, fermentation's recycled
   NAD⁺, and the sugar the Calvin cycle hands to glycolysis. A RESOURCE
   CLAIM IS NOT AN EXPLANATORY ORDER. Biology's resources genuinely go round
   in loops and the explanation axis is a DAG, so any edge that says "this
   makes the stuff that one over there uses" has to be able to say it
   without also claiming which is read first. instance-of into a THEME is exempted: a theme is a
   view over the map, not a station on the explanation.

   CONTAINMENT IS TWO RELATIONS, and they point opposite ways. `part-of`
   BUILDS: amino acids make a primary structure, phospholipids make a
   bilayer, so the part is read first. `contains` ZOOMS IN: you meet the
   enzyme and then look inside it for the pocket, so the whole is read
   first. One type for both put the entire enzyme subtree six columns
   LEFT of the enzyme and left the walk with nowhere to go from it. */
const FORWARD = {
  'prerequisite-of': 1, 'causes': 1, 'determines': 1, 'enables': 1,
  'produces': 1, 'alters': 1, 'transforms-into': 1, 'evidence-for': 1,
  'part-of': 1, 'contains': 1, 'contributes-to': 1, 'lowers': 1, 'precedes': 1,
  'necessitates': 1,
};
/* LATERAL types sit BESIDE the reading rather than along it, so they impose
   no order, wear the contrast colour and carry no arrowhead. `contrasts-with`
   holds two things apart; `analogous-to` says two things are the same move in
   different systems, which is what NADPH is to NADH. Opposite claims, same
   geometry: neither one is a step. */
const LATERAL = { 'contrasts-with': 1, 'analogous-to': 1 };
const BACKWARD = {
  'consumes': 1, 'destroys': 1, 'explained-by': 1, 'instance-of': 1,
  /* a film hangs off what it illustrates, so it lands to the right of it */
  'illustrates': 1,
};

/* the ordering constraint a link imposes: [earlier, later], or null */
function ordered(l) {
  if (l.type === 'instance-of' && l.b.type === 'theme') return null;
  if (FORWARD[l.type])  return [l.a, l.b];
  if (BACKWARD[l.type]) return [l.b, l.a];
  return null;
}

/* which side of the reading a neighbour sits on, seen from n:
   'why' is upstream (what explains this), 'onward' is downstream (what
   this makes possible), 'contrast' is beside. answers counts as why from
   the concept's side — the question is the motivation. */
function groupOf(l, n) {
  if (LATERAL[l.type]) return 'contrast';
  const o = ordered(l);
  if (o) return o[1] === n ? 'why' : 'onward';
  if (l.type === 'answers') return n === l.b ? 'why' : 'onward';
  return n === l.b ? 'why' : 'onward';
}

/* ---- x: explanatory order ----------------------------------------------
   Longest-path layering over the ordering constraints, with a cycle guard
   (a cycle here is a data bug: usually a causes edge typed backwards).
   Nodes with no upstream constraint are then pulled RIGHT to just before
   their first consequence, so a disulfide bridge does not sit beside
   electronegativity merely because nothing points at it. Questions are
   exempt: a question is a door, placed just left of its best answer. */
const inCons = new Map(nodes.map(n => [n, []]));
const outCons = new Map(nodes.map(n => [n, []]));
for (const l of links) {
  const o = ordered(l);
  if (!o || o[0].type === 'question' || o[1].type === 'question') continue;
  inCons.get(o[1]).push(o[0]);
  outCons.get(o[0]).push(o[1]);
}
const layerOf = new Map();
function layer(n, stack = new Set()) {
  if (layerOf.has(n)) return layerOf.get(n);
  if (stack.has(n)) { console.warn('ordering cycle at', n.id); return 0; }
  stack.add(n);
  const ins = inCons.get(n);
  const v = ins.length ? Math.max(...ins.map(m => layer(m, stack) + 1)) : 0;
  stack.delete(n);
  layerOf.set(n, v);
  return v;
}
for (const n of nodes) if (n.type !== 'question') layer(n);
/* pull sourceless nodes right, to just before their first consequence —
   IGNORING consequences whose only constraint is this node (they trail
   it, so using them is circular: point-mutation would be held at 0 by
   nat-select, whose position comes from point-mutation) — then
   re-propagate the longest path so the trailers follow.

   THE SEARCH IS TRANSITIVE. A node whose every consequence trails it has no
   anchor one step out, and used to be left at column 0 — which stranded
   `antiparallel → strand-asymmetry → replication` and `codon → genetic-code
   → translation` at the map's left edge, four columns before the DNA they
   are properties of. So the walk continues through the trailers until it
   reaches something independently anchored, and the distance travelled is
   what the node sits back from it. */
for (const n of nodes) {
  if (n.type === 'question' || inCons.get(n).length) continue;
  let front = [n], seen = new Set([n]), dist = 0, want = null;
  while (front.length && dist < 12 && want === null) {
    const next = [];
    dist++;
    for (const m of front) for (const o of outCons.get(m)) {
      if (seen.has(o)) continue;
      seen.add(o);
      /* anchored = held by a constraint from outside this floating chain */
      if (inCons.get(o).some(p => !seen.has(p)))
        want = want === null ? layerOf.get(o) - dist : Math.min(want, layerOf.get(o) - dist);
      else next.push(o);
    }
    front = next;
  }
  if (want !== null) layerOf.set(n, Math.max(0, want));
}
for (let pass = 0; pass < 12; pass++) {
  let changed = false;
  for (const n of nodes) {
    if (n.type === 'question' || !inCons.get(n).length) continue;
    const v = Math.max(...inCons.get(n).map(m => layerOf.get(m) + 1));
    if (v > layerOf.get(n)) { layerOf.set(n, v); changed = true; }
  }
  if (!changed) break;
}
/* MEDIAN TIGHTENING. Longest-path layering puts every node as far LEFT as
   its constraints allow, which is right for a node whose story starts there
   and wrong for one that is merely reachable early: glucose sat at column 5
   with six columns of slack, nine away from the glycolysis that consumes it,
   because digestion happens to mention it first.

   So each node with slack moves to the median of its RANK-1 neighbours,
   clamped to the range its own constraints still allow. Rank 1 is what makes
   this safe to apply everywhere: bilayer has one late consumer
   (chemiosmosis, sixteen columns right) and two early rank-1 causes, so its
   median stays early and the water unit does not get torn apart chasing it.
   The clamp is what keeps it legal, so no edge can reverse. */
for (let pass = 0; pass < 4; pass++) {
  let moved = false;
  for (const n of nodes) {
    if (n.type === 'question') continue;
    const ins = inCons.get(n), outs = outCons.get(n);
    if (!outs.length) continue;                   /* a sink has nowhere to go */
    const lo = ins.length ? Math.max(...ins.map(m => layerOf.get(m) + 1)) : 0;
    const hi = Math.min(...outs.map(m => layerOf.get(m))) - 1;
    if (hi <= lo) continue;                       /* no slack to spend */
    let near = linksOf(n).filter(l => l.rank === 1)
      .map(l => (l.a === n ? l.b : l.a))
      .filter(m => m.type !== 'question' && layerOf.has(m))
      .map(m => layerOf.get(m));
    if (!near.length) continue;
    near.sort((a, b) => a - b);
    const mid = near.length % 2
      ? near[(near.length - 1) / 2]
      : (near[near.length / 2 - 1] + near[near.length / 2]) / 2;
    const want = Math.round(Math.min(hi, Math.max(lo, mid)));
    if (want !== layerOf.get(n)) { layerOf.set(n, want); moved = true; }
  }
  if (!moved) break;
}

/* authored column nudges apply after the algorithm has spoken, and before
   anything (question anchors, neighbour means) reads the layers */
for (const n of nodes)
  if (n.nudge && layerOf.has(n)) layerOf.set(n, layerOf.get(n) + n.nudge);

/* a node with NO ordering edges (induced-fit, the themes) has no place on
   the explanation axis of its own — it sits at the mean of its neighbours */
for (const n of nodes) {
  if (n.type === 'question') continue;
  if (inCons.get(n).length || outCons.get(n).length) continue;
  const ns = neighbours(n).filter(m => m.type !== 'question');
  if (ns.length)
    layerOf.set(n, ns.reduce((s, m) => s + layerOf.get(m), 0) / ns.length);
}
/* a question is anchored to its RANK-1 answer — the door hangs at its own
   door frame, not at the mean of everything it opens. Among several rank-1
   answers, the earliest layer wins: the question enters the story where
   the story starts. */
for (const n of nodes) {
  if (n.type !== 'question') continue;
  const aLinks = linksOf(n).filter(l => l.type === 'answers');
  if (!aLinks.length) { n.anchor = null; continue; }
  const bestRank = Math.min(...aLinks.map(l => l.rank));
  n.anchor = aLinks.filter(l => l.rank === bestRank)
    .map(l => l.a === n ? l.b : l.a)
    .sort((a, b) => layerOf.get(a) - layerOf.get(b))[0];
}
/* COLUMN WIDTH IS NOT A CONSTANT. A layer holding two nodes cost the same
   430px of paper as one holding twenty-three, so the sparse tail spent a
   third of the map's width on almost nothing — and the white space around a
   lone question read as emphasis it had not earned — while the water end had
   cards shoulder to shoulder in a gap barely wider than one card. The gap
   AFTER a column is scaled by the busier of the two it separates: sparse
   columns close up, crowded ones get the room the cards need. Only the
   spacing changes, never the order, so no edge can reverse. */
const COL_MIN = 250, COL_MAX = 580, BUSY = 14;
const load = {};
for (const n of nodes) {
  if (n.type === 'question' || !layerOf.has(n)) continue;
  const c = Math.round(layerOf.get(n));
  load[c] = (load[c] || 0) + 1;
}
const cols = Object.keys(load).map(Number);
const colLo = Math.min(...cols), colHi = Math.max(...cols);
const gapAt = c => COL_MIN + (COL_MAX - COL_MIN) *
  Math.min(1, Math.max(load[c] || 0, load[c + 1] || 0) / BUSY);
const colX = new Map();
{
  let x = 0;
  for (let c = colLo; c <= colHi; c++) { colX.set(c, x); x += gapAt(c); }
}
/* a levelless node's layer is a mean, and a question sits 0.7 of a column
   left of its answer, so the ruler has to be readable between its rungs */
function xAt(v) {
  const c = Math.floor(v);
  if (c < colLo) return colX.get(colLo) - (colLo - v) * gapAt(colLo);
  if (c >= colHi) return colX.get(colHi) + (v - colHi) * gapAt(colHi - 1);
  return colX.get(c) + (v - c) * gapAt(c);
}
for (const n of nodes) n.tx = xAt(
  n.type === 'question' ? (n.anchor ? layerOf.get(n.anchor) - 0.7 : colLo)
                        : layerOf.get(n));

/* ---- y: the scale ladder ------------------------------------------------
   Bands from the ladder, top is ecosystem because up is bigger. Bands
   nothing occupies stay thin — present on the ruler, not spent on screen.
   A leveled node sits in its band; a levelless one (concepts, themes,
   questions) settles at the mean of its neighbours, iterated, which is
   what lets polarity float between the water and protein shelves. */
const lvOf = n => n.level || n.occursAt || n.emergesAt || 0;
const used = new Set(nodes.map(lvOf).filter(Boolean));
/* A RUNG IS AS TALL AS WHAT STANDS ON IT. Every used band was a flat 660px,
   so macromolecule's thirty-eight nodes and ecosystem's one got the same
   paper — five nodes were spending 2,640px of a 5,540px map while the
   molecule and macromolecule rungs had cards on identical points. The ladder
   still says which rung; how much room the rung gets is what it holds. */
const bandLoad = {};
for (const n of nodes) { const lv = lvOf(n); if (lv) bandLoad[lv] = (bandLoad[lv] || 0) + 1; }
const BAND_LO = 340, BAND_HI = 1320, BAND_FULL = 34;
const bandH = lv => !used.has(lv) ? 130
  : BAND_LO + (BAND_HI - BAND_LO) * Math.min(1, (bandLoad[lv] || 0) / BAND_FULL);
const bandCentre = {}, bandEdge = [];
{
  let y = 0;
  for (let lv = 10; lv >= 1; lv--) {
    const h = bandH(lv);
    bandEdge.push(y);
    bandCentre[lv] = y + h / 2;
    y += h;
  }
  bandEdge.push(y);
}
for (const n of nodes) n.ty = lvOf(n) ? bandCentre[lvOf(n)] : bandCentre[2];

/* WITHIN A BAND, ORDER BY THE GRAPH. Which rung a node sits on is its scale
   and is not negotiable, but its height ON that rung used to be left to
   repulsion and a jitter — so a membrane protein could sit below the
   tertiary structure it is an instance of, while the selective permeability
   that necessitates it was a whole band above and the edge crossed
   everything in between. Every node now settles at the MEDIAN of its rank-1
   neighbours; a leveled one is then clamped back into its own band. The
   ladder still says which rung, the edges say where along it. */
const BAND_PAD = 0.17;            /* of the band's own height, at each edge */
const bandLo = {}, bandHi = {};
for (const lv of used) {
  const half = bandH(lv) * (0.5 - BAND_PAD);
  bandLo[lv] = bandCentre[lv] - half;
  bandHi[lv] = bandCentre[lv] + half;
}
/* THE QUESTION FILTER RUNS BEFORE THE FALLBACK, not after. The other way
   round, a node whose only rank-1 neighbour is a question passed the
   non-empty test, then filtered to nothing and bailed — so van-helmont never
   read the carbon fixation it is evidence for and kept the raw band centre.

   And every pass reads a SNAPSHOT. Reading `ty` as it was being written made
   a node's seat depend on where it sits in graphdata.js, so reordering the
   data file moved cards for no reason a reader could see. */
const rank1Of = new Map(nodes.map(n => {
  let ns = linksOf(n).filter(l => l.rank === 1)
    .map(l => (l.a === n ? l.b : l.a)).filter(m => m.type !== 'question');
  if (!ns.length) ns = neighbours(n).filter(m => m.type !== 'question');
  return [n, ns];
}));
for (let pass = 0; pass < 12; pass++) {
  const was = new Map(nodes.map(n => [n, n.ty]));
  for (const n of nodes) {
    if (n.type === 'question') continue;
    const ns = rank1Of.get(n);
    if (!ns.length) continue;
    const ys = ns.map(m => was.get(m)).sort((a, b) => a - b);
    const mid = ys.length % 2
      ? ys[(ys.length - 1) / 2]
      : (ys[ys.length / 2 - 1] + ys[ys.length / 2]) / 2;
    const lv = lvOf(n);
    n.ty = lv ? Math.max(bandLo[lv], Math.min(bandHi[lv], mid)) : mid;
  }
}
/* after the concepts settle: a question sits level with its anchor */
for (const n of nodes)
  if (n.type === 'question' && n.anchor) n.ty = n.anchor.ty;

/* start positions: the semantic target plus a deterministic nudge, so
   stacked cards separate the same way every load */
nodes.forEach((n, i) => {
  n.x = n.tx;
  n.y = n.ty + ((i * 137) % 97 - 48) * 2.2;
  n.vx = n.vy = 0;
});

/* ---- DOM --------------------------------------------------------------- */

/* HALF-EXTENTS, NOT A RADIUS. Repulsion used the circumscribed circle, so
   every card reserved its own DIAGONAL in all directions — and the widest
   cards on the map are the questions, which is why every hole in the paper
   had a door sitting in the middle of it. A card is a box; measure it as
   one. */
function sizeOf(n, grow = 1) {
  n.rx = n.el.offsetWidth / 2 * grow;
  n.ry = n.el.offsetHeight / 2 * grow;
}

const esc = t => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function paintNode(n) {
  const el = document.createElement('div');
  if (n.type === 'question') {
    /* an anchoring question is the door into a unit; a bridging one links two
       that are already open. Both are questions, so both are doors, but they
       are not the same size of door. */
    el.className = 'node question unlit ' + (n.qtype || 'anchor') +
                   (n.made ? ' made asked' : '');
    /* A QUESTION CAN CARRY A LESSON. Where a lesson is a whole unit rather
       than one claim — water-lab is — no concept card is the right host, and
       the door is. The question keeps its own shape and gains a picture and
       the pill under it, the same two things a concept card gains. */
    const qLesson = openerFor(n);
    if (qLesson) el.classList.add('haslesson');
    el.innerHTML = '<span>' + esc(n.text) + '</span>' +
                   (qLesson
                     ? '<div class="thumb"><span class="ph"></span></div>' +
                       '<div class="opens"><button type="button" ' +
                       'class="opener primary" data-open="' + esc(qLesson.id) +
                       '">' + (qLesson.kind === 'model' ? 'open 3D model'
                                                        : 'view lesson') +
                       '</button></div>' : '') +
                   '<div class="chips"></div>';
  } else if (n.type === 'theme') {
    el.className = 'node theme unlit';
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>' +
                   '<div class="chips"></div>';
  } else if (n.type === 'specimen') {
    /* the composer's specimen card, inverted from a concept's: the NAME is
       the card, because a specimen is a thing and its blurb is a label on
       it. No dot — a specimen belongs to every concept that names it. The
       prov line is read from the baker's half of the registry. */
    el.className = 'node card unlit specimen';
    const tag = n.does === 'enzyme' && n.ecClass
      ? '<div class="tag" title="' + esc(n.ecDoes || '') + '">' + esc(n.ecClass)
        + '<span>EC ' + esc(n.ec) + '</span></div>'
      : n.does === 'enzyme' ? '<div class="tag">enzyme</div>' : '';
    const prov = [
      n.method,
      n.residues != null && n.declared != null
        ? n.residues + ' of ' + n.declared + ' residues' : null,
      n.species,
    ].filter(Boolean).map(esc).join(' · ');
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' + tag +
                   '<div class="thumb"><span class="ph"></span></div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>' +
                   '<div class="prov">' + prov + '</div>' +
                   '<div class="chips"></div>';
  } else if (n.type === 'ask') {
    el.className = 'node askpill';
    el.dataset.pill = n.id;
    el.textContent = n.label;
  } else if (n.type === 'made') {
    /* GENERATED, AND IT MUST NOT PASS FOR AUTHORED. Every other card on this
       map ships with the assertion that checks it; this one is a model's
       sentence, written seconds ago, checked by nobody. The dashed edge and
       the tag are the whole difference between an extension and a forgery. */
    el.className = 'node card made';
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>' +
                   '<div class="tags"><span class="tag made">generated</span></div>';
  } else if (n.type === 'satellite') {
    el.className = 'node card satellite';
    if (n.tint) el.style.setProperty('--dot', n.tint);
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>';
  } else if (n.type === 'content') {
    /* the specimen card's shape, for the same reason: this card IS a thing,
       so its name leads and its claim is a label on it. A film carries its
       still and its credit; a lesson carries neither and says so. */
    el.className = 'node card unlit content ' + n.kind;
    if (n.tint) el.style.setProperty('--dot', n.tint);
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' +
                   '<div class="tag">' + (n.kind === 'video' ? 'film' : 'lesson') + '</div>' +
                   (n.blurb ? '<div class="claim">' + esc(n.blurb) + '</div>' : '') +
                   (n.poster
                     ? '<div class="thumb mounted"><img class="still poster" alt="" src="../' +
                       esc(n.poster) + '"></div>' : '') +
                   (n.credit
                     ? '<div class="credit"><a href="' + esc(n.creditUrl) +
                       '" target="_blank" rel="noopener">' + esc(n.credit) + '</a>' +
                       (n.year ? ' · ' + n.year : '') + '</div>' : '') +
                   '<div class="opens"><button type="button" class="opener" data-open="' +
                     esc(n.id) + '">' + (n.kind === 'video' ? 'play' : 'open lesson') +
                   '</button></div>' +
                   '<div class="chips"></div>';
  } else {
    el.className = 'node card unlit ' + n.type +
                   (n.big ? ' big' : '') +
                   (n.subject === 'chemistry' ? ' chem' : '');
    const tint = n.subject === 'chemistry' ? CHEM_TINT : (UNITS[n.unit] || {}).tint;
    if (tint) el.style.setProperty('--dot', tint);
    n.tint = tint;
    /* no scale tag: the gutter is the ruler, and a card at a rung sits level
       with that rung's label already */
    const opener = openerFor(n);
    const tags =
      (n.type === 'evidence' ? '<span class="tag eviD">evidence</span>' : '') +
      (n.subject === 'chemistry' ? '<span class="tag chem">chemistry</span>' : '');
    el.innerHTML = '<div class="name">' +
                     (n.type === 'process' ? '<span class="run">→</span>' : '') +
                     (n.type === 'evidence'
                       ? '<i class="ph-bold ph-flask flask" aria-hidden="true"></i>' : '') +
                     esc(n.name) + '</div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>' +
                   /* a thumb is a promise a picture is coming, so only cards
                      with a view get one; it stays hidden while fogged */
                   (viewFor(n) ? '<div class="thumb"><span class="ph"></span></div>' : '') +
                   /* THE LESSON'S OWN CARD IS GONE, so this button is the
                      only way into it and does not fade with the card's
                      other controls. Under the thumb, because it is what
                      the picture above it is a picture OF. */
                   /* BORROWED PICTURES CARRY THEIR CREDIT, the way the
                      film cards do. A lesson's shot is ours and prints
                      nothing; a model's is its author's and prints here,
                      because the thumb is already showing their work before
                      anyone opens the modal that names them. */
                   (opener && opener.credit
                     ? '<div class="credit"><a href="' + esc(opener.creditUrl) +
                       '" target="_blank" rel="noopener">' + esc(opener.credit) +
                       '</a></div>' : '') +
                   (opener
                     ? '<div class="opens"><button type="button" ' +
                       'class="opener primary" data-open="' + esc(opener.id) +
                       '">' + (opener.kind === 'model' ? 'open 3D model'
                                                       : 'view lesson') +
                       '</button></div>' : '') +
                   (tags ? '<div class="tags">' + tags + '</div>' : '') +
                   '<div class="chips"></div>';
  }
  n.el = el;
  world.appendChild(el);
  sizeOf(n);
}

const wordFor = t => t.replace(/-/g, ' ');

function paintLink(l) {
  const contrast = LATERAL[l.type];
  l.el = document.createElementNS(NS, 'path');
  l.el.setAttribute('fill', 'none');
  if (l.rank >= 3) l.el.setAttribute('stroke-dasharray', '3 4');
  svg.appendChild(l.el);
  if (!contrast) {
    l.arrow = document.createElementNS(NS, 'polygon');
    l.arrow.setAttribute('points', '-3,-3.5 4,0 -3,3.5');
    svg.appendChild(l.arrow);
  }
  l.label = document.createElementNS(NS, 'text');
  l.label.setAttribute('text-anchor', 'middle');
  l.label.textContent = wordFor(l.type);
  svg.appendChild(l.label);
}

/* the one place an edge's resting style is decided. Focus overlays it and
   clearFocus routes back through here, so the states cannot drift. */
/* The current highlight's picks, or null. Edges read it too: a highlighted
   group with its interior edges dropped is a scatter of dots, and what a
   unit looks like IS its wiring. Declared here because edgeRefresh closes
   over it and runs before applyHighlight ever does. */
let hiNodes = null;

function edgeRefresh(l) {
  const contrast = LATERAL[l.type];
  const colour = contrast ? '#e2643a' : '#1f5f4f';
  const both = l.a.on && l.b.on, any = l.a.on || l.b.on;
  let op = both ? (l.rank === 1 ? 0.4 : 0.2) : any ? 0.12 : 0.05;
  let arrowOp = both ? (l.rank === 1 ? 0.55 : 0.35) : any ? 0.12 : 0.05;
  /* INSIDE THE HIGHLIGHT, an edge is drawn as if both ends were lit, so the
     group's shape survives the fog it is lying over. Everything else falls
     back further than the fog alone, which is the same 0.28 the unpicked
     marks take. */
  if (hiNodes) {
    const inside = hiNodes.has(l.a) && hiNodes.has(l.b);
    op = inside ? (l.rank === 1 ? 0.55 : 0.28) : op * 0.3;
    arrowOp = inside ? (l.rank === 1 ? 0.7 : 0.4) : arrowOp * 0.3;
  }
  l.el.setAttribute('stroke', colour);
  l.el.setAttribute('stroke-width', l.rank === 1 ? '2.2' : '1');
  l.el.setAttribute('stroke-opacity', op);
  if (l.arrow) {
    l.arrow.setAttribute('fill', colour);
    l.arrow.setAttribute('fill-opacity', arrowOp);
  }
}

/* ---- the stages ---------------------------------------------------------
   Four live boxes across the whole map, card-stage.js's budget. onEvict
   fires while the box is live, which is the only moment a still can be
   taken — a card that goes quiet must not go blank. */
const stages = CardStage.pool({
  limit: 4,
  onEvict: (id, box) => {
    const n = byId[id];
    const thumb = n && n.el && n.el.querySelector('.thumb');
    if (!thumb) return;
    const png = box.snapshot ? box.snapshot() : null;
    thumb.classList.remove('mounted');
    if (!png) return;
    const img = document.createElement('img');
    img.className = 'still'; img.alt = ''; img.src = png;
    thumb.appendChild(img);
    thumb.classList.add('mounted');
  },
});

function goLive(n) {
  const view = viewFor(n);
  const thumb = view && n.el && n.el.querySelector('.thumb');
  if (!thumb) return;
  /* A LESSON'S THUMB IS A PICTURE, and so is a model's. It costs no context
     and never needs reclaiming, so it is written straight in and the pool of
     four stays for the boxes that are actually running something. A model's
     picture is doing a second job: the embed cannot be snapshotted across
     origins, so a live one would leave the card blank the moment the reader
     looked away. */
  if (SHOT[view.kind]) {
    if (!thumb.classList.contains('mounted')) {
      const img = document.createElement('img');
      /* no loading="lazy": inside a transformed #world the intersection
         never resolves and the image stays at zero. The card being lit IS
         the laziness — nothing is fetched for a node still in the fog. */
      img.className = 'still shot'; img.alt = '';
      img.src = '../' + view.shot;
      thumb.appendChild(img);
      thumb.classList.add('mounted');
    }
    return;
  }
  if (stages.has(n.id)) {                 // re-front, and resume if paused
    const box = stages.acquire(n.id, null);
    if (box.start) box.start();
    return;
  }
  stages.acquire(n.id, () => {
    thumb.querySelectorAll('.still').forEach(el => el.remove());
    thumb.classList.add('mounted');

    if (view.kind === 'molbox')
      /* no inset frame, no leader: the card is the frame. Spin, because the
         point is that the thing is 3D. */
      return Molbox.create({ mount: thumb, spec: MolLib.MOLECULES[view.spec],
                             spin: true });

    if (view.kind === 'build')
      /* the bonding builder, opened finished and flat — the view that draws
         the electrons. zoomOnComplete because a card is a close-up. */
      return MoleculeBuilder.create({ mount: thumb, recipe: view.recipe,
                                      fill: true, zoomOnComplete: true });

    if (view.kind === 'protein')
      /* proteinbox owns the molecule (trace, surface, fold, its two
         controls); a specimen names a registry key and the box resolves the
         files itself, an r: item names files directly. base because
         nodegraph/ is a directory down. */
      return Proteinbox.create(view.protein
        ? { mount: thumb, base: '../', protein: view.protein, variant: view.variant }
        : { mount: thumb,
            trace: '../' + view.trace,
            chains: view.chains,
            surface: view.surface ? '../' + view.surface : null,
            fold: view.fold ? '../' + view.fold : null });

    /* a water sim: card-stage owns the shell, watersim is the physics */
    let sim = null;
    const box = CardStage.create({
      mount: thumb,
      cam: { theta: 0.5, phi: 1.15, r: 26 },
      step: () => { if (sim) sim.step(Object.assign(
        { solvent: sim.salt.length > 0 }, view.frame)); },
      onDestroy: () => { sim = null; },
    });
    sim = WaterSim.create(THREE, box.root);
    for (let i = 0; i < view.waters; i++) sim.spawn();
    for (let i = 0; i < (view.salt || 0); i++) sim.addSalt('nacl');
    if (view.salt) sim.assignShells();
    box.draw();
    return box;
  });
  reDensify();                  // a card mounted while zoomed in opens sharp
}

/* the canvas measures its unzoomed layout box, so the device ratio carries
   the zoom — idle only, since resizing a drawing buffer reallocates it */
let densityTimer = 0;
function reDensify() {
  const px = Math.min(devicePixelRatio * view.k, 3);
  for (const id of stages.keys()) {
    const box = stages.get(id);
    const stage = box && box.stage;
    if (!stage || !stage.renderer) continue;
    if (stage.renderer.getPixelRatio() === px) continue;
    stage.renderer.setPixelRatio(px);
    stage.resize();
    if (box.draw) box.draw();
  }
}
const densifySoon = () => {
  clearTimeout(densityTimer);
  densityTimer = setTimeout(reDensify, 180);
};

/* ---- light ------------------------------------------------------------- */

function light(n) {
  if (mode === 'build' && !built.has(n)) return;
  if (n.on) return;
  n.on = true;
  n.el.classList.remove('unlit');
  sizeOf(n);
  for (const l of linksOf(n)) edgeRefresh(l);
  goLive(n);                    // a lit card shows its subject, not a promise
  wake(0.5);
}

function unlightAll() {
  for (const n of nodes) { n.on = false; n.el.classList.add('unlit'); }
}

/* the single-card inverse. A fogged card must not keep a WebGL context, so
   the stage goes back to the pool — same rule start() applies wholesale. */
function unlight(n) {
  if (!n.on) return;
  n.on = false;
  n.el.classList.add('unlit');
  if (stages.has(n.id)) stages.release(n.id);
}

/* ---- relax --------------------------------------------------------------
   Overlap resolution only. X is pinned hard to the layer column, y is
   pulled to the median the layout computed, links align y between their
   endpoints, and repulsion does the rest. No spring invents an x. */
let alpha = 0, settled = true;
const wake = a => { alpha = Math.max(alpha, a); settled = false; };

function step() {
  if (mode === 'build') return buildStep();
  const REPEL = 22000, VMAX = 16, GAP = 64;
  const NA = active(), LA = activeLinks();
  for (const n of NA) { n.vx *= 0.76; n.vy *= 0.76; }

  for (let i = 0; i < NA.length; i++) {
    const a = NA[i];
    if (a.satellite) continue;          /* revealed detail pushes nothing */
    for (let j = i + 1; j < NA.length; j++) {
      const b = NA[j];
      if (b.satellite) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = (i - j) || 1; dy = 1; d2 = 2; }
      const d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
      const f = REPEL / d2;
      a.vx -= ux * f; a.vy -= uy * f;
      b.vx += ux * f; b.vy += uy * f;
      /* BOX OVERLAP, resolved on the axis of LEAST overlap — the shortest
         way out. A wide flat card stops shoving its neighbours down for a
         height it does not have, and stops holding them off sideways at a
         distance only its corners reach. */
      const ox = a.rx + b.rx + GAP - Math.abs(dx);
      const oy = a.ry + b.ry + GAP - Math.abs(dy);
      if (ox > 0 && oy > 0) {
        if (ox < oy) {
          const p = ox * 1.3 * (dx < 0 ? -1 : 1);
          a.vx -= p; b.vx += p;
        } else {
          const p = oy * 1.3 * (dy < 0 ? -1 : 1);
          a.vy -= p; b.vy += p;
        }
      }
    }
  }

  for (const l of LA) {
    if (l.a.satellite || l.b.satellite) continue;
    const dy = l.b.y - l.a.y;
    const f = dy * 0.004;                     /* y alignment only */
    l.a.vy += f; l.b.vy -= f;
  }

  let moved = 0;
  for (const n of NA) {
    n.vx += (n.tx - n.x) * 0.12;
    /* a question holds its anchor harder than a concept holds its mean:
       shoved off it, it reads as attached to whatever it drifted near */
    /* firmer than it was, on both counts: the y target used to be a band
       centre or a neighbour mean, and holding loosely to a vague target was
       right. It is a median now, so holding it is worth more than the room
       repulsion gets — swept 0.05/0.015 through 0.16/0.13 and this is the
       floor of the card-overlap curve. */
    n.vy += (n.ty - n.y) * (n.type === 'question' ? 0.07 : lvOf(n) ? 0.09 : 0.06);
    const v = Math.hypot(n.vx, n.vy);
    if (v > VMAX) { n.vx *= VMAX / v; n.vy *= VMAX / v; }
    if (n === dragNode || n.pinned) continue;
    const dx = n.vx * alpha, dy = n.vy * alpha;
    n.x += dx; n.y += dy;
    moved = Math.max(moved, Math.abs(dx), Math.abs(dy));
  }
  alpha *= 0.985;
  if (alpha < 0.05 && moved < 0.05) { settled = true; alpha = 0; }
}

/* BUILD'S RELAX IS question-composer.html's, which is the layout this mode is
   copying. The map's step is overlap resolution over targets a layout pass has
   already spread across a column grid; a grown graph has no such pass, and
   running it here dealt cards on top of their own arrivals.

   What the composer has and the map does not is a LINK SPRING: a rest length
   between two connected cards is what holds a fan open and keeps a card near
   whatever revealed it. Column pull is firm, the row target soft, and the
   friction heavy — cards settle into place rather than bouncing into it. */
function buildStep() {
  const REPEL = 20000, SPRING = 0.012, COLUMN = 0.06, REST = 620, VMAX = 16, GAP = 44;
  for (const n of buildNodes) { n.vx *= 0.76; n.vy *= 0.76; }

  for (let i = 0; i < buildNodes.length; i++) {
    const a = buildNodes[i];
    for (let j = i + 1; j < buildNodes.length; j++) {
      const b = buildNodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = (i - j) || 1; dy = 1; d2 = 2; }
      const d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
      const f = REPEL / d2;
      a.vx -= ux * f; a.vy -= uy * f;
      b.vx += ux * f; b.vy += uy * f;
    }
  }

  for (const l of buildLinks) {
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.hypot(dx, dy) || 1;
    /* the rest length has to clear both boxes, or a spring between two big
       cards balances the separation pushing them apart and the pair settles
       overlapping: measured, a specimen with a ribbon in it sat on both of
       its rank-1 neighbours at a flat 420 */
    /* a door or a facet keeps the short rest its fan was dealt at, or the
       spring pulls back out the very gap `BUILD_CHAIN` closed */
    const chain = l.a.type === 'question' || l.b.type === 'question' ||
                  l.a.synthetic || l.b.synthetic;
    const rest = Math.max(chain ? BUILD_CHAIN : REST,
                          l.a.rx + l.b.rx + GAP, l.a.ry + l.b.ry + GAP);
    const f = (d - rest) * SPRING;
    l.a.vx += (dx / d) * f; l.a.vy += (dy / d) * f;
    l.b.vx -= (dx / d) * f; l.b.vy -= (dy / d) * f;
  }

  let moved = 0;
  for (const n of buildNodes) {
    n.vx += (n.tx - n.x) * COLUMN;
    n.vy += (n.ty - n.y) * 0.04;
    const v = Math.hypot(n.vx, n.vy);
    if (v > VMAX) { n.vx *= VMAX / v; n.vy *= VMAX / v; }
    if (n === dragNode || n.pinned) continue;
    const dx = n.vx * alpha, dy = n.vy * alpha;
    n.x += dx; n.y += dy;
    moved = Math.max(moved, Math.abs(dx), Math.abs(dy));
  }
  /* OVERLAP IS A CONSTRAINT, NOT A FORCE. As a force it needs alpha to still
     be worth something, so it either loses the race with the decay and leaves
     cards on top of each other, or it is held alive and then fights the spring
     in a limit cycle the reader sees as jitter. Projected straight onto the
     positions it resolves in a frame or two and cannot oscillate: the pulls
     are gentle, alpha decays to nothing, and the last frame to run is
     overlap-free. Counted into `moved` so the loop does not declare itself
     settled with a separation still pending. */
  for (let i = 0; i < buildNodes.length; i++) {
    const a = buildNodes[i];
    for (let j = i + 1; j < buildNodes.length; j++) {
      const b = buildNodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const ox = a.rx + b.rx + GAP - Math.abs(dx);
      const oy = a.ry + b.ry + GAP - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;
      const held = m => m === dragNode || m.pinned;
      const share = held(a) || held(b) ? 1 : 0.5;
      /* the shorter way out, so a wide flat card stops shoving its neighbours
         down for a height it does not have */
      if (ox < oy) {
        const p = ox * share * (dx < 0 ? -1 : 1);
        if (!held(a)) a.x -= p;
        if (!held(b)) b.x += p;
        moved = Math.max(moved, ox * share);
      } else {
        const p = oy * share * (dy < 0 ? -1 : 1);
        if (!held(a)) a.y -= p;
        if (!held(b)) b.y += p;
        moved = Math.max(moved, oy * share);
      }
    }
  }
  alpha *= 0.985;
  if (alpha < 0.05 && moved < 0.05) { settled = true; alpha = 0; }
}

function draw() {
  /* a satellite has no position of its own: it holds an offset from its host
     and is placed from wherever the host currently is, so dragging a card
     takes its revealed detail with it */
  for (const n of nodes) {
    if (!n.satellite) continue;
    n.x = n.host.x + n.dx;
    n.y = n.host.y + n.dy;
  }
  for (const n of nodes) n.el.style.transform =
    'translate(-50%,-50%) translate(' + n.x.toFixed(1) + 'px,' + n.y.toFixed(1) + 'px)';
  for (const l of links) {
    const x1 = l.a.x, y1 = l.a.y, x2 = l.b.x, y2 = l.b.y;
    const bend = Math.abs(x2 - x1) * 0.42 + 30;
    const s1 = x2 >= x1 ? bend : -bend;
    l.el.setAttribute('d', 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) +
      'C' + (x1 + s1).toFixed(1) + ',' + y1.toFixed(1) +
      ' ' + (x2 - s1).toFixed(1) + ',' + y2.toFixed(1) +
      ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
    const mx = (x1 + 3 * (x1 + s1) + 3 * (x2 - s1) + x2) / 8;
    const my = (y1 + 3 * y1 + 3 * y2 + y2) / 8;
    l.label.setAttribute('x', mx.toFixed(1));
    l.label.setAttribute('y', (my - 8).toFixed(1));
    if (l.arrow) {
      const deg = Math.atan2(1.5 * (y2 - y1), 1.5 * (x2 - x1 - s1)) * 180 / Math.PI;
      l.arrow.setAttribute('transform',
        'translate(' + mx.toFixed(1) + ',' + my.toFixed(1) + ') rotate(' + deg.toFixed(1) + ')');
    }
  }
}

/* the reader has moved the camera themselves, by hand or by asking: a resize
   must not re-centre a map they have navigated */
let touched = false;
let follow = null, followFrames = 0, followK = 0;
function followStep() {
  if (!follow || followFrames-- <= 0) { follow = null; followK = 0; return; }
  /* a QUERY arrives from wherever the reader happened to be, which may be the
     whole map at 0.3 — where the card it lands on is a smudge. So a follow
     can carry a zoom, eased on the same frames as the pan. Clicking a card
     sets no `followK` and the zoom is left exactly as the reader had it. */
  if (followK && Math.abs(followK - view.k) > 0.002) {
    const k = view.k + (followK - view.k) * 0.06;
    /* zoom about the screen centre, which is where the pan is taking it */
    view.x = innerWidth / 2 - (innerWidth / 2 - view.x) * (k / view.k);
    view.y = innerHeight / 2 - (innerHeight / 2 - view.y) * (k / view.k);
    view.k = k;
  }
  view.x += (innerWidth * 0.5 - follow.x * view.k - view.x) * 0.05;
  view.y += (innerHeight / 2 - follow.y * view.k - view.y) * 0.05;
  applyView();
}

/* THE OPENING MOVE, which is `question-composer.html`'s intro in this map's
   terms. A BEAT FIRST: the question alone on the paper, long enough to read,
   with the graph it opened held back — a pull-back that starts on the first
   frame is a zoom, and the reader is reading. Then the camera draws back to
   the fit on a timed cubic, not a per-frame lerp: a lerp is fastest at the
   instant it starts, which is the opposite of the move this wants.

   It is not `follow` — that centres its target, and Build holds the seed a
   seventh of the way in — so the camera is written from the seed's world
   position every frame and only k is eased. Any pan, zoom or drag ends it: a
   move the reader is fighting is worse than no move. */
let cineOn = false, cineAt = 0, cineK = 0, cineY = 0;
const CINE_HOLD = 900, CINE_GLIDE = 1600, CINE_FROM = 1;
/* the composer's ease, cubic in and out: slow away, slow in */
const cineEase = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

function cineStep() {
  if (!cineOn || mode !== 'build') return;
  const t = performance.now() - cineAt;
  if (t < CINE_HOLD) return;                 /* the beat */
  if (document.body.classList.contains('intro')) {
    document.body.classList.remove('intro');
    stagger(waiting); waiting = [];          /* the graph arrives with the move */
  }
  const u = Math.min(1, (t - CINE_HOLD) / CINE_GLIDE);
  view.k = CINE_FROM + (cineK - CINE_FROM) * cineEase(u);
  seatSeed();
  applyView();
  if (u >= 1) cineEnd();
}

/* THE WAVE. The cards do not fade in where they already are — they JOIN, one
   at a time, in reading order: by hop first, then left to right, which is the
   order the reader would have clicked them in. Each arrival wakes the relax,
   so the graph shifts to take the new card the way it does when a fan is
   dealt, and what the reader watches is the graph being built rather than a
   picture being revealed.

   The layout is computed FIRST and whole — `dealBuild` deals the graph,
   settles it and frames the camera — and then everything but the seed is
   PARKED and re-admitted on the schedule. Dealing progressively instead would
   mean framing a camera on a graph that does not exist yet, and every card
   would land somewhere the next arrival moves it away from. A parked card
   keeps the seat the layout gave it. */
const ARRIVE_STEP = 100, ARRIVE_CAP = 4000;   /* ms between arrivals, and the last card's wait */
let wave = 0;                   /* the current wave; a reseed invalidates the last */
let waiting = [];               /* parked through the beat, dealt when it ends */
/* the opening deal lays the whole graph out before anything is parked, so the
   fans it calls must not park as they go — a parked card is out of `built`,
   and the next hop would deal it again as if it were new */
let dealing = false;

/* out of the graph, holding its seat. The relax, the edges and the stage pool
   all read the built set, so leaving it is all it takes to be gone. */
function park(m) {
  m.seatX = m.x; m.seatY = m.y;
  built.delete(m);
  const i = buildNodes.indexOf(m);
  if (i >= 0) buildNodes.splice(i, 1);
  for (let j = buildLinks.length - 1; j >= 0; j--) {
    const l = buildLinks[j];
    if (l.a === m || l.b === m) { showLink(l, false); buildLinks.splice(j, 1); }
  }
  unlight(m);
  showEl(m, false);
}

/* the fade a single card arrives on. Two frames so the browser takes the
   starting opacity before the class goes, with a timer racing them: rAF is
   throttled to about once a second in a hidden tab, and the card would sit at
   zero until the reader came back. */
function fadeIn(m) {
  if (!m.el) return;
  m.el.classList.add('arriving');
  let done = false;
  const go = () => {
    if (done) return;
    done = true;
    if (m.el) m.el.classList.remove('arriving');
  };
  requestAnimationFrame(() => requestAnimationFrame(go));
  setTimeout(go, 60);
}

function stagger(list) {
  const order = list.slice()
    .sort((a, b) => (a.hop || 0) - (b.hop || 0) || a.x - b.x);
  for (const m of order) park(m);
  const id = ++wave;
  order.forEach((m, i) => setTimeout(() => {
    if (id !== wave || mode !== 'build') return;   /* a reseed owns the graph now */
    reveal(m, m.seatX, m.seatY, null);
    fadeIn(m);
    /* the floor is applied on ARRIVAL as well as on focus: focus graded this
       card while the graph still held it, and then the wave took it out and
       put it back, so nothing has floored it since */
    buildFull();
    measure();
    wake(0.5);                  /* the graph takes the new card */
  }, Math.min(i * ARRIVE_STEP, ARRIVE_CAP)));
}

function cineEnd() {
  cineOn = false;
  document.body.classList.remove('intro');
}

/* the seed's spot on the screen, which the opening move holds still while the
   zoom changes underneath it */
function seatSeed() {
  if (!buildSeed) return;
  const w = innerWidth || 1440, h = innerHeight || 900;
  view.x = w * 0.13 - (buildSeed.x - buildSeed.rx) * view.k;
  /* the same y the arrival framed: a heading holds its own line, a card seed
     holds the graph's. Recomputing it here as the seed's own y made a card
     seed jump on the move's first frame. */
  view.y = h / 2 - cineY * view.k;
}

function frame() {
  if (!settled) { step(); draw(); }
  cineStep();
  followStep();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- pan, zoom, drag ---------------------------------------------------- */

const canvas = document.getElementById('canvas');
const hint = document.getElementById('hint');
let view = { x: 0, y: 0, k: 0.6 };

function showHint() { hint.textContent = 'k ' + view.k.toFixed(2); }

const MARKK_MAX = 2.4;
let markk = 1;

const applyView = () => {
  showHint();
  /* the marks' counter-scale, capped — see .node.card.unlit */
  markk = view.k < 1 ? Math.min(1 / view.k, MARKK_MAX) : 1;
  world.style.setProperty('--markk', markk.toFixed(3));
  const zoomed = view.k > 1;
  world.style.zoom = zoomed ? view.k : 1;
  const t = zoomed ? view.k : 1;
  world.style.transform =
    'translate(' + (view.x / t) + 'px,' + (view.y / t) + 'px)' +
    (zoomed ? '' : ' scale(' + view.k + ')');
  placeGutter();
};

let dragNode = null, dragging = null, last = null, travel = 0;

/* the tip rides the cursor and only over a node that still has something to
   open. It is hidden the moment a drag starts: mid-pan it is not an offer. */
const expandTip = document.getElementById('expandtip');
canvas.addEventListener('pointermove', e => {
  const on = !dragging && e.target.closest('.node.canexpand');
  expandTip.hidden = !on;
  if (on) expandTip.style.transform =
    'translate(' + (e.clientX + 16) + 'px,' + (e.clientY + 18) + 'px)';
});
canvas.addEventListener('pointerleave', () => { expandTip.hidden = true; });
canvas.addEventListener('pointerdown', () => { expandTip.hidden = true; });

/* nothing on the map is draggable in the HTML sense — the CSS covers WebKit,
   this covers the rest, and both leave the card's own drag alone */
canvas.addEventListener('dragstart', e => e.preventDefault());

canvas.addEventListener('pointerdown', e => {
  /* a card's own controls keep their pointer — every control must be here.
     The symptom of a missing entry is a button that renders and does
     nothing while the card behind it opens. */
  if (e.target.closest('.chip, .mb-dims, .pbox-rep, .pbox-play, .opener, .askpill')) return;
  const hit = e.target.closest('.node');
  last = { x: e.clientX, y: e.clientY };
  travel = 0;
  follow = null;
  if (hit) {
    dragNode = nodes.find(n => n.el === hit);
    hit.classList.add('dragging');
    dragging = 'node';
    wake(0.3);
  } else {
    dragging = 'pan';
    canvas.classList.add('panning');
  }
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  last = { x: e.clientX, y: e.clientY };
  travel += Math.hypot(dx, dy);
  if (dragging === 'pan') { view.x += dx; view.y += dy; applyView(); }
  else { dragNode.x += dx / view.k; dragNode.y += dy / view.k; dragNode.vx = dragNode.vy = 0;
         wake(0.3); }
});

function endDrag(e) {
  const click = travel <= 5;
  if (dragging === 'node') {
    dragNode.el.classList.remove('dragging');
    if (click) {
      if (mode === 'build') expand(dragNode);
      light(dragNode); focus(dragNode);
    }
    else dragNode.pinned = true;
    dragNode = null;
  } else if (dragging === 'pan' && click && focused) {
    clearFocus();
  }
  canvas.classList.remove('panning');
  dragging = null;
  if (e && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* zoom about a point on the screen, so whatever is under the fingers stays
   under them */
function zoomAt(k, cx, cy) {
  k = Math.min(2.5, Math.max(0.18, k));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k;
  applyView();
  densifySoon();                 // the canvases follow the zoom, once it stops
}

/* A Mac trackpad's two-finger scroll IS a wheel event, and so is a mouse
   wheel's click, so the handler has to tell them apart: the trackpad pans and
   the wheel zooms, which is what each one is for.

   NO SINGLE EVENT SAYS WHICH. Safari sends a mouse notch as deltaY 4.0002,
   wheelDeltaY -12 — fractional, not a multiple of 120, and the same shape a
   swipe arrives in. What separates them is the STREAM: a notch is one or two
   events, a two-finger scroll is a long burst with a momentum tail behind it.
   So the BURST is what gets classified, the verdict carries to the next one,
   and it is remembered across loads, because otherwise a trackpad reader pays
   the wrong first flick on every visit. The map opens assuming a wheel.

   The two zooms are metered differently: a notch is a step, so it moves k by
   a fixed ratio, while a pinch or a ctrl-scroll is continuous. */
const BURST_GAP = 120;      // ms of quiet that ends a burst
const BURST_PAN = 8;        // events in one burst that only fingers produce
let burstAt = 0, burstN = 0, shortRun = 0;
const TRACKPAD_KEY = 'nodegraph.trackpad';
let trackpad = false;
try { trackpad = localStorage.getItem(TRACKPAD_KEY) === '1'; } catch (_) {}
const setTrackpad = on => {
  trackpad = on;
  try { localStorage.setItem(TRACKPAD_KEY, on ? '1' : '0'); } catch (_) {}
};

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  follow = null;
  const s = e.deltaMode === 1 ? 16 : 1;             // deltaMode 1 counts lines
  const now = performance.now();

  if (now - burstAt < BURST_GAP) burstN++;
  else {
    /* the burst that just ended: two stubby ones in a row mean the fingers
       left and a wheel took over */
    shortRun = burstN && burstN <= 2 ? shortRun + 1 : 0;
    if (shortRun >= 2 && trackpad) setTrackpad(false);
    burstN = 1;
  }
  burstAt = now;
  if (burstN >= BURST_PAN && !trackpad) setTrackpad(true);

  if (e.ctrlKey || e.metaKey)                       // pinch, in Chrome's dialect
    zoomAt(view.k * Math.exp(-e.deltaY * s * 0.01), e.clientX, e.clientY);
  else if (trackpad || e.deltaX !== 0) {
    view.x -= e.deltaX * s;
    view.y -= e.deltaY * s;
    applyView();
    densifySoon();
  } else {
    const steps = e.wheelDeltaY ? Math.sign(e.wheelDeltaY) : -Math.sign(e.deltaY);
    zoomAt(view.k * Math.exp(steps * 0.14), e.clientX, e.clientY);
  }
}, { passive: false });

/* Safari's pinch. e.scale is cumulative from the gesture's start, so the
   start's k is what it multiplies. preventDefault also stops the page zoom
   the same fingers would otherwise trigger. */
let gestureK = 1;
canvas.addEventListener('gesturestart', e => {
  e.preventDefault(); follow = null; gestureK = view.k;
}, { passive: false });
canvas.addEventListener('gesturechange', e => {
  e.preventDefault(); zoomAt(gestureK * e.scale, e.clientX, e.clientY);
}, { passive: false });
canvas.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

/* ---- focus and the direction chips -------------------------------------- */

let focused = null;

/* A MARK IS MEASURED AT THE SIZE IT REACHES WHEN FULLY COUNTER-SCALED, not
   at the size it happens to be right now. The spacing is baked once and the
   reader zooms freely through it, so sizing marks at the current zoom put
   seventeen labels on top of each other at the zoom the map opens on. Only
   the marks grow: a lit card is a card, and it is already the bigger box. */
/* WHAT "MORE" MEANS DIFFERS BY MODE, and asking the map's question in Build
   says every card is finished, because Build lights everything it deals. On
   the map a node has more when a neighbour is still fogged; in Build it has
   more when `expand` would still find something to deal — a neighbour not yet
   built, or a question the bar is holding for it. */
const canOpen = n => mode === 'build'
  ? linksOf(n).some(l => {
      const o = l.a === n ? l.b : l.a;
      return !o.satellite && !built.has(o);
    }) || QUERIES.some(q => q.anchorId === n.id && !built.has(q))
  : !n.on && links.some(l => l.a === n ? !l.b.on : l.b === n ? !l.a.on : false);

function measure() {
  for (const n of active()) {
    const grow = n.on ? 1 : MARKK_MAX / markk;
    sizeOf(n, grow);
    n.el.classList.toggle('canexpand', canOpen(n));
  }
  wake(0.4);
}

/* a theme's fan is dealt whole — a theme is a query, not a place */
function renderChips(n) {
  const box = n.el.querySelector('.chips');
  if (!box) return;
  if (n.type === 'theme') {
    const dark = neighbours(n).filter(m => !m.on);
    box.innerHTML = dark.length
      ? '<button class="chip" data-g="all">show all ' + neighbours(n).length + '</button>' : '';
    return;
  }
  /* a card deals no chips: focusing it already presents its neighbourhood,
     and the row of three read as controls competing with the card's text. */
  box.innerHTML = '';
}

/* the lesson behind a card, opened over the map; src set on show and
   cleared on hide, so the lesson's context belongs to the moment it is open */
const lessonFrame = document.getElementById('lessonframe');
const lessonTitle = document.getElementById('lessontitle');
const lessonModal = Modal.create({
  el: 'lessonmodal',
  onShow: c => {
    lessonTitle.textContent = c.name || 'the lesson';
    lessonFrame.src = '../' + c.href;
  },
  onHide: () => { lessonFrame.src = 'about:blank'; },
});

/* ---- a 3D model, over the map ----------------------------------------
   The parameters are built here rather than authored in graphcontent.js, for
   the reason YT_VARS is: the table holds the model's uid, which is the fact,
   and everything below is this page's decision about how a card shows one.

     autostart 1    — the reader clicked the opener.
     autospin       — the same claim molbox's `spin` makes: the thing is 3D,
                      and a still frame of it is indistinguishable from the
                      picture the reader just clicked away from.
     ui_infos 0     — the header already says what this is and whose it is.
     ui_hint 0      — the drag-me hand, over an anatomy model, reads as a
                      label on the organelle.
     dnt 1          — do not track, the reason the films are nocookie.
   ui_watermark is asked for and ignored on a free account; it costs nothing
   to ask and the day the model's author upgrades it starts working. */
const SKFB_VARS = {
  autostart: 1, autospin: 0.2, preload: 1, dnt: 1,
  ui_theme: 'dark', ui_infos: 0, ui_stop: 0, ui_hint: 0,
  ui_ar: 0, ui_vr: 0, ui_help: 0, ui_settings: 0,
  ui_watermark: 0, ui_watermark_link: 0,
};
const skfbSrc = uid =>
  'https://sketchfab.com/models/' + encodeURIComponent(uid) + '/embed?' +
  new URLSearchParams(SKFB_VARS);

/* Sketchfab's viewer API, loaded ON FIRST OPEN and never before — the same
   deal loadYT() makes, and for the same two reasons: it is a third-party
   script, and it is the only way to know when the model is actually on
   screen. Resolves to null rather than throwing when it cannot load, and the
   caller falls back to a bare iframe whose cover lifts on the frame's own
   load event — early, but a picture beats a black rectangle. */
let skfbReady = null;
function loadSkfb() {
  if (skfbReady) return skfbReady;
  skfbReady = new Promise(resolve => {
    if (window.Sketchfab) return resolve(window.Sketchfab);
    const t = setTimeout(() => resolve(null), 6000);
    const el = document.createElement('script');
    el.src = 'https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js';
    el.onload = () => { clearTimeout(t); resolve(window.Sketchfab || null); };
    el.onerror = () => { clearTimeout(t); resolve(null); };
    document.head.appendChild(el);
  });
  return skfbReady;
}

const modelBody = document.getElementById('modelbody');
let modelToken = 0;                 // closed and reopened before a load lands
const modelModal = Modal.create({
  el: 'modelmodal',
  onShow: c => {
    document.getElementById('modeltitle').textContent = c.name;
    /* A LINK, and the model's page is where the licence and the author live.
       Same split as the film: plain text on the card, the link in here. */
    const label = esc(c.credit) + (c.year ? ' · ' + esc(String(c.year)) : '');
    document.getElementById('modelcredit').innerHTML = c.creditUrl
      ? '<a href="' + esc(c.creditUrl) + '" target="_blank" rel="noopener noreferrer">'
        + label + '</a>'
      : label;

    const mine = ++modelToken;
    modelBody.classList.remove('ready');
    /* Built now, never before: no request reaches sketchfab.com until a
       reader opens one. The cover carries the card's own still, so the modal
       opens on the picture the reader just clicked. */
    modelBody.innerHTML =
      '<iframe id="modelframe" allowfullscreen ' +
      'allow="autoplay; fullscreen; xr-spatial-tracking" title="' + esc(c.name) +
      '"></iframe><div class="mcover"><b>loading the model</b></div>';
    modelBody.querySelector('.mcover').style.backgroundImage =
      'url("../' + c.shot + '")';
    const f = document.getElementById('modelframe');
    const say = document.querySelector('#modelbody .mcover b');
    const lift = () => { if (mine === modelToken) modelBody.classList.add('ready'); };

    loadSkfb().then(SF => {
      if (mine !== modelToken) return;      // closed while the script loaded
      if (!SF) { f.onload = lift; f.src = skfbSrc(c.src); return; }
      /* init() writes the src itself, so the options go here rather than
         through skfbSrc — same parameters, one authority.

         NOT `viewerready`: that fires when the viewer exists, which is tens
         of seconds before half a million faces and their textures have
         arrived, and lifting on it puts the cover away over a black frame —
         exactly the failure the cover is here to prevent. The two progress
         events are what say the picture is real. A safety timer lifts it
         anyway, because a cover that never goes away is worse than an
         unfinished model: the reader can rotate what has loaded. */
      const at = { model: 0, texture: 0 };
      const tick = () => {
        if (mine !== modelToken) return;
        const pc = Math.round((at.model + at.texture) * 50);
        if (say) say.textContent = 'loading the model · ' + pc + '%';
        if (at.model >= 1 && at.texture >= 1) lift();
      };
      new SF(f).init(c.src, Object.assign({}, SKFB_VARS, {
        success: api => {
          api.start();
          api.addEventListener('viewerready', () => setTimeout(lift, 45000));
          api.addEventListener('modelLoadProgress',
                               e => { at.model = e.progress; tick(); });
          api.addEventListener('textureLoadProgress',
                               e => { at.texture = e.progress; tick(); });
        },
        error: lift,
      }));
    });
  },
  /* REMOVING the iframe is what stops it. A hidden one keeps its WebGL
     context and keeps talking to sketchfab.com, so closing the card ends
     both — about:blank would leave the context alive. */
  onHide: () => { modelToken++; modelBody.innerHTML = ''; },
});

/* ---- the video, over the map -----------------------------------------
   youtube-nocookie, and the parameters are built here rather than authored in
   graphcontent.js: the table holds the video's ID, which is the fact, and every
   option below is this page's decision about how a card plays one.

     cc_load_policy 0 — THE POINT OF THE COLUMN. These videos print their key
                        terms on the picture, and a burned-in caption lands on
                        top of the word it is explaining. The param is the
                        documented way to ask; a reader whose account defaults
                        captions on can still override it, which is what
                        `unloadModule` on ready is for.
     rel 0            — the end screen offers more of this channel rather than
                        the whole of YouTube. A map is not a place to be
                        recommended out of.
     modestbranding 1 — the card already says whose work it is.
     autoplay 1       — the reader clicked play. */
const YT_VARS = {
  rel: 0, modestbranding: 1, autoplay: 1, playsinline: 1,
  cc_load_policy: 0, iv_load_policy: 3,
  /* No YouTube bar. The strip under the picture is ours, and the frame takes
     no pointer events, so the title and logo never fade in over the animation
     either. `plain()` keeps the native controls, because with no API there is
     nothing to drive a replacement with. */
  controls: 0,
};
const ytSrc = (id, api) =>
  'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?' +
  new URLSearchParams({ ...YT_VARS, ...(api ? { enablejsapi: 1, origin: location.origin } : {}) });

/* The API is loaded ON FIRST OPEN and never before: it is a third-party script,
   and a map nobody has opened a video on should not have fetched one. Resolves
   to null rather than throwing when it cannot load — offline, blocked, no
   network — and the caller falls back to a plain iframe. */
let ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    const t = setTimeout(() => resolve(null), 6000);
    window.onYouTubeIframeAPIReady = () => { clearTimeout(t); resolve(window.YT); };
    const el = document.createElement('script');
    el.src = 'https://www.youtube.com/iframe_api';
    el.onerror = () => { clearTimeout(t); resolve(null); };
    document.head.appendChild(el);
  });
  return ytReady;
}

const cueList = document.getElementById('videocues');
const trackBar = document.getElementById('videotracks');
let player = null, tracks = [], cues = [], cueEls = [], lit = -1, ticker = 0;

/* Which track the reader last chose, kept for the session only. A default that
   followed them across visits would need storage this page does not otherwise
   touch, and the default matters more than the memory: the video's OWN words
   are what a reader watching somebody else's video should get first. */
let trackPref = 'narration';


const mmss = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

function renderCues() {
  cueList.textContent = ''; cueEls = []; lit = -1;
  for (const q of cues) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="at">' + mmss(q.t) + '</span>' +
                   '<span class="tx">' + esc(q.text) + '</span>' +
                   (q.step ? '<span class="st">' + q.step + '</span>' : '');
    // Reading ahead is what the column is for, so a line is a seek target.
    li.addEventListener('click', () => {
      if (player && player.seekTo) { player.seekTo(q.t, true); player.playVideo(); }
    });
    cueList.appendChild(li);
    cueEls.push(li);
  }
  /* A TAIL, so the last cue can still reach the top. Without it the column
     runs out of scroll and the final few lines sit wherever they happen to
     land, which breaks the one promise the alignment makes. Sized in pixels
     from the list's height, because a percentage padding resolves against
     WIDTH and would be silently wrong. */
  const pad = document.createElement('li');
  pad.className = 'pad';
  pad.setAttribute('aria-hidden', 'true');
  cueList.appendChild(pad);
  sizePad();

  // Straight back to where the video is, so switching track never loses the
  // place. Instant rather than smooth: the list was just rebuilt, and animating
  // a scroll from the top of a list the reader never saw is motion for nothing.
  if (player && player.getCurrentTime) {
    litAt(player.getCurrentTime());
    scrollLit();
  }
}

function sizePad() {
  const pad = cueList.querySelector('.pad');
  const last = cueEls[cueEls.length - 1];
  if (!pad || !last) return;
  pad.style.height = Math.max(0, cueList.clientHeight - last.offsetHeight) + 'px';
}

/* The lit line goes to the TOP of the column, not merely into view: the reader
   is looking at one place, and a line that lands anywhere in a tall column is a
   line they have to find.

   Written as a scrollTop rather than scrollIntoView, which walks up the tree
   and can scroll an ancestor as well. And INSTANT rather than smooth, which is
   a measured decision and not a preference: `behavior: 'smooth'` is a no-op on
   this container in some browsers — a raw `scrollTo({behavior:'smooth'})`
   moved it not at all while `scrollTop =` moved it fine — so a smooth call
   fails by silently not scrolling, which reads exactly like the alignment
   being broken. A tween of our own would want rAF, which a backgrounded tab
   does not run. */
function scrollLit() {
  const el = cueEls[lit];
  if (!el) return;
  cueList.scrollTop += el.getBoundingClientRect().top
                     - cueList.getBoundingClientRect().top;
}

// The tail is a pixel height, so it is wrong the moment the window changes.
addEventListener('resize', () => { sizePad(); scrollLit(); });

function pickTrack(id) {
  const t = tracks.find(x => x.id === id) || tracks[0];
  if (!t) return;
  trackPref = t.id;
  cues = t.cues || [];
  for (const b of trackBar.querySelectorAll('button'))
    b.setAttribute('aria-pressed', String(b.dataset.track === t.id));
  const src = trackBar.querySelector('.src');
  if (src) src.innerHTML = t.sourceUrl
    ? '<a href="' + esc(t.sourceUrl) + '" target="_blank" rel="noopener noreferrer">'
      + esc(t.source || '') + '</a>'
    : esc(t.source || '');
  renderCues();
}

/* TWO TRACKS, and the default is the video's own. The narration is the film's
   author writing about their own film, and a reader watching somebody else's
   work should hear it in their words; ours is the same beats rewritten for a
   Bio 101 reader, which is a summary and says so. The switch is only drawn
   when there is more than one, so a single-track video shows no chrome. */
function renderTracks() {
  trackBar.textContent = '';
  trackBar.hidden = tracks.length < 2;
  if (trackBar.hidden) return;
  for (const t of tracks) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.track = t.id;
    b.textContent = t.label || t.id;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => pickTrack(t.id));
    trackBar.appendChild(b);
  }
  const src = document.createElement('span');
  src.className = 'src';
  trackBar.appendChild(src);
}

/* Fetched per open and not cached: a video is opened once in a session far
   more often than twice, and the file is a couple of KB. An empty column is a
   fine failure — the video still plays. */
async function loadCues(c) {
  tracks = []; cues = []; cueEls = []; lit = -1;
  cueList.textContent = ''; trackBar.textContent = ''; trackBar.hidden = true;
  if (!c.captions) return;
  try {
    const doc = await fetch('../' + c.captions).then(r => r.json());
    tracks = doc.tracks || [];
  } catch (e) { return; }
  renderTracks();
  pickTrack(trackPref);
}

/* Which line is now. Linear from the last one rather than a search over all of
   them: playback moves forward, and a seek is the only jump. */
function litAt(t) {
  let i = cues.length - 1;
  while (i > 0 && cues[i].t > t) i--;
  if (i === lit) return;
  if (cueEls[lit]) cueEls[lit].classList.remove('on');
  lit = i;
  const el = cueEls[i];
  if (!el) return;
  el.classList.add('on');
  scrollLit();
}

/* No API: the video still plays and the column still reads, it just does not
   follow. Better than no video. */
function plain(c) {
  /* Native controls come back with the player, so ours would be a second set
     that does nothing. */
  const strip = document.querySelector('.mctl');
  if (strip) strip.hidden = true;
  const box = document.querySelector('.mstage');
  box.innerHTML = '';
  const f = document.createElement('iframe');
  f.id = 'videoframe';
  f.title = 'video';
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = ytSrc(c.src, false).replace('controls=0', 'controls=1');
  box.appendChild(f);
}

/* WHERE THE CAPTIONS ACTUALLY GO OFF, and the whole reason the cue column can
   exist. `cc_load_policy=0` only ASKS: a reader whose YouTube account defaults
   captions on gets them anyway, and these videos print their key terms on the
   picture, so the burned-in line lands on top of the word it is explaining.

   Two calls because neither is documented and only their combination was
   observed to clear the render. The getters keep reporting a live track
   afterwards, so `getOption` cannot be used to check the result — the picture
   is the only test. Retried on a delay as well as on the module event: the
   module can load after the event that announced the last one. */
function killCaptions(p) {
  const go = () => {
    try { p.setOption('captions', 'track', {}); } catch (e) {}
    for (const m of ['captions', 'cc']) { try { p.unloadModule(m); } catch (e) {} }
  };
  go();
  setTimeout(go, 1200);
}

/* ---- our own transport -----------------------------------------------
   Every one of these exists because `controls=0` took YouTube's away. The
   modal card carries `playing` / `paused` so the CSS can draw the state in two
   places at once (the strip's button and the big centre mark) from one fact. */
const vCard = () => document.querySelector('#videomodal .mcard');
const vPlay = document.getElementById('videoplay');
const vTap  = document.getElementById('videotap');
const vBar  = document.getElementById('videobar');
const vFill = vBar.querySelector('i');
const vTime = document.getElementById('videotime');
const vDur  = document.getElementById('videodur');

function setPlaying(on) {
  const card = vCard();
  if (!card) return;
  card.classList.toggle('playing', on);
  card.classList.toggle('paused', !on);
  vPlay.setAttribute('aria-label', on ? 'Pause' : 'Play');
}

/* THE COVER IS THE PRE-PLAY STATE ONLY, and that limit is a measured result
   rather than a preference.

   YouTube draws its own overlay — big glyph, title, avatar, "More videos",
   logo — on every pause AND every seek, and it does not fade on a timer we can
   wait out: measured at +0.5s, +2s and +8s after a resume, it was still up at
   two and gone by eight. Covering it would mean hiding several seconds of the
   film every time the reader touches a cue, which costs more than the chrome.

   So the cover does the one job it can do cleanly: it hides the player's
   start-up, where there is nothing behind it worth seeing anyway. Once the
   picture has moved it never comes back, and a pause shows YouTube's own UI,
   which is what a paused embed looks like. */
function setCovered(on) {
  const card = vCard();
  if (card) card.classList.toggle('covered', on);
}

function toggle() {
  if (!player || !player.getPlayerState) return;
  const YT = window.YT;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}
vPlay.addEventListener('click', toggle);
vTap.addEventListener('click', toggle);

/* Seek from anywhere on the track, including the transparent padding that
   makes a 2px line catchable. */
vBar.addEventListener('click', e => {
  if (!player || !player.getDuration) return;
  const r = vBar.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  player.seekTo(f * player.getDuration(), true);
  player.playVideo();
});

/* Ours, because the native button went with the rest of the chrome. The iframe
   itself is what goes fullscreen, so the strip and the column stay behind. */
document.getElementById('videofull').addEventListener('click', () => {
  const f = player && player.getIframe && player.getIframe();
  if (f && f.requestFullscreen) f.requestFullscreen();
});

function paintTime() {
  if (!player || !player.getCurrentTime) return;
  const t = player.getCurrentTime(), d = player.getDuration() || 0;
  vTime.textContent = mmss(t);
  vDur.textContent = mmss(d);
  vFill.style.width = d ? (t / d * 100) + '%' : '0';
  /* Lifted by the PICTURE moving rather than by the player reporting PLAYING,
     which it does while its start-up card is still on screen. */
  if (t >= 0.55) {
    setCovered(false);
    // The poster has done its job once the video is running; every later
    // cover is a scrim over a frame the reader has already seen.
    const cv = document.querySelector('.mcover');
    if (cv && cv.classList.contains('first')) {
      cv.classList.remove('first');
      cv.style.backgroundImage = '';
    }
  }
  litAt(t);
}

function mount(c) {
  loadYT().then(YT => {
    if (!videoModal.isOpen()) return;          // closed while the script loaded
    if (!YT) return plain(c);
    player = new YT.Player('videoframe', {
      /* The API builds its iframe against www.youtube.com unless told
         otherwise, which would quietly undo the nocookie host `plain()` uses. */
      host: 'https://www.youtube-nocookie.com',
      videoId: c.src,
      playerVars: YT_VARS,
      events: {
        onReady: e => { killCaptions(e.target); e.target.playVideo(); },
        // Fires whenever a module loads, which is the only moment the
        // captions one can be taken away. It can fire more than once, and
        // killCaptions is safe to repeat.
        onApiChange: e => killCaptions(e.target),
        onStateChange: e => {
          clearInterval(ticker);
          /* BUFFERING is not PAUSED. YouTube fires it after PLAYING and again
             on every seek, and treating it as a stop threw the poster over a
             running video for as long as the buffer took. The state is left
             exactly as it was and the ticker stops, which is all buffering
             actually means here. */
          if (e.data === YT.PlayerState.BUFFERING) return;
          setPlaying(e.data === YT.PlayerState.PLAYING);
          /* THE END SCREEN IS THE LAST PIECE OF CHROME. `rel=0` narrows it to
             this channel but does not remove it, and a grid of thumbnails over
             the final frame is exactly what the reader came here to get away
             from. Rewinding to the start puts frame 0 back and never lets it
             draw. */
          if (e.data === YT.PlayerState.ENDED) {
            e.target.seekTo(0, true);
            e.target.pauseVideo();
            paintTime();
            return;
          }
          if (e.data !== YT.PlayerState.PLAYING) { paintTime(); return; }
          ticker = setInterval(paintTime, 250);
        },
      },
    });
  });
}

const videoModal = Modal.create({
  el: 'videomodal',
  onShow: c => {
    document.getElementById('videotitle').textContent = c.name;
    /* A link in the MODAL and plain text on the card. On the card, every click
       is the map's — zoom, drag, or open the video — and one that leaves the
       site would be competing with all three. Here the reader has already
       watched it, and going to find more is the reasonable next thing. */
    const credit = document.getElementById('videocredit');
    const label = esc(c.credit) + (c.year ? ' · ' + esc(String(c.year)) : '');
    credit.innerHTML = c.creditUrl
      ? '<a href="' + esc(c.creditUrl) + '" target="_blank" rel="noopener noreferrer">'
        + label + '</a>'
      : label;
    const cover = document.querySelector('.mcover');
    if (cover) {
      cover.classList.add('first');
      cover.style.backgroundImage = 'url("../' + c.poster + '")';
    }
    setPlaying(false);
    setCovered(true);             // and stays up until the picture moves
    loadCues(c);
    mount(c);
  },
  /* DESTROYING the player is what stops it. A hidden iframe keeps playing and
     keeps talking to YouTube, so closing the card has to end both — and the
     placeholder has to come back, because destroy() takes the node with it. */
  onHide: () => {
    clearInterval(ticker); ticker = 0;
    if (player && player.destroy) player.destroy();
    player = null; lit = -1;
    setPlaying(false);
    setCovered(true);
    vFill.style.width = '0'; vTime.textContent = '0:00'; vDur.textContent = '0:00';
    /* destroy() takes the iframe with it, so the STAGE is rebuilt — the frame
       placeholder, our click target and the paused mark. Only the stage: the
       strip below has live listeners bound to its nodes, and rebuilding
       `.mvideo` would silently drop every one of them. */
    const stage = document.querySelector('.mstage');
    if (stage) stage.innerHTML =
      '<div id="videoframe"></div>' +
      '<div class="mcover"></div>' +
      '<button type="button" class="mtap" id="videotap" aria-label="Play or pause"></button>' +
      '<span class="mbig" aria-hidden="true"></span>';
    document.getElementById('videotap').addEventListener('click', toggle);
    const strip = document.querySelector('.mctl');
    if (strip) strip.hidden = false;
  },
});

document.addEventListener('click', e => {
  if (e.target.closest('.credit a')) return;   // the credit goes out, not in
  const ask = e.target.closest('.askpill');
  if (ask) {
    const pill = byId[ask.dataset.pill];
    if (pill) toggleFacet(pill.host, pill.facet);
    return;
  }
  const open = e.target.closest('.opener[data-open]');
  if (open) {
    const c = BY_CONTENT.get(open.dataset.open);
    if (c) (c.kind === 'video' ? videoModal
           : c.kind === 'model' ? modelModal : lessonModal).show(c);
    return;
  }
