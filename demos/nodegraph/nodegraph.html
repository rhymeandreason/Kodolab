  const b = e.target.closest('.chip');
  if (!b) return;
  const n = nodes.find(m => m.el.contains(b));
  if (!n) return;
  for (const l of linksOf(n)) {
    if (b.dataset.g !== 'all' && groupOf(l, n) !== b.dataset.g) continue;
    light(l.a === n ? l.b : l.a);
  }
  measure();
  focus(n);
});

/* ---- FOCUS DIMMING: every number, in one place ---------------------------
   Distance from the focused card is carried by OPACITY ALONE (colour is spoken
   for: red means contrasts-with). Two things fade together — the CARD and the
   EDGE that reaches it — and `rank` is shared between them so they cannot say
   different things about the same relation.

   To make a neighbour more present, raise `rank`. To make the near ring louder
   without touching the far one, raise `card.hop1`. `out` is mirrored into CSS
   below, so the fogged rest of the map moves from here too.  */
const DIM = {
  rank: { 1: 1, 2: 0.6, 3: 0.45 },   /* what a rank is worth, card and edge */
  card: { hop1: 1, hop2: 0.8 },     /* multiplier by distance, on the CARD  */
  edge: { hop1: .8, hop2: 0.6 },   /* ... and on the EDGE. Lower: a line is
                                        thin, and reads louder than it measures */
  out: 0.18,                         /* a card outside the neighbourhood     */
  outEdge: 0.06,                     /* ... and an edge with an end outside  */
  arrow: 1.1,                        /* an arrowhead is small, so it is lifted */
};
/* the fog is a CSS rule and the grading is JS: this is what keeps one number
   behind both, so `out` above is the only place it is written */
document.documentElement.style.setProperty('--dim-out', DIM.out);

const byRank = r => DIM.rank[r] || DIM.rank[3];

function focus(n) {
  focused = n;
  walk = null;                  // a click lands off the fan; goWalk restores its own
  /* A QUESTION IS ONLY HALF OF ITSELF. Focusing one and leaving its answer a
     fogged mark asks the reader to guess which of the neighbours it opened is
     the answer — so the rank-1 answers open with it. Rank 1 only: the rest of
     what a question touches is still theirs to open. */
  if (n.type === 'question') {
    for (const l of linksOf(n))
      if (l.type === 'answers' && l.rank === 1) light(l.a === n ? l.b : l.a);
  }
  showHint();
  follow = n; followFrames = 700;
  if (n.on) goLive(n);          // the clicked card re-fronts in the pool
  document.body.classList.add('focusing');
  for (const m of nodes) { m.el.classList.remove('lit', 'hub', 'hop2'); m.el.style.opacity = ''; }
  for (const m of nodes) { const c = m.el.querySelector('.chips'); if (c) c.innerHTML = ''; }

  /* A CARD IS AS PRESENT AS THE LINE THAT JUSTIFIES IT. The hops carry the
     BEST rank that reached them, not just membership: a node used to be binary
     — in the neighbourhood at full strength or fogged — while its edge was
     graded by rank, so a hop-2 card reached by a rank-2 edge sat at 1 above a
     line drawn at 0.24 and read as attached to nothing. Same `byRank` as the
     edge loop below, so the two agree by construction. */
  const best = (m, from) => linksOf(m).reduce((r, l) =>
    (l.a === from || l.b === from) ? Math.min(r, l.rank) : r, 9);
  /* IN BUILD THE HOPS ARE COUNTED FROM THE CARD, not from the door. A question
     seeded here spends one hop on the member it names and another on the card
     that holds it, so grading from the question put the whole graph two hops
     out and fogged everything the reader built. `buildFull` below draws the
     chain itself at full strength; this is what stops the chain from eating
     the neighbourhood's share. */
  const g = mode === 'build' ? chainEnd(n) : n;
  const hop1 = new Map();
  for (const m of neighbours(g)) hop1.set(m, best(m, g));
  const hop2 = new Map();
  for (const m of hop1.keys()) for (const o of neighbours(m)) {
    if (o === g || hop1.has(o)) continue;
    hop2.set(o, Math.min(hop2.has(o) ? hop2.get(o) : 9, best(o, m)));
  }

  n.el.classList.add('lit', 'hub');
  for (const [m, rank] of hop1) {
    m.el.classList.add('lit');
    m.el.style.opacity = (byRank(rank) * DIM.card.hop1).toFixed(2);
  }
  for (const [m, rank] of hop2) {
    m.el.classList.add('lit', 'hop2');
    m.el.style.opacity = (byRank(rank) * DIM.card.hop2).toFixed(2);
  }

  renderChips(n);
  /* the pills, the query and a graft all belong to the baked map: each one
     spawns satellites off cards that Build has not dealt */
  if (mode !== 'build') { syncGraft(n); syncQuery(n); syncPill(n); }
  measure();
  gutterLight(n);

  /* edgeRefresh first for the resting colour, width and dash, then dim: focus
     used to wash both hops red instead, which spent the only colour the edges
     have. The numbers are DIM, above. */
  for (const l of links) {
    const first = l.a === g || l.b === g;
    const second = (hop1.has(l.a) && hop2.has(l.b)) || (hop1.has(l.b) && hop2.has(l.a));
    edgeRefresh(l);
    const near = first ? DIM.edge.hop1 : second ? DIM.edge.hop2 : 0;
    const rk = byRank(l.rank);
    l.el.setAttribute('stroke-opacity', near ? (near * rk).toFixed(2) : String(DIM.outEdge));
    if (l.arrow) l.arrow.setAttribute('fill-opacity',
      near ? (near * rk * DIM.arrow).toFixed(2) : String(DIM.outEdge));
    l.label.classList.toggle('on', first);
  }
  /* the answered chain is re-asserted after the loop above, which knows
     nothing about it and would leave it dimmed like any other enrichment */
  if (queryHost && queryHost.query) fullChain(queryHost);
  if (mode === 'build') buildFull();
}

/* `fullChain`'s rule, for the chain Build draws. Question → member → card is
   one continuous claim, and the hop grading breaks it into three strengths —
   worse here than on the map, because the member is a card of its own rather
   than a satellite, so the card the question is actually about is two hops out
   and reads at half. The first hop is a single card as well, and dimming that
   grades a fan of one. So a door, a member, and whatever they attach to are
   drawn at full strength whatever the distance says. */
/* a door and the members it names are read THROUGH the card they hang off, so
   that card is where the neighbourhood starts. Ordinary cards are their own
   chain end, which is why this is safe to run on every focus in Build. */
function chainEnd(n) {
  let cur = n;
  const seen = new Set([n]);
  while (cur && (cur.type === 'question' || cur.synthetic)) {
    const next = buildLinks
      .map(l => l.a === cur ? l.b : l.b === cur ? l.a : null)
      .find(m => m && !seen.has(m));
    if (!next) break;
    seen.add(next); cur = next;
  }
  return cur;
}

/* NOTHING IN A BUILT GRAPH IS FOG. The map's `out` tier is for the parts of it
   the reader has never opened; here every card on screen was dealt because
   they asked for it, and a graph seeded on a question spends two of its hops
   before the neighbourhood even starts, so its outer ring fell to 0.18 and
   read as unexplored. The grading inside the neighbourhood is kept — that is
   what says which cards answer the question — and everything past it is
   floored instead of fogged. */
/* the floor, and a SECOND one for a graph grown from a question of any type.
   A question spends its first hops on its own chain — the member it names, the
   card that holds it — so what a card seed shows at one hop out, a question
   seed is showing at three, and the same grading reads flatter and further
   away for having travelled. */
const BUILD_OUT = 0.75, BUILD_OUT_EDGE = 0.3;
const BUILD_OUT_Q = 0.9, BUILD_OUT_EDGE_Q = 0.45;

function buildFull() {
  const door = !!(buildSeed && buildSeed.type === 'question');
  const floor = door ? BUILD_OUT_Q : BUILD_OUT;
  const edgeFloor = door ? BUILD_OUT_EDGE_Q : BUILD_OUT_EDGE;
  for (const m of buildNodes) {
    if (!m.el) continue;
    m.el.classList.add('lit');            /* the fog rule also takes the clicks */
    /* THE FOCUSED CARD IS NEVER FLOORED DOWN. It carries no inline opacity of
       its own — the CSS gives it 1 — so a blanket floor made the seed of a
       card-seeded graph the dimmest thing on screen. */
    if (m === focused) { m.el.style.opacity = '1'; continue; }
    const graded = m.el.style.opacity ? +m.el.style.opacity : floor;
    m.el.style.opacity = String(Math.max(graded, floor));
  }
  for (const l of buildLinks) {
    if (+l.el.getAttribute('stroke-opacity') >= edgeFloor) continue;
    l.el.setAttribute('stroke-opacity', String(edgeFloor));
    if (l.arrow) l.arrow.setAttribute('fill-opacity', String(edgeFloor));
  }
  const chain = new Set();
  for (const m of buildNodes) {
    if (m.type !== 'question' && !m.synthetic) continue;
    chain.add(m);
    for (const l of buildLinks) {
      if (l.a === m) chain.add(l.b);
      else if (l.b === m) chain.add(l.a);
    }
  }
  for (const m of chain) if (m.el) m.el.style.opacity = '1';
  for (const l of buildLinks) {
    if (!chain.has(l.a) || !chain.has(l.b)) continue;
    l.el.setAttribute('stroke-opacity', '1');
    if (l.arrow) l.arrow.setAttribute('fill-opacity', '1');
  }
}

/* THE ANSWERED CHAIN READS AT FULL STRENGTH. Question → its kind → the pill →
   the card is one continuous claim, and the focus dimming grades those links
   by hop distance and rank into three different opacities — which makes the
   answer look like the weakest part of what is on screen. The rest of the fan
   is left dimmed on purpose: that contrast is what says which member answered.
   Re-run after every focus, because focus repaints every link. */
function fullChain(host) {
  const q = host.query;
  if (!q) return;
  const target = q.host;
  /* a query that landed on the card itself is a chain of one link, and there
     is no pill between them to light */
  const chain = links.filter(l =>
    l.a === q || l.b === q ||                                  /* question → kind */
    (kf(host).pill && target && target !== host &&
     (l.a === target || l.b === target) &&
     (l.a === kf(host).pill || l.b === kf(host).pill)) ||      /* kind → pill */
    (kf(host).pillLink && l === kf(host).pillLink));           /* pill → card */
  for (const l of chain) {
    l.el.setAttribute('stroke-opacity', '1');
    if (l.arrow) l.arrow.setAttribute('fill-opacity', '1');
  }
  /* the cards too, now that a hop is graded by the rank that reached it: the
     satellite links are rank 2, so the answering kind would fade to 0.6 the
     moment the reader clicked the card it hangs off */
  for (const m of [q, target, kf(host).pill, host])
    if (m && m.el) m.el.style.opacity = '1';
}

function clearFocus() {
  focused = null;
  walk = null;
  syncGraft(null);
  syncQuery(null);
  syncPill(null);
  showHint();
  document.body.classList.remove('focusing');
  for (const m of nodes) {
    m.el.classList.remove('lit', 'hub', 'hop2');
    m.el.style.opacity = '';
    const c = m.el.querySelector('.chips'); if (c) c.innerHTML = '';
  }
  measure();
  gutterLight(null);
  for (const l of links) edgeRefresh(l);
}

/* ---- the walk ------------------------------------------------------------
   Arrow keys step from the focused card: → onward, ← why, ↑/↓ to take a
   different branch out of the same fan. The doc's QA test, playable: if the
   spine is coherent, holding → reads as a course.

   Three rules are what make it read as one course rather than wander.

   ONLY AN EDGE THAT IMPOSES AN ORDER IS A STEP. groupOf() falls through to
   a→b for the types the grammar says order nothing, which is fine for
   grouping a card's chips and fatal for a walk: `denaturation preserves
   primary` became a forward step and the walk fell into
   tertiary→denaturation→primary→secondary→tertiary. So the walk reads
   ordered() directly, plus `answers`, which is the door into a card.
   describes and preserves stay on the chips and are not stations.

   A SPECIMEN AND A THEME ARE DESTINATIONS. Their rank is authored from
   their own side, the asymmetry graphdata.js calls out for the theme fan:
   `p:prion instance-of folding` rank 1 says prion is the best thing we hold
   for folding, not that folding's next word is prion. Walking onward used
   to land on it and stop dead two hops from the unit's own question. They
   are still walkable the other way — from the specimen back up to what it
   exemplifies — and a theme still deals its whole fan from its chip.

   A FAN LEADS WITH ITS LONGEST ARM. hbond deals seven rank-1 properties and
   array order used to pick, so → off the mechanism hub stopped at
   transpiration and the other six were unreachable by walking at all. Now
   equal ranks are broken by how far each branch carries, so the hub runs to
   the bilayer and the fold, and the rest are one ↓ away. */

/* the direction a walk step reads this link, or null if it is not a step */
function walkDir(l, n) {
  if (l.type === 'answers') return n === l.b ? 'why' : 'onward';
  const o = ordered(l);
  if (!o) return null;
  return o[1] === n ? 'why' : 'onward';
}
/* an evidence card shows HOW WE KNOW a claim, which is a destination the
   same way a film is: worth clicking, never a station the explanation walks
   through.

   A SPECIMEN IS A DESTINATION UNLESS ITS EDGES SAY OTHERWISE. Most exemplify
   a concept and stop there, which `instance-of` is exactly the word for. One
   does not: rubisco `enables` carbon fixation at rank 1 and `causes`
   photorespiration, so the photosynthesis spine runs THROUGH it, and being a
   protein is not a reason to step over the card carrying the explanation.
   What decides is the edge, not the type. */
const carries = n => linksOf(n).some(l => l.rank === 1 && l.type !== 'instance-of');
const station = n => (n.type !== 'specimen' || carries(n)) && n.type !== 'theme' &&
                     n.type !== 'content' && n.type !== 'evidence' &&
                     n.type !== 'satellite' && n.type !== 'ask' &&
                     n.type !== 'made';

/* how far a branch carries: the longest rank-1 chain onward from it. No
   memo — 64 nodes, and only a keypress asks. The seen guard is for a data
   bug the layering pass would already have warned about. */
function reach(n, dir, seen = new Set()) {
  if (seen.has(n)) return 0;
  seen.add(n);
  let best = 0;
  for (const l of linksOf(n)) {
    const m = l.a === n ? l.b : l.a;
    if (l.rank !== 1 || walkDir(l, n) !== dir || !station(m)) continue;
    best = Math.max(best, 1 + reach(m, dir, seen));
  }
  seen.delete(n);
  return best;
}

/* the fan out of n in one direction, best arm first */
function walkCands(n, dir) {
  const out = [];
  for (const l of linksOf(n)) {
    const m = l.a === n ? l.b : l.a;
    if (walkDir(l, n) !== dir || !station(m)) continue;
    out.push({ m, rank: l.rank, far: reach(m, dir) });
  }
  out.sort((a, b) => a.rank - b.rank || b.far - a.far ||
                     a.m.tx - b.m.tx || (a.m.id < b.m.id ? -1 : 1));
  return out.map(x => x.m);
}

/* the fan the current card was reached through, so ↑/↓ can re-pick from it */
let walk = null;

function goWalk() {
  const fan = walk;             /* focus() drops the fan; the walk keeps it */
  light(fan.cands[fan.ix]);
  focus(fan.cands[fan.ix]);
  walk = fan;
  showHint();
}

function stepWalk(dir) {
  if (!focused) return;
  /* the walk reads the whole map, and in Build most of it is not dealt: a
     step would focus a card that is display:none */
  if (mode === 'build') return;
  const cands = walkCands(focused, dir);
  if (!cands.length) return;
  walk = { from: focused, dir, cands, ix: 0 };
  goWalk();
}

function stepBranch(d) {
  if (!walk || walk.cands.length < 2) return;
  walk.ix = (walk.ix + d + walk.cands.length) % walk.cands.length;
  goWalk();
}

/* ---- ⌘⇧D: throw away what this page has stored ---------------------------
   The saved grafts are the reader's own questions and their dealt cards, and
   they survive a reload by design, so nothing short of clearing site data got
   rid of them — which is a nuisance while working on the builder that makes
   them. Behind a confirm because it destroys authored content, and it names
   the count so the dialog is not a blank threat.

   `ss.tutor.visitor` is NOT cleared: it is the tutor's, shared across the
   site, and this page does not get to reset other pages' state. `e.code` so
   the shift that is part of the chord cannot change what is matched.

   The keys are read from the consts that own them, inside the function: they
   are declared further down the file, so a list up here would have to retype
   the strings and would go stale the first time one is renamed. */
function wipeStorage() {
  const keys = [GRAFTS_KEY, TRACKPAD_KEY];
  let n = 0;
  try { n = Object.keys(readGrafts()).length; } catch (_) {}
  const what = n ? n + (n === 1 ? ' saved question' : ' saved questions') : 'no saved questions';
  if (!confirm('Clear this page\u2019s stored data (' + what +
               ') and reload?\n\nYour tutor id is left alone.')) return;
  try { for (const k of keys) localStorage.removeItem(k); } catch (_) {}
  location.reload();
}

addEventListener('keydown', e => {
  /* before the modal guard: this is a get-me-out-of-here key and should work
     with a lesson open */
  if (e.metaKey && e.shiftKey && e.code === 'KeyD') {
    e.preventDefault();
    wipeStorage();
    return;
  }
  if (Modal.anyOpen()) return;             // the modal's Esc is the modal's
  if (e.key === 'Escape') { clearFocus(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepWalk('onward'); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); stepWalk('why'); }
  if (e.key === 'ArrowDown')  { e.preventDefault(); stepBranch(1); }
  if (e.key === 'ArrowUp')    { e.preventDefault(); stepBranch(-1); }
});

/* ---- what a card weighs --------------------------------------------------
   Three questions about a card, and they disagree with each other, which is
   the point of offering them separately.

     DEGREE       how much this card has to say for itself.
     THROUGH      how many rank-1 explanations run through it. This is the
                  doc's own discriminating test and the one that separates a
                  hinge from a terminus: hydrolysis has six rank-1 edges and
                  not one path passes through it.
     SPAN         how many units it touches, which is what a bridge is.

   Computed HERE and not beside `big`, because `big` is decided before the
   specimens and the content cards have pushed their links and so counts a
   different graph from this one.

   Ranked by percentile rather than by raw value: the three scales are not
   comparable, and the downstream-style measures explode toward the left of
   the map where everything is eventually a consequence of electronegativity. */
const CARDS = nodes.filter(n =>
  ['concept', 'structure', 'process', 'evidence'].includes(n.type));
{
  const adj = new Map(CARDS.map(n => [n, []]));
  for (const l of links) {
    if (l.rank !== 1) continue;
    for (const n of [l.a, l.b]) {
      const m = l.a === n ? l.b : l.a;
      if (!adj.has(n) || !adj.has(m)) continue;
      if (walkDir(l, n) === 'onward' && station(m)) adj.get(n).push(m);
    }
  }
  /* Brandes, over the rank-1 station graph the walk actually uses */
  const bc = new Map(CARDS.map(n => [n, 0]));
  for (const s of CARDS) {
    const stack = [], pred = new Map(CARDS.map(n => [n, []]));
    const sig = new Map(CARDS.map(n => [n, 0])), dist = new Map(CARDS.map(n => [n, -1]));
    sig.set(s, 1); dist.set(s, 0);
    const q = [s];
    while (q.length) {
      const v = q.shift(); stack.push(v);
      for (const w of adj.get(v)) {
        if (dist.get(w) < 0) { dist.set(w, dist.get(v) + 1); q.push(w); }
        if (dist.get(w) === dist.get(v) + 1) {
          sig.set(w, sig.get(w) + sig.get(v)); pred.get(w).push(v);
        }
      }
    }
    const delta = new Map(CARDS.map(n => [n, 0]));
    while (stack.length) {
      const w = stack.pop();
      for (const v of pred.get(w))
        delta.set(v, delta.get(v) + (sig.get(v) / sig.get(w)) * (1 + delta.get(w)));
      if (w !== s) bc.set(w, bc.get(w) + delta.get(w));
    }
  }
  for (const n of CARDS) {
    const mine = linksOf(n).filter(l => l.rank === 1);
    n.wDeg = mine.length;
    n.wThrough = bc.get(n);
    n.wSpan = new Set(mine.map(l => (l.a === n ? l.b : l.a).unit).filter(Boolean)).size;
  }
  const pct = key => {
    const sorted = CARDS.slice().sort((a, b) => a[key] - b[key]);
    sorted.forEach((n, i) => { n[key + 'P'] = i / (sorted.length - 1); });
  };
  ['wDeg', 'wThrough', 'wSpan'].forEach(pct);
  /* SPAN IS NOT IN THE COMBINED SCORE, though it looks like it belongs. It
     has its own mode already, and counting it twice sank tertiary — the
     single highest-betweenness card on the map — for the crime of living
     entirely inside the protein unit. A card can carry the map without
     leaving its own region. */
  for (const n of CARDS) n.wAll = (n.wDegP + n.wThroughP) / 2;
}

const hiliteSel = document.getElementById('hilite');
const HILITE_TOP = 10;

const HILITE_KEY = { through: 'wThrough', degree: 'wDeg', carries: 'wAll' };

/* A THEME IS A SAVED QUERY, and the doc calls "show me everything connected
   to Structure-Function" one of the most valuable views the graph can offer.
   The options are generated from the data rather than authored, so a new
   theme arrives with its own option and cannot be forgotten here. Kept in
   their own group because this is a different question from the weights:
   `all of the above` unions the four measures and stops there. */
/* A UNIT IS THE COARSEST SAVED QUERY: the chapter, the thing the coloured
   dot already says on every card. Generated from UNITS so a new unit cannot
   be forgotten here, and only units that actually have nodes are offered. */
{
  const group = document.getElementById('hiliteunits');
  const held = new Set(nodes.map(n => n.unit));
  for (const key of Object.keys(UNITS)) {
    if (!held.has(key)) continue;
    const opt = document.createElement('option');
    opt.value = 'unit:' + key;
    opt.textContent = UNITS[key].name.toLowerCase();
    opt.dataset.tint = UNITS[key].tint;   // the custom menu draws the dot
    group.appendChild(opt);
  }
}

{
  const group = document.getElementById('hilitethemes');
  for (const t of nodes.filter(n => n.type === 'theme')) {
    const opt = document.createElement('option');
    opt.value = 'theme:' + t.id;
    opt.textContent = t.name.toLowerCase();
    group.appendChild(opt);
  }
}

/* one mode's picks. `bridge` is a threshold rather than a top-N because
   touching three units means something on its own; the others are ranked. */
function picksFor(mode) {
  /* A QUESTION CARRIES NO UNIT and must not: a bridging one joins two by
     definition, and authoring one unit on it would pick a side. So the door
     is derived — a question joins the unit it answers INTO at rank 1, which
     puts an anchoring question in exactly one unit and a bridging one in
     both, without either being written down twice. */
  if (mode.startsWith('unit:')) {
    const u = mode.slice(5);
    const own = nodes.filter(n => n.unit === u);
    const inside = new Set(own);
    const doors = nodes.filter(n => n.type === 'question' &&
      linksOf(n).some(l => l.rank === 1 && inside.has(l.a === n ? l.b : l.a)));
    return own.concat(doors);
  }
  if (mode.startsWith('theme:')) {
    const t = byId[mode.slice(6)];
    return t ? [t, ...neighbours(t)] : [];
  }
  if (mode === 'bridge') return CARDS.filter(n => n.wSpan >= 3);
  const key = HILITE_KEY[mode];
  return CARDS.slice().sort((a, b) => b[key] - a[key]).slice(0, HILITE_TOP);
}

function applyHighlight() {
  const mode = hiliteSel.value;
  for (const n of nodes) n.el.classList.remove('hi');
  document.body.classList.toggle('highlighting', !!mode);
  if (!mode) {
    hiNodes = null;
    for (const l of links) edgeRefresh(l);
    return;
  }
  /* `all` is the UNION, not a fifth metric: a card earns the highlight by
     any one of the four readings, which is the widest honest answer to
     "which of these matter". */
  const pick = mode === 'all'
    ? new Set(['carries', 'through', 'degree', 'bridge'].flatMap(picksFor))
    : picksFor(mode);
  for (const n of pick) n.el.classList.add('hi');
  hiNodes = new Set(pick);
  /* PICKING A GROUP CLOSES WHAT IS NOT IN IT. A card left open from an
     earlier trail reads as part of the answer, and half a dozen of them
     scattered over a highlighted unit is the loudest thing on screen while
     being exactly the wrong claim. Opened cards inside the pick stay open;
     nothing is opened FOR the reader, because exploration is light and this
     menu is a reading of the map, not a click. */
  for (const n of nodes) if (n.on && !hiNodes.has(n)) unlight(n);
  for (const l of links) edgeRefresh(l);
  measure();

  /* PICKING A THEME IS PICKING ITS CARD. A theme is a query and choosing it
     from the menu should do what clicking it does, so it lights, focuses,
     and the camera frames the fan rather than leaving the reader to find a
     dark card somewhere on a nine-thousand-pixel map. Focus outranks the
     highlight while it lasts, which is why Escape drops back to the
     at-a-glance version instead of clearing it. */
  /* A UNIT IS A BAND, NOT A BLOB. X is explanatory order, so a chapter runs
     the width of the map — proteins spans 11k px — and centre()'s bounding
     box would either clip or floor out at a zoom where it clips anyway. So
     frame the INTERQUARTILE box: where the bulk of the chapter sits, with
     the far outliers left off-screen still highlighted for whoever pans out
     to them. No focus either — opening one card picks a winner out of
     thirty, and the answer to "where is proteins" is the shape of the group.
     Floor is lower than centre()'s: at 0.22 a card is a dot, and the dots
     are what the question was asking about. */
  if (mode.startsWith('unit:')) {
    follow = null;
    if (!pick.length) return;
    /* quantiles need a population; under about eight nodes they just drop
       members, so a small unit gets its true box. */
    const lo = pick.length >= 8 ? 0.15 : 0, hi = pick.length >= 8 ? 0.85 : 1;
    const band = (axis, f) => {
      const v = pick.map(n => n[axis]).sort((p, q) => p - q);
      return v[Math.round((v.length - 1) * f)];
    };
    const x0 = band('x', lo), x1 = band('x', hi);
    const y0 = band('y', lo), y1 = band('y', hi);
    const pad = 320;
    const k = Math.max(0.22, Math.min(0.7,
      Math.min(innerWidth / (x1 - x0 + 2 * pad),
               innerHeight / (y1 - y0 + 2 * pad))));
    view = {
      k,
      x: innerWidth / 2 - (x0 + x1) / 2 * k,
      y: innerHeight / 2 - (y0 + y1) / 2 * k,
    };
    applyView();
    return;
  }

  if (mode.startsWith('theme:')) {
    const t = byId[mode.slice(6)];
    if (!t) return;
    light(t);
    focus(t);
    follow = null;                /* the frame below IS the camera move */
    /* CENTRED ON THE THEME, zoomed to reach its fan. centre() cannot do this
       job: a theme reaches across four units by design, so the bounding box
       of theme-plus-fan is most of the map, it floors out at minimum zoom
       and the card itself gets pushed to an edge. Framing the card alone is
       readable but shows one of nine instances, which is not why anyone
       picks a theme. So the theme is pinned to the centre and the zoom pulls
       back symmetrically until the fan is in shot, with a floor so it never
       becomes unreadable. */
    const fan = neighbours(t);
    const reach = (axis) => Math.max(400, ...fan.map(m => Math.abs(m[axis] - t[axis])));
    const k = Math.max(0.26, Math.min(0.55,
      Math.min(innerWidth / (2 * reach('x') + 700),
               innerHeight / (2 * reach('y') + 500))));
    view = { k, x: innerWidth / 2 - t.x * k, y: innerHeight / 2 - t.y * k };
    applyView();
  }
}
hiliteSel.addEventListener('change', applyHighlight);

/* ---- the highlight menu -------------------------------------------------
   Built from the <select> AFTER the unit and theme options exist, so the
   generated-from-data rule holds for the menu too and nothing is authored
   twice. Clicking a row writes the value and fires `change`, which is the
   only thing the rest of the file knows about. */
const hiliteWrap  = document.getElementById('hilitewrap');
const hiliteBtn   = document.getElementById('hilitebtn');
const hiliteMenu  = document.getElementById('hilitemenu');
const hiliteLabel = document.getElementById('hilitelabel');
const hiliteDot   = document.getElementById('hilitedot');

for (const el of hiliteSel.children) {
  if (el.tagName === 'OPTGROUP') {
    if (!el.children.length) continue;
    const h = document.createElement('div');
    h.className = 'hgroup'; h.textContent = el.label;
    hiliteMenu.appendChild(h);
    for (const opt of el.children) hiliteMenu.appendChild(hiliteRow(opt));
  } else hiliteMenu.appendChild(hiliteRow(el));
}

function hiliteRow(opt) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'hopt'; b.setAttribute('role', 'option');
  b.dataset.value = opt.value;
  if (opt.dataset.tint) {
    const d = document.createElement('span');
    d.className = 'hdot'; d.style.background = opt.dataset.tint;
    b.appendChild(d);
  }
  b.appendChild(document.createTextNode(opt.textContent));
  return b;
}

function syncHilite() {
  const opt = hiliteSel.selectedOptions[0];
  hiliteLabel.textContent = opt ? opt.textContent : 'all';
  const tint = opt && opt.dataset.tint;
  hiliteDot.hidden = !tint;
  if (tint) hiliteDot.style.background = tint;
  for (const row of hiliteMenu.querySelectorAll('.hopt'))
    row.setAttribute('aria-selected', row.dataset.value === hiliteSel.value);
}

function openHilite(on) {
  hiliteMenu.hidden = !on;
  hiliteWrap.classList.toggle('open', on);
  hiliteBtn.setAttribute('aria-expanded', on);
}

hiliteBtn.addEventListener('click', () => openHilite(hiliteMenu.hidden));
hiliteMenu.addEventListener('click', e => {
  const row = e.target.closest('.hopt');
  if (!row) return;
  hiliteSel.value = row.dataset.value;
  hiliteSel.dispatchEvent(new Event('change'));
  openHilite(false);
});
document.addEventListener('pointerdown', e => {
  if (!hiliteWrap.contains(e.target)) openHilite(false);
}, true);
addEventListener('keydown', e => { if (e.key === 'Escape') openHilite(false); });
hiliteSel.addEventListener('change', syncHilite);
syncHilite();

/* ---- pills: what a card holds but does not seat ---------------------------
   THE CHAIN IS card → pill → fan. The pill is a node rather than another chip
   in the card's row, because as a chip it read as one more navigation control
   among three and the thing it does is not navigation. As a node hanging off
   the card it is an event, and the fan hangs off IT, so the map says plainly
   that these arrived through a question.

   TWO THINGS FAIL THE NODE TEST FOR OPPOSITE REASONS. A `kinds` member is too
   small to be a card — UV and benzene route nowhere and nobody arrives at one
   alone. An `evidence` card is the other way round: a real card with a real
   claim, but a leaf with one edge, so its seat says nothing except "beside
   the thing it settles" and four of them said it about the same card. Both
   are content the map should hold and neither is worth a seat.

   NOTHING HERE IS BAKED, and that is the one invariant worth arguing over.
   The map is laid out once so spatial memory can form, but a satellite is a
   leaf with one edge to one parent: its position says nothing beyond "below
   this card", and nobody remembers the seat of something they have never
   seen. So they are made on reveal, PINNED, and skipped by the relax's
   repulsion and its link pull, which is why opening one moves nothing else.

   The pills follow the focus: focusing a card that has either facet grows
   them, focusing anything outside that card's own family takes them away. */
let pillHost = null;

/* read-only view of a card's kinds facet, for the query and highlight code
   that asks about a card it may never open */
const kf = h => (h && h.facets && h.facets.kinds) || {};

/* TWO FACETS ASK TWO DIFFERENT QUESTIONS OF THE SAME CARD, and one card is
   asked both — `carbon-fixation` has kinds AND van Helmont's willow — so the
   pill belongs to the facet, not to the host. Each facet keeps its own pill,
   fan and links under `host.facets[key]`, and the pills stack under the card
   in declaration order. */
const FACETS = {
  kinds: {
    label: 'What kinds are there?',
    has: h => !!(h.kinds && h.kinds.length),
    deal: h => h.kinds.map(([name, claim], i) =>
      ({ id: h.id + '::' + i, type: 'satellite', name, claim })),
  },
  evidence: {
    label: 'How do we know?',
    has: h => EVIDENCE.has(h.id),
    /* the experiment cards themselves, in the shape the map used to draw
       them: a flask, a name and the sentence that is the whole point */
    deal: h => EVIDENCE.get(h.id).map(e =>
      ({ id: e.id, type: 'evidence', name: e.name, claim: e.claim })),
  },
};
const FACET_KEYS = Object.keys(FACETS);
const hasFacet = h => !!h && FACET_KEYS.some(k => FACETS[k].has(h));
const fc = (host, key) => {
  const all = host.facets || (host.facets = {});
  return all[key] || (all[key] = { pill: null, pillLink: null, sats: null, satLinks: null });
};

function makePills(host) {
  let below = host.el.offsetHeight / 2 + 34;
  for (const key of FACET_KEYS) {
    if (!FACETS[key].has(host)) continue;
    const f = fc(host, key);
    const pill = {
      id: host.id + '::ask:' + key, type: 'ask', facet: key,
      satellite: true, pinned: true,
      host, label: FACETS[key].label, unit: host.unit, tint: host.tint,
      deg: 0, on: true, dx: 0, dy: 0, x: host.x, y: host.y, vx: 0, vy: 0,
    };
    nodes.push(pill); byId[pill.id] = pill;
    paintNode(pill);
    /* focus decided what to light before this existed. It is always family of
       the focused card, so it is always lit. */
    pill.el.classList.add('lit');
    pill.dy = below + pill.el.offsetHeight / 2;
    below += pill.el.offsetHeight + 12;
    pill.tx = pill.x; pill.ty = pill.y;
    sizeOf(pill);
    const l = { a: pill, b: host, type: 'asks', rank: 2, spine: false };
    links.push(l); paintLink(l); edgeRefresh(l);
    l.label.style.display = 'none';      /* the pill says it; the line need not */
    f.pill = pill; f.pillLink = l;
  }
  return host;
}

function dropNodes(list) {
  for (const m of list) { m.el.remove(); nodes.splice(nodes.indexOf(m), 1); delete byId[m.id]; }
}
function dropLinks(list) {
  for (const l of list) { l.el.remove(); l.label.remove(); if (l.arrow) l.arrow.remove(); }
  links = links.filter(l => !list.includes(l));
}

function dropPills(host) {
  for (const key of FACET_KEYS) {
    const f = host.facets && host.facets[key];
    if (!f) continue;
    if (f.sats) collapseFacet(host, key);
    if (f.pill) { dropNodes([f.pill]); dropLinks([f.pillLink]); }
    f.pill = null; f.pillLink = null;
  }
}

/* the pills belong to whichever card is being worked on, and survive a click
   on one of themselves or on anything they produced */
function syncPill(n) {
  const family = pillHost &&
    (n === pillHost || n === pillHost.query ||
     FACET_KEYS.some(k => {
       const f = pillHost.facets && pillHost.facets[k];
       return f && (n === f.pill || (f.sats || []).includes(n));
     }));
  if (family) return;
  if (pillHost) dropPills(pillHost);
  pillHost = hasFacet(n) ? makePills(n) : null;
}

function collapseFacet(host, key) {
  /* only the kinds fan can be carrying a query: an extension question names a
     `kind`, never an experiment */
  if (key === 'kinds') dropQuery(host);
  const f = fc(host, key);
  if (!f.sats) return;
  dropNodes(f.sats); dropLinks(f.satLinks);
  f.sats = null; f.satLinks = null;
  if (f.pill) f.pill.el.textContent = f.pill.label;
}

/* THE FAN HANGS OFF THE PILL, not off the card, so the reading is that a
   question produced it. Fanned rather than stacked: five in a column ran
   551px down into a map that is tight in y and roomy in x. */
function toggleFacet(host, key) {
  const f = host && key && fc(host, key);
  if (!f || !f.pill) return;
  if (f.sats) { collapseFacet(host, key); draw(); return; }

  const GAP = 18, pill = f.pill;
  f.sats = []; f.satLinks = [];
  FACETS[key].deal(host).forEach(spec => {
    const sat = {
      ...spec, satellite: true, pinned: true,
      unit: host.unit, tint: host.tint, deg: 0, on: true, host: pill,
      dx: 0, dy: 0, x: pill.x, y: pill.y, vx: 0, vy: 0,
    };
    nodes.push(sat); byId[sat.id] = sat;
    paintNode(sat);
    /* AN EVIDENCE CARD PAINTS THROUGH THE CARD BRANCH, which starts fogged —
       and a revealed card that withholds its claim is the mark it replaced.
       `light()` is what normally strips this; a satellite never goes through
       it. Before `sizeOf`, or the fan is spaced for a mark and then holds
       cards. */
    sat.el.classList.remove('unlit');
    sat.el.classList.add('lit');
    sat.tx = sat.x; sat.ty = sat.y;
    sizeOf(sat);
    const l = { a: sat, b: pill, type: key === 'evidence' ? 'evidence-for' : 'instance-of',
                rank: 2, spine: false };
    links.push(l); f.satLinks.push(l); paintLink(l); edgeRefresh(l);
    f.sats.push(sat);
  });

  const count = f.sats.length;
  const wide = Math.max(...f.sats.map(x => x.el.offsetWidth));
  const tall = Math.max(...f.sats.map(x => x.el.offsetHeight));
  const span = Math.min(150, count * 34) * Math.PI / 180;
  const step = count > 1 ? span / (count - 1) : 0;
  const place = (reach) => f.sats.forEach((sat, i) => {
    const a = -span / 2 + i * step;             /* 0 points straight down */
    sat.dx = reach * Math.sin(a);
    sat.dy = reach * Math.cos(a);
  });
  /* THE RADIUS CHECKS ITSELF. Spacing by width along the chord is not enough:
     on an arc adjacent cards are separated diagonally, so a taller card still
     collides vertically at a radius the width formula called clear. Rather
     than a cleverer formula, push the fan out until the boxes really miss. */
  const clash = () => {
    for (let a = 0; a < count; a++) for (let b = a + 1; b < count; b++) {
      const p = f.sats[a], q = f.sats[b];
      if (Math.abs(p.dx - q.dx) < (p.el.offsetWidth + q.el.offsetWidth) / 2 + GAP &&
          Math.abs(p.dy - q.dy) < (p.el.offsetHeight + q.el.offsetHeight) / 2 + GAP)
        return true;
    }
    return false;
  };
  let reach = Math.max(count > 1 ? (wide + GAP) / (2 * Math.sin(step / 2)) : 0,
                       pill.el.offsetHeight / 2 + tall / 2 + GAP);
  place(reach);
  for (let guard = 0; guard < 40 && clash(); guard++) place(reach *= 1.06);

  pill.el.textContent = 'hide the ' + count;
  draw();
}

/* ---- asking ---------------------------------------------------------------
   A QUERY ARRIVES, IT DOES NOT LIVE HERE. Asking an extension question opens
   the card it lands on, deals that card's kinds, and spawns the question
   itself beside the member that answers it — as a satellite, so it rides
   whatever it is attached to and pushes nothing on the map out of place.

   The pill stays in the chain. A reader who arrives by query and one who
   arrived by clicking "what kinds are there?" are looking at the same thing,
   and a second way of drawing it would say they are not. */

/* THE QUERY OUTLIVES THE PILL. A query that landed on a card with no `kinds`
   has no fan to collapse, so `collapseKinds` never runs and nothing would ever
   take it off the map. Its own handle is what drops it. */
let queryHost = null;

function dropQuery(host) {
  if (!host || !host.query) return;
  const q = host.query;
  dropLinks(links.filter(l => l.a === q || l.b === q));
  dropNodes([q]);
  /* A QUERY LEAVES THE MAP, NOT THE MAP'S INDEX. `dropNodes` deletes the id
     because a satellite ceases to exist when its fan closes — but a deferred
     question is authored and permanent, off the map exactly the way it was
     before it was first asked, and `ask()` finds it by id. Without this the
     question can be asked once and then never again. */
  byId[q.id] = q;
  q.el = null; q.satellite = false; q.host = null; q.on = false;
  host.query = null;
  if (queryHost === host) queryHost = null;
}

/* the query's own family check, the same shape as syncPill's: focusing the
   card, its pill, one of its kinds or the question itself is staying inside
   what the query opened; anything else is leaving. */
function syncQuery(n) {
  if (!queryHost) return;
  const h = queryHost;
  if (n === h || n === h.query || n === h.pill || (h.sats || []).includes(n)) return;
  dropQuery(h);
}

function spawnQuery(q, host) {
  if (host.query && host.query !== q) dropQuery(host);
  if (host.query === q) return;

  /* the member that answers it, or the card itself when the question is
     about the whole fan rather than one of it */
  const target = (q.kind && (kf(host).sats || []).find(s => s.name === q.kind)) || host;
  q.satellite = true; q.pinned = true; q.host = target;
  q.on = true; q.deg = 0; q.vx = 0; q.vy = 0;
  q.x = target.x; q.y = target.y;
  nodes.push(q); byId[q.id] = q;
  paintNode(q);
  /* before the measurements below: the class changes the box it reports */
  q.el.classList.add('lit', 'asked');
  /* below its answer, and left of it, so the question reads before the card
     it points at rather than out of the card's own reading order */
  q.dx = -(target.el.offsetWidth / 2 + q.el.offsetWidth / 2 + 30);
  q.dy = target.el.offsetHeight / 2 + q.el.offsetHeight / 2 + 26;
  sizeOf(q);

  const l = { a: q, b: target, type: 'answers', rank: 1, spine: true };
  links.push(l); paintLink(l); edgeRefresh(l);
  host.query = q;
  queryHost = host;
  fullChain(host);
  draw();
}

/* the one entry point: everything that asks goes through here, so the bar,
   the list and anything later that fuzzy-matches all land the same way */
/* WHERE AN ASK ARRIVES. A query comes from the bar, so it comes from wherever
   the reader happened to be — the whole map at 0.30, or one card at 1.5. It
   lands at the same zoom either way, or the same question shows a different
   amount of its surroundings every time it is asked. */
const ASK_ZOOM = 0.6;

function askQuestion(q) {
  if (!q) return;
  if (buildsNow()) {
    buildOnArrive = false;
    /* a deferred question is dealt its own card here, so it seeds as itself
       and the card it answers into arrives as its first hop */
    buildFrom(q);
    return;
  }
  /* the reader's own: deal the saved cards back rather than paying for a
     second answer to the question they already asked */
  if (q.mine) { restoreGraft(q); return; }
  /* a question that is already a card is followed to the same zoom: only what
     is drawn differs between the two kinds of door, not how you arrive */
  if (q.qtype !== 'extension') {
    light(q); focus(q);
    followK = ASK_ZOOM; touched = true;
    return;
  }
  const host = byId[q.anchorId];
  if (!host) { console.warn('query has nowhere to land:', q.id); return; }
  light(host);
  focus(host);                         /* syncPill grows the pill from here */
  if (FACETS.kinds.has(host) && !kf(host).sats) toggleFacet(host, 'kinds');
  spawnQuery(q, host);
  /* the fan and the question were born after focus lit the neighbourhood */
  for (const m of [q, kf(host).pill, ...(kf(host).sats || [])])
    if (m && m.el) m.el.classList.add('lit');
  /* THE CHAIN MOVES AFTER THE ASK. The fan is placed, then the relax settles
     it, so a point computed now is stale by the time the pan arrives — the
     follow target reads the chain live, and it is the BOUNDING BOX rather than
     the mean of centres because the asked question is by far the widest card
     in it. */
  const chain = () => [q, host, kf(host).pill, ...(kf(host).sats || [])].filter(m => m && m.el);
  const box = () => chain().reduce((b, m) => {
    const w = m.el.offsetWidth / 2, h = m.el.offsetHeight / 2;
    return { l: Math.min(b.l, m.x - w), r: Math.max(b.r, m.x + w),
             t: Math.min(b.t, m.y - h), b: Math.max(b.b, m.y + h) };
  }, { l: Infinity, r: -Infinity, t: Infinity, b: -Infinity });
  follow = { get x() { const k = box(); return (k.l + k.r) / 2; },
             get y() { const k = box(); return (k.t + k.b) / 2; } };
  followFrames = 700;
  followK = ASK_ZOOM;
  touched = true;
  wake(0.4);
}

/* ---- the ask bar ----------------------------------------------------------
   Every question is reachable from here, not only the deferred ones: an
   anchor or bridging question is already a card, so asking one focuses it
   where it sits. The placeholder rotates so the bar shows what it accepts
   rather than describing it. */
const askBar = document.getElementById('askbar');
const askIn = document.getElementById('askinput');
const askList = document.getElementById('asklist');
const askCaret = document.getElementById('askcaret');
const askNote = document.getElementById('asknote');

/* ---- the reader's own questions ------------------------------------------
   A GRAFT IS EPHEMERAL ON THE MAP AND PERMANENT IN THE DRAWER. Clicking the
   background still clears it, because a generated card must not accumulate
   into something that reads as curriculum — but rebuilding is not restoring:
   every build is a fresh call and returns different cards, so a stray click
   used to destroy that particular answer for good. Saved here, the same
   question deals the same cards back, instantly and with no call.

   localStorage rather than a session: the reader's own questions are the one
   thing on this map they authored, and losing them to a reload is the same
   loss one refresh later. Wrapped in try/catch throughout — a private window
   throws on the accessor itself, and the map has to work anyway. */
const GRAFTS_KEY = 'nodegraph:grafts:v1';
const GRAFTS_MAX = 40;

function readGrafts() {
  try { return JSON.parse(localStorage.getItem(GRAFTS_KEY)) || {}; }
  catch (e) { return {}; }
}
function writeGrafts(all) {
  try { localStorage.setItem(GRAFTS_KEY, JSON.stringify(all)); }
  catch (e) { /* full, or a window that refuses to store: the graft is still
                 on screen, it just will not come back */ }
}
function rememberGraft(text, payload) {
  const all = readGrafts();
  all[text] = { ...payload, at: Date.now() };
  /* oldest out first, so the drawer cannot grow without end */
  const keys = Object.keys(all).sort((a, b) => all[a].at - all[b].at);
  while (keys.length > GRAFTS_MAX) delete all[keys.shift()];
  writeGrafts(all);
}

/* a saved graft becomes a DOOR: off the map like any extension question, in
   the dropdown beside the authored ones, and answering into the same card it
   was grafted onto so it groups under that unit */
function doorFor(text, g) {
  const q = {
    id: 'mine:' + text, type: 'question', qtype: 'extension', mine: true,
    text, anchorId: g.host, graft: g,
  };
  byId[q.id] = q;
  return q;
}

const ASKABLE = NODES.filter(n => n.type === 'question').map(n => byId[n.id]);
{
  const saved = readGrafts();
  for (const text of Object.keys(saved)) {
    if (!byId[saved[text].host]) continue;   /* grafted onto a card since renamed */
    if (saved[text].parent && !saved[saved[text].parent]) continue;   /* built on a graft since evicted */
    ASKABLE.push(doorFor(text, saved[text]));
  }
}

/* the unit a question belongs to is DERIVED, the same way the highlight menu
   derives it: a deferred one has no edges left, so it reads `anchorId`. */
function unitOfQuestion(q) {
  if (q.qtype === 'extension') { const h = byId[q.anchorId]; return h && h.unit; }
  const l = linksOf(q).find(x => x.rank === 1);
  const other = l && (l.a === q ? l.b : l.a);
  return other && other.unit;
}

/* SORTED BY UNIT, because the list is grouped by it: a heading starts where
   the unit changes, so an unsorted list prints Genetics four times. Within a
   unit the extensions lead — they are the rows with nowhere else to be found.
   The unit order is UNITS' own, which is the order the map is taught in. */
const UNIT_ORDER = Object.keys(UNITS);
function sortAskable() {
ASKABLE.sort((a, b) => {
  const ua = UNIT_ORDER.indexOf(unitOfQuestion(a)), ub = UNIT_ORDER.indexOf(unitOfQuestion(b));
  if (ua !== ub) return (ua < 0 ? 99 : ua) - (ub < 0 ? 99 : ub);
  const ea = a.qtype === 'extension' ? 0 : 1, eb = b.qtype === 'extension' ? 0 : 1;
  return ea - eb || a.text.localeCompare(b.text);
});
}
sortAskable();

let suggestion = 0, rotateTimer = null;
function rotate() {
  if (document.activeElement === askIn || askIn.value) return;
  suggestion = (suggestion + 1) % ASKABLE.length;
  askIn.placeholder = ASKABLE[suggestion].text;
}
function startRotate() { stopRotate(); rotateTimer = setInterval(rotate, 5000); }
function stopRotate() { if (rotateTimer) clearInterval(rotateTimer); rotateTimer = null; }
askIn.placeholder = ASKABLE[0].text;
startRotate();

let listOpen = false, cursor = -1;
/* A QUESTION IS SEARCHED THE WAY A CARD IS, by terms rather than by substring:
   `tree mass` has to find "Where does the mass of a tree come from?", and a
   contiguous match never will. The card it answers into counts too, so `pigment`
   finds the autumn question even though the word is not in it.

   BROWSING AND SEARCHING LOOK DIFFERENT. An empty field lists every question
   grouped by unit, which is the curriculum's own order and is what a reader
   browsing wants. Typed terms produce a flat list in score order, because the
   best match belongs at the top where Enter takes it, and unit headings would
   scatter it. */
function questionScore(q, terms) {
  const target = byId[q.qtype === 'extension' ? q.anchorId : ''] ||
                 (q.anchor || null);
  const extra = target ? (target.name || '') + ' ' + (target.kind || q.kind || '') : (q.kind || '');
  return score(q.text.toLowerCase(), terms, 100) +
         score(extra.toLowerCase(), terms, 20);
}

function renderList(filter) {
  const terms = (filter || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  let rows;
  if (terms.length) {
    rows = ASKABLE.map(q => ({ q, s: questionScore(q, terms) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.q.text.length - b.q.text.length)
      .map(x => x.q);
  } else {
    rows = ASKABLE;
  }
  askList.innerHTML = '';
  if (!rows.length) {
    /* not a dead end: Enter still searches the cards from here */
    askList.innerHTML = '<div class="askgroup">no question — Enter searches the map</div>';
    return rows;
  }
  let group = null;
  rows.forEach((q, i) => {
    if (!terms.length) {
      const u = unitOfQuestion(q);
      if (u !== group) {
        group = u;
        const h = document.createElement('div');
        h.className = 'askgroup';
        h.textContent = (UNITS[u] && UNITS[u].name) || 'elsewhere';
        askList.appendChild(h);
      }
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'askopt' + (q.qtype === 'extension' ? ' ext' : '') +
                  (q.mine ? ' mine' : '') + (i === cursor ? ' on' : '');
    b.dataset.q = q.id;
    b.textContent = q.text;
    askList.appendChild(b);
  });
  return rows;
}

/* the list is grouped by unit, so the rows are not in ASKABLE's order — the
   keyboard cursor has to walk what is DRAWN */
const drawnRows = () => [...askList.querySelectorAll('.askopt')];

function openList(filter) {
  listOpen = true; askList.hidden = false; askBar.classList.add('open');
  renderList(filter);
}
function closeList() {
  listOpen = false; askList.hidden = true; askBar.classList.remove('open');
  cursor = -1;
}

/* THE READER'S WORDS STAY IN THE FIELD. Clearing it threw away the thing they
   would edit to try again, and the rotation then wrote a different question
   over the space where theirs had been — which reads as the bar having
   forgotten. `rotate()` already declines while the field holds anything, so
   leaving the text in is the whole of the fix. */
function ask(id) {
  const q = byId[id];
  if (!q) return;
  closeList();
  askIn.blur();
  ASKED.push(q.text);           /* a follow-up can refer to it */
  askQuestion(q);
}

askIn.addEventListener('focus', stopRotate);
askIn.addEventListener('blur', startRotate);
askIn.addEventListener('input', () => {
  cursor = -1;
  note('');
  if (askIn.value.trim()) openList(askIn.value); else closeList();
});
askIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!listOpen) { openList(askIn.value); cursor = 0; }
    else cursor = Math.min(cursor + 1, drawnRows().length - 1);
    renderList(askIn.value);
    const on = askList.querySelector('.askopt.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'ArrowUp' && listOpen) {
    e.preventDefault();
    cursor = Math.max(cursor - 1, 0);
    renderList(askIn.value);
    const on = askList.querySelector('.askopt.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'Escape') { closeList(); askIn.blur(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const rows = drawnRows();
  /* A HIGHLIGHTED ROW OUTRANKS THE PLACEHOLDER. Arrowing down puts no text in
     the field, so an empty-field check first sent every keyboard pick to
     whatever the rotation happened to be showing. The placeholder is only the
     offer when the reader has neither typed nor chosen. */
  if (listOpen && cursor >= 0 && rows[cursor]) { ask(rows[cursor].dataset.q); return; }
  /* an empty field asks whatever the placeholder is offering: the rotation
     is a suggestion, and Enter is how you take it */
  if (!askIn.value.trim()) { ask(ASKABLE[suggestion].id); return; }
  /* Cards are not in the dropdown on purpose — a reader who wants a card types
     its name and presses Enter, and does not need a list to tell them the name
     they just typed exists. Order: a card NAMED this, then a question that
     matches, then anything a claim or a kinds fan says. */
  const typed = askIn.value;
  lastTyped = typed;
  note('');
  /* A FOLLOW-UP IS ASKED OF WHAT IS ON SCREEN. "what are some examples" has
     no subject of its own; run through the tiers it lands on whichever card
     says the word. With something in view it goes straight to the model, with
     the view attached. */
  if (isFollowUp(typed) && contextCard() && !extendOff) {
    askExtend(typed).then(ok => { if (!ok) miss(); land(ok ? 'followup' : 'miss'); });
    askIn.blur(); closeList();
    return;
  }
  const named = namedCard(typed);
  if (goToNamed(typed)) { land('named', named && named.n); return; }
  if (rows[0]) { ask(rows[0].dataset.q); land('question', rows[0].dataset.q); return; }
  /* a graft you already own beats a card that merely shares a word: you asked
     this before, and the answer is sitting in the drawer */
  const mine = nearestMine(typed);
  if (mine) {
    closeList(); askIn.blur();
    if (mode === 'build') buildFrom(mine); else restoreGraft(mine);
    land('mine', mine.anchorId);
    return;
  }
  const kw = searchMap(typed);
  if (goToMatch(typed)) { land('keyword', kw && kw.n, { member: kw && kw.kind }); return; }
  /* nothing deterministic matched: guess, say it is a guess, and offer the
     other thing that can be done with a question the map does not hold */
  semanticGo(typed).then(ok => {
    /* no red flash when there is something to offer: a bar that reddens under
       the words "that's a new question" is telling the reader off for asking */
    if (!ok && extendOff) miss();
    if (!ok) land(extendOff ? 'miss' : 'offer');
    offerBuild(typed);
  });
  askIn.blur(); closeList();
});

function miss() {
  askBar.classList.add('miss');
  setTimeout(() => askBar.classList.remove('miss'), 600);
}
askCaret.addEventListener('click', () => {
  if (listOpen) { closeList(); return; }
  openList(askIn.value); askIn.focus();
});
askList.addEventListener('click', e => {
  const b = e.target.closest('.askopt');
  if (b) ask(b.dataset.q);
});
document.addEventListener('pointerdown', e => {
  if (listOpen && !askBar.contains(e.target)) closeList();
});

/* ---- keyword search -------------------------------------------------------
   OFFLINE, AND THE FLOOR UNDER EVERYTHING ELSE. A semantic match over baked
   vectors is the better answer to a typed sentence and is a separate piece of
   work; this is what runs when there is no key, no network, or no question
   worth matching — which is every checkout by default.

   It searches what a reader can SEE on a card: its name, its claim, and the
   names in its kinds fan. A kinds hit resolves to the card that holds it,
   because that is where the reader has to go to read it. */

/* A QUESTION IS IN HERE ONLY IF IT HOLDS A LESSON. `l:water` hangs off
   `q-medium`, so the water lesson was unreachable by typing `water` while
   questions were excluded wholesale. It is searched by its LESSON alone — its
   own text is what the dropdown already matches, and scoring it twice would
   let the same words win in two tiers. */
const SEARCHABLE = () => nodes.filter(n =>
  !n.satellite && n.type !== 'ask' &&
  (n.type === 'question' ? !!openerFor(n) : !!n.name));

/* A CARD'S LESSON IS PART OF WHAT IT OFFERS. `membrane` is the case that
   forced this: the membrane lesson hangs off `selective-perm`, whose name and
   claim never say the word, while `membrane-protein` says it and opens
   nothing.

   THE HREF STEM CARRIES IT, at name weight — `membrane-lab.html` is the
   plainest statement of a lesson's subject that we hold, and it is two or
   three words rather than prose. The lesson's title scores at claim weight and
   its BLURB not at all: a blurb is a paragraph, and scoring it sent `water` to
   the osmosis lesson and `pyruvate` to the bridge, over the cards actually
   named those things. */
const lessonOf = n => lessonFor(n);
const lessonStem = n => {
  const l = lessonOf(n);
  return l ? (l.href || '').replace(/[?#].*$/, '').replace(/\.html$/, '')
                           .replace(/[-_/]/g, ' ').toLowerCase() : '';
};
/* a bare href is the lesson's home; `?step=` is a second door into the same
   page, so the home wins the word they share */
const lessonIsHome = n => { const l = lessonOf(n); return !!l && !/[?#]/.test(l.href || ''); };
const label = n => n.name || n.text || n.id;

/* Scored, not just filtered, because "protein" is in a dozen claims and is
   the NAME of one card. Every term has to appear somewhere or the row is out,
   so two words narrow rather than widen. */
function score(hay, terms, weight) {
  let total = 0;
  for (const t of terms) {
    const i = hay.indexOf(t);
    if (i < 0) return 0;                       /* every term, or nothing */
    /* the whole field beats a prefix of it, which beats a whole word inside
       it, which beats a fragment: `trans` is the name of a fatty acid and the
       first five letters of translation, and the one it IS should win */
    const whole = new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(hay);
    total += weight * (hay === t ? 6 : i === 0 ? 3 : whole ? 2 : 1);
  }
  return total;
}

function searchMap(text) {
  const terms = (text || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return null;
  const hits = [];
  for (const n of SEARCHABLE()) {
    const name = (n.name || '').toLowerCase();   /* a question has none */
    const nameScore = score(name, terms, 100);
    const stemScore = score(lessonStem(n), terms, 100);
    let best = nameScore + stemScore + score((n.claim || '').toLowerCase(), terms, 8) +
               score((lessonOf(n) ? lessonOf(n).name : '').toLowerCase(), terms, 8);
    let kind = null;
    for (const [k, claim] of n.kinds || []) {
      const s = score(k.toLowerCase(), terms, 60) + score(claim.toLowerCase(), terms, 6);
      if (s > 0 && s > (kind ? kind.s : 0)) kind = { k, s };
    }
    /* AN EXPERIMENT IS OFF THE MAP AND STILL HAS A NAME. `Meselson` and
       `Photograph 51` are what a reader types, and neither is on any card's
       face — so evidence is scored the way a kinds member is, and the hit
       resolves to the claim it settles, because that is where it hangs. */
    let ev = null;
    for (const e of EVIDENCE.get(n.id) || []) {
      const s = score(e.name.toLowerCase(), terms, 60) +
                score((e.claim || '').toLowerCase(), terms, 6);
      if (s > 0 && s > (ev ? ev.s : 0)) ev = { name: e.name, s };
    }
    const fan = kind && ev ? (kind.s >= ev.s ? kind : ev) : (kind || ev);
    if (fan && fan.s > best) best = fan.s;
    else { kind = null; ev = null; }           /* the card itself won */
    if (fan && fan !== kind) kind = null;
    if (fan && fan !== ev) ev = null;
    if (best > 0) hits.push({ n, kind: kind && kind.k, ev: ev && ev.name,
                              s: best, nameScore, stemScore });
  }
  /* A CARD WITH A LESSON IS THE BETTER ARRIVAL. `membrane` names no card, but
     `selective-perm` holds the membrane lesson and `membrane-protein` merely
     has the word in its name — the reader typing it wants the one they can
     open. Worth about a tier, so it settles near-misses without letting a
     lesson outrank a card that is actually named what was typed. */
  for (const h of hits) if (lessonOf(h.n)) h.s *= 1.6;
  /* ties: the lesson's home page before one of its inner steps, then the
     shorter name — "RNA" over "RNA processing" for `rna` */
  hits.sort((a, b) => b.s - a.s ||
    (lessonIsHome(b.n) - lessonIsHome(a.n)) ||
    label(a.n).length - label(b.n).length);
  return hits[0] || null;
}

/* A NAMED CARD OUTRANKS A QUESTION THAT MERELY MENTIONS IT. `protein` is the
   name of a card and a word inside four questions; typing it should go to the
   card. The bar is the reader saying what they want, and a name is the most
   direct way to say it. The test is every term landing as a WHOLE WORD in the
   name — 200 per term, the whole-word tier in `score` — so `cyanide`, which is
   in a question and in no card's name, still asks the question. */
function namedCard(text) {
  const terms = (text || '').trim().split(/\s+/).filter(Boolean).length;
  const hit = searchMap(text);
  if (!hit || hit.kind || hit.ev) return null;
  /* NAMED, or the SUBJECT OF ITS LESSON. Both are the reader saying plainly
     what they want, so both outrank a question that merely contains the word:
     `membrane` is the subject of the lesson on `selective-perm` and appears
     inside "How does a membrane assemble itself?", and the lesson is the
     better arrival. 200 per term is the whole-word tier in `score`. */
  const floor = 200 * terms;
  return (hit.nameScore >= floor || hit.stemScore >= floor) ? hit : null;
}

/* the same arrival an asked question gets, minus the question */
const goToNamed = text => arriveAt(namedCard(text));
const goToMatch = text => arriveAt(searchMap(text));

function arriveAt(hit) {
  if (!hit) return false;
  closeList();
  askIn.blur();
  /* IN BUILD AN ARRIVAL IS A SEED. The fans below are the map's facets and
     Build does not deal them, so a kinds or evidence hit lands on the card
     that holds it — which is where the reader has to go to read it anyway. */
  if (buildsNow()) { buildOnArrive = false; return buildFrom(hit.n); }
  light(hit.n);
  focus(hit.n);
  /* a fan hit is not a card, so the fan is dealt to put it on screen */
  if (hit.kind && FACETS.kinds.has(hit.n) && !kf(hit.n).sats) toggleFacet(hit.n, 'kinds');
  if (hit.ev && FACETS.evidence.has(hit.n) &&
      !(hit.n.facets && hit.n.facets.evidence && hit.n.facets.evidence.sats))
    toggleFacet(hit.n, 'evidence');
  followK = ASK_ZOOM;
  touched = true;
  wake(0.4);
  return true;
}

/* ---- the semantic fallback ------------------------------------------------
   LAST, AND ONLY LAST. Everything above is deterministic, offline and free;
   this is what runs when a typed line matches no question and no card, where
   the bar used to just redden. So no keystroke pays for it, `membrane` and
   `protein` never reach it, and a checkout with no key loses nothing it had.

   THE CORPUS SHIPS, THE QUERY DOES NOT. graphdata-vectors.json is baked by
   tools/bake-graph-vectors.js and holds a vector per question, per claim and
   per kinds member; /api/find embeds the reader's line and returns that one
   vector. The cosine happens here, so the floor below is an edit rather than a
   redeploy. Fetched on the FIRST MISS rather than at load: it is half a
   megabyte, and most readers will never type something the keyword search
   cannot answer.

   Z, NOT COSINE, AND IT IS STILL A GUESS. Absolute cosine does not separate
   signal from noise on this corpus: measured, `asdfgh` scores 0.839 against
   its best claim and a correct hit scores 0.855. What does carry information
   is how far the top row stands above the rest of its OWN kind — questions sit
   systematically higher than claims because question-to-question is the same
   register, which is why `kind` is written into every row. Even then the
   separation is soft: `my cat is hungry` reaches z=3.27, above several real
   questions. The floor rejects only the flattest cases, and everything that
   gets through is LABELLED as a closest match rather than presented as an
   answer. */

const VECTORS_URL = 'graphdata-vectors.json';
/* A WRONG JUMP COSTS MORE THAN A MISS. Landing the reader on the closest card
   is only worth doing when it is actually the answer; otherwise they have to
   read a card, work out it is not what they asked, and come back. So the floor
   is set where a hit is CONFIDENT rather than where it is merely best, and
   everything under it is offered as a new question instead of travelled to.

   Measured over 18 queries. Above 3.5: lactate for sore muscles (4.12), the
   yeast question (5.24), mitochondrion (3.72), enzymes (3.76), water (4.22),
   carotenoids (4.00). Below it and now refused: fish → photosynthesis (3.22),
   "my cat is hungry" → q-digest (3.27), pizza → optimal conditions (3.12).
   It costs some real hits too — "how does sunscreen work" (2.72) and "how do
   plants eat" (3.24) were both right and are now offers. That is the trade,
   and it is deliberately made in this direction. */
const Z_FLOOR = 3.5;

let corpus = null, corpusWanted = null, semanticOff = false, extendOff = false;

/* THE LAST QUERY'S VECTOR, KEPT. `semanticGo` embeds the reader's line to rank
   it, and `askExtend` needs the same vector to pick candidates — so building a
   question the reader had just searched embedded identical text twice, seconds
   apart, and threw the first one away. Two Gemini calls, two rows in the
   `finds` log under one question, and two slots against the hourly cap.
   One entry, not a cache: the only text this is ever asked for again is the
   line still sitting in the field. */
let lastVector = null;          /* { q, v } */

/* ---- where a question landed ----------------------------------------------
   THE SERVER CANNOT SEE THIS, so the page says it. Four of the bar's six tiers
   never touch an endpoint — a card matched by name, a question, a restored
   graft, a keyword hit — and those arrivals were invisible in the log while
   being most of them. What the log is for is knowing which tier carries the
   map and which questions fall through to a guess, and neither is derivable
   from the query text once there is more than one tier.

   A BEACON, so the reader pays nothing: it does not block the arrival, it
   survives the tab closing a moment later, and it cannot fail visibly. */

const VISITOR_KEY = 'ss.tutor.visitor';   /* the tutor's own, shared on purpose:
                                             one browser, one id, cleared with
                                             site data like everything else */
const VISITOR = (() => {
  try {
    let v = localStorage.getItem(VISITOR_KEY);
    if (!v && crypto.randomUUID) { v = crypto.randomUUID(); localStorage.setItem(VISITOR_KEY, v); }
    return v || null;
  } catch (e) { return null; }        /* private mode: the row logs without one */
})();

/* WHAT THE READER TYPED, not what was matched. The tiers hand around resolved
   nodes and rewritten strings; the log wants the line as it was entered, which
   is the only version that can be counted or read back as a question somebody
   actually asked. */
let lastTyped = '';

function land(tier, target, extra) {
  if (!lastTyped) return;
  try {
    const body = JSON.stringify({
      q: lastTyped, tier,
      target: target && (target.id || target),
      visitorId: VISITOR,
      ...(extra || {}),
    });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/land', new Blob([body], { type: 'application/json' }));
    } else {
      fetch('/api/land', { method: 'POST', headers: { 'content-type': 'application/json' },
                           body, keepalive: true }).catch(() => {});
    }
  } catch (e) { /* a landing nobody hears is not worth an error */ }
}

/* ONE SHAPE, ALWAYS: `{v, task, dims}` on success, `{status}` on refusal. The
   first cut returned the bare vector on a cache hit and the response object on
   a miss, and the caller that read `.v` silently got nothing — candidates came
   back empty and the endpoint refused the build. */
async function embedQuery(text) {
  if (lastVector && lastVector.q === text) return lastVector;
  /* `visitorId` on the spending calls, not just the beacon. Without it every
     row this page writes is anonymous, so the per-visitor cap in _finds.js
     never applies and the landing has no row to fold into — it matches on
     (q, visitor) and a null never equals a uuid. */
  const res = await fetch('/api/find', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ q: text, visitorId: VISITOR }),
  });
  if (!res.ok) return { status: res.status };
  const out = await res.json();
  if (!out || !out.v) return { status: 502 };
  lastVector = { q: text, v: out.v, task: out.task, dims: out.dims };
  return lastVector;
}

function loadCorpus() {
  if (corpus) return Promise.resolve(corpus);
  if (!corpusWanted) corpusWanted = fetch(VECTORS_URL)
    .then(r => r.ok ? r.json() : Promise.reject(new Error('vectors ' + r.status)))
    .then(j => (corpus = j))
    .catch(e => { console.warn('no baked vectors:', e.message); semanticOff = true; return null; });
  return corpusWanted;
}

/* per KIND, because the three live at different absolute cosines */
function bestByZ(v, rows) {
  const out = [];
  for (const k of ['q', 'claim', 'kind']) {
    const of = rows.filter(r => r.kind === k);
    if (of.length < 2) continue;
    const scored = of.map(r => ({ r, s: r.v.reduce((t, x, i) => t + x * v[i], 0) }));
    const mean = scored.reduce((t, x) => t + x.s, 0) / scored.length;
    const sd = Math.sqrt(scored.reduce((t, x) => t + (x.s - mean) ** 2, 0) / scored.length) || 1;
    const top = scored.reduce((a, b) => (b.s > a.s ? b : a));
    out.push({ row: top.r, z: (top.s - mean) / sd, s: top.s });
  }
  return out.sort((a, b) => b.z - a.z)[0] || null;
}

function note(html) {
  askNote.innerHTML = html || '';
  askNote.classList.remove('offer');
  askNote.hidden = !html;
}

/* THE OFFER, NOT THE ACT. Generation is seconds and money, and a guess the
   reader is happy with should not pay for one — so the map is only extended
   when they ask for it, from beside the guess that did not satisfy them. */
function offerBuild(text) {
  if (extendOff) return;
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'askbuild';
  b.onclick = () => askExtend(text);
  b.textContent = 'Extend the map';
  /* the big treatment only when the offer IS the message: beside a closest
     match it is a second option, and shouting it over the answer is wrong */
  if (askNote.hidden) {
    askNote.innerHTML = '<span class="lead">That’s a new question.</span>';
    askNote.classList.add('offer');
    askNote.hidden = false;
  }
  askNote.appendChild(b);
}

async function semanticGo(text) {
  if (semanticOff) return false;
  askBar.classList.add('thinking');
  try {
    const got = await embedQuery(text);
    if (got && got.status) {
      /* no key, or the endpoint is not deployed: stop asking for this session
         rather than paying a round trip on every miss */
      if ([404, 501, 503].includes(got.status)) semanticOff = true;
      return false;
    }
    const { v, task, dims } = got;
    const bank = await loadCorpus();
    if (!bank || !v) return false;
    /* THE TASK TYPE IS NOT A DETAIL. A query embedded with a different one
       lands in a different geometry and the cosines come back plausible and
       quietly wrong, so the two are compared rather than assumed. */
    if (task !== bank.task || dims !== bank.dims) {
      console.warn('vector geometry mismatch:', task, dims, 'vs', bank.task, bank.dims);
      return false;
    }
    const hit = bestByZ(v, bank.rows);
    if (!hit || hit.z < Z_FLOOR) return false;

    /* THE CORPUS STILL HOLDS THE EXPERIMENTS, and it should: their claims are
       the most distinctive prose on the map. They are no longer cards, so the
       row resolves to the claim each one settles and arrives with its fan
       dealt — the same landing a `kind` row gets. */
    const evHost = EVIDENCE_HOST.get(hit.row.node);
    const n = evHost || byId[hit.row.node];
    if (!n) return false;
    land('semantic', n, { member: hit.row.member || null, z: hit.z });
    if (hit.row.kind === 'q') ask(n.id);
    else if (evHost) arriveAt({ n, ev: evidenceName(hit.row.node) });
    else arriveAt({ n, kind: hit.row.member || null });
    note('closest match: <em>' + esc(hit.row.text.slice(0, 90)) + '</em>');
    return true;
  } catch (e) {
    console.warn('semantic search failed:', e.message);
    return false;
  } finally {
    askBar.classList.remove('thinking');
  }
}

/* ---- extending the map ----------------------------------------------------
   A GRAFT, NOT AN EDIT. The reader asks something the curriculum does not
   cover — "how do fish breathe underwater?" — and /api/extend proposes two or
   three cards wired to cards that already exist. They arrive as SATELLITES of
   the card they attach to: pinned, outside the layout pass, dropped when focus
   leaves. That is what makes this safe rather than merely careful — a
   generated node cannot move a laid-out card, cannot close a cycle on the
   explanation axis and cannot spend a rank-1 budget, because it never enters
   the passes that do any of those things. Nothing is persisted; the map is the
   same map on the next reload.

   EVERY ID IS RESOLVED HERE TOO. The endpoint validates, and then this does it
   again against `byId`, because the endpoint's idea of what exists came from
   the list this page sent it. An edge naming anything unresolvable is dropped,
   never repaired: a repaired edge is a claim nobody made. */

let graft = null;               /* { host, nodes, links } */

function dropGraft() {
  if (!graft) return;
  dropLinks(graft.links);
  dropNodes(graft.nodes);
  graft = null;
  note('');
}

/* the same family test the query uses: staying inside what the graft opened is
   not leaving it */
function syncGraft(n) {
  if (!graft) return;
  if (n === graft.host || graft.nodes.includes(n)) return;
  dropGraft();
}

/* A GRAFT ON A GRAFT. With `stack` the open graft stays and the new row goes
   above it: the reader asked a second question of a card the first one built,
   and the chain climbs from the map's floor one question at a time. Every card
   is still a satellite of the same laid-out ROOT, so the safety argument does
   not change — nothing here can move the skeleton. */
function spawnGraft(host, made, edges, question, { stack = false } = {}) {
  if (!stack) dropGraft();
  const byMade = new Map();
  const fresh = [], wires = [];
  const prior = stack && graft ? graft.nodes : [];

  made.forEach((m, i) => {
    const n = {
      id: 'made:' + m.id, type: 'made', satellite: true, pinned: true, host,
      name: m.name, claim: m.claim, unit: host.unit, tint: host.tint,
      q: question, root: host.id,
      deg: 0, on: true, dx: 0, dy: 0, x: host.x, y: host.y, vx: 0, vy: 0,
    };
    fresh.push(n); byMade.set(m.id, n); byId[n.id] = n;
    nodes.push(n);
    paintNode(n);
    n.el.classList.add('lit');
    sizeOf(n);
  });

  /* ABOVE the host, and laid out by hand: there are at most four and the relax
     never sees them. Above because the map is banded by SCALE and the reader
     is usually looking at the bottom of the frame with room over the top —
     and because the question that produced these sits above them again, so
     the column reads question, then answer, then the card it hangs off. */
  const gap = 26;
  const span = fresh.reduce((t, m) => t + m.el.offsetWidth + gap, -gap);
  const tall = Math.max(...fresh.map(m => m.el.offsetHeight));
  /* the floor of this row: the host's top edge, or the top of whatever the
     open graft already stacked (its question included) */
  const base = prior.length
    ? Math.min(...prior.map(m => m.dy - m.el.offsetHeight / 2)) - 40
    : -(host.el.offsetHeight / 2 + 64);
  let x = 0;
  fresh.forEach(n => {
    const w = n.el.offsetWidth;
    n.dx = x + w / 2 - span / 2;
    x += w + gap;
    n.dy = base - tall / 2;
  });

  const resolve = id => byMade.get(id) || byId[id] || null;
  for (const e of edges) {
    const a = resolve(e.from), b = resolve(e.to);
    if (!a || !b || a === b) continue;
    /* a generated node has to be one END of every generated edge: two existing
       cards already have whatever edge the map says they have, and inventing a
       second one between them would put a model's claim on the skeleton */
    if (a.type !== 'made' && b.type !== 'made') continue;
    if (b.type !== 'made' && !b.on) light(b);
    const l = { a, b, type: e.type, rank: e.rank, spine: false, made: true };
    wires.push(l);
    links.push(l);
    paintLink(l); edgeRefresh(l);
    l.el.classList.add('made');
    l.el.setAttribute('stroke-opacity', '1');
  }

  /* THE QUESTION IS PART OF WHAT WAS BUILT. Without it the graft is an answer
     with no question on the map, which is the one thing a reader cannot
     reconstruct from looking — and it is the reason the cards under it exist. */
  if (question) {
    const q = {
      id: 'made:q:' + (prior.length ? prior.filter(m => m.type === 'question').length : 0),
      type: 'question', qtype: 'extension', made: true,
      satellite: true, pinned: true, host, text: question,
      unit: host.unit, tint: host.tint,
      deg: 0, on: true, dx: 0, dy: 0, x: host.x, y: host.y, vx: 0, vy: 0,
    };
    fresh.push(q); byId[q.id] = q; nodes.push(q);
    paintNode(q);
    q.el.classList.add('lit');
    sizeOf(q);
    q.dx = 0;
    q.dy = base - tall - 40 - q.el.offsetHeight / 2;
    /* to the first card it produced, so the line reads question → answer */
    const target = fresh.find(n => n.type === 'made');
    if (target) {
      const l = { a: q, b: target, type: 'answers', rank: 2, spine: false, made: true };
      wires.push(l); links.push(l);
      paintLink(l); edgeRefresh(l);
      l.el.classList.add('made');
      l.el.setAttribute('stroke-opacity', '1');
    }
  }

  graft = { host, nodes: prior.concat(fresh), links: (stack && graft ? graft.links : []).concat(wires) };
  draw();
}

/* the generated cards on screen right now, in either mode: what a next
   question may build on, so the endpoint is told about them */
function liveMade() {
  const pool = mode === 'build' ? buildMade.nodes : (graft ? graft.nodes : []);
  return pool.filter(n => n.type === 'made' && n.el);
}

/* YOUR OWN QUESTION, ASKED AGAIN IN OTHER WORDS. Question matching needs every
   term, which is right for the authored list and wrong here: a reader who
   typed "how do fish breathe water?" last week and "how do fish breathe
