   underwater?" today means the same question, and the strict rule offered them
   a second build of a graft they already own.

   Content words only, or the function words carry it — "how does a cell make
   energy" and "how does a cell divide" share four of five terms and nothing
   that matters. Two content words in common and two thirds of the shorter
   side: enough to catch a rephrasing, not enough to catch a different
   question about the same card. */
const CHAFF = new Set(['a', 'an', 'the', 'is', 'are', 'do', 'does', 'did', 'how',
  'why', 'what', 'when', 'where', 'which', 'who', 'of', 'in', 'on', 'to', 'for',
  'and', 'or', 'it', 'its', 'my', 'your', 'you', 'i', 'we', 'they', 'be', 'can',
  'get', 'gets', 'so', 'that', 'this', 'there', 'with', 'from', 'at', 'as']);

const meat = t => (t || '').toLowerCase().split(/[^a-z0-9⁺⁻₀-₉α-ωΑ-Ω]+/)
  .filter(w => w && w.length > 1 && !CHAFF.has(w));

/* words a follow-up is made of, on top of the chaff: strip them and a line
   with nothing left is about whatever the reader is looking at */
const FOLLOW = new Set(['example', 'examples', 'more', 'else', 'next', 'then', 'same',
  'other', 'another', 'again', 'instead', 'mean', 'means', 'matter', 'matters',
  'happen', 'happens', 'happened', 'work', 'works', 'about', 'these', 'those',
  'like', 'some', 'any', 'really', 'exactly', 'here', 'go', 'tell', 'me',
  'explain', 'show', 'give', 'say', 'simpler', 'simply', 'detail', 'important']);
const PRONOUN = /\b(this|that|it|these|those|here)\b/i;
function isFollowUp(text) {
  const rest = meat(text).filter(w => !FOLLOW.has(w));
  return rest.length === 0 || (rest.length <= 2 && PRONOUN.test(text));
}

/* the card a follow-up is about: what is focused, or Build's seed */
function contextCard() {
  let n = focused && focused.claim ? focused : null;
  if (!n && focused && focused.satellite && focused.host && focused.host.claim) n = focused.host;
  if (!n && mode === 'build' && buildSeed) n = buildSeed.claim ? buildSeed : byId[buildSeed.anchorId];
  return n && n.name ? n : null;
}

/* what the reader can see, for the model: in Build the whole graph they
   built; on the map the focused card's neighbourhood and the open graft */
function viewContext() {
  const f = contextCard();
  const near = [];
  if (mode === 'build') near.push(...buildNodes);   /* dealt, not yet revealed, still counts */
  else if (f) {
    near.push(f);
    for (const l of linksOf(f)) if (l.rank <= 2) near.push(l.a === f ? l.b : l.a);
    if (graft) near.push(...graft.nodes);
  }
  const shown = near.filter(n => n.name && n.claim && n.type !== 'question');
  return {
    focus: f ? { id: f.id, name: f.name, claim: f.claim } : null,
    shown: shown.map(n => n.id),
    asked: ASKED.slice(-6),
    cards: shown.map(n => ({ id: n.id, name: n.name, claim: n.claim })),
  };
}
const ASKED = [];

function nearestMine(text) {
  const want = new Set(meat(text));
  if (want.size < 2) return null;
  let best = null;
  for (const q of ASKABLE) {
    if (!q.mine) continue;
    const have = new Set(meat(q.text));
    if (!have.size) continue;
    let shared = 0;
    for (const w of have) if (want.has(w)) shared++;
    const ratio = shared / Math.min(have.size, want.size);
    if (shared >= 2 && ratio >= 0.66 && (!best || ratio > best.ratio)) best = { q, ratio };
  }
  return best && best.q;
}

/* the same arrival a build gives, minus the call. `spawnGraft` re-validates
   every id against `byId`, so a card renamed since the graft was saved drops
   its edge rather than drawing one to nothing. */
function restoreGraft(q) {
  if (mountGraft(q)) frameGraft(graft.host);
}

/* A CHAIN RESTORES FROM THE BOTTOM. A graft saved with a `parent` names ids
   the parent made, so the parent is mounted first and this one stacks on it;
   the root is focused once, before the first row. */
function mountGraft(q) {
  const g = (readGrafts()[q.text]) || q.graft;
  const host = g && byId[g.host];
  if (!host) { note('That card is no longer on the map.'); return false; }
  if (g.parent) {
    const pq = ASKABLE.find(x => x.mine && x.text === g.parent);
    if (!pq || !mountGraft(pq)) { note('The question this one built on is gone.'); return false; }
  } else {
    light(host);
    focus(host);
  }
  spawnGraft(host, g.nodes || [], g.edges || [], q.text, { stack: !!g.parent });
  for (const n of graft.nodes) n.el.classList.add('lit');
  note(esc(g.note || ''));
  return true;
}

/* the column is question, cards, host: centre the box it makes rather than
   any one of them, and read it live because the host is still settling */
function frameGraft(host) {
  const col = () => [host, ...(graft ? graft.nodes : [])].filter(n => n.el);
  const box = () => col().reduce((b, m) => {
    const w = m.el.offsetWidth / 2, h = m.el.offsetHeight / 2;
    return { l: Math.min(b.l, m.x - w), r: Math.max(b.r, m.x + w),
             t: Math.min(b.t, m.y - h), b: Math.max(b.b, m.y + h) };
  }, { l: Infinity, r: -Infinity, t: Infinity, b: -Infinity });
  follow = { get x() { const k = box(); return (k.l + k.r) / 2; },
             get y() { const k = box(); return (k.t + k.b) / 2; } };
  followFrames = 700; followK = ASK_ZOOM; touched = true;
  wake(0.4);
}

async function askExtend(text) {
  if (extendOff) return false;
  askBar.classList.add('thinking');
  note('Building …');
  try {
    /* the candidates are this page's retrieval, with claims; the index is the
       whole map as id and name, because retrieval picks the wrong neighbours
       and the model has to be able to find the right one itself */
    const bank = await loadCorpus();
    let candidates = [];
    if (bank) {
      /* almost always the vector `semanticGo` just fetched for this same line */
      const got = await embedQuery(text);
      const v = got && got.v;
      if (v) {
        const seen = new Set();
        candidates = bank.rows
          .map(r => ({ r, s: r.v.reduce((t, x, i) => t + x * v[i], 0) }))
          .sort((a, b) => b.s - a.s)
          .map(x => byId[x.r.node])
          .filter(n => n && n.claim && !seen.has(n.id) && seen.add(n.id))
          .slice(0, 12)
          .map(n => ({ id: n.id, name: n.name, claim: n.claim }));
      }
    }
    /* the cards an earlier question built are the likeliest hosts for the
       next one, and they have no vectors: they go in as candidates by hand */
    const made = liveMade().map(n => ({ id: n.id, name: n.name, claim: n.claim }));
    /* the neighbourhood first: a follow-up almost always attaches to what is
       in view, and the embedding does not know what is in view */
    const ctx = viewContext();
    const seen = new Set();
    candidates = ctx.cards.concat(made, candidates)
      .filter(c => !seen.has(c.id) && seen.add(c.id)).slice(0, 30);
    const index = nodes
      .filter(n => n.name && !n.satellite && n.type !== 'made')
      .map(n => ({ id: n.id, name: n.name }))
      .concat(made.map(n => ({ id: n.id, name: n.name })));

    const r = await fetch('/api/extend', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ q: text, candidates, index, visitorId: VISITOR,
                             context: { focus: ctx.focus, shown: ctx.shown, asked: ctx.asked } }),
    });
    if (!r.ok) {
      if ([404, 501, 503].includes(r.status)) extendOff = true;
      note('');
      return false;
    }
    const out = await r.json();
    ASKED.push(text);
    if (!out.nodes || !out.nodes.length) {
      note(out.note ? esc(out.note) : '');
      return false;
    }
    /* THE DOOR IS THE RESTATED QUESTION. "what are some examples" is what was
       typed; what it meant names the card, stands alone in the drawer, and
       cannot collide with the next reader's "what are some examples". */
    if (out.question && out.question.length > 3) text = out.question;
    /* the host is the first EXISTING card any edge names: that is where the
       graft hangs, and where the camera goes */
    /* the anchor is the first card any edge names that already exists — a
       laid-out card, or a generated one from an earlier question. The chain
       hangs off the anchor; the ROOT it is a satellite of is the laid-out card
       under the whole stack. */
    const fresh = new Set(out.nodes.map(n => 'made:' + n.id));
    const anchorId = out.edges.flatMap(e => [e.from, e.to]).find(id => byId[id] && !fresh.has(id));
    const anchor = byId[anchorId];
    if (!anchor) { note(''); return false; }
    const onMade = anchor.type === 'made';
    const host = onMade ? byId[anchor.root] : anchor;
    if (!host) { note(''); return false; }

    /* saved as the ANSWER, not as the request: the ids and edges are already
       validated and already resolved against this map, so a restore draws
       exactly what was drawn and never asks anything again. Saved BEFORE it is
       drawn, so both modes read the answer from the same place. */
    rememberGraft(text, { host: host.id, nodes: out.nodes, edges: out.edges,
                          note: out.note || '', parent: onMade ? anchor.q : undefined });
    if (!ASKABLE.some(x => x.mine && x.text === text)) {
      ASKABLE.push(doorFor(text, readGrafts()[text] || { host: host.id }));
      sortAskable();
    }
    note(esc(out.note || ''));
    /* IN BUILD A NEW QUESTION IS A NEW GRAPH, not a graft on somebody else's
       card: it seeds, and what it generated is its first hop. */
    if (buildsNow()) {
      buildOnArrive = false;
      const door = ASKABLE.find(x => x.mine && x.text === text);
      return buildFrom(door);
    }
    if (!onMade) { light(host); focus(host); }
    spawnGraft(host, out.nodes, out.edges, text, { stack: onMade });
    for (const n of graft.nodes) n.el.classList.add('lit');
    frameGraft(host);
    return true;
  } catch (e) {
    console.warn('extend failed:', e.message);
    note('');
    return false;
  } finally {
    askBar.classList.remove('thinking');
  }
}

/* ---- the gutter ruler ---------------------------------------------------- */

const gutter = document.getElementById('gutter');
const rungs = {};
for (const [lv, name] of LADDER) {
  const r = document.createElement('div');
  r.className = 'rung';
  r.innerHTML = '<i></i><span>' + esc(name) + '</span><span class="how"></span>';
  gutter.appendChild(r);
  rungs[lv] = r;
}

function placeGutter() {
  for (const [lv, r] of Object.entries(rungs)) {
    const y = bandCentre[lv] * view.k + view.y;
    r.style.top = y.toFixed(1) + 'px';
    r.style.display = y < 70 || y > innerHeight - 40 ? 'none' : '';
  }
}

function gutterLight(n) {
  for (const r of Object.values(rungs)) {
    r.classList.remove('on');

    r.style.removeProperty('--tint');

    n.occursAt ? 'occurs here' : n.emergesAt ? 'emerges here' : '';
}

/* faint band boundaries drawn in world space, so the shelves read even
   where no ruler label is on screen */
{
  const x0 = -900, x1 = Math.max(...nodes.map(n => n.tx)) + 900;
  for (const y of bandEdge) {
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('class', 'band');
    ln.setAttribute('x1', x0); ln.setAttribute('x2', x1);
    ln.setAttribute('y1', y);  ln.setAttribute('y2', y);
    svg.insertBefore(ln, svg.firstChild);

}

/* ---- start --------------------------------------------------------------- */

canvas.addEventListener('pointerdown', () => { touched = true; cineEnd(); });
canvas.addEventListener('wheel', () => { touched = true; cineEnd(); });
addEventListener('resize', () => { applyView(); if (!touched) centre(); });

function centre(set) {
  const list = set || nodes.filter(n => n.on);
  if (!list.length) return;
  const xs = list.map(n => n.x), ys = list.map(n => n.y);
  const pad = 300;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const k = Math.min(0.9, Math.max(0.3,
    Math.min(innerWidth / (x1 - x0), innerHeight / (y1 - y0))));
  view = {
    k,
    x: innerWidth / 2 - (x0 + x1) / 2 * k,
    y: innerHeight / 2 - (y0 + y1) / 2 * k,
  };
  applyView();
}

for (const n of nodes) paintNode(n);
for (const l of links) paintLink(l);

/* ---- Build ---------------------------------------------------------------
   THE MAP IS BAKED; BUILD IS THE OTHER READING. Same nodes, same edges, same
   authored rank — only the seats are different, so nothing here reaches into
   graphdata.js and no bake can go stale behind it.

   The seed sits on the left and every fan opens to the right, so x is HOPS
   FROM THE SEED rather than explanatory order and y is a slot in a fan
   rather than the scale ladder. Both axes mean something else than they do
   on the map, which is why the ruler and the band lines are hidden in this
   mode instead of left to lie.

   Two hops are dealt at the start and a click deals another, so the graph
   the reader ends with is the path they took through it. Growth is bounded
   by clicks, not by a depth cap, and what holds the layout together is the
   map's own relax running over the BUILT set alone. */
const BUILD_HOPS = 2;             /* dealt at the start; every click deals one more */
const BUILD_COL = 820;            /* x between hops */
const BUILD_GAP = 46;             /* y between siblings in one fan */

let mapSave = null;

const showEl = (n, on) => { n.el.style.display = on ? '' : 'none'; };
const showLink = (l, on) => {
  for (const e of [l.el, l.arrow, l.label]) if (e) e.style.display = on ? '' : 'none';
};
const labelOf = n => n.name || n.text || n.id;

/* A CARD ARRIVES AT ITS SEAT, not at its parent's. The composer's `show` sets
   x to the target and lets the relax adjust from there; flying a card in from
   the card that revealed it means every arrival starts inside a pile and the
   first thing the reader sees is the shove that separates it. */
function reveal(n, x, y, from) {
  if (built.has(n)) return false;
  built.add(n); buildNodes.push(n);
  n.pinned = false;
  n.tx = x; n.ty = y;
  n.x = x; n.y = y;
  n.vx = n.vy = 0;
  /* KEPT WHEN THERE IS NO PARENT TO COUNT FROM. The wave parks every card and
     re-admits it with no `from`, so zeroing here made the whole graph read as
     hop 0 — which is the seed's number, and it drives the drift and the taper. */
  n.hop = from ? (from.hop || 0) + 1 : (n.hop || 0);
  /* DEPTH IS NOT HOP. A door and the member it names are a chain the reader
     has not chosen anything with yet, so they cost no depth — otherwise a
     question seed's first real card would be tapered as though the reader had
     already followed two edges out of it. */
  const chainish = from && (from.type === 'question' || from.synthetic);
  n.depth = from ? (from.depth || 0) + (chainish ? 0 : 1) : (n.depth || 0);
  showEl(n, true);
  light(n);
  /* every edge to something already built, not just the one it arrived on:
     a fan that closes back onto a sibling has to draw that */
  for (const l of linksOf(n)) {
    const o = l.a === n ? l.b : l.a;
    if (!built.has(o) || buildLinks.includes(l)) continue;
    buildLinks.push(l); showLink(l, true); edgeRefresh(l);
  }
  return true;
}

/* FIVE EDGES PER CARD, RANK-FIRST: a card deals its rank-1 edges and tops up
   from rank 2 and then 3 only if it is still short, so the spine leads and the
   enrichment fills in behind it. Uncapped, `func` and `protein-class` alone put
   seventeen cards in one fan. */
const BUILD_FAN = 5;
/* THE FAN TAPERS WITH DEPTH. Five edges branching twice is thirty-one cards
   before the extras, and a hub seed spends the whole page on cards nobody
   asked for. The first fan stays wide — it is what the seed IS — and the ring
   past it narrows. A CLICK always deals the full five: that fan is the reader
   choosing, and the taper is only for what the map deals on their behalf. */
const BUILD_FAN_FAR = 3;
const BUILD_ASKS = 2;             /* deferred questions a card may deal, on top */
const BUILD_CHAIN = 400;          /* the short hop: a door or a kind, to its card */

/* a deterministic per-card drift, hashed from the id: the bow and the rank
   only separate cards that DIFFER in those, and a fan of five rank-1 edges has
   neither to work with. Hashed rather than random so the graph is the same
   every session, which is what spatial memory needs. */
function wobble(id, span) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  return ((Math.abs(h) % 1000) / 1000 - 0.5) * span;
}

function expand(n) {
  const fan = !dealing || !(n.depth || 0) ? BUILD_FAN : BUILD_FAN_FAR;
  const seen = new Set();
  const kids = linksOf(n)
    .slice()
    .sort((a, b) => a.rank - b.rank)
    .map(l => (l.a === n ? l.b : l.a))
    /* A SATELLITE IS NOT A STATION. A kinds fan, a pill or a generated card
       left open on the map is still in `nodes` when the reader switches over,
       and it rides its host rather than holding a seat — dealt into a fan it
       arrives as a card the graph cannot grow from. */
    .filter(m => !m.satellite && !built.has(m) && !seen.has(m) && seen.add(m))
    .slice(0, fan);
  /* AND THE QUESTIONS THE BAR IS HOLDING FOR IT, outside the five: they were
     never on the map competing for a seat, and a card that has one is a card
     the reader can ask about. */
  for (const q of QUERIES) {
    if (kids.length >= fan + BUILD_ASKS) break;
    if (q.anchorId !== n.id || built.has(q)) continue;
    if (!buildQuery(q)) continue;
    /* the kind it names comes with it, and BEFORE it: the question's only edge
       runs to the member, so dealt alone it arrives attached to nothing */
    const via = (links.find(l => l.type === 'answers' && l.a === q) || {}).b;
    if (via && via !== n && !built.has(via) && !kids.includes(via)) kids.push(via);
    kids.push(q);
  }
  /* what a saved question produced is dealt off the QUESTION, because that is
     what it is the answer to — the edges themselves run to the map's cards */
  if (n.graftNodes)
    for (const m of n.graftNodes)
      if (!built.has(m) && !kids.includes(m)) kids.push(m);
  /* AND THE REST OF THE FAN, once one member of it is on the graph. A question
     names one kind and the map deals the whole fan around it, because a member
     only means anything against the others — three kinds of mutagen is the
     answer, and ultraviolet alone is a fact. */
  if (n.kinds && n.kinds.some((k, i) => built.has(byId[n.id + '::build:' + i])))
    for (const [name] of n.kinds) {
      const k = buildKind(n, name);
      if (k && !built.has(k) && !kids.includes(k)) kids.push(k);
    }
  if (!kids.length) return [];
  /* the best edge between the parent and this card. A question dealt through
     the kind it names has no edge to the parent at all — `Math.min()` of
     nothing is Infinity, which put the whole graph at NaN — so it falls back
     to the rank its own answer edge carries. */
  const rankTo = m => {
    const rs = linksOf(n).filter(l => l.a === m || l.b === m).map(l => l.rank);
    return rs.length ? Math.min(...rs) : (m.anchorRank || 2);
  };
  /* THE DRIFT WIDENS WITH DEPTH. The first fan is read against the card that
     opened it and wants to stay tidy beside it; a second hop is five fans
     landing at the same distance, and at one hop's width they arrive as a
     wall. Running off the screen is the right trade — the reader came here by
     clicking and can pan. */
  const drift = BUILD_COL * (0.5 + 0.5 * (n.hop || 0));

  /* THE FAN OPENS RIGHT WHATEVER THE ARROW SAYS. On the map an edge's
     direction is the reading order and it decides which side a card sits;
     here the reading order is the reader's own clicks, so what is right of a
     card is what that card revealed.

     Dealt off the parent's CURRENT position rather than its column, which is
     what lets a fan follow a card the relax has already moved. The composer
     steps its fan by a constant per kind; these cards range from a two-line
     question to a specimen with a ribbon in it, so the step is the card's own
     height and the row cannot be dealt on top of itself. */
  /* A DOOR AND A FACET HANG CLOSE. A hop is the width of an explanation; a
     question to the card it asks about, or a member to the card it is a member
     OF, is not one — at a full hop they read as two cards with a hand's width
     of paper between them and nothing in it. */
  const colOf = m => (n.type === 'question' || n.synthetic ||
                      m.type === 'question' || m.synthetic) ? BUILD_CHAIN : BUILD_COL;
  const before = buildLinks.length;
  for (const m of kids) reveal(m, n.x + colOf(m), n.y, n);
  const hs = kids.map(m => Math.max(m.el.offsetHeight, 120) + BUILD_GAP);
  const total = hs.reduce((a, b) => a + b, 0);
  let y = n.y - total / 2;
  kids.forEach((m, i) => {
    const t = kids.length === 1 ? 0 : (i / (kids.length - 1)) * 2 - 1;   /* -1 … +1 */
    m.ty = y + hs[i] / 2;
    y += hs[i];
    /* A HOP IS NOT A COLUMN. Every fan reaching the same distance put twelve
       cards in a 180px band and the hop read as a wall. Two things break it,
       both read from the data: the BOW, which sets the ends of a fan back from
       its middle, and the RANK, which puts enrichment further out than the
       spine — so how far right a card sits says how well it is attached. */
    /* the rank stagger is a claim about how well a card is ATTACHED, and the
       rank on a facet edge is not that claim: the fan's own edges are rank 2
       by construction, which pushed every member half a hop further out than
       the card it belongs to. Short hops take the bow and the drift only. */
    const col = colOf(m), near = col / BUILD_COL;
    m.tx = n.x + col - Math.abs(t) * 160 * near
           + (col === BUILD_COL ? (rankTo(m) - 1) * col * 0.55 : 0)
           + wobble(m.id, drift * near);
    m.x = m.tx; m.y = m.ty; m.vx = m.vy = 0;
  });
  measure();
  wake(1);                    /* a fan dealt into an occupied region has work to do */
  if (!dealing) stagger(kids);   /* a dealt fan joins one card at a time */
  return kids;
}

/* the seed on the left, at a zoom a card is readable at. `innerWidth` reads 0
   when the pane is collapsed, which silently sends the camera to infinity. */
function buildCamera(seed) {
  const w = innerWidth || 1440, h = innerHeight || 900;
  const ys = buildNodes.flatMap(n => [n.y - n.ry, n.y + n.ry]);
  const y0 = Math.min(...ys) - 60, y1 = Math.max(...ys) + 60;
  /* A HEADING IS CENTRED ON THE PAGE, not on the graph it opened. It is the
     title of everything on screen, and framing the bounding box instead put it
     wherever its own chain happened to sit — low, when the fans opened above
     it. The fit below still chooses the zoom. */
  const mid = seed.type === 'question' ? seed.y : (y0 + y1) / 2;
  /* the seed on the left and the first fans in frame. A hop-2 column of
     seventeen cards is taller than any readable zoom, so the fit is floored
     rather than obeyed: what a reader has to see is the seed and the arms
     leaving it, and the rest of the column is one scroll away. */
  const k = Math.min(0.6, Math.max(0.5, h / (y1 - y0)));
  /* close on the seed first, then pull back to the fit. A reader who wants the
     whole graph now can pan or zoom, which ends the move where it stands. */
  cineK = k;
  cineY = seed.type === 'question' ? seed.y : mid;
  cineOn = true;
  /* THE BEAT BELONGS TO THE QUESTION. It is a title card, and holding on one
     is what makes it read as one. A card seed has no title to hold and the
     hold would be a blank screen — the graph is what it opened with — so it
     starts the pull-back on the first frame. */
  const heading = seed.type === 'question';
  cineAt = performance.now() - (heading ? 0 : CINE_HOLD);
  if (heading) document.body.classList.add('intro');
  view.k = CINE_FROM;
  seatSeed();
  applyView();
  touched = true;
}

/* AN EXTENSION QUESTION HAS A SEAT HERE. It is off the map because the map is
   laid out and a query has no place in a layout — but Build has no layout to
   protect, so the question is just a node, and the reader who switched over
   with one open should still be looking at it. The node is authored and
   permanent; only its card and its `answers` edge are made for the session,
   and both are given back when the mode ends or the seed changes. */
const buildMade = { nodes: [], links: [] };
const isQuery = n => QUERIES.includes(n);

function dropMade() {
  for (const l of buildMade.links) {
    l.el.remove(); l.label.remove(); if (l.arrow) l.arrow.remove();
  }
  links = links.filter(l => !buildMade.links.includes(l));
  for (const q of buildMade.nodes) {
    if (q.el) q.el.remove();
    const i = nodes.indexOf(q);
    if (i >= 0) nodes.splice(i, 1);
    /* an authored question keeps its id: it is off the map exactly the way it
       was before Build borrowed it, and `ask()` still finds it. A kind card was
       invented here and leaves the index with its card. */
    if (q.synthetic) delete byId[q.id];
    else byId[q.id] = q;
    q.el = null; q.on = false; q.satellite = false; q.host = null;
  }
  buildMade.nodes.length = 0; buildMade.links.length = 0;
}

/* A KIND IS A NODE HERE TOO. On the map a kinds member is a satellite riding a
   pill, because it is detail too small to hold a seat; in Build there are no
   seats, and it is the member — not the card — that a question naming one is
   actually asking about. Its own id, so the map's fan and this can both exist
   without one standing in for the other. */
function buildKind(host, name) {
  const i = (host.kinds || []).findIndex(([n]) => n === name);
  if (i < 0) return null;
  const id = host.id + '::build:' + i;
  if (byId[id] && byId[id].el) return byId[id];
  const [nm, claim] = host.kinds[i];
  const k = {
    id, type: 'satellite', synthetic: true, name: nm, claim,
    unit: host.unit, tint: host.tint,
    satellite: false, pinned: false, on: false, deg: 1, vx: 0, vy: 0,
  };
  nodes.push(k); byId[id] = k;
  paintNode(k); showEl(k, false);
  buildMade.nodes.push(k);
  const l = { a: k, b: host, type: 'instance-of', rank: 2, spine: false };
  links.push(l); paintLink(l); showLink(l, false); edgeRefresh(l);
  buildMade.links.push(l);
  return k;
}

/* paint a deferred question into the graph, with the edge the extraction took
   off it — landing on the KIND it names where it names one, which is the chain
   the map draws through the pill. Returns null where its anchor is not a card,
   which is not a case the data has but is one a re-bake could make. */
function buildQuery(q) {
  const host = byId[q.anchorId];
  if (!host || !host.el) return null;
  if (q.el) return q;
  paintNode(q);
  showEl(q, false);
  q.satellite = false; q.pinned = false; q.host = null; q.on = false;
  q.deg = 1; q.vx = 0; q.vy = 0;
  q.el.classList.add('unlit');
  nodes.push(q); byId[q.id] = q;
  buildMade.nodes.push(q);
  const target = (q.kind && buildKind(host, q.kind)) || host;
  const l = { a: q, b: target, type: 'answers', rank: q.anchorRank, spine: true };
  links.push(l); paintLink(l); showLink(l, false); edgeRefresh(l);
  buildMade.links.push(l);
  return q;
}
/* A SAVED QUESTION IS ITS OWN GRAPH HERE. On the map a graft is satellites of
   a laid-out card — pinned, outside the layout, because a generated node must
   not be able to move the skeleton. Build has no skeleton to protect and no
   seats to spend, so the reader's question is a heading like any other and the
   cards it produced are ordinary nodes in the graph it opened. Nothing is
   generated here: the saved payload is replayed, and it was already validated
   against `byId` when it was made. */
function buildMine(q) {
  const g = readGrafts()[q.text] || q.graft;
  const host = g && byId[g.host];
  if (!host || !host.el) { note('That card is no longer on the map.'); return null; }
  if (q.el) return q;
  /* a chain builds from the bottom: the parent's cards have to exist before
     this question's edges can name them */
  if (g.parent) {
    const pq = ASKABLE.find(x => x.mine && x.text === g.parent);
    if (!pq || !buildMine(pq)) { note('The question this one built on is gone.'); return null; }
  }

  paintNode(q);
  showEl(q, false);
  q.satellite = false; q.pinned = false; q.host = null; q.on = false;
  q.deg = 1; q.vx = 0; q.vy = 0;
  /* seated at the host until revealed: a chain's parent may sit outside the
     hops, and draw() places every node whether or not it is shown */
  q.x = host.x; q.y = host.y;
  q.el.classList.add('unlit');
  nodes.push(q); byId[q.id] = q;
  buildMade.nodes.push(q);

  const made = new Map();
  for (const m of (g.nodes || [])) {
    const id = 'made:' + m.id;
    if (byId[id]) continue;              /* a live graft on the map owns that id */
    const n = {
      id, type: 'made', synthetic: true, name: m.name, claim: m.claim,
      unit: host.unit, tint: host.tint, q: q.text, root: host.id,
      satellite: false, pinned: false, on: false, deg: 0, vx: 0, vy: 0,
      x: host.x, y: host.y,
    };
    nodes.push(n); byId[id] = n; made.set(m.id, n);
    paintNode(n); showEl(n, false);
    buildMade.nodes.push(n);
  }
  const resolve = id => made.get(id) || byId['made:' + id] || byId[id] || null;
  /* the question's own edge runs to what it was asked OF: the root card, or
     the generated card a parent question built */
  const anchor = (g.edges || []).flatMap(e => [e.from, e.to])
    .map(id => made.has(id) ? null : resolve(id)).find(Boolean) || host;
  const ql = { a: q, b: anchor, type: 'answers', rank: 1, spine: true };
  links.push(ql); paintLink(ql); showLink(ql, false); edgeRefresh(ql);
  buildMade.links.push(ql);
  for (const e of (g.edges || [])) {
    const a = resolve(e.from), b = resolve(e.to);
    if (!a || !b || a === b) continue;
    /* the map's rule, unchanged: a generated node has to be one END of every
       generated edge, or a model's claim lands on the skeleton */
    if (a.type !== 'made' && b.type !== 'made') continue;
    const l = { a, b, type: e.type, rank: e.rank || 2, spine: false, made: true };
    links.push(l); paintLink(l); showLink(l, false); edgeRefresh(l);
    l.el.classList.add('made');
    buildMade.links.push(l);
  }
  /* dealt off the question rather than off the host: they are its answer */
  q.graftNodes = [...made.values()];
  return q;
}

/* THE SEED IS WHATEVER THE READER ARRIVED AT. `q-machine` is only the default
   the toggle uses; the ask bar, a `?node=`/`?ask=`/`?q=` link and a keyword
   search all land here instead of on the map when Build is on, so the mode is
   a way of reading any card rather than a tour of one. */
let buildSeed = null;

function enterBuild(seed) {
  if (mode === 'build') return;
  /* the baked seats are the map, and they are not recomputed on the way back:
     switching modes must not cost the reader the map they had open */
  mapSave = {
    view: { ...view }, touched,
    seats: nodes.map(n => ({ n, x: n.x, y: n.y, tx: n.tx, ty: n.ty,
                             pinned: n.pinned, on: n.on })),
  };
  clearFocus();
  stages.clear();                       /* a hidden card must not hold a context */
  mode = 'build';
  document.body.classList.add('building');
  for (const n of nodes) { n.on = false; n.el.classList.add('unlit'); showEl(n, false); }
  for (const l of links) showLink(l, false);
  /* BUILD WITH NOTHING TO BUILD FROM IS A PROMPT. There is no default seed: a
     reader who switched over with nothing open is asking to start something,
     and the honest form of that is an empty page with the ask bar in the
     middle of it. It moves back down the moment a graph exists. */
  if (!seed) {
    buildSeed = null;
    document.body.classList.add('empty');
    askIn.focus();
    return;
  }
  dealBuild(seed);
}

/* one graph, grown from one card. Runs on the way in and again whenever the
   reader asks for a different seed without leaving the mode. */
function dealBuild(seed) {
  for (const n of buildNodes) { n.on = false; n.el.classList.add('unlit'); showEl(n, false); }
  for (const l of buildLinks) showLink(l, false);
  built.clear(); buildNodes.length = 0; buildLinks.length = 0;
  stages.clear();
  dropMade();                    /* before the seed is painted, or it drops it */
  if (seed && seed.mine) seed = buildMine(seed) || byId[seed.anchorId];
  else if (isQuery(seed)) seed = buildQuery(seed) || byId[seed.anchorId];
  if (!seed || !seed.el) { console.warn('build seed missing'); return; }
  document.body.classList.remove('empty');
  buildSeed = seed;
  /* the counts belong to THIS graph: a card kept its hop from the last one, and
     reveal now preserves what it finds rather than zeroing it */
  for (const n of nodes) { n.hop = 0; n.depth = 0; }
  /* before the reveal, which measures: the heading is a different box from the
     card it would otherwise be, and a fan spaced for the card holds the
     heading badly */
  for (const m of nodes) if (m.el) m.el.classList.remove('seed');
  if (seed.type === 'question') seed.el.classList.add('seed');
  reveal(seed, 0, 0, null);
  /* THE SEED HOLDS STILL. Everything else is arranged around it, and a seed
     the relax is free to shove leaves the camera framing a card that has since
     moved — measured, 150px below where it was centred. */
  seed.pinned = true;
  dealing = true;
  let front = [seed];
  /* A QUESTION SPENDS ITS HOPS ON ITS OWN CHAIN. Its only edge is the answer,
     and where it names a kind there is a card between it and its host — so two
     hops off a question is a chain of three before the graph starts. The door
     gets those hops back. */
  const hops = BUILD_HOPS + (isQuery(seed) ? (seed.kind ? 2 : 1) : 0);
  for (let h = 0; h < hops; h++) {
    const next = [];
    for (const n of front) next.push(...expand(n));
    front = next;
  }
  dealing = false;
  measure(); wake(1);
  /* settle BEFORE the camera reads the extents, or it frames the targets and
     the relax then walks the graph out of the shot */
  for (let i = 0; i < 1200 && !settled; i++) step();
  draw();
  focus(seed);
  follow = null;                          /* the camera below is the arrival */
  buildCamera(seed);
  /* everything but the seed waits its turn — with the beat where there is one,
     and from the next tick where there is not */
  waiting = buildNodes.filter(m => m !== seed);
  for (const m of waiting) park(m);
  if (!document.body.classList.contains('intro')) { stagger(waiting); waiting = []; }
}

/* what Build was showing, said in the map's own terms: a kind is read through
   the card it belongs to, a generated card through the one it was grafted onto,
   and a question stays a question — the map has its own way of opening one. */
function mapSubject() {
  let n = focused && built.has(focused) ? focused : buildSeed;
  while (n && n.synthetic && n.type !== 'question') {
    const l = buildLinks.find(k => (k.a === n && k.b !== n) || (k.b === n && k.a !== n));
    n = l ? (l.a === n ? l.b : l.a) : null;
  }
  if (n && n.type === 'made') n = byId[(readGrafts()[buildSeed.text] || {}).host] || null;
  return n;
}

function leaveBuild() {
  if (mode !== 'build' || !mapSave) return;
  const subject = mapSubject();
  mode = 'map';
  cineEnd();                     /* the opening move belongs to the graph it opened */
  document.body.classList.remove('building');
  clearFocus();
  stages.clear();
  dropMade();                    /* before the show-all, or a borrowed card stays */
  for (const n of nodes) if (n.el) n.el.classList.remove('seed');
  for (const n of nodes) showEl(n, true);
  for (const l of links) showLink(l, true);
  /* A SEAT CAN OUTLIVE ITS NODE. `seats` is a snapshot taken on the way in,
     and a node can leave the map before the way out — dealBuild's dropMade()
     on a re-deal, a query dropped, a kinds fan collapsed. Its `el` is null by
     then and there is no seat left to restore, so it is skipped rather than
     crashed on. Same guard as the `seed` sweep above. */
  for (const s of mapSave.seats) {
    const n = s.n;
    if (!n.el) continue;
    n.x = s.x; n.y = s.y; n.tx = s.tx; n.ty = s.ty; n.pinned = s.pinned;
    n.vx = n.vy = 0;
    n.on = false;
    n.el.classList.add('unlit');
    if (s.on) light(n);                  /* light() is what re-mounts the box */
  }
  built.clear(); buildNodes.length = 0; buildLinks.length = 0;
  buildSeed = null;
  document.body.classList.remove('empty');
  for (const l of links) edgeRefresh(l);
  measure();
  view = { ...mapSave.view }; touched = mapSave.touched;
  applyView(); draw();

  /* THE READING CARRIES BOTH WAYS. What Build was on is opened here, in the
     map's own terms — an extension question through `askQuestion`, a saved one
     through its graft — so a reader toggling back and forth is looking at the
     same thing in two forms. */
  if (subject) {
    if (subject.mine) restoreGraft(subject);
    else if (subject.type === 'question' && (isQuery(subject) || !subject.el)) askQuestion(subject);
    /* `byId` IS THE INDEX, NOT THE MAP. dropMade and dropQuery both keep a
       non-synthetic node indexed on purpose — an authored question has to
       stay findable — while nulling its `el`, so the id check alone passes
       for a card that is no longer on the page. `el` is what says it is. */
    else if (byId[subject.id] === subject && subject.el) { light(subject); focus(subject); }
    /* and the reader's own camera is what they left the map at: the pan only
       happens when what they were reading is not already on the page */
    view = { ...mapSave.view }; touched = mapSave.touched;
    applyView();
    /* the zoom is the reader's either way: a pan to something off the page is
       worth it, a zoom they did not ask for is not */
    followK = 0;
    if (onScreen(subject)) follow = null;
  }
  draw();
}

/* is this card in the frame as it stands? */
function onScreen(n) {
  if (!n || !n.el) return false;
  const w = innerWidth || 1440, h = innerHeight || 900;
  const x = n.x * view.k + view.x, y = n.y * view.k + view.y;
  return x > 40 && x < w - 40 && y > 60 && y < h - 60;
}

const modeBtns = [...document.querySelectorAll('#modes .mode')];
const syncModes = () => {
  for (const o of modeBtns) o.classList.toggle('on', o.dataset.mode === mode);
};
/* SWITCHING MODES CARRIES THE READING. An open query is what the reader is
   looking at, so it outranks the card under it; a kind, a pill or a generated
   card is read through the card it hangs off, so the walk up `host` is what
   turns any of them into a seed. Nothing open falls back to the default. */
function currentSeed() {
  if (queryHost && queryHost.query) return queryHost.query;
  /* AN OPEN GRAFT OUTRANKS THE CARD UNDER IT. Seeding on the card would deal
     the map's own neighbourhood and leave the generated cards behind; the
     door for the newest question in the stack is what deals them, and its
     chain brings the rest. */
  if (graft) {
    const qs = graft.nodes.filter(n => n.type === 'question');
    const top = qs[qs.length - 1];
    const door = top && ASKABLE.find(x => x.mine && x.text === top.text);
    if (door) return door;
  }
  let n = focused;
  while (n && n.satellite && n.host) n = n.host;
  if (n && n.type === 'made') n = byId[n.root] || null;
  return n && byId[n.id] === n ? n : null;
}

for (const b of modeBtns) b.addEventListener('click', () => {
  const want = b.dataset.mode;
  if (want === mode) return;
  if (want === 'build') enterBuild(currentSeed()); else leaveBuild();
  syncModes();
});

/* THE ONE DOOR INTO BUILD. Every arrival — the ask bar, a search, a shared
   link — comes through here, so seeding a new graph and switching into the
   mode cannot drift apart. A card that was never painted (an extension
   question, which has no seat) cannot be a seed; its anchor is. */
function buildFrom(n) {
  if (!n || (!n.el && !isQuery(n) && !n.mine)) return false;
  if (mode !== 'build') enterBuild(n);
  else dealBuild(n);            /* which focuses the seed and frames it */
  syncModes();
  return true;
}

/* a `mode=build` link arrives before there is anything to seed with: the
   tiers resolve the card first and the arrival routes here */
let buildOnArrive = false;
const buildsNow = () => mode === 'build' || buildOnArrive;

/* THE PAGE'S FIRST FRAME, run once at load. NOT the Reset button — that
   clears the highlight and nothing else (below); coming back here would
   throw away the reader's position, zoom and every card they had opened,
   which is refreshing the page with extra steps. */
function start() {
  follow = null;
  hiliteSel.value = '';
  syncHilite();
  hiNodes = null;
  document.body.classList.remove('highlighting');
  for (const n of nodes) n.el.classList.remove('hi');
  clearFocus();
  stages.clear();               // fogged cards must not hold contexts
  unlightAll();
  /* the doors: both anchoring questions and their rank-1 answers lit,
     everything else fog */
  const doors = [];
  for (const q of ['q-medium', 'q-machine']) {
    const n = byId[q];
    light(n); doors.push(n);
    for (const l of linksOf(n)) if (l.spine) {
      const m = l.a === n ? l.b : l.a;
      light(m); doors.push(m);
    }
  }
  /* AND EVERY LESSON, out of the fog at load. The lessons are the featured
     work and the reason the map exists, so a reader who never explores still
     sees all of them; they cost no stage, being screenshots. Not added to
     `doors`, because the camera below frames the opening, and seven cards
     spread over three units would pull it back to a zoom nothing is legible
     at. They are lit where they stand, for whoever pans. */
  for (const n of nodes) if (lessonFor(n)) light(n);
  for (const l of links) edgeRefresh(l);
  measure();
  wake(1);
  for (let i = 0; i < 240; i++) step();   /* pre-settle, so load is calm */
  draw();
  centre(doors);
}
/* RESET IS THE HIGHLIGHT'S OFF SWITCH, not the page's. It puts the menu back
   to "all" and drops the overlay; the camera, the zoom and every lit card stay
   exactly where the reader left them. applyHighlight's empty-mode path is what
   does the work, so the button and picking "all" from the menu cannot drift. */
function resetHighlight() {
  hiliteSel.value = '';
  syncHilite();
  applyHighlight();
}
/* ---- a link to one card ---------------------------------------------------
   THE URL IS A SEARCH RESULT, NOT A CAMERA. It names WHAT to open and lets the
   page work out where that is, so a link keeps working after a re-bake moves
   every column — which a saved x/y/zoom would not survive a single edit of.

     ?node=simple-diffusion        a card
     ?node=pigment&kind=Carotenoid a card with one of its kinds dealt
     ?ask=q-sunburn                a question, authored or deferred
     ?q=how+do+fish+breathe        whatever the bar would have done with it
     ?node=selective-perm&mode=build   the same card, grown in Build
     ?q=osmosis&mode=build             ... and the same for a keyword
     ?build=hbond                      the shorthand for node + mode

   `mode=build` composes with all three tiers rather than replacing them: what
   they resolve to becomes the SEED, so a keyword link and a card link open the
   same graph.

   `q` is the general one and runs the same pipeline Enter does, down to the
   offer to build — so a question somebody grafted is shareable as the QUESTION
   even though the graft itself lives in their own browser and not in the link.

   Applied after `start()`, which fogs the map and frames the opening: this is
   a reader arriving somewhere specific, so it happens last and wins. */

const asklink = document.getElementById('asklink');

function urlFor() {
  const u = new URL(location.href);
  u.search = '';
  /* A LINK TO A BUILD IS A LINK TO ITS SEED. The graph itself is the reader's
     own clicks and is not in the URL; what travels is the card it grew from,
     which is what the far end needs to grow their own. */
  if (mode === 'build' && buildSeed) {
    u.searchParams.set('node', buildSeed.id);
    u.searchParams.set('mode', 'build');
    return u.href;
  }
  const n = focused;
  /* a live graft is the reader's own and is not in the link — but the QUESTION
     that made it is, so the far end can build their own answer to it */
  if (graft && graft.nodes.length) {
    const q = graft.nodes.find(m => m.type === 'question');
    if (q) { u.searchParams.set('q', q.text); return u.href; }
  }
  if (!n) return u.href;
  if (n.satellite && n.host) {
    /* a kind has no id of its own that survives a reload: name its card and
       the member, which is what `toggleKinds` deals from anyway */
    const host = n.host.host || n.host;      /* satellite → pill → card */
    if (host && host.id) {
      u.searchParams.set('node', host.id);
      if (n.name) u.searchParams.set('kind', n.name);
      return u.href;
    }
  }
  if (n.type === 'question') { u.searchParams.set('ask', n.id); return u.href; }
  u.searchParams.set('node', n.id);
  return u.href;
}

asklink.addEventListener('click', async () => {
  const href = urlFor();
  try {
    await navigator.clipboard.writeText(href);
  } catch (e) {
    /* a page served over http, or a browser refusing the clipboard: select it
       instead, so the reader can still copy what they asked for */
    const t = document.createElement('textarea');
    t.value = href; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e2) { /* nothing left to try */ }
    t.remove();
  }
  asklink.classList.add('done');
  setTimeout(() => asklink.classList.remove('done'), 900);
});

function openFromUrl() {
  const p = new URLSearchParams(location.search);
  const nodeId = p.get('node') || p.get('build'), askId = p.get('ask'), q = p.get('q');

  /* `?mode=build`, or the shorthand `?build=<id>`. The flag is set BEFORE the
     tiers run and the arrival routes through `buildFrom`, so a keyword link
     seeds Build with whatever that keyword resolved to — the alternative,
     switching the mode first, would hide the map with nothing built yet. */
  buildOnArrive = p.get('mode') === 'build' || p.has('build');

  if (nodeId && byId[nodeId]) {
    const n = byId[nodeId];
    if (buildsNow()) { buildOnArrive = false; buildFrom(n); return; }
    light(n); focus(n);
    const kind = p.get('kind');
    if (kind && n.kinds && !n.sats) toggleKinds(n);
    followK = ASK_ZOOM; touched = true; wake(0.4);
    return;
  }
  if (askId && byId[askId]) { askQuestion(byId[askId]); return; }
  if (q) {
    /* the same tiers Enter walks, so a shared link and a typed line land in
       the same place — including the offer, when the map has no answer */
    if (goToNamed(q)) return;
    const hit = ASKABLE.filter(x => questionScore(x, meat(q).concat(
      q.toLowerCase().split(/\s+/).filter(Boolean))) > 0);
    const exact = ASKABLE.find(x => x.text.toLowerCase() === q.toLowerCase());
    if (exact) { askQuestion(exact); return; }
    const mine = nearestMine(q);
    if (mine) {
      if (buildsNow()) { buildOnArrive = false; buildFrom(mine); }
      else restoreGraft(mine);
      return;
    }
    if (hit.length) { askQuestion(hit[0]); return; }
    if (goToMatch(q)) return;
    askIn.value = q;
    semanticGo(q).then(ok => {
      if (ok) return;
      if (extendOff) miss();
      offerBuild(q);       /* the offer stands in both modes; buildOnArrive
                              is still set, so accepting it builds */
    });
  }
}

document.getElementById('reset').addEventListener('click', resetHighlight);
start();
openFromUrl();
</script>
