<!DOCTYPE html>
<!-- Bio 101 node graph — typed nodes, typed ranked edges, and the scale
     ladder as a first-class axis. docs/Biology-Node-Graph.md is the design;
     graphdata.js is the content (two units: water, proteins, plus the
     macromolecule bridges).

     THE CANVAS HAS SEMANTIC AXES, and that is the design:

       * X is explanatory order, computed by topological layering over the
         directed edge types. Chemistry prerequisites sit far left,
         consequences right, so every causal arrow points rightward and
         reading direction IS explanation direction.
       * Y is the scale ladder. Leveled nodes sit in horizontal bands
         (molecule low, ecosystem high) aligned with the gutter ruler;
         concepts, which have no level, settle at the mean of their
         neighbours. part-of edges therefore run vertically and causal
         edges horizontally — the doc's two axes are the screen's two.
       * The layout is BAKED from the data, identical every load, so
         spatial memory can form. The relax only resolves overlaps; it
         never invents position.

     THE WHOLE MAP EXISTS FROM LOAD; exploration is light, not creation.
     Unvisited nodes render as dim marks — fog of war — and clicking
     illuminates. A theme lights its instances and a unit lights its
     chapter; no reveal special cases. A focused card offers its neighbours grouped
     by direction (why · so what · contrast — the doc's direction of
     learning), and arrow keys walk rank-1 edges with the camera.

     Kept from the composer, as technique only: the card design language,
     the scale()/zoom split, pan/drag/pin, focus dimming. -->

<style>
  /* kodo.css owns the paper, the palette and the chrome. What is left here is
     the map: one colour it needs that the site does not have, and the whole of
     the canvas. */
  :root {
    /* the extension door: a blue that belongs to no unit, so it reads as a
       kind of question rather than as a region */
    --ext: #2f5fb5;
  }

  /* THE MAP IS THE WHOLE WINDOW. Nothing scrolls: pan and zoom are the only
     ways through it, and a scrollbar appearing means a node escaped the world. */
  html, body { height: 100%; }
  body {
    font-family: var(--font-display);
    background: var(--surface-page);
    color: var(--text-strong);
    margin: 0;
    overflow: hidden;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- chrome --------------------------------------------------------- */

  /* kodo.css's `.btn` is the sketchbook's drawn rectangle. The map's is a
     quiet micro-cap chip, so it is stated in full rather than modified. */
  .btn {
    font-family: var(--font-display); font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    background: var(--surface-card); border: 1px solid var(--border-hair); border-radius: 3px;
    padding: 0.45rem 0.75rem; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .btn:hover { color: var(--accent); border-color: var(--accent); }
  .btn.on { color: var(--paper); background: var(--accent); border-color: var(--accent); }

  /* ---- the mode switch -------------------------------------------------
     Two readings of the same data — the baked map, and one grown a click at
     a time from a seed card — so it is one control with two halves rather
     than two buttons. Bottom left, opposite the ask bar's own line. */
  .modes {
    position: fixed; left: clamp(1rem, 3vw, 2rem); bottom: 1.1rem; z-index: 8;
    display: flex; gap: 2px; padding: 2px;
    background: var(--surface-card); border: 1px solid var(--border-hair); border-radius: 999px;
  }
  .modes .mode {
    font-family: var(--font-display); font-size: 0.62rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    background: none; border: 0; border-radius: 999px;
    padding: 0.4rem 0.85rem; cursor: pointer;
    transition: color .15s, background .15s;
  }
  .modes .mode:hover { color: var(--accent); }
  .modes .mode.on { color: var(--paper); background: var(--accent); }

  /* BUILD's y is a fan slot, not the scale ladder, so the ruler and the band
     lines would both be lying. The ask bar and the highlight read the baked
     map and reach cards that are not built, so they go with them. */
  body.building .gutter, body.building .band,
  body.building #hilitewrap { display: none; }

  /* THE BEAT. For the moment the question is alone on the paper, the graph it
     opened is held back and then arrives with the camera — the composer's
     intro, which is the reason its reveal reads as a reveal rather than a
     zoom. `!important` because focus writes an opacity on every card as an
     inline style, and an inline style wins any class. */
  body.building .node, body.building #edges { transition: opacity .55s ease; }
  body.building.intro .node:not(.seed) { opacity: 0 !important; }
  body.building.intro #edges { opacity: 0; }
  /* AND THE GRAPH ARRIVES IN ORDER, nearest the seed first. A wave that lands
     at once is a picture appearing; one that lands in reading order is the
     graph being built, which is the whole claim of the mode. The delay is per
     element, so this is one class and a `transition-delay`. */
  body.building .node.arriving { opacity: 0 !important; }
  body.building #edges path, body.building #edges polygon,
  body.building #edges text { transition: opacity .5s ease; }

  /* the map is dragged, never read as a document: a pan that leaves a blue
     smear of selected labels behind it looks like a broken gesture. The ask
     bar and the lesson modal are outside #canvas and keep their selection. */
  #canvas {
    position: fixed; inset: 0; cursor: grab; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #canvas.panning { cursor: grabbing; }
  /* geometricPrecision: #world is zoomed above k=1, and whole-pixel glyph
     advances rewrap headings as k moves. */
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0;
           text-rendering: geometricPrecision; -webkit-text-size-adjust: none; }
  #edges { position: absolute; overflow: visible; pointer-events: none; }
  #edges text {
    font-family: var(--font-display); font-size: 10px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    fill: var(--muted); opacity: 0; transition: opacity .18s;
    paint-order: stroke; stroke: var(--paper); stroke-width: 3px;
  }
  #edges text.on { opacity: 0.95; }
  #edges line.band { stroke: #eeebe2; stroke-width: 1; }

  /* the highlight picker. A native <select> cannot carry a unit's colour, and
     that colour is the whole point of the unit rows, so the menu is ours and
     the <select> stays as the value: every reader of hiliteSel.value and every
     `change` listener is untouched. */
  .hilite { position: relative; margin-right: 0.9rem; }
  .hilite select { display: none; }
  .hbtn {
    font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.04em;
    color: var(--ink); background: var(--surface-card);
    border: 1px solid var(--border-hair); border-radius: 3px;
    padding: 0.35rem 0.55rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.5rem; min-width: 9rem;
    transition: border-color .15s;
  }
  .hbtn:hover, .hilite.open .hbtn { border-color: var(--accent); }
  .hbtn .hlabel { flex: 1; text-align: left; }
  .hbtn .caret { color: var(--muted); font-size: 0.7rem; line-height: 1; }
  .hdot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    display: inline-block;
  }
  .hmenu {
    position: absolute; top: calc(100% + 0.35rem); right: 0; z-index: 20;
    min-width: 13rem; max-height: 62vh; overflow-y: auto;
    background: var(--surface-card); border: 1px solid var(--border-hair); border-radius: 3px;
    box-shadow: 0 14px 34px -12px rgba(20, 22, 26, .28);
    padding: 0.25rem 0;
  }
  .hmenu[hidden] { display: none; }
  /* the rule rides on the heading, so every group is divided from what is
     above it and the first one is divided from the `all` row */
  .hmenu .hgroup {
    font-family: var(--font-display); font-size: 0.52rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    padding: 0.55rem 0.7rem 0.25rem;
    border-top: 1px solid var(--border-hair); margin-top: 0.3rem;
  }
  .hmenu .hopt {
    font-family: var(--font-ui); font-size: 0.72rem; color: var(--ink);
    display: flex; align-items: center; gap: 0.5rem; width: 100%;
    background: none; border: 0; text-align: left; cursor: pointer;
    padding: 0.32rem 0.7rem;
  }
  .hmenu .hopt:hover { background: var(--paper); }
  .hmenu .hopt[aria-selected="true"] { color: var(--accent); }

  /* ---- highlight ------------------------------------------------------
     A reading of the map's own shape, laid over the fog. Only MARKS respond:
     an open card is already making its own case, and focus outranks this
     entirely, so the two dimming systems never fight. */
  body.highlighting:not(.focusing) .node.unlit { opacity: 0.28; }
  body.highlighting:not(.focusing) .node.unlit.hi { opacity: 1; }
  body.highlighting:not(.focusing) .node.card.unlit.hi {
    background: var(--surface-card); border-color: var(--border-hair);
  }
  body.highlighting:not(.focusing) .node.card.unlit.hi .name {
    font-size: 0.92em; color: var(--ink); font-weight: 600;
  }
  /* a highlighted theme is the query itself, so it reads as the source */
  body.highlighting:not(.focusing) .node.theme.unlit.hi {
    background: var(--ink); border-style: solid; border-color: var(--ink);
    color: var(--paper);
  }

  /* ---- the ask bar -----------------------------------------------------
     The extension questions live here instead of on the map, so this is the
     only way to reach one. Bottom centre: the masthead holds the readings of
     the map, and this is the reader's own line. */
  .askbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: clamp(1rem, 3vh, 1.8rem); z-index: 8;
    width: min(34rem, calc(100vw - 8rem));
    transition: transform .55s cubic-bezier(.4, 0, .2, 1);
  }
  /* BUILD WITH NOTHING IN IT IS A PROMPT, so the reader's own line is the page
     rather than a strip along the bottom of one. Moved by TRANSFORM, not by
     `top`: `bottom: auto` cannot be interpolated and the bar would jump. */
  body.building.empty .askbar {
    transform: translate(-50%, calc(-50vh + 3.2rem));
  }
  /* a pill, because the field is a line of speech and not a form control.
     The shadow arrives on focus rather than sitting there: it is what lifts
     the bar off the map for the moment the reader is in it. */
  .askrow {
    display: flex; align-items: stretch;
    background: var(--surface-card); border: 1px solid var(--border-hair); border-radius: 999px;
    box-shadow: 0 6px 18px -14px rgba(20, 22, 26, .3);
    transition: border-color .15s, box-shadow .2s;
  }
  .askbar:focus-within .askrow {
    box-shadow: 0 16px 38px -16px rgba(20, 22, 26, .34);
  }
  .askbar:focus-within .askrow, .askbar.open .askrow { border-color: var(--ext); }
  /* a miss is said by the bar rather than by an alert: the fuzzy match is not
     built yet, and a dead Enter with no answer reads as a broken field */
  .askbar.miss .askrow { border-color: var(--spark); }
  #askinput {
    flex: 1; min-width: 0; font-family: var(--font-editorial); font-size: 1rem;
    color: var(--ink); background: none; border: 0; outline: none;
    padding: 0.6rem 0.4rem 0.6rem 1.15rem;
  }
  /* the placeholder is a QUESTION being offered, not a label, so it carries
     the extension door's italic and steps back in colour */
  #askinput::placeholder { color: var(--muted); font-style: italic; opacity: 1; }
  .askcaret {
    display: flex; align-items: center;
    font-size: 0.85rem; color: var(--muted); line-height: 1;
    background: none; border: 0;
    padding: 0 1rem 0 0.5rem; cursor: pointer; transition: color .15s;
  }
  .askcaret:hover { color: var(--ext); }
  /* OUTSIDE THE FIELD, not in it. The caret belongs to the input — it opens
     what the field searches — and this does not: it acts on the map. Round,
     and off the end of the row, so the two are not read as a pair of controls
     on one bar. */
  .asklink {
    position: absolute; left: calc(100% + 0.6rem); bottom: 0;
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem;
    background: var(--surface-card); border: 1px solid var(--border-hair);
    color: var(--muted); cursor: pointer;
    box-shadow: 0 14px 34px -18px rgba(20, 22, 26, .3);
    transition: color .15s, border-color .15s, background .15s;
  }
  .asklink:hover { color: var(--ext); border-color: var(--ext); }
  .asklink.done { background: var(--ext); border-color: var(--ext); color: var(--surface-card); }
  /* A generated card wears its provenance. Same shape as a card so it reads in
     the same glance, dashed so it never reads as one. */
  .node.card.made {
    border-style: dashed; border-color: var(--ext);
    background: color-mix(in srgb, var(--ext) 4%, var(--surface-card));
  }
  .node.card.made .name { color: var(--ext); }
  /* THE READER'S OWN QUESTION, ON THE MAP. It is the reason everything under
     it exists, so it reads at the asked-extension size — and dashed, in the
     same blue, because it is no more authored than the cards it produced. */
  .node.question.made {
    border-style: dashed; border-color: var(--ext);
    background: color-mix(in srgb, var(--ext) 4%, var(--surface-card));
  }
  .tag.made { color: var(--ext); border-color: color-mix(in srgb, var(--ext) 35%, transparent); }
  /* a generated EDGE is dashed too: the claim it makes was not authored either */
  #edges path.made { stroke-dasharray: 5 4; }

  /* the same primary pill a concept wears for its lesson, in the extension
     blue: the map's one filled control, and this is the same kind of act */
  .askbuild {
    font-family: var(--font-display); font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--surface-card); background: var(--ext);
    border: 1px solid transparent; border-radius: 999px;
    padding: 0.62em 1.15em; margin-left: 0.7rem;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 8px 22px -9px rgba(20, 22, 26, 0.6);
    transition: background .15s;
  }
  .askbuild:hover { background: var(--ink); }


  /* A GUESS SAYS SO. The semantic fallback cannot tell a real question it has
     no good answer for from a query about pizza — measured, not assumed — so
     an arrival it produced is labelled rather than presented as a lookup. */
  /* THE BAR SPEAKS IN THE MAP'S OWN VOICE. Everything above the field — a
     closest match, a graft's bridge note, the offer, "building" — is the map
     talking to the reader, so it is set in the serif the cards use and at a
     size that is read rather than squinted at. It sits above a 1rem field and
     under nothing, and it was losing to both at 0.68. */
  .asknote {
    font-family: var(--font-editorial); font-size: 1.15rem; line-height: 1.35;
    letter-spacing: -0.01em; color: var(--ink);
    text-align: center; padding: 0 0.2rem 0.55rem;
  }
  .asknote[hidden] { display: none; }
  .asknote em { font-style: italic; color: var(--ext); }
  /* the offer is one sentence and an action, so they share a line */
  .asknote.offer {
    display: flex; align-items: center; justify-content: center;
    gap: 0.2rem; padding-bottom: 0.6rem;
  }
  .askbar.thinking .askrow { border-color: var(--ext); }
  .askbar.thinking #askinput { opacity: 0.5; }

  .asklist {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 0.4rem);
    max-height: 46vh; overflow-y: auto;
    background: var(--surface-card); border: 1px solid var(--border-hair); border-radius: 3px;
    box-shadow: 0 14px 34px -12px rgba(20, 22, 26, .28);
    padding: 0.25rem 0;
  }
  .asklist[hidden] { display: none; }
  .askgroup {
    font-family: var(--font-display); font-size: 0.52rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    padding: 0.55rem 0.7rem 0.25rem;
    border-top: 1px solid var(--border-hair); margin-top: 0.3rem;
  }
  .asklist .askgroup:first-child { border-top: 0; margin-top: 0; }
  .askopt {
    font-family: var(--font-editorial); font-size: 0.85rem; color: var(--ink);
    display: block; width: 100%; text-align: left;
    background: none; border: 0; cursor: pointer; padding: 0.34rem 0.7rem;
  }
  /* the same italic blue the door wears on the map, so a row and the card it
     produces are recognisably the same object */
  .askopt.ext { font-style: italic; color: var(--ext); }
  /* the reader's own question, dashed the way the cards it made are dashed */
  .askopt.mine { border-left: 2px dashed var(--ext); padding-left: 0.55rem; }
  .askopt:hover, .askopt.on { background: var(--paper); }

  /* ---- the scale gutter ------------------------------------------------
     No longer a legend: a RULER. Each rung is pinned to its band's world
     y, repositioned on every pan and zoom, so the label and the cards at
     that scale are always level with each other. */
  .gutter {
    position: fixed; left: clamp(0.9rem, 2vw, 1.6rem); top: 0; bottom: 0;
    z-index: 5; pointer-events: none; user-select: none;
  }
  .gutter .rung {
    position: absolute; transform: translateY(-50%);
    display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;
    font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: #c9c5ba; transition: color .18s;
  }
  .gutter .rung i {
    width: 14px; height: 2px; background: var(--border-hair); flex: none;
    transition: background .18s, width .18s;
  }
  .gutter .rung.on { color: var(--ink); }
  .gutter .rung.on i { background: var(--tint, var(--accent)); width: 22px; }
  .gutter .rung .how {
    font-size: 0.52rem; color: var(--spark); letter-spacing: 0.1em;
    margin-left: 0.15rem;
  }
  .gutter .rung:not(.on) .how { display: none; }

  /* ---- nodes ----------------------------------------------------------- */

  /* the cursor says whether there is anything left to reach: zoom-in only on
     a node that is still fogged AND still has a dark neighbour. An opened
     card has nothing left to open, and a walked-out corner of the map stops
     promising more. `canexpand` is recomputed in measure(). */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    user-select: none;
    border-radius: 4px;
    transition: border-color .15s, box-shadow .15s, opacity .18s;
  }
  .node.dragging { cursor: grabbing; box-shadow: 0 10px 26px rgba(20,22,26,.12); }

  .node.card {
    width: 17.5rem;
    padding: 0.85rem 1rem 0.9rem;
    background: var(--surface-card);
    border: 1px solid var(--border-hair);
    text-align: left;
  }
  .node.card .name {
    font-size: 0.6rem; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 0.4rem;
  }
  /* the dot is the UNIT; chemistry nodes wear the cross-subject tint */
  .node.card .name::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--dot, var(--border-hair)); flex: none;
  }
  .node.card .claim {
    font-family: var(--font-editorial); font-size: 1rem; line-height: 1.28;
    color: var(--ink); margin-top: 0.35rem; letter-spacing: -0.005em;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* 4:3 and a RATIO on purpose (the composer's rule): the card sets the
     width, the picture follows, so the closed thumb and the open one are
     the same frame at two sizes. The `.ph` shimmer is the loading state
     until the stage mounts; a still of the last frame stands in when the
     pool takes the context back. */
  /* SCOPED TO `.node`, NOT `.node.card`: a question is not a card, and when
     one gained a lesson every rule here missed it — the raw 1600px still laid
     out at its natural size and the door became eleven hundred pixels tall. */
  .node .thumb {
    position: relative; overflow: hidden;
    width: 100%; aspect-ratio: 4 / 3; margin: 0.65rem 0 0.25rem;
    background: #eceae4; border: 1px solid var(--border-hair); border-radius: 3px;
  }
  .node .thumb .ph {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      #eceae4 30%, #f6f4ef 48%, #eceae4 66%) 0 0 / 300% 100%;
    animation: thumb-shimmer 1.5s linear infinite;
  }
  @keyframes thumb-shimmer { to { background-position: -300% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .node .thumb .ph { animation: none; }
  }
  .node .thumb.mounted { background: #f2f0ea; }
  .node .thumb.mounted .ph { display: none; }
  .node .thumb > canvas { display: block; width: 100%; height: 100%; }
  /* -webkit-user-drag: a thumb belongs to its card, and Safari's native image
     drag would otherwise peel the picture off under a pan */
  .node .thumb .still {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; -webkit-user-drag: none;
  }
  .node.unlit .thumb { display: none; }

  /* a video's credit: printed, small, and the only outbound link on a card */
  .node.card .credit {
    font-size: 0.55rem; letter-spacing: 0.06em; color: var(--muted);
    margin-top: 0.3rem;
  }
  .node.card .credit a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--border-hair); }
  .node.card .credit a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .node.card.unlit .credit { display: none; }
  /* a poster fills its frame; the generated stills are 16:9 in a 4:3 thumb */
  .node .thumb .still.poster { object-fit: cover; }

  .node.canexpand { cursor: zoom-in; }
  /* the word the cursor is already saying, for whoever does not read cursors */
  #expandtip {
    position: fixed; top: 0; left: 0; z-index: 9; pointer-events: none;
    font-family: var(--font-display); font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    background: var(--surface-card); border: 1px solid var(--border-hair); border-radius: 3px;
    padding: 0.24rem 0.42rem;
    box-shadow: 0 6px 16px -10px rgba(20, 22, 26, .5);
  }
  #expandtip[hidden] { display: none; }

  .node.card .tags {
    display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem;
  }
  /* em, not rem: a tag shows through the fog on specimen and content marks,
     so it has to ride the mark's counter-scale the way the name does. Left
     in rem it stayed 8px and rendered at five on screen. */
  .node.card .tag {
    font-size: 0.52em; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--border-hair); border-radius: 2px;
    padding: 0.14em 0.34em;
  }
  .node.card .tag.chem   { color: #8a5cc0; border-color: #ded2ef; }

  /* ---- type carried by form, not by a tag ------------------------------ */
  /* every card is opaque — paper, not transparent — so an edge line never
     runs under its text; only the WHITE ground is reserved for structures */
  .node.card.concept { background: var(--paper); border-color: transparent; }
  .node.card.concept:hover,
  .node.card.concept.hub { background: var(--surface-card); border-color: var(--border-hair); }
  .node.card.chem { background: var(--paper); border: 1px dashed #cdbfe3; }
  /* evidence is an experiment, not a claim: card ground, and a rule down the
     left the way a process wears one */
  .node.card.evidence { border-left: 3px solid var(--dot, var(--border-hair)); }
  .node.card .tag.eviD { color: var(--dot, var(--accent)); border-color: currentColor; }
  .node.card.process { border-left: 3px solid var(--dot, var(--border-hair)); }
  .node.card.process .name .run {
    color: var(--dot, var(--muted)); font-weight: 600; margin-right: 0.05rem;
  }

  /* THE PILL IS A NODE, so it is a node's shape: sitting on the paper below
     the card it belongs to, with the question written on it. It is the only
     rounded thing on the map, which is what makes opening one feel like an
     event rather than another chip. */
  .node.askpill {
    padding: 0.4rem 0.9rem; border-radius: 999px; cursor: pointer;
    background: var(--surface-card); border: 1px solid var(--dot, var(--accent));
    color: var(--dot, var(--accent));
    font-family: var(--font-display); font-size: 0.62rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    box-shadow: 0 6px 18px -10px rgba(20,22,26,.35);
    transition: background .15s, color .15s;
  }
  .node.askpill:hover { background: var(--dot, var(--accent)); color: var(--surface-card); }

  /* a revealed kind: a small card, no dot, no chips. It is a leaf and it
     says so by being visibly lighter than the card it hangs off. */
  .node.card.satellite {
    width: 13rem; padding: 0.6rem 0.75rem;
    background: var(--surface-card); border-color: var(--border-hair);
    box-shadow: 0 6px 18px -12px rgba(20,22,26,.3);
  }
  .node.card.satellite .name { font-size: 0.55em; }
  .node.card.satellite .name::before { width: 0.6em; height: 0.6em; }
  .node.card.satellite .claim {
    font-size: 0.8em; line-height: 1.3; -webkit-line-clamp: 4;
  }

  /* ---- a specimen card -------------------------------------------------
     The composer's, verbatim in spirit: the concept card inverted. Name
     serif and leading, claim demoted to a caption, provenance quiet and
     tabular, EC class as the tag. No dot. */
  .node.card.specimen .name {
    font-family: var(--font-editorial); font-size: 1.1rem; line-height: 1.2;
    font-weight: 400; letter-spacing: -0.01em; text-transform: none;
    color: var(--ink); display: block;
  }
  .node.card.specimen .name::before { display: none; }
  .node.card.specimen .claim {
    font-family: var(--font-ui); font-size: 0.72rem; line-height: 1.4;
    color: var(--muted); margin-top: 0.5rem; letter-spacing: 0;
    -webkit-line-clamp: 3;
  }
  .node.card.specimen .thumb { margin-top: 0.55rem; }
  .node.card.specimen .prov {
    font-family: var(--font-ui); font-size: 0.63rem; line-height: 1.35;
    color: #9a9ca3; margin-top: 0.35rem;
    font-variant-numeric: tabular-nums;
  }
  .node.card.specimen .tag {
    display: inline-flex; align-items: baseline; gap: 0.4rem;
    margin-top: 0.3rem; border: 0; padding: 0;
    font-family: var(--font-display); font-size: 0.56em; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
  }
  .node.card.specimen .tag span {
    letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .node.card.unlit .prov { display: none; }

  /* ---- a content card: a film or a lesson ------------------------------
     The specimen card's shape. Its opener is the card's whole purpose, so
     it does NOT fade with the rest of a card's controls. */
  .node.card.content { width: 15rem; }
  .node.card.content .name {
    font-family: var(--font-editorial); font-size: 1.05rem; line-height: 1.2;
    font-weight: 400; letter-spacing: -0.01em; text-transform: none;
    color: var(--ink); display: block;
  }
  .node.card.content .name::before { display: none; }
  .node.card.content .tag {
    display: inline-block; margin-top: 0.4em;
    font-size: 0.52em; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--border-hair); border-radius: 2px; padding: 0.14em 0.34em;
  }
  .node.card.content .thumb { margin-top: 0.55rem; }
  .node.card.content .opens { margin-top: 0.5rem; }
  .node.card.content .opener { opacity: 1; pointer-events: auto; }

  /* ---- A LESSON OUTRANKS EVERYTHING AROUND IT --------------------------
     The lessons are the featured work and a film is somebody else's, so the
     lesson card is the loudest thing on the paper: wider, its name at the
     size of a claim, a rule down the left in its own region's tint, and an
     opener that is filled rather than outlined. It is the only solid button
     on the map, which is the whole point of a call to action. */
  .node.card.content.lesson {
    width: 19rem;
    border-color: var(--border-hair);
    border-left: 3px solid var(--dot, var(--accent));
    box-shadow: 0 10px 30px -14px rgba(20, 22, 26, 0.3);
  }
  .node.card.content.lesson .name { font-size: 1.4em; line-height: 1.16; }
  .node.card.content.lesson .tag {
    color: var(--dot, var(--accent)); border-color: currentColor;
  }
  .node.card.content.lesson .claim {
    font-family: var(--font-editorial); font-size: 0.82em; line-height: 1.34;
    color: var(--muted); margin-top: 0.5em;
  }
  .node.card.content.lesson .opener {
    background: var(--dot, var(--accent)); color: var(--surface-card);
    border-color: transparent; padding: 0.5em 0.85em; font-size: 0.6em;
    box-shadow: none;
  }
  .node.card.content.lesson .opener:hover {
    background: var(--ink); color: var(--surface-card); border-color: transparent;
  }
  /* fogged, a lesson still reads as the biggest mark in its neighbourhood:
     white ground and its region's rule, against everything else's bare text.
     Back to max-content, though — the open card's 19rem left half the mark
     as empty paper. */
  .node.card.content.lesson.unlit {
    width: max-content;
    border-left: 3px solid var(--dot, var(--accent));
    background: var(--surface-card);
  }
  .node.card.content.lesson.unlit .name { font-size: 0.95em; }
  /* THE TAG SURVIVES THE FOG. Everything else on a content card is withheld
     like any other mark, but a fogged film with its tag hidden is bare serif
     text and reads as one more concept: the one thing a reader needs from
     across the map is that this is a film, or a lesson. */
  .node.card.content.unlit .name { display: inline; }
  .node.card.content.unlit .tag { margin: 0 0 0 0.45rem; vertical-align: 0.12em; }
  .node.card.content.unlit .opens { display: none; }

  /* THE BUTTON IS `.opener`, NOT `.lesson`. A content card wears its kind as
     a class, so a lesson card was itself `.lesson` — which the pointerdown
     guard read as "that is a button, do not start a drag". The card could
     then never be lit or focused, and while it stayed unlit its opener was
     display:none. Nothing to click, and clicking did nothing. The name is
     also just truer: this button opens a film as often as a lesson. */
  .node .opener {
    font-family: var(--font-display); font-size: 0.55rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); cursor: pointer;
    background: var(--surface-card); border: 1px solid var(--border-hair); border-radius: 3px;
    padding: 0.3rem 0.5rem; box-shadow: 0 5px 16px -8px rgba(0,0,0,.4);
    transition: opacity .18s ease, color .15s, border-color .15s;
  }
  .node .opener:hover { color: var(--ink); border-color: var(--ink); }

  /* THE PRIMARY PILL. When the lesson had its own card, that card was the
     loudest thing on the paper and its filled button was the only solid one
     on the map. The lesson now rides its concept, so the pill inherits that
     job: filled, in the concept's own region tint, pill-shaped so it reads
     as an action rather than one more tag. It is the concept card's whole
     call to action, so unlike the other controls it does not fade on a card
     that is merely open rather than focused. */
  .node .opener.primary {
    background: var(--dot, var(--accent)); color: var(--surface-card);
    border-color: transparent; border-radius: 999px;
    padding: 0.45em 0.95em; font-size: 0.58rem; font-weight: 500;
    opacity: 1; pointer-events: auto;
    box-shadow: 0 6px 18px -8px rgba(20, 22, 26, 0.55);
  }
  .node .opener.primary:hover {
    background: var(--ink); color: var(--surface-card); border-color: transparent;
  }
  /* fogged, a card is a mark: no thumb, no claim, and no button either */
  .node.unlit > .opens { display: none; }
  .node > .opens { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }

  /* a card's controls belong to the card being WORKED ON: everywhere else
     they are faded, not removed, so nothing reflows on focus. The composer
     gates on apparent size; here the focused card is the one being worked
     on, which is simpler and the same idea.

     THE TWO EXCLUSIONS ARE OPENERS THAT ARE THE CARD'S WHOLE PURPOSE, not
     controls on it: the lesson pill (`.primary`) and a film card's play
     button (`.content`, which sets its own `opacity: 1` above). Both are
     written as exclusions here rather than as louder rules elsewhere —
     every one of those selectors ties this one on specificity, so whichever
     came later in the file silently won. */
  .node:not(.hub) .pbox-rep,
  .node:not(.hub) .pbox-play,
  .node:not(.hub):not(.content) .opener:not(.primary),
  .node:not(.hub) .mb-dims { opacity: 0; pointer-events: none; }

  /* a hub reads bigger before it is clicked: five or more rank-1 edges */
  .node.card.big { width: 22rem; }
  .node.card.big .claim { font-size: 1.2rem; line-height: 1.24; -webkit-line-clamp: 5; }

  /* AN EXPERIMENT IS ONLY EVER IN A FAN NOW, so it is sized for the fan and
     not for a column. An experiment's claim is what it DID, and there is no
     shorter way to say heavy nitrogen or a labelled phage: Photograph 51 ran
     to five lines at card width and lost the sentence that matters. The fan
     has room in x, which is the axis this map is roomy in. */
  .node.card.evidence { width: 21.5rem; }
  .node.card.evidence .claim { -webkit-line-clamp: 5; }

  /* the open card steps up one size, not to a poster: there is no picture
     to make room for yet, so the growth only has to say "you are here" */
  .node.hub { box-shadow: 0 14px 34px -12px rgba(20,22,26,.22); }
  .node.card.hub { width: 21rem; padding: 1.05rem 1.2rem 1.1rem; }
  .node.card:not(.content):not(.specimen).hub .claim {
    font-size: 1.2rem; line-height: 1.24; margin-top: 0.45rem;
    letter-spacing: -0.008em; -webkit-line-clamp: 6;
  }
  .node.card:not(.content):not(.specimen).hub .name { font-size: 0.64rem; letter-spacing: 0.19em; }
  .node.card.big.hub { width: 24rem; }
  .node.card.big.hub .claim { font-size: 1.35rem; }
  /* a content or specimen card is already at the size its own kind sets, so
     focusing one must not step it up again: the card would resize under the
     click that opened it. */
  .node.card.content.hub,
  .node.card.specimen.hub { padding: 0.85rem 1rem 0.9rem; box-shadow: none; }
  .node.card.specimen.hub { width: 17.5rem; }
  .node.card.content.hub { width: 15rem; }
  .node.card.content.lesson.hub {
    width: 19rem; box-shadow: 0 10px 30px -14px rgba(20, 22, 26, 0.3);
  }

  .node.theme {
    width: 20rem; padding: 1.15rem 1.35rem 1.2rem;
    background: var(--ink); border: 1px solid var(--ink);
    color: var(--paper); text-align: center;
  }
  .node.theme .name {
    font-family: var(--font-editorial); font-size: 1.35rem; line-height: 1.15;
    letter-spacing: -0.015em;
  }
  .node.theme .claim {
    font-family: var(--font-ui); font-size: 0.72rem; color: #b6b2a8;
    margin-top: 0.4rem;
  }

  /* an anchoring question is a door, and it reads at door size: well above
     the card claim, ink, never fogged. Not TWICE it any more — at 2rem over
     26rem a door held a moat the map could not afford, and a question read
     as important by the paper around it rather than by what it opens. */
  .node.question {
    width: 22rem;
    padding: 0.7rem 0.9rem;
    background: var(--paper);
    border: 1px solid transparent;
    font-family: var(--font-editorial); font-size: 1.6rem; line-height: 1.16;
    letter-spacing: -0.015em; color: var(--ink);
    text-align: center;
  }
  /* A BRIDGING QUESTION IS A SMALLER DOOR. An anchor opens a unit and should
     be findable from across the map; a bridging one joins two units already
     in view, so it reads at the scale of the cards it sits between rather
     than competing with the unit it is inside. Narrower too, or a short
     question sets one enormous line. */
  .node.question.bridging, .node.question.extension {
    width: 19rem; max-width: 19rem;
    font-size: 1.25rem; line-height: 1.2; letter-spacing: -0.008em;
    color: var(--muted);
  }
  /* AN EXTENSION DOOR OPENS ONTO A FAN, not onto a claim, so it is marked as
     a different act rather than a smaller one: italic and blue, a colour no
     unit owns. Clicking it deals the kinds of the card it answers into. */
  .node.question.extension { font-style: italic; }
  /* AN ASKED QUESTION IS THE LOUDEST THING ON THE MAP. In the bar it is one
     row of many; on the map it is the reason everything around it is open, so
     it arrives at twice the size it reads at in the list. Wider with it, or
     two and a half rem sets a tall narrow column beside a small card. */
  .node.question.extension.asked {
    font-size: 2.5rem; line-height: 1.1; letter-spacing: -0.02em;
    width: 30rem; max-width: 30rem;
  }
  .node.question.unlit.extension.asked { max-width: 30rem; }
  /* a fogged question is sized by max-content against a max-width, so the
     narrower cap has to be restated here or the fog rule's 26rem wins */
  .node.question.unlit.bridging,
  .node.question.unlit.extension { max-width: 19rem; }
  .node.question.hub {
    width: 24rem; padding: 0.9rem 1rem 0.95rem;
  }

  /* THE SEED QUESTION IS THE GRAPH'S TITLE. In Build the first card is the
     thing the reader asked and everything on screen is there because of it, so
     it is set as a heading rather than dealt as a card: no ground, no border,
     and large enough that nothing beside it competes. Restated past the focus,
     hover and extension rules, every one of which repaints a question. */
  body.building .node.question.seed,
  body.building .node.question.extension.seed,
  body.building .node.question.seed:hover,
  body.building .node.question.extension.seed:hover,
  body.building.focusing .node.question.seed.lit,
  body.building.focusing .node.question.extension.seed.lit {
    width: 32rem; max-width: 32rem; padding: 0.2rem 0.8rem;
    /* THE PAPER, NOT NOTHING. A transparent heading lets the edge leaving it
       draw straight through the words — it leaves at the box's centre, which
       is the middle line of the text. */
    background: var(--paper); border-color: transparent; box-shadow: none;
    font-family: var(--font-editorial); font-size: 3.4rem; line-height: 1.06;
    letter-spacing: -0.025em; font-style: normal;
    color: var(--ink); text-align: left;
  }

  /* ---- fog of war ------------------------------------------------------
     An unlit node is a MARK: dot and name on the paper, claim withheld.
     The map's shape is always visible; its content is earned by walking
     to it. Same element, so lighting never relayouts the world. */
  /* a mark's ground hugs its title — the full card width would blank out
     edges far beyond the text it is protecting */
  .node.card.unlit {
    background: var(--paper); border-color: transparent;
    width: max-content;
  }
  .node.card.unlit .claim, .node.card.unlit .tags { display: none; }
  .node.card.unlit.process { border-left-color: transparent; }
  .node.theme.unlit {
    background: var(--paper); border: 1px dashed var(--border-hair); color: var(--ink);
    width: max-content;
  }
  /* A MARK IS A MAP LABEL. Below k=1 it counter-scales, so a name stays the
     size the reader is actually looking at while the card it will become
     scales with the rest of the world. Everything inside a mark is sized in
     em off `--markk` so the ground, the dot and the tracking follow the
     name instead of being left behind by it. The cap is why the labels do
     not eventually eat the map: full compensation at k=0.18 would stack
     them on top of each other, and past ~0.4 a label may shrink. */
  .node.card.unlit, .node.theme.unlit {
    font-size: calc(1rem * var(--markk, 1));
    padding: 0.85em 1em 0.9em;
  }
  .node.card.unlit .name { font-size: 0.6em; }
  .node.card.unlit .name::before { width: 0.7em; height: 0.7em; }
  /* an evidence card is an EXPERIMENT, so its dot IS a flask: the mark says
     how we know before the name is read. The disc replaces the unit dot
     rather than sitting beside it, and everything is em so it follows a
     mark's counter-scale like every other dot. The glyph is knocked out in
     the ground the card stands on, which is paper on a mark and card once
     the node is lit. Sits after the unlit rule, which sizes the dot too. */
  .node.card.evidence .name::before { display: none; }
  .node.card.evidence .name .flask {
    flex: none; font-size: 0.95em; width: 1.75em; height: 1.75em;
    border-radius: 50%; background: var(--dot, var(--border-hair));
    color: var(--paper); line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .node.card.evidence:not(.unlit) .name .flask { color: var(--surface-card); }
  /* a mark's name is already 2.4x, so the same em would give a 38px disc.
     This holds the flask at the same ratio to the dot it replaces. */
  .node.card.evidence.unlit .name .flask { font-size: 0.65em; }
  .node.theme.unlit .name { font-size: 1em; }
  .node.theme.unlit .claim { display: none; }
  .node.question.unlit { width: max-content; max-width: 22rem; }
  /* a mark hovers the way a question does: card ground, line border, ink */
  .node.card.unlit:hover,
  .node.theme.unlit:hover,
  .node.question.unlit:hover {
    background: var(--surface-card); border-color: var(--border-hair); border-style: solid;
  }
  /* a focused card's neighbours present themselves: a mark in the hops
     takes the card ground, so the offer reads as an offer rather than as
     fog that happens to be near */
  .focusing .node.card.unlit.lit {
    background: var(--surface-card); border-color: var(--border-hair);
  }
  .focusing .node.theme.unlit.lit {
    background: var(--surface-card); border-style: solid; border-color: var(--border-hair);
  }

  /* the focused card's neighbour groups: the direction of learning */
  .node .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem; }
  .node .chips:empty { display: none; }
  .chip {
    font-family: var(--font-display); font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
    background: var(--surface-card); border: 1px solid #cfdcd7; border-radius: 2px;
    padding: 0.28rem 0.5rem; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.contrast { color: var(--spark); border-color: #f2cdbd; }
  .chip.contrast:hover { border-color: var(--spark); }
  .node.question .chips { justify-content: center; }
  /* a question that holds a lesson: the picture and the pill sit under the
     words, centred like the chips, and the type comes down because a 2rem
     question over a screenshot is a poster rather than a card */
  .node.question .thumb { margin-top: 0.8rem; }
  .node.question > .opens { justify-content: center; margin-top: 0.6rem; }
  .node.question.haslesson { font-size: 1.5rem; }
  .node.question.haslesson.lit { background: var(--surface-card); border-color: var(--border-hair); }
  .node.theme .chip { background: transparent; }

  .node:hover { border-color: var(--accent); }
  .node.question:hover { background: var(--surface-card); border-color: var(--border-hair); color: var(--ink); }

  /* the number is DIM.out in the script; this is its fallback */
  .focusing .node { opacity: var(--dim-out, 0.18); pointer-events: none; }
  .focusing .node.lit { opacity: 1; pointer-events: auto; }
  .focusing .node.hop2 { opacity: 1; }
  .focusing .node.question.lit {
    background: var(--surface-card); border-color: var(--border-hair); color: var(--ink);
  }
  /* the blue is the extension door's identity, so it outlives hover and
     focus — both of which repaint a question in ink. Stated after them
     rather than at the type rule, which they would otherwise win. */
  .node.question.extension,
  .node.question.extension:hover,
  .focusing .node.question.extension.lit { color: var(--ext); }
  .node.question.extension:hover { border-color: var(--ext); }
  /* the generated question's dashed blue outline, restated past the focus and
     hover rules that repaint every question's border in --line */
  .node.question.made,
  .node.question.made:hover,
  .focusing .node.question.made.lit {
    border-style: dashed; border-color: var(--ext);
    background: color-mix(in srgb, var(--ext) 4%, var(--surface-card));
  }

  /* ---- the lesson, over the map (kit/modal.js reads this markup) ------- */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(0.75rem, 2.5vw, 2rem);
  }
  .modal[hidden] { display: none; }
  .modal .mback {
    position: absolute; inset: 0;
    background: rgba(20, 22, 26, 0.55);
    animation: mfade .2s ease-out;
  }
  .modal .mcard {
    position: relative;
    display: flex; flex-direction: column; min-height: 0;
    width: min(1280px, 100%); height: min(860px, 100%);
    background: var(--surface-card); border-radius: 6px; overflow: hidden;
    box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .5);
    animation: mrise .24s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes mfade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes mrise { from { opacity: 0; transform: translateY(12px) scale(.99) }
                     to   { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) {
    .modal .mback, .modal .mcard { animation: none; }
  }
  .modal .mhead {
    flex: none; display: flex; align-items: center; gap: 1rem;
    padding: 0.7rem 0.6rem 0.7rem 1.1rem;
    border-bottom: 1px solid var(--border-hair);
  }
  .modal .mhead > span:first-child {
    flex: 1;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .modal .mclose {
    font-family: var(--font-display); font-size: 1.35rem; line-height: 1;
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 0.2rem 0.5rem;
  }
  .modal .mclose:hover { color: var(--ink); }
  /* Safari sizes a flex iframe from its intrinsic 300x150, not the free
     space, so the height is stated and min-height:0 lets it shrink. */
  #lessonframe { flex: 1 1 auto; width: 100%; height: 100%; min-height: 0;
                 border: 0; display: block; }

  /* ---- a 3D model, over the map ---------------------------------------
     Somebody else's viewer in an iframe, so this modal owns none of what is
     inside it: no camera, no snapshot, no theme, no pause. Dark like the
     film's card, because the model arrives lit and paper around it fights
     the lighting. Its credit sits in the header for the same reason the
     film's does — the work is not ours and the header has to say so. */
  .modal.model .mcard { background: #0e0f11; width: min(1400px, 100%);
                        height: auto; max-height: min(820px, 100%); }
  .modal.model .mhead { border-bottom-color: rgba(255,255,255,.12); }
  .modal.model .mhead > span:first-child { color: #f2f0ea; }
  .modal.model .mclose { color: rgba(242,240,234,.6); }
  .modal.model .mclose:hover { color: #fff; }
  .modal.model .credit {
    font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(242,240,234,.55);
  }
  .modal.model .credit a { color: rgba(242,240,234,.75);
                           text-decoration-color: rgba(242,240,234,.3); }
  .modal.model .credit a:hover { color: #f4f2ec; text-decoration-color: currentColor; }
  /* The aspect box the iframe is measured by: Safari sizes a flex iframe
     from its intrinsic 300x150 and the viewer would collapse to a strip. */
  .modal.model .mbody { position: relative;
                        flex: 1 1 auto; min-height: 0; aspect-ratio: 16 / 9; }
  #modelframe { width: 100%; height: 100%; border: 0; display: block; }
  /* THE SAME PICTURE THE CARD SHOWED, held over the frame until the viewer
     says it has something to draw. Half a megabyte of geometry takes tens of
     seconds on a first visit, and the embed paints BLACK for all of it — a
     reader who clicked a picture of a mitochondrion and got a black rectangle
     has been told the thing is broken. */
  .modal.model .mcover {
    position: absolute; inset: 0; background: #0e0f11 center/cover no-repeat;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 2.2rem;
    transition: opacity .45s ease-out; pointer-events: none;
  }
  .modal.model .mcover b {
    font-weight: 400;
    font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(242,240,234,.75);
    background: rgba(14,15,17,.6); padding: 0.35rem 0.7rem; border-radius: 3px;
    animation: mpulse 1.6s ease-in-out infinite;
  }
  @keyframes mpulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
  .modal.model .mbody.ready .mcover { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .modal.model .mcover b { animation: none; }
  }

  /* ---- the video, over the map (ported from tests/question-composer.html) */
  /* A VIDEO is 16:9 and a lesson is a sheet, so the card sizes to the content
     rather than the two sharing one box with the wrong shape for one of them.
     Black behind it: the letterbox belongs to the film, not to the paper. */
  .modal.video .mcard { background: #0e0f11; }
  .modal.video .mhead { border-bottom-color: rgba(255,255,255,.12); }
  .modal.video .mhead > span:first-child { color: #f2f0ea; }
  .modal.video .mclose { color: rgba(242,240,234,.6); }
  .modal.video .mclose:hover { color: #fff; }
  .modal.video .credit {
    font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(242,240,234,.55);
  }
  /* THE VIDEO SETS THE HEIGHT and the column scrolls inside it. `.mcues` has
     `overflow-y`, which zeroes its automatic minimum size, so 19 cues do not
     drag the card taller than the picture — and `max-height` is what stops a
     wide window from pushing the header off the top of the screen. */
  .modal.video .mcard { width: min(1400px, 100%); height: auto;
                        max-height: min(820px, 100%); }
  /* The column is ABSOLUTE so it cannot size the row. A row flex container
     takes its cross-axis height from the tallest item's content, and 19 cues
     are taller than the picture — which held the card at its max height with a
     band of dead black under the video. Out of flow, the video is the only
     thing left to measure, so the card hugs it and the cues scroll in the gap
     the margin leaves. */
  .modal.video .mbody { position: relative; flex: 1; min-height: 0;
                        overflow: hidden; }
  .modal.video .mvideo { margin-right: 24rem; }
  /* ---- our own player chrome -------------------------------------------
     `controls=0` takes YouTube's bar away, and on its own that is not enough:
     the title, the logo and the share button still fade in over the picture on
     hover, which is the covering-the-science problem again in another form. So
     the frame takes no pointer events at all and everything below is ours. The
     cost is real and paid on purpose: fullscreen and the native scrubber are
     gone, so we owe the reader a replacement for each. */
  .modal.video .mstage { position: relative; }
  .modal.video #videoframe, .modal.video #videoframe iframe { pointer-events: none; }
  .modal.video .mtap {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  /* A SCRIM, not a picture. Mid-video this stands in front of YouTube's
     paused overlay for the half second it takes to fade, and throwing the
     title card over a 0:41 scene would be its own wrong. `.first` is the
     pre-play state, where the poster IS the right image and the frame behind
     it has nothing in it yet. */
  .modal.video .mcover {
    position: absolute; inset: 0; pointer-events: none;
    background-color: rgba(14, 15, 17, .96);
    background-position: center; background-size: cover;
    background-repeat: no-repeat;
    opacity: 0; transition: opacity .18s ease;
  }
  .modal.video .mcover.first { background-color: #0e0f11; }
  .modal.video .mcard.covered .mcover { opacity: 1; }

  /* The paused mark, centred. Only while paused, so a playing video is picture
     and nothing else. */
  .modal.video .mbig {
    position: absolute; left: 50%; top: 50%; width: 3.4rem; height: 3.4rem;
    transform: translate(-50%, -50%); pointer-events: none;
    border-radius: 50%; background: rgba(14,15,17,.5);
    border: 1px solid rgba(255,255,255,.7);
    opacity: 0; transition: opacity .18s ease;
  }
  .modal.video .mbig::after {
    content: ''; position: absolute; left: 56%; top: 50%;
    transform: translate(-50%, -50%);
    border: 0.62rem solid transparent; border-left: 1rem solid #fff;
  }
  /* Only while the cover is up. After that YouTube draws its own glyph on a
     pause, and two play marks over one frame is worse than either. */
  .modal.video .mcard.covered .mbig { opacity: 1; }

  .modal.video .mctl {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.55rem 0.9rem 0.7rem;
  }
  .modal.video .mctl button {
    flex: none; width: 1.1rem; height: 1.1rem; padding: 0;
    background: none; border: 0; cursor: pointer; position: relative;
  }
  .modal.video .mplay::before {
    content: ''; position: absolute; left: 2px; top: 50%;
    transform: translateY(-50%);
    border: 0.42rem solid transparent; border-left: 0.62rem solid rgba(242,240,234,.75);
  }
  /* Two bars, drawn from one element and its border, so pause needs no glyph. */
  .modal.video .mcard.playing .mplay::before {
    border: 0; width: 0.28rem; height: 0.82rem; left: 1px;
    background: rgba(242,240,234,.75);
    box-shadow: 0.42rem 0 0 rgba(242,240,234,.75);
  }
  .modal.video .mctl button:hover::before { border-left-color: #fff; background-color: #fff; }
  .modal.video .mfull::before {
    content: ''; position: absolute; inset: 2px;
    border: 1px solid rgba(242,240,234,.75); border-radius: 1px;
  }
  .modal.video .mfull:hover::before { border-color: #fff; }
  .modal.video .mtime {
    flex: none; font-family: var(--font-display); font-size: 0.6rem;
    letter-spacing: 0.06em; color: rgba(242,240,234,.75);
    font-variant-numeric: tabular-nums;
  }
  .modal.video .mtime.dim { color: rgba(242,240,234,.4); }
  /* Padded above and below so the 2px line is a 14px hit target: a scrubber
     the reader has to aim at is one they will miss. */
  .modal.video .mbar {
    flex: 1; height: 2px; cursor: pointer;
    background: rgba(255,255,255,.16);
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    background-clip: padding-box;
  }
  .modal.video .mbar i {
    display: block; height: 100%; width: 0; background: var(--spark);
  }

  /* `height: auto` is load-bearing: the IFrame API stamps width="640"
     height="360" ATTRIBUTES on the iframe it builds, and a presentational
     height beats `aspect-ratio` — the player came out 1030x356 in a box that
     wanted 1030x579. */
  #videoframe, #videoframe iframe {
    display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border: 0;
  }

  /* ---- the caption column ----------------------------------------------
     The reason this modal is not simply a 16:9 box. YouTube's own captions
     burn over the picture, and these videos PRINT their key terms on screen —
     the caption lands on top of the word it is explaining. So captions are off
     in the player and the text is here, beside it, where it can also be longer
     than a caption line and clickable. */
  .modal.video .mside {
    position: absolute; inset: 0 0 0 auto; width: 24rem;
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid rgba(255,255,255,.1);
  }
  /* TWO TRACKS, and which one is showing is a fact about whose words these
     are. The source under the switch is not decoration: the narration is the
     video author's writing carried across, and a column of it with no name on
     it reads as ours. */
  .modal.video .mtracks {
    flex: none; display: flex; align-items: center; gap: 0.35rem;
    padding: 0.7rem 1rem 0.6rem;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .modal.video .mtracks button {
    font-family: var(--font-display); font-size: 0.55rem; letter-spacing: 0.14em;
    text-transform: uppercase; cursor: pointer;
    color: rgba(242,240,234,.45);
    background: none; border: 1px solid rgba(255,255,255,.14);
    border-radius: 3px; padding: 0.3rem 0.5rem;
    transition: color .15s, border-color .15s;
  }
  .modal.video .mtracks button:hover { color: rgba(242,240,234,.8); }
  .modal.video .mtracks button[aria-pressed="true"] {
    color: #f4f2ec; border-color: rgba(255,255,255,.45);
  }
  .modal.video .mtracks .src {
    margin-left: auto;
    font-family: var(--font-display); font-size: 0.55rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(242,240,234,.35);
  }
  /* Underlined rather than coloured: the column is already two greys and a
     lit line, and a third colour here would read as another state. */
  .modal.video .mtracks .src a,
  .modal.video .credit a {
    color: inherit; text-decoration: underline;
    text-underline-offset: 2px; text-decoration-color: rgba(242,240,234,.3);
  }
  .modal.video .mtracks .src a:hover,
  .modal.video .credit a:hover { color: #f4f2ec; text-decoration-color: currentColor; }
  .modal.video .mcues {
    flex: 1; min-height: 0;
    margin: 0; padding: 0.6rem 0 1.2rem; list-style: none;
    overflow-y: auto; overscroll-behavior: contain;
  }
  /* SERIF, and larger than a caption. This column is the only running prose
     on the page a reader actually reads through, several sentences at a time
     against a dark ground — which is what Literata is for and what a 0.78rem
     system-ui was fighting. The timecode and the step number stay in `--sans`
     below: those are labels, not prose. */
  .modal.video .mcues li {
    display: flex; gap: 0.7rem; align-items: baseline;
    padding: 0.6rem 1.1rem; cursor: pointer;
    color: rgba(242,240,234,.45);
    font-family: var(--font-editorial); font-size: 1.2rem; line-height: 1.6;
    transition: color .18s ease;
  }
  .modal.video .mcues li:hover { color: rgba(242,240,234,.72); }
  /* Not a cue: no padding, no hover, no pointer. Its height is set from JS. */
  .modal.video .mcues li.pad { padding: 0; pointer-events: none; }
  /* The lit line is the only one at full strength, so the column can be read
     at a glance without hunting for where the video is. */
  .modal.video .mcues li.on { color: #f4f2ec; }
  .modal.video .mcues li.on .at { color: var(--spark); }
  .modal.video .mcues .at {
    flex: none; width: 2.4rem;
    font-family: var(--font-display); font-size: 0.62rem; letter-spacing: 0.06em;
    color: rgba(242,240,234,.35);
  }
  /* A step number ties the line to the lesson's own ten, which is the same
     numbering glycolysis-lab teaches. */
  .modal.video .mcues .st {
    flex: none; font-family: var(--font-display); font-size: 0.55rem;
    letter-spacing: 0.1em; color: rgba(242,240,234,.3);
  }
  /* Narrow: the column goes back into flow, under the video. */
  @media (max-width: 900px) {
    .modal.video .mbody { display: flex; flex-direction: column;
                          overflow-y: auto; }
    .modal.video .mvideo { margin-right: 0; }
    .modal.video .mside { position: static; width: auto; flex: 1 1 auto;
                          border-left: 0;
                          border-top: 1px solid rgba(255,255,255,.1); }
  }

  .hint {
    position: fixed; right: clamp(1rem, 3vw, 2rem); bottom: 1.1rem; z-index: 5;
    font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted);
  }
</style>

<body>

<header class="sitenav floating">
  <a class="mark" href="/"><img src="/kodolab-wordmark.svg" alt="kodolab"></a>
  <span class="crumb">Biology</span>
  <span class="spacer"></span>
  <div class="hilite" id="hilitewrap">
    <button type="button" class="hbtn" id="hilitebtn"
            aria-haspopup="listbox" aria-expanded="false">
      <span class="hdot" id="hilitedot" hidden></span>
      <span class="hlabel" id="hilitelabel">all</span>
      <i class="ph-bold ph-caret-down caret" aria-hidden="true"></i>
    </button>
    <div class="hmenu" id="hilitemenu" role="listbox" hidden></div>
    <select id="hilite">
      <option value="">all</option>
      <!-- one option per unit, appended at load from UNITS -->
      <optgroup label="by unit" id="hiliteunits"></optgroup>
      <optgroup label="by weight">
        <option value="carries">what carries the map</option>
        <option value="through">most paths through</option>
        <option value="degree">most connections</option>
        <option value="bridge">bridges between units</option>
        <option value="all">all of the above</option>
      </optgroup>
      <!-- one option per theme, appended at load from the data -->
      <optgroup label="by theme" id="hilitethemes"></optgroup>
    </select>
  </div>
  <button class="btn" id="reset">Reset</button>
</header>

<nav class="gutter" id="gutter" aria-label="scale ladder"></nav>

<div id="canvas">
  <div id="world">
    <svg id="edges" width="1" height="1"></svg>
  </div>
</div>

<div class="hint" id="hint"></div>
<div id="expandtip" hidden>expand</div>

<!-- Map reads the baked graph. Build grows one out of a seed card. -->
<div class="modes" id="modes" role="group" aria-label="how the graph is drawn">
  <button type="button" class="mode on" data-mode="map">Map</button>
  <button type="button" class="mode" data-mode="build">Build</button>
</div>

<!-- the ask bar: every question on the map is reachable from here, and the
     extension ones are reachable ONLY from here -->
<div class="askbar" id="askbar">
  <div class="asklist" id="asklist" role="listbox" hidden></div>
  <div class="asknote" id="asknote" hidden></div>
  <div class="askrow">
    <input id="askinput" type="text" autocomplete="off" spellcheck="false"
           aria-label="ask a question of the map">
    <button type="button" class="askcaret" id="askcaret"
            aria-label="all the questions"><i class="ph-bold ph-caret-down" aria-hidden="true"></i></button>
  </div>
  <button type="button" class="asklink" id="asklink"
          aria-label="copy a link to what is open" title="copy a link to this card">
    <i class="ph-bold ph-link" aria-hidden="true"></i>
  </button>
</div>

<!-- The lesson, over the map. The iframe is empty until it opens and emptied
     on close: a lesson is its own WebGL context and about a megabyte of
     trajectory, and neither should be paid by a reader who never opened it. -->
<div id="lessonmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="lessontitle">
    <div class="mhead">
      <span id="lessontitle">the lesson</span>
      <button class="mclose" aria-label="Close">&times;</button>
    </div>
    <iframe id="lessonframe" title="lesson" allow="fullscreen"></iframe>
  </div>
</div>

<!-- The video, over the map. A SECOND modal rather than the lesson's with a
     different src: the two share nothing but the word "opens". A lesson is a
     page we own, sized as a sheet, carrying its own chrome; a video is 16:9,
     somebody else's, and its header has to say whose. kit/modal.js stacks
     them, which is what it was built for. -->
<div id="videomodal" class="modal video" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="videotitle">
    <div class="mhead">
      <span id="videotitle">the video</span>
      <span id="videocredit" class="credit"></span>
      <button class="mclose" aria-label="Close">&times;</button>
    </div>
    <div class="mbody">
      <!-- A PLACEHOLDER, not the player. YouTube's IFrame API replaces this
           node with its own iframe, and destroying the player takes that
           iframe with it — which is what stops playback and ends the
           third-party connection when the card closes. `mount()` puts a fresh
           placeholder back. With no API (offline, blocked), `plain()` writes a
           bare iframe here instead and the column simply does not follow. -->
      <div class="mvideo">
        <div class="mstage">
          <div id="videoframe"></div>
          <!-- A PAUSED player draws YouTube's own overlay: title, avatar,
               "More videos", logo. pointer-events stops the HOVER chrome and
               not that one, so the poster covers the frame whenever the video
               is not running. It doubles as the loading state. -->
          <div class="mcover"></div>
          <!-- OUR click target. The frame below it is pointer-events:none, so
               YouTube's hover chrome never appears over the picture; this is
               what gives the click back. -->
          <button type="button" class="mtap" id="videotap" aria-label="Play or pause"></button>
          <span class="mbig" aria-hidden="true"></span>
        </div>
        <div class="mctl">
          <button type="button" class="mplay" id="videoplay" aria-label="Play"></button>
          <span class="mtime" id="videotime">0:00</span>
          <div class="mbar" id="videobar"><i></i></div>
          <span class="mtime dim" id="videodur">0:00</span>
          <button type="button" class="mfull" id="videofull" aria-label="Fullscreen"></button>
        </div>
      </div>
      <div class="mside">
        <div class="mtracks" id="videotracks"></div>
        <ol class="mcues" id="videocues"></ol>
      </div>
    </div>
  </div>
</div>

<!-- A 3D model somebody else hosts. A THIRD modal, and the iframe is built
     on show and removed on hide: the embed is a second WebGL context in a
     document we do not control, so it exists only while it is being looked
     at. Nothing is fetched from sketchfab.com until this opens. -->
<div id="modelmodal" class="modal model" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="modeltitle">
    <div class="mhead">
      <span id="modeltitle">the model</span>
      <span id="modelcredit" class="credit"></span>
      <button class="mclose" aria-label="Close">&times;</button>
    </div>
    <div class="mbody" id="modelbody"></div>
  </div>
</div>

<script>
'use strict';

const { UNITS, CHEM_TINT, LADDER, NODES, EDGES } = GraphData;

/* ---- graph ------------------------------------------------------------- */

const world = document.getElementById('world');
const svg = document.getElementById('edges');
const NS = 'http://www.w3.org/2000/svg';

const nodes = [], byId = {};
let links = [];                 /* reassigned when a card's kinds collapse */
for (const spec of NODES) {
  const n = { ...spec, deg: 0 };
  nodes.push(n); byId[n.id] = n;
}
for (const [from, type, to, rank] of EDGES) {
  const a = byId[from], b = byId[to];
  if (!a || !b) { console.warn('edge names a missing node:', from, type, to); continue; }
  links.push({ a, b, type, rank });
  a.deg++; b.deg++;
}

/* ---- how do we know ------------------------------------------------------
   EVIDENCE IS A DESTINATION AND IT WAS TAKING SEATS. Seven experiment cards
   are seven leaves with one edge each, and a leaf's y target IS its
   neighbour's — so the four DNA experiments were all aimed at one point
   beside `dna-structure` and stacked there, in the busiest columns on the
   map. They come off before layout the way an extension question does, and
   arrive from a pill on the claim they settle.

   ONLY `type: 'evidence'` LEAVES. `point-mutation evidence-for nat-select`
   and the three `evidence-for endosymbiosis` edges come from real concept
   cards that are stations in their own right; the edge type is not what
   decides this, the node type is. */
const EVIDENCE = new Map();          /* host id → the experiments that settle it */
const EVIDENCE_HOST = new Map();     /* experiment id → its host, for the search */
const EVIDENCE_NAME = new Map();    /* experiment id → its name, for the same */
const evidenceName = id => EVIDENCE_NAME.get(id) || null;
{
  const ev = nodes.filter(n => n.type === 'evidence');
  for (const e of ev) {
    const l = links.find(k => (k.a === e || k.b === e) && k.type === 'evidence-for');
    const host = l && (l.a === e ? l.b : l.a);
    if (!host) { console.warn('evidence supports nothing:', e.id); continue; }
    if (!EVIDENCE.has(host.id)) EVIDENCE.set(host.id, []);
    EVIDENCE.get(host.id).push(e);
    EVIDENCE_HOST.set(e.id, host);
    EVIDENCE_NAME.set(e.id, e.name);
  }
  /* the degree was counted when the edges were built, and degree sizes hubs */
  for (const l of links)
    if (l.a.type === 'evidence' || l.b.type === 'evidence') { l.a.deg--; l.b.deg--; }
  links = links.filter(l => l.a.type !== 'evidence' && l.b.type !== 'evidence');
  for (const e of ev) { nodes.splice(nodes.indexOf(e), 1); delete byId[e.id]; }
}

/* ---- the deferred doors -------------------------------------------------
   AN EXTENSION QUESTION IS NOT ON THE MAP. It is a query, and a query has no
   seat: it arrives at whatever it asked about and leaves with it. So the node
   and its `answers` edge are pulled out here, BEFORE layout — they are
   authored in graphdata.js like anything else, and `anchorId` is all that
   survives into the page. Leaving them in cost nothing visible and moved
   every neighbour they repelled. */
const QUERIES = nodes.filter(n => n.type === 'question' && n.qtype === 'extension');
for (const q of QUERIES) {
  const answers = links.filter(l => (l.a === q || l.b === q) && l.type === 'answers');
  const best = answers.sort((a, b) => a.rank - b.rank)[0];
  q.anchorId = best ? (best.a === q ? best.b.id : best.a.id) : null;
  q.anchorRank = best ? best.rank : 2;      /* Build re-makes this edge */
  if (!q.anchorId) console.warn('extension question answers nothing:', q.id);
  /* the degree was counted when the edge was built, and degree sizes hubs —
     so give it back, or every extension's answer reads one link heavier */
  for (const l of links) if (l.a === q || l.b === q) { l.a.deg--; l.b.deg--; }
  links = links.filter(l => l.a !== q && l.b !== q);
  nodes.splice(nodes.indexOf(q), 1);
}

const neighbours = n => links.flatMap(l => l.a === n ? [l.b] : l.b === n ? [l.a] : []);
const linksOf = n => links.filter(l => l.a === n || l.b === n);

/* MAP or BUILD. Build draws the same nodes and the same edges from its own
   positions, so the relax, the measuring and the edge painting all have to
   run over what is BUILT rather than over the whole map — everything else is
   display:none and would be repelling cards it cannot be seen next to. */
let mode = 'map';
const built = new Set();
const buildNodes = [], buildLinks = [];
const active = () => mode === 'build' ? buildNodes : nodes;
const activeLinks = () => mode === 'build' ? buildLinks : links;

/* RANK IS AUTHORED AND NEVER REWRITTEN. It draws the edge, orders a fan for
   the walk, and sizes a hub, so a node that rewrites it is falsifying all
   three. Reachability is a separate claim and gets its own field: `spine`
   is rank 1 plus, for a node whose best edge is rank 2 or 3, that best edge,
   so nothing on the map is unreachable by a rank-1 walk. Doing
   this by promoting rank was what erased the map's only rank-3 edge — vdw
   part-of rgroup-inter, and rank 3 is exactly the claim it wants to make. */
for (const l of links) l.spine = l.rank === 1;
for (const n of nodes) {
  const mine = linksOf(n);
  if (!mine.length) { console.warn('orphan node:', n.id); continue; }
  const best = Math.min(...mine.map(l => l.rank));
  if (best > 1) for (const l of mine) if (l.rank === best) l.spine = true;
}

/* hub weight is read from the data: five rank-1 edges is the soft budget,
   so a card at or past it is by definition a mechanism hinge */
for (const n of nodes)
  n.big = linksOf(n).filter(l => l.rank === 1).length >= 5;

/* ---- content: what a card can show --------------------------------------
   graphcontent.js is optional — the map is a working page without it. A
   node mounts its best-ranked inline item and no more: a live box is a
   WebGL context and the pool rations four across the whole map. */
const CONTENT = (window.GraphContent || {}).CONTENT || [];
const PLACED = new Map(((window.GraphContent || {}).PLACEMENTS || []));
const BY_CONTENT = new Map(CONTENT.map(c => [c.id, c]));
/* INLINE rides the node: a molbox, a water sim, a builder or a ribbon IS the
   card's own subject drawn, so it belongs in the card's thumb. A LESSON IS
   INLINE TOO, and it is the one that wins the thumb — it arrives as a
   screenshot rather than a live box, so the old objection (two live things
   competing for one thumb, which is what glycolysis carried) is gone, and
   what a reader wants from a concept that HAS a lesson is the lesson.
   CARD is the other kind: a film is somebody else's object and keeps its
   own card, the way a specimen does. */
const INLINE = { water: 1, build: 1, molbox: 1, protein: 1, lesson: 1, model: 1 };
/* the kinds whose thumb is a PICTURE rather than a live box, and whose card
   therefore carries an opener under it. Both arrive as a still, so neither
   competes with the pool of four for a WebGL context. */
const SHOT = { lesson: 1, model: 1 };
const CARD = { video: 1 };
const ON_NODE = new Map();
for (const [cid, ranks] of PLACED) {
  if (cid.startsWith('p:')) continue;          // specimens: their own pass below
  const item = BY_CONTENT.get(cid);
  if (!item) { console.warn('placement names missing content:', cid); continue; }
  if (CARD[item.kind]) continue;               // its own card: the pass below
  for (const [nid, rank] of Object.entries(ranks)) {
    if (!byId[nid]) { console.warn('placement names missing node:', cid, nid); continue; }
    (ON_NODE.get(nid) || ON_NODE.set(nid, []).get(nid)).push({ item, rank });
  }
}
/* rank first, then a lesson ahead of a live box at the same rank: `folding`
   places both at 1, and the tie has to break the same way every load or the
   card's face depends on source order. */
for (const list of ON_NODE.values())
  list.sort((a, b) => a.rank - b.rank ||
                      (SHOT[b.item.kind] || 0) - (SHOT[a.item.kind] || 0));

for (const c of CONTENT)
  if (SHOT[c.kind] && !c.shot) console.warn(c.kind + ' has no shot:', c.id);

/* a card mounts its best-ranked INLINE item and no more; a specimen carries
   its own render, because a card that IS content does not look it up */
/* the lesson or model a concept holds, if any — the opener under its thumb */
const openerFor = n => {
  const placed = (ON_NODE.get(n.id) || []).find(x => SHOT[x.item.kind]);
  return placed ? placed.item : null;
};
/* THE LESSON specifically, which is a narrower question than "does this card
   open something". Our own work is lit at load and is searchable by the stem
   of its href; a model is borrowed, has no href, and stays in the fog. */
const lessonFor = n => {
  const placed = (ON_NODE.get(n.id) || []).find(x => x.item.kind === 'lesson');
  return placed ? placed.item : null;
};

const viewFor = n => {
  if (n.type === 'specimen') return { kind: 'protein', protein: n.protein, variant: n.variant };
  const placed = (ON_NODE.get(n.id) || []).filter(x => INLINE[x.item.kind]);
  return placed.length ? placed[0].item : null;
};


/* ---- specimens ----------------------------------------------------------
   Spawned from proteins/proteins.js, the registry of what we hold — a `p:`
   placement says WHERE one hangs and WHICH STRUCTURE it hangs there. The
   card prints only what `read` carries (the baker's half), so it cannot
   claim what a re-bake no longer holds. The edge is instance-of, which is
   also what places a specimen one column right of the concept it
   exemplifies.

   `p:<key>` takes the registry's default variant; `p:<key>@<variant>` names
   one. An exemplar has to be able to show the thing it is an exemplar OF —
   hexokinase demonstrates induced fit, and its default is the OPEN form,
   which is the state induced fit has not happened in yet. One card per
   protein either way: the node id is the key, never the variant. */
const SPEC = (window.ProteinLib && window.ProteinLib.PROTEINS) || [];
const specKey = id => id.slice(2).split('@')[0];
const specWant = id => id.slice(2).split('@')[1] || null;
for (const id of PLACED.keys())
  if (id.startsWith('p:') && !SPEC.some(p => p.key === specKey(id)))
    console.warn('placement names no such protein:', id);
for (const p of SPEC) {
  const ids = [...PLACED.keys()].filter(k => k.startsWith('p:') && specKey(k) === p.key);
  if (ids.length > 1) console.warn(p.key + ': placed more than once, using ' + ids[0]);
  const row = PLACED.get(ids[0]);
  if (!row) continue;                          // unplaced: not on the map yet
  const want = specWant(ids[0]);
  const asked = want && p.variants.find(x => x.id === want);
  if (want && !asked) console.warn(ids[0] + ': no such variant, using the default');
  const v = asked || p.variants.find(x => x.default) || p.variants[0];
  const ribbon = v && (v.bake ? v.bake.trace : v.read && v.read.baked);
  if (!ribbon) { console.warn(p.key + ': no baked ribbon'); continue; }
  const ec = v.read.ec || null;
  const cls = ec ? (ProteinLib.EC_CLASS || [])[Number(ec.split('.')[0])] : null;
  const n = {
    id: 'p:' + p.key, type: 'specimen', level: 2, unit: 'proteins', deg: 0,
    name: p.name, claim: p.blurb, does: p.does,
    protein: p.key, variant: v.id,
    species: v.species, method: v.read.method,
    residues: v.read.residues, declared: v.read.declared,
    ec, ecClass: cls ? cls[0] : null, ecDoes: cls ? cls[1] : null,
  };
  nodes.push(n); byId[n.id] = n;
  /* A PLACEMENT MAY NAME ITS EDGE. `instance-of` is right for an exemplar and
     wrong for a protein that carries the explanation: rubisco does not
     instantiate carbon fixation, it ENABLES it, and instance-of is BACKWARD —
     typed the default way, the reaction would have sat left of the enzyme
     that runs it, and photorespiration would have lost its only parent.
     `['enables', 1]` in place of a bare rank, defaulting to what it was. */
  for (const [nid, spec] of Object.entries(row)) {
    const m = byId[nid];
    if (!m) { console.warn('specimen placed on missing node:', n.id, nid); continue; }
    const [type, rank] = Array.isArray(spec) ? spec : ['instance-of', spec];
    links.push({ a: n, b: m, type, rank, spine: rank === 1 });
    n.deg++; m.deg++;
  }
}

/* ---- content cards ------------------------------------------------------
   A film and a lesson are their own objects, so each is its own card, the
   same shape as a specimen. `illustrates` is BACKWARD, which puts the card
   one column right of what it illustrates — the concept is the station, the
   film is the thing hanging off it. No level: a film is not at a scale, so
   it settles at its neighbours' y like any levelless node. */
for (const [cid, ranks] of PLACED) {
  const item = BY_CONTENT.get(cid);
  if (!item || !CARD[item.kind]) continue;
  const n = { ...item, type: 'content', deg: 0 };
  nodes.push(n); byId[n.id] = n;
  for (const [nid, rank] of Object.entries(ranks)) {
    const m = byId[nid];
    if (!m) { console.warn('content placed on missing node:', n.id, nid); continue; }
    /* the card wears the tint of the FIRST region it illustrates, so a lesson
