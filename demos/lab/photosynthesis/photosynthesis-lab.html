<!doctype html>
<html lang="en" data-lab-theme="green">
<head>
  <meta charset="utf-8">
  <!-- Served at /labs/… by a vercel.json rewrite, which does not move the file:
       relative paths and module imports resolve against this folder either way. -->
  <base href="/demos/lab/photosynthesis/">
  <script defer src="/demos/lib/site.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floating Leaf Disks</title>
<!-- seo: written by demos/tools/seo.js; edit its PAGES table, not these lines -->
<meta name="description" content="The floating leaf disk lab in 3D: vacuum spinach disks in bicarbonate, shine a lamp, and time how fast photosynthesis floats them back up with oxygen.">
<link rel="canonical" href="https://www.kodolab.org/labs/leaf-disks">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kodolab">
<meta property="og:url" content="https://www.kodolab.org/labs/leaf-disks">
<meta property="og:title" content="Floating Leaf Disks">
<meta property="og:description" content="The floating leaf disk lab in 3D: vacuum spinach disks in bicarbonate, shine a lamp, and time how fast photosynthesis floats them back up with oxygen.">
<meta name="twitter:card" content="summary">
<!-- /seo -->
  <script src="../page.js" data-text="text.js"></script>  <!-- import map, fonts, icons, lab.css, the words (text.js) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section class="panel data-panel" id="dataPanel" hidden>
      <div class="panel-head">
        <span class="panel-title"><i class="ph ph-chart-line-up"></i><span data-t="panel.title"></span></span>
        <span class="clock" id="clock">00:00</span>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="swatch sw-a"></span>
          <div>
            <div class="stat-label" data-t="panel.cupA"></div>
            <div class="stat-val"><b id="cntA">0</b><span class="of-floating"></span></div>
          </div>
        </div>
        <div class="stat">
          <span class="swatch sw-b"></span>
          <div>
            <div class="stat-label" data-t="panel.cupB"></div>
            <div class="stat-val"><b id="cntB">0</b><span class="of-floating"></span></div>
          </div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <div class="speed" id="speed">
        <span><i class="ph ph-fast-forward"></i><span data-t="panel.time"></span></span>
        <button data-s="1" class="on">1×</button>
        <button data-s="2">2×</button>
        <button data-s="4">4×</button>
      </div>
      <div class="result" id="result" hidden></div>
    </section>

  </div>
  <script>LabPage.chrome()</script>

  <script type="module" async src="intro-art.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
