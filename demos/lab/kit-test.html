<!doctype html>
<html lang="en" data-lab-theme="indigo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kit scene in a lab</title>
  <script src="page.js"></script>
  <style>
    .kit-test { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
      display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-radius: 999px;
      background: rgba(255,255,255,.92); box-shadow: 0 6px 24px rgba(0,0,0,.12); font: 14px/1.2 var(--font, system-ui); }
    .kit-test input[type=range] { width: 320px; }
    .kit-test output { min-width: 13em; }
    .bg-cell { background: #eef0f7; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>LabPage.chrome()</script>
  <div class="kit-test">
    <button id="mode" type="button">Meiosis</button>
    <input id="t" type="range" min="0" max="1" step="0.01" value="0">
    <output id="phase"></output>
  </div>
  <script type="module" src="kit-test.js"></script>
</body>
</html>
