<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Props</title>
  <script src="page.js"></script>  <!-- import map, fonts, icons, lab.css -->
  <style>
    .catalog { top: 76px; left: var(--gutter); width: 300px; max-height: calc(100% - 96px); overflow: auto; padding-bottom: 10px; }
    .catalog ul { list-style: none; margin: 0; padding: 0 8px 4px; }
    .catalog li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13.5px; }
    .catalog li:hover, .catalog li.on { background: rgba(255,255,255,.8); box-shadow: inset 0 0 0 1px var(--line); }
    .catalog code { font: 500 11.5px 'JetBrains Mono', monospace; color: var(--muted); }
    .catalog h3 { margin: 10px 18px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    #btnSketch.on { background: var(--accent); color: #fff; }
    @media (max-width: 820px) { .catalog { top: auto; bottom: var(--gutter); right: var(--gutter); width: auto; max-height: 38%; } }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i class="ph-fill ph-flask"></i></div>
        <div><h1>Lab props</h1><p>Everything in Lab/props, on one bench · 1 unit = 1 cm</p></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnSketch" title="Sketch outline (S)"><i class="ph ph-pencil-simple"></i></button>
        <button class="icon-btn" id="btnView" title="Show everything"><i class="ph ph-crosshair-simple"></i></button>
      </div>
    </header>
    <aside class="panel catalog" id="catalog"></aside>
  </div>
  <script type="module">
    import { V3, createStage, createMaterials, createInteraction, makeBench } from './lab.js';
    import { PROPS } from './props/catalog.js';

    const overview = { t: V3(4, 2, -2), p: V3(4, 62, 74) };
    const stage = createStage({
      canvas: document.getElementById('scene'),
      views: { overview },
      sketch: true,
      insets: (w) => (w > 820 ? { left: 320 } : { bottom: window.innerHeight * 0.38 }),
    });
    const mat = createMaterials(stage);
    const sketch = stage.sketch;
    const btnSketch = document.getElementById('btnSketch');
    btnSketch.classList.toggle('on', sketch.enabled);
    const toggleSketch = () => { sketch.enabled = !sketch.enabled; btnSketch.classList.toggle('on', sketch.enabled); };
    btnSketch.addEventListener('click', toggleSketch);
    window.addEventListener('keydown', (e) => { if (e.key === 's' && !e.target.closest('input, select')) toggleSketch(); });
    const ix = createInteraction(stage, { targets: () => [], status: () => null, onClick: (k) => k && show(k) });

    stage.scene.add(makeBench(mat).group);

    // keep each section together, in order of first appearance
    const sections = [...new Set(PROPS.map((it) => it.group))];
    const items = PROPS.slice().sort((a, b) => sections.indexOf(a.group) - sections.indexOf(b.group));

    // lay them out in rows across the bench, each in its starting state
    const cols = 8, dx = 15, dz = 16;
    const entries = {};
    let slot = 0;
    items.forEach((it) => {
      const prop = it.make(mat);
      it.controls.forEach((ctl) => ctl.set(prop, ctl.value));
      if (it.key === 'lamp') {
        prop.group.position.set(52, 0, -34);   // at the back; its head reaches 24 cm forward
      } else {
        const x = (slot % cols - (cols - 1) / 2) * dx + 2, z = (Math.floor(slot / cols) - 1.5) * dz;
        prop.group.position.x += x;
        prop.group.position.z += z;
        slot++;
      }
      stage.scene.add(prop.group);
      const anchors = Object.keys(prop.anchors || {});
      ix.register(it.key, prop.group, {
        name: it.name, short: it.name,
        desc: `<code>${it.call}</code><br><span class="muted">props/${it.file}${anchors.length ? ' · anchors: ' + anchors.join(', ') : ''}</span>`,
      });
      entries[it.key] = { group: it.group, name: it.name, file: it.file, prop };
    });

    // catalog panel
    const cat = document.getElementById('catalog');
    let html = '<div class="panel-head"><span class="panel-title"><i class="ph ph-cube"></i>Props</span><span class="step-count">' + items.length + '</span></div>';
    let last = '';
    Object.entries(entries).forEach(([k, e]) => {
      if (e.group !== last) { if (last) html += '</ul>'; html += `<h3>${e.group}</h3><ul>`; last = e.group; }
      html += `<li data-k="${k}"><span>${e.name}</span><code>${e.file}</code></li>`;
    });
    cat.innerHTML = html + '</ul>';
    function show(k) {
      const e = entries[k];
      cat.querySelectorAll('li').forEach((li) => li.classList.toggle('on', li.dataset.k === k));
      const p = e.prop.group.position;
      const t = V3(p.x, 4, p.z + (k === 'lamp' ? 18 : 0));
      stage.focus({ t, p: t.clone().add(V3(6, 16, 30)) });
    }
    cat.addEventListener('click', (ev) => { const li = ev.target.closest('li'); if (li) show(li.dataset.k); });
    document.getElementById('btnView').addEventListener('click', () => { cat.querySelectorAll('li').forEach((li) => li.classList.remove('on')); stage.focus(overview); });

    stage.onFrame(() => ix.update());
    stage.focus(overview, 0);
    stage.start();
    window.GALLERY = { stage, sketch, entries };
  </script>
</body>
</html>
