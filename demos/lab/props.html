<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prop Viewer</title>
  <script src="page.js"></script>  <!-- import map, fonts, icons, lab.css -->
  <style>
    body { font-family: Inter, system-ui, sans-serif; color: var(--ink); }
    .catalog { top: 76px; left: var(--gutter); width: 260px; max-height: calc(100% - 96px); overflow: auto; padding-bottom: 10px; }
    .catalog ul { list-style: none; margin: 0; padding: 0 8px 4px; }
    .catalog li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 13.5px; }
    .catalog li:hover, .catalog li.on { background: rgba(255,255,255,.85); box-shadow: inset 0 0 0 1px var(--line); }
    .catalog li.on { color: var(--accent); font-weight: 600; }
    .catalog code { font: 500 11px 'JetBrains Mono', monospace; color: var(--muted); }
    .catalog h3, .inspector h3 { margin: 12px 18px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    .inspector { top: 76px; right: var(--gutter); width: 300px; max-height: calc(100% - 96px); overflow: auto; padding-bottom: 14px; }
    .inspector .title { padding: 16px 18px 4px; }
    .inspector .title h2 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
    .inspector .title p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
    .call { margin: 8px 14px 4px; padding: 9px 11px; border-radius: 10px; background: rgba(15,29,43,.05); font: 500 11.5px/1.5 'JetBrains Mono', monospace; color: var(--ink-2); word-break: break-word; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 4px 14px 0; }
    .stat { background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; }
    .stat b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; color: var(--muted); }
    .ctl { padding: 6px 18px; }
    .ctl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
    .ctl output { font: 500 12px 'JetBrains Mono', monospace; color: var(--muted); }
    .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
    .toggle { display: flex; align-items: center; gap: 9px; padding: 5px 18px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
    .anchors { margin: 0 18px; display: flex; flex-wrap: wrap; gap: 5px; }
    .anchors span { font: 500 11.5px 'JetBrains Mono', monospace; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
    .none { margin: 0 18px; font-size: 12.5px; color: var(--muted); }

    .pick { display: none; font: 500 14px Inter, sans-serif; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 46vw; }

    #tags { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
    .tag { position: absolute; transform: translate(10px, -50%); font: 600 11px 'JetBrains Mono', monospace; color: #fff; background: var(--accent); padding: 2px 7px; border-radius: 6px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .tag.scale { background: var(--ink); transform: translate(-50%, 6px); }

    @media (max-width: 820px) {
      .catalog { display: none; }
      .pick { display: block; }
      #btnPrev, #btnNext { display: none; }
      .inspector { top: auto; bottom: var(--gutter); left: var(--gutter); right: var(--gutter); width: auto; max-height: 40%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="tags"></div>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i class="ph-fill ph-cube"></i></div>
        <div><h1>Prop viewer</h1><p>One model from Lab/props at a time · 1 unit = 1 cm</p></div>
      </div>
      <div class="top-actions">
        <select class="pick" id="pick" aria-label="Prop"></select>
        <button class="icon-btn" id="btnPrev" title="Previous prop (↑)"><i class="ph ph-caret-up"></i></button>
        <button class="icon-btn" id="btnNext" title="Next prop (↓)"><i class="ph ph-caret-down"></i></button>
        <button class="icon-btn" id="btnFrame" title="Reframe (F)"><i class="ph ph-crosshair-simple"></i></button>
        <a class="icon-btn" href="gallery.html" title="All props on one bench"><i class="ph ph-squares-four"></i></a>
      </div>
    </header>
    <aside class="panel catalog" id="catalog"></aside>
    <aside class="panel inspector" id="inspector"></aside>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { V3, createStage, createMaterials, disposeTree, REVISION, GLASS_LOOK } from './lab.js';
    import { PROPS } from './props/catalog.js';

    const wide = () => window.innerWidth > 820;
    const stage = createStage({
      canvas: document.getElementById('scene'),
      sketch: true,
      fitAspect: 0.1,                       // we frame the camera ourselves
      controls: { minDistance: 3, maxDistance: 160 },
      shadow: { left: -40, right: 40, top: 40, bottom: -40 },
      insets: (w, h) => (w > 820 ? { left: 280, right: 320, top: 90 } : { top: 70, bottom: h * 0.4 }),
    });
    const mat = createMaterials(stage);
    const sketch = stage.sketch;

    const ITEMS = PROPS.slice();
    // keep each group together in the list, in order of first appearance
    const GROUPS = [...new Set(ITEMS.map((it) => it.group))];
    ITEMS.sort((a, b) => GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group));
    const byKey = Object.fromEntries(ITEMS.map((it) => [it.key, it]));

    /* ---------- scene furniture ---------- */
    const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.02, 1, 96), new THREE.MeshStandardMaterial({ color: 0xeef2f5, roughness: 0.62 }));
    pedestal.receiveShadow = true;
    stage.scene.add(pedestal);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.004, 6, 128), new THREE.MeshBasicMaterial({ color: 0xc7d0d9 }));
    rim.rotation.x = Math.PI / 2;
    stage.scene.add(rim);

    const scaleBar = new THREE.Group();
    const barMat = new THREE.MeshBasicMaterial({ color: 0x0f1d2b });
    const barLine = new THREE.Mesh(new THREE.BoxGeometry(1, 0.02, 1), barMat);
    const tickA = new THREE.Mesh(new THREE.BoxGeometry(1, 0.02, 1), barMat), tickB = tickA.clone();
    scaleBar.add(barLine, tickA, tickB);
    scaleBar.traverse((o) => { o.userData.noSketch = true; });
    stage.scene.add(scaleBar);

    const pivot = new THREE.Group();           // turntable spins this
    stage.scene.add(pivot);
    const boundsHelper = new THREE.Box3Helper(new THREE.Box3(), 0x16a34a);
    boundsHelper.material.transparent = true; boundsHelper.material.opacity = 0.6;
    pivot.add(boundsHelper);

    /* ---------- state ---------- */
    const opts = { spin: false, anchors: true, bounds: false, sketch: sketch.enabled };
    let cur = null;   // { it, prop, center, radius, size, markers[] }
    const tagsEl = document.getElementById('tags');
    let tags = [];

    function load(key) {
      const it = byKey[key] || ITEMS[0];
      if (cur) { pivot.remove(cur.prop.group); disposeTree(cur.prop.group); }
      pivot.rotation.y = 0;
      const prop = it.make(mat);
      pivot.add(prop.group);

      // centre the prop's footprint on the turntable axis
      prop.group.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(prop.group);
      const c = box.getCenter(new THREE.Vector3());
      prop.group.position.x -= c.x; prop.group.position.z -= c.z;
      prop.group.updateMatrixWorld(true);
      box.setFromObject(prop.group);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = box.getBoundingSphere(new THREE.Sphere()).radius;
      boundsHelper.box.copy(box);

      // pedestal and scale bar sized to the prop
      const pr = Math.max(7, Math.hypot(size.x, size.z) / 2 * 1.3 + 2);
      pedestal.scale.set(pr, 1, pr); pedestal.position.y = -0.5;
      rim.scale.set(pr, pr, 1); rim.position.y = 0.002;
      const len = [1, 2, 5, 10, 20].reduce((b, n) => (n <= pr * 0.7 ? n : b), 1);
      const th = Math.max(0.06, pr * 0.008);
      barLine.scale.set(len, 1, th); tickA.scale.set(th, 1, th * 6); tickB.scale.set(th, 1, th * 6);
      tickA.position.x = -len / 2; tickB.position.x = len / 2;
      scaleBar.position.set(0, 0.01, pr * 0.84);

      // anchors
      const markers = Object.entries(prop.anchors || {}).map(([name, p]) => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.12, radius * 0.018), 16, 10),
          new THREE.MeshBasicMaterial({ color: 0x16a34a, depthTest: false, transparent: true }));
        m.renderOrder = 20; m.position.copy(p); m.visible = opts.anchors; m.raycast = () => {};
        prop.group.add(m);
        return { name, m };
      });

      // triangle count (before markers would be added, they're excluded by flag)
      let tris = 0, meshes = 0;
      prop.group.traverse((o) => {
        if (!o.isMesh || markers.some((k) => k.m === o)) return;
        meshes++;
        const g = o.geometry; if (!g || !g.attributes.position) return;
        tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      });

      cur = { it, prop, center, radius, size, markers, tris, meshes, scaleLen: len, pr };
      it.controls.forEach((ctl) => ctl.set(prop, ctl.value));   // starting state

      // tags
      tagsEl.innerHTML = '';
      tags = markers.map((k) => { const d = document.createElement('div'); d.className = 'tag'; d.textContent = k.name; tagsEl.appendChild(d); return { d, obj: k.m }; });
      const sd = document.createElement('div'); sd.className = 'tag scale'; sd.textContent = len + ' cm'; tagsEl.appendChild(sd);
      tags.push({ d: sd, obj: scaleBar, scale: true });

      renderCatalog(); renderInspector();
      frame(0.9);
      if (location.hash.slice(1) !== it.key) history.replaceState(null, '', '#' + it.key);
    }

    function frame(dur = 0.9) {
      if (!cur) return;
      const w = window.innerWidth, h = window.innerHeight, i = stage.insets();
      if (!w || !h) return;   // a hidden pane: r / 0 would put the camera at infinity, then NaN
      const fov = THREE.MathUtils.degToRad(stage.camera.fov);
      const tanV = Math.tan(fov / 2) * (h - (i.top || 0) - (i.bottom || 0)) / h;
      const tanH = Math.tan(fov / 2) * (w / h) * (w - (i.left || 0) - (i.right || 0)) / w;
      const r = Math.max(cur.radius, 3);
      const dist = (r / Math.min(tanV, tanH)) * 1.08;
      const t = cur.center.clone();
      const dir = V3(0.42, 0.5, 1).normalize();
      stage.focus({ t, p: t.clone().add(dir.multiplyScalar(dist)) }, dur);
    }

    /* ---------- UI ---------- */
    const catEl = document.getElementById('catalog'), insEl = document.getElementById('inspector'), pick = document.getElementById('pick');
    function renderCatalog() {
      let html = `<div class="panel-head"><span class="panel-title"><i class="ph ph-cube"></i>Props</span><span class="step-count">${ITEMS.length}</span></div>`;
      let last = '';
      ITEMS.forEach((it) => {
        if (it.group !== last) { if (last) html += '</ul>'; html += `<h3>${it.group}</h3><ul>`; last = it.group; }
        html += `<li data-k="${it.key}" class="${cur && cur.it === it ? 'on' : ''}"><span>${it.name}</span><code>${it.file}</code></li>`;
      });
      catEl.innerHTML = html + '</ul>';
      pick.innerHTML = ITEMS.map((it) => `<option value="${it.key}"${cur && cur.it === it ? ' selected' : ''}>${it.name}</option>`).join('');
    }
    const fmt = (v) => (Math.round(v * 10) / 10).toFixed(1);
    function renderInspector() {
      const { it, size, tris, meshes, markers } = cur;
      let html = `<div class="title"><h2>${it.name}</h2><p>${it.desc}</p></div>
        <div class="call">${it.call}<br><span style="color:var(--muted)">props/${it.file}</span></div>
        <h3>Size</h3>
        <div class="stats">
          <div class="stat"><b>${fmt(size.x)}</b><span>width cm</span></div>
          <div class="stat"><b>${fmt(size.z)}</b><span>depth cm</span></div>
          <div class="stat"><b>${fmt(size.y)}</b><span>height cm</span></div>
          <div class="stat"><b>${Math.round(tris).toLocaleString()}</b><span>triangles</span></div>
          <div class="stat"><b>${meshes}</b><span>meshes</span></div>
          <div class="stat"><b>${markers.length}</b><span>anchors</span></div>
        </div>`;
      html += '<h3>State</h3>';
      if (!it.controls.length) html += '<p class="none">No state to change.</p>';
      it.controls.forEach((ctl, n) => {
        if (ctl.toggle) html += `<label class="toggle"><input type="checkbox" data-c="${n}"${ctl.value ? ' checked' : ''}>${ctl.label}</label>`;
        else html += `<div class="ctl"><label>${ctl.label}<output data-o="${n}">${showVal(ctl, ctl.value)}</output></label>
          <input type="range" data-c="${n}" min="${ctl.min}" max="${ctl.max}" step="${ctl.step}" value="${ctl.value}"></div>`;
      });
      html += '<h3>Anchors</h3>' + (markers.length ? `<div class="anchors">${markers.map((k) => `<span>${k.name}</span>`).join('')}</div>` : '<p class="none">None.</p>');
      html += `<h3>View</h3>
        <label class="toggle"><input type="checkbox" data-o-key="spin"${opts.spin ? ' checked' : ''}>Turntable</label>
        <label class="toggle"><input type="checkbox" data-o-key="anchors"${opts.anchors ? ' checked' : ''}>Show anchors</label>
        <label class="toggle"><input type="checkbox" data-o-key="bounds"${opts.bounds ? ' checked' : ''}>Show bounding box</label>
        <h3>Glass edges</h3>
        ${GLASS.map(([k, label, min, max, st]) => `<div class="ctl"><label>${label}<output data-go="${k}">${glassVal(k)}</output></label>
          <input type="range" data-g="${k}" min="${min}" max="${max}" step="${st}" value="${glassVal(k)}"></div>`).join('')}
        <h3>Sketch outline · three r${REVISION}</h3>
        <label class="toggle"><input type="checkbox" data-o-key="sketch"${opts.sketch ? ' checked' : ''}>Outline</label>
        ${SKETCH.map(([k, label, min, max, st]) => `<div class="ctl"><label>${label}<output data-so="${k}">${sketch.params[k]}</output></label>
          <input type="range" data-s="${k}" min="${min}" max="${max}" step="${st}" value="${sketch.params[k]}"></div>`).join('')}`;
      insEl.innerHTML = html;
      applyView();
    }
    // glass silhouettes (materials.js GLASS_LOOK) and the lip/foot rings (mat.glassEdge), shared by every vessel
    const GLASS = [['uEdgeK', 'Edge strength', 0, 3, 0.05], ['uEdgeW', 'Edge width', 0.4, 2, 0.05], ['uEdgeD', 'Edge darkness', 0, 1.47, 0.01], ['rim', 'Lip + foot rings', 0, 1, 0.05]];
    const glassVal = (k) => (k === 'rim' ? mat.glassEdge.opacity : GLASS_LOOK[k].value);
    const SKETCH = [['width', 'Line weight', 0.5, 3, 0.1], ['wobble', 'Wobble', 0, 4, 0.1], ['ref', 'Full weight within (cm)', 10, 150, 5], ['minScale', 'Weight far away', 0.1, 1, 0.05], ['opacity', 'Ink', 0.2, 1, 0.05], ['grain', 'Pencil grain', 0, 1, 0.05], ['liquidWidth', 'Liquid line weight', 0.5, 4, 0.1], ['resolution', 'Resolution (× CSS px)', 1, 2, 0.25]];
    function showVal(ctl, v) {
      if (ctl.unit === 's') { const m = Math.floor(v / 60), s = Math.floor(v % 60); return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; }
      const d = ctl.step < 0.1 ? 2 : ctl.step < 1 ? 1 : 0;
      return Number(v).toFixed(d) + (ctl.unit ? ' ' + ctl.unit : '');
    }
    function applyView() {
      cur.markers.forEach((k) => { k.m.visible = opts.anchors; });
      boundsHelper.visible = opts.bounds;
      sketch.enabled = opts.sketch;
    }
    insEl.addEventListener('input', (e) => {
      const el = e.target;
      if (el.dataset.oKey) { opts[el.dataset.oKey] = el.checked; applyView(); return; }
      if (el.dataset.g) {
        const k = el.dataset.g, v = +el.value;
        if (k === 'rim') { mat.glassEdge.opacity = v; mat.glassEdge.visible = v > 0; } else GLASS_LOOK[k].value = v;
        insEl.querySelector(`output[data-go="${k}"]`).textContent = el.value; return;
      }
      if (el.dataset.s) { sketch.set({ [el.dataset.s]: +el.value }); insEl.querySelector(`output[data-so="${el.dataset.s}"]`).textContent = el.value; return; }
      const ctl = cur.it.controls[+el.dataset.c];
      if (!ctl) return;
      const v = ctl.toggle ? el.checked : +el.value;
      ctl.value = v;
      ctl.set(cur.prop, v);
      const out = insEl.querySelector(`output[data-o="${el.dataset.c}"]`);
      if (out) out.textContent = showVal(ctl, v);
    });
    catEl.addEventListener('click', (e) => { const li = e.target.closest('li'); if (li) load(li.dataset.k); });
    pick.addEventListener('change', () => load(pick.value));
    const step = (d) => { const i = ITEMS.indexOf(cur.it); load(ITEMS[(i + d + ITEMS.length) % ITEMS.length].key); };
    document.getElementById('btnPrev').addEventListener('click', () => step(-1));
    document.getElementById('btnNext').addEventListener('click', () => step(1));
    document.getElementById('btnFrame').addEventListener('click', () => frame());
    window.addEventListener('keydown', (e) => {
      if (e.target.closest('input, select')) return;
      if (e.key === 'ArrowDown' || e.key === 'j') { step(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp' || e.key === 'k') { step(-1); e.preventDefault(); }
      else if (e.key === 'f') frame();
      else if (e.key === ' ') { opts.spin = !opts.spin; renderInspector(); e.preventDefault(); }
    });
    window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (byKey[k] && (!cur || cur.it.key !== k)) load(k); });
    stage.onResize(() => frame(0.3));

    /* ---------- frame loop ---------- */
    const v = new THREE.Vector3();
    stage.onFrame((dt) => {
      if (opts.spin) pivot.rotation.y += dt * 0.5;
      const w = window.innerWidth, h = window.innerHeight;
      stage.camera.updateMatrixWorld();
      tags.forEach(({ d, obj, scale }) => {
        const show = scale || (opts.anchors && obj.visible);
        obj.getWorldPosition(v);
        v.project(stage.camera);
        const on = show && v.z < 1;
        d.style.display = on ? '' : 'none';
        if (on) d.style.left = ((v.x + 1) / 2 * w) + 'px', d.style.top = ((1 - v.y) / 2 * h) + 'px';
      });
    });

    // Load after the first frame: a clipping-plane material (beaker liquid) compiled
    // in three r128's very first render gets stuck throwing on every frame.
    stage.onFirstFrame(() => load(location.hash.slice(1) || ITEMS[0].key));
    stage.start();
    window.VIEWER = { stage, sketch, mat, load, get cur() { return cur; } };
  </script>
</body>
</html>
