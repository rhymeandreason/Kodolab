<!doctype html>
<html lang="en" data-lab-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly levels bench</title>
  <script src="../page.js" data-text="text.js"></script>
  <script src="../../lib/palette.js"></script>
  <style>
    .bench-ctl { position: fixed; left: 12px; top: 64px; z-index: 50; width: 250px; padding: 10px 12px; font: 12px/1.4 system-ui; }
    .bench-ctl label { display: grid; grid-template-columns: 70px 1fr 34px; gap: 6px; align-items: center; margin: 4px 0; }
    .bench-ctl select { grid-column: 2 / 4; }
    .bench-ctl .cue { margin-top: 8px; color: var(--muted); }
    .intro { display: none !important; }
  </style>
</head>
<body>
  <div id="app"><section class="panel bench-ctl" id="ctl"></section></div>
  <script>LabPage.chrome()</script>
  <script type="module">
    /* A test bench for the two zoom worlds: every Z field on a control. ?level=cell|mol opens there;
       ?z={json} sets fields at load (pick and the allele pairs as arrays). */
    import { V3, createStage, createMaterials, createZoom, chromeInsets, makeBench } from '../lab.js';
    import { createCell } from './cell.js';
    import { createMolecule } from './molecule.js';

    const STEP_IDS = ['knock', 'sort', 'setup', 'predict1', 'wait1', 'clear1', 'hatch1', 'count1', 'mate2', 'predict2', 'wait2', 'clear2', 'hatch2', 'count2', 'test', 'punnett'];
    const Z = { step: 'knock', vial: 'B', mother: ['w', 'w'], father: ['W', 'Y'], meiosis: 0, fert: 0, pick: [0, 1], grid: 0, pigment: 0 };
    const qs = new URLSearchParams(location.search);
    if (qs.get('z')) Object.assign(Z, JSON.parse(qs.get('z')));
    const stage = createStage({ canvas: document.getElementById('scene'), views: { bench: { t: V3(0, 4, 0), p: V3(0, 40, 60) } }, insets: (w, h) => chromeInsets(w, h) });
    stage.scene.add(makeBench(createMaterials(stage)).group);
    let stepI = Math.max(0, STEP_IDS.indexOf(Z.step));
    const zoom = createZoom(stage, {
      levels: [
        { key: 'cell', world: createCell(stage.env, { stepIds: STEP_IDS }), name: 'Cell', meta: '≈ 10 µm', bg: '#f1eef0' },
        { key: 'mol', world: createMolecule(stage.env, { stepIds: STEP_IDS }), name: 'Molecule', meta: '≈ 50 nm', bg: '#f3ece6' },
      ],
      getT: () => Z, getStep: () => stepI,
    });
    const ctl = document.getElementById('ctl');
    const str = (v) => (Array.isArray(v) ? v.join(',') : String(v));
    const sel = (k, opts) => `<label>${k}<select data-k="${k}">${opts.map((o) => `<option ${str(Z[k]) === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>`;
    const sl = (k) => `<label>${k}<input type="range" min="0" max="1" step="0.001" value="${Z[k]}" data-k="${k}"><span>${Z[k]}</span></label>`;
    ctl.innerHTML = sel('step', STEP_IDS) + sel('vial', ['A', 'B', 'C']) + sel('mother', ['W,W', 'W,w', 'w,w']) + sel('father', ['W,Y', 'w,Y'])
      + sel('pick', ['0,0', '0,1', '1,0', '1,1']) + sl('meiosis') + sl('fert') + sl('grid') + sl('pigment')
      + '<div class="cue" id="cue"></div>';
    ctl.addEventListener('input', (e) => {
      const k = e.target.dataset.k; if (!k) return;
      let v = e.target.value;
      if (e.target.type === 'range') { v = +v; e.target.nextElementSibling.textContent = v.toFixed(2); }
      if (k === 'pick') v = v.split(',').map(Number);
      if (k === 'mother' || k === 'father') v = v.split(',');
      Z[k] = v;
      if (k === 'step') { stepI = STEP_IDS.indexOf(v); zoom.onStep(); }
    });
    stage.onFrame((dt) => { zoom.update(dt); const c = zoom.caption(); document.getElementById('cue').innerHTML = c ? (c.text || c) + (c.note ? `<br><i>${c.note}</i>` : '') : ''; });
    window.BENCH = { Z, zoom, stage, setStep: (id) => { Z.step = id; stepI = STEP_IDS.indexOf(id); zoom.onStep(); } };
    stage.start();
    const lv = qs.get('level');
    if (lv) setTimeout(() => zoom.go(lv), 300);
  </script>
</body>
</html>
