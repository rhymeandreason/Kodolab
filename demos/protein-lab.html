<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building a protein</title>

<!-- ===================================================================
     FROM AMINO ACIDS TO A FOLD, on macromolecule-builder.html's stage.
     Four cards, each one claim:

       1. THE PEPTIDE BOND. Only carboxyl meets amino, a water leaves,
          and the chain grows one way. Direction is what is left after
          the chemistry, not a rule the page states.
       2. GLUTATHIONE. Glutamate offers two carboxyls; only the side
          chain's makes the molecule a peptidase cannot cut. Which bond
          formed is decided by where the student dragged.
       3. COLLAGEN. Proline's ring pins its own phi, and the chain bends
          where the others run straight.
       4. THE HELIX. The same chain in two folds. Nothing places the
          hydrogen bonds: they are FOUND (kit/hbond.js) on whatever the
          two torsions built, so a strand shows none and a helix shows
          one per turn's worth of residues.

     Ends where hemoglobin-lab.html begins: a helix is the second level,
     and that lesson folds one chain into the third.
     =================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/kodo.css">
<link rel="stylesheet" href="macromolecule/assembly.css">
<style>
  #note a{color:inherit}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <nav id="cards"></nav>
    <div id="choose"></div>
    <div id="seq"><div class="label">the chain</div>
      <div class="chain"></div><div class="ends"></div></div>
    <button id="reset">Start over</button>
    <button id="dim3d"></button>
    <div id="note"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<script src="lib/mol-aminoacids.js"></script>
<script src="lib/mol-small.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/stagekit.js"></script>
<script src="kit/hbond.js"></script>
<script src="macromolecule/spec.js"></script>
<script src="macromolecule/peptide.js"></script>
<script src="macromolecule/plane.js"></script>
<script src="macromolecule/assembly.js"></script>
<script>
"use strict";

const S = MolLib.SCALE;
const { un, nearestSite } = MacroAssembly;

/* What every card here shares: one reaction, read off each residue's own
 * `condense:` roles. A card adds its monomers and its words. */
const PEPTIDE = {
  // WHICH carboxyl reacted. Every residue here has one; glutamate has two.
  donor:at => at.pose.donor, acceptor:'amino',
  chains:true, ends:'N-terminus → C-terminus',
  unit:'residue', bond:'peptide bond',
  label:p => p.spec.name,
  poseIn:(h, g, donor, round) => Peptide.pose(h, g, donor, round ? 'helix' : 'strand'),
  /* EVERY CARBOXYL THE HOST STILL HAS, and the nearest one wins: glutamate
   * has two, and which takes the bond is decided by where the student drags,
   * not by a fixed order that would put it somewhere nobody pointed. */
  solve:(host, guest) => {
    const h = un(host), g = un(guest);
    return nearestSite(host, guest, ['carboxyl', 'gamma']
      .filter(donor => MacroSpec.free(h, donor))
      .map(donor => Peptide.pose(h, g, donor)));
  },
};

/* THE HELIX'S HYDROGEN BONDS, FOUND. Every backbone N–H is a donor and every
 * carbonyl O an acceptor, and kit/hbond.js decides which pairs are bonded by
 * distance and angle, the same criterion water-lab uses. The page never says
 * i to i+4; if the torsions stopped building a helix, the dashes would go. */
let helixBonds = [];
function hbonds(A){
  const c = A.chain(), donors = [], acceptors = [];
  c.forEach((p, k) => {
    const n = p.spec.names, at = i => A.P.atomAt(p, i).toArray();
    const N = MacroSpec.role(un(p), 'amino').keep;
    for(const h of ['H', 'H2']) if(n.includes(h))
      donors.push({ h:at(n.indexOf(h)), root:at(N), owner:k, id:k + h });
    if(n.includes('O')) acceptors.push({ p:at(n.indexOf('O')), owner:k, id:k + 'O', capacity:1 });
  });
  helixBonds = HBond.find(donors, acceptors, { maxDist:2.5 * S, order:'best' });
  const draw = HBond.create(THREE, { radius:0.055 * S, gap:0.26 * S });
  draw.set(helixBonds);
  return [draw.group];
}

const CARDS = [
  { ...PEPTIDE,
    key:'bond', n:1, title:'The peptide bond', sub:'which ends react',
    /* Proline is absent on purpose. Its ring pins phi near −65° where every
     * other residue here sits at −139°, so a chain with one in it bends, which
     * is true and is card 3's point, but as an unexplained kink here it reads
     * as a bug. */
    monomers:['glycine', 'alanine', 'serine', 'cysteine'],
    home:{ glycine:[-21, 9], alanine:[-7, -10], serine:[9, 9], cysteine:[22, -10] },
    box:{ x:0, y:0, rxz:32, hy:22 },
    lead:'Push two of them together. Only one pairing of ends does anything. '
       + 'Find which, and watch what comes off.',
    done:c => `<b>${c.length} residues</b>, joined N to C. Four different monomers, so this `
            + 'chain has a <b>sequence</b>, and the sequence is the whole of what it does.',
    more:'The chain can only grow at the end that still has its &ndash;COOH.',
  },
  { ...PEPTIDE,
    /* GLUTATHIONE, and the choice that makes it. Cysteine will bond to either
     * of glutamate's carboxyls, and both products are real molecules, but only
     * the γ one is glutathione, and the γ bond is why no ordinary peptidase can
     * cut it. Nothing on the stage says which to use. */
    key:'glutathione', n:2, title:'Glutathione', sub:'γ-Glu-Cys-Gly',
    monomers:['glutamate', 'cysteine', 'glycine'],
    home:[[-20, 8], [4, -10], [24, 8]],
    box:{ x:0, y:0, rxz:32, hy:22 },
    lead:'Glutamate has <b>two</b> &ndash;COOH: one on the backbone, one on the end of its '
       + 'side chain. Cysteine will take either. Only one of them makes glutathione.',
    done:(c, card, A) => {
      const g = A.sticks.find(s => s.donor === 'gamma');
      if(A.sticks.length < 2) return g
        ? 'The <b>&gamma;</b> bond, through the side chain. Now put glycine on the far end.'
        : 'That is the backbone &ndash;COOH: an ordinary dipeptide. Pull it apart '
          + '(double-click) and try the other one.';
      return g
        ? '<b>Glutathione.</b> The first bond is &gamma;, through the side chain. A peptidase '
          + 'reads backbone bonds and cannot see this one, so the cell can keep a lot of it, '
          + 'and the &ndash;SH in the middle is what does the work.'
        : 'All backbone bonds: an ordinary tripeptide, and any protease takes it apart. '
          + 'Glutathione is joined through glutamate&rsquo;s <b>side chain</b>.';
    },
    more:(c, card, A) => card.done(c, card, A),
  },
  { ...PEPTIDE,
    /* WHAT IS NOT DRAWN is the triple helix. Collagen is three of these wound
     * together, and glycine has to be every third residue because that position
     * faces the axis. One chain cannot show that, and the note says so. */
    key:'collagen', n:3, title:'Collagen', sub:'Gly-Pro-Pro',
    monomers:['glycine', 'proline', 'proline'],
    home:[[-22, 8], [2, -10], [22, 8]],
    box:{ x:0, y:0, rxz:32, hy:22 },
    lead:'The collagen repeat: glycine, then two prolines, over and over. '
       + 'Watch what proline does to the chain.',
    done:c => c.length < 3
      ? `<b>${c.length}</b> of three. Proline's ring bends the chain where the others run straight.`
      : '<b>Gly-Pro-Pro</b>, and the bend is proline: its side chain loops back onto its own '
        + 'backbone nitrogen, so that bond cannot rotate to the extended angle the others take. '
        + 'Collagen is <b>three</b> of these wound together, and glycine has to be every third '
        + 'residue because that position faces the middle, where nothing bigger than an H fits.',
    more:(c, card) => card.done(c, card),
  },
  { ...PEPTIDE,
    /* THE SAME CHAIN, TWO FOLDS. Dealt already joined, because this card is
     * about the shape and not about making it. All alanine: it is the classic
     * helix-former, and a residue drawn rigid from its conformer would put
     * side-chain clashes on stage that a real helix relieves by turning. */
    key:'helix', n:4, title:'The helix', sub:'two angles, one fold',
    monomers:Array(8).fill('alanine'),
    home:Array(8).fill([0, 0]),
    prejoin:true,
    views:{ to:'Fold into a helix', back:'Unfold to a strand', decorate:hbonds },
    lead:'',
    done:c => `<b>${c.length} alanines</b> as an extended strand. Each residue's C=O and N&ndash;H `
            + 'point out to the side, at nothing on this chain. Fold it.',
    more:'Join it back into one chain to fold it.',
    round:c => {
      const n = helixBonds.length;
      const gap = n ? Math.abs(helixBonds[0].donor.owner - helixBonds[0].acceptor.owner) : 0;
      return '<b>An &alpha;-helix.</b> Same bonds, same atoms; only two angles per residue '
        + `changed. Now each C=O points along the axis at the N&ndash;H ${gap} residues on: `
        + `<b>${n} hydrogen bonds</b>, dashed, and they are what hold the coil. `
        + 'Side chains point outward. Folding further is '
        + '<a href="hemoglobin-lab.html">the hemoglobin lesson</a>.';
    },
  },
];

MacroAssembly.create({ cards:CARDS, el:{
  canvas:document.getElementById('gl'),     stage:document.getElementById('stage'),
  note:document.getElementById('note'),     seq:document.getElementById('seq'),
  rail:document.getElementById('cards'),    choose:document.getElementById('choose'),
  reveal:document.getElementById('dim3d'),  reset:document.getElementById('reset') } });
</script>
</body>
</html>
