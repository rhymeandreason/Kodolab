<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building a protein</title>

<!-- ===================================================================
     FROM AMINO ACIDS TO A SEQUENCE, on macromolecule-builder.html's stage.
     Six cards, each one claim:

       1. THE PEPTIDE BOND. Only carboxyl meets amino, a water leaves,
          and the chain grows one way. Direction is what is left after
          the chemistry, not a rule the page states.
       2. GLUTATHIONE. Glutamate offers two carboxyls; only the side
          chain's makes the molecule a peptidase cannot cut. Which bond
          formed is decided by where the student dragged.
       3. COLLAGEN. Proline's ring pins its own phi, and the chain bends
          where the others run straight.
       4. MET-ENKEPHALIN. Five residues are a whole signal, read N to C.
       5. SICKLE CELL. The first seven of the beta chain, then one swap at
          position 6: a charged side chain becomes a greasy one.
       6. OXYTOCIN AND VASOPRESSIN. Nine residues, two cysteines that close
          a ring, and two positions that pick the hormone.

     Cards 4-6 deal the residues out of order and check the chain against
     the target, so the sequence is something the student reads and builds.

     UNDER THE STAGE, THE SAME CHAIN AS A TEXTBOOK DRAWS IT
     (macromolecule/peptide-diagram.js), redrawn on every join, so the
     boxed C(=O)-N(-H) on paper and the bond on the model are read
     against each other.

     Ends where helix-lab.html begins: the same backbone, folded.
     =================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/kodo.css">
<link rel="stylesheet" href="macromolecule/assembly.css">
<style>
  #note a{color:inherit}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <nav id="cards"></nav>
    <div id="choose"></div>
    <div id="seq"><div class="label">the chain</div>
      <div class="chain"></div><div class="ends"></div></div>
    <button id="reset">Start over</button>
    <button id="dim3d"></button>
    <div id="diagram"></div>
    <div id="note"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<script src="lib/mol-aminoacids.js"></script>
<script src="lib/mol-small.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/stagekit.js"></script>
<script src="macromolecule/spec.js"></script>
<script src="macromolecule/peptide.js"></script>
<script src="macromolecule/plane.js"></script>
<script src="macromolecule/peptide-diagram.js"></script>
<script src="macromolecule/assembly.js"></script>
<script>
"use strict";

const S = MolLib.SCALE;
const { un, nearestSite } = MacroAssembly;

/* What every card here shares: one reaction, read off each residue's own
 * `condense:` roles. A card adds its monomers and its words. */
const PEPTIDE = {
  // WHICH carboxyl reacted. Every residue here has one; glutamate has two.
  donor:at => at.pose.donor, acceptor:'amino',
  chains:true, ends:'N-terminus → C-terminus',
  unit:'residue', bond:'peptide bond',
  label:p => p.spec.name,
  diagram,
  /* EVERY CARBOXYL THE HOST STILL HAS, and the nearest one wins: glutamate
   * has two, and which takes the bond is decided by where the student drags,
   * not by a fixed order that would put it somewhere nobody pointed. */
  solve:(host, guest) => {
    const h = un(host), g = un(guest);
    return nearestSite(host, guest, ['carboxyl', 'gamma']
      .filter(donor => MacroSpec.free(h, donor))
      .map(donor => Peptide.pose(h, g, donor)));
  },
};

/* THE STAGE, DRAWN FLAT. One fragment per separate piece, left to right as
 * they lie on the stage, each walked N to C along the bonds. A glutamate that
 * bonded through both carboxyls is a branch the straight drawing cannot hold,
 * so its second branch is drawn as a fragment of its own. */
function diagram(A, fresh){
  const guests = new Set(A.sticks.map(s => s.guest));
  const queue = A.P.pieces.filter(p => !guests.has(p))
    .sort((a, b) => a.mol.position.x - b.mol.position.x);
  const frags = [], where = new Map();
  while(queue.length){
    const frag = [];
    for(let p = queue.shift(); p; ){
      const out = A.sticks.filter(s => s.host === p);
      out.slice(1).forEach(s => queue.push(s.guest));
      where.set(p, [frags.length, frag.length]);
      frag.push({ spec:p.base, prev:guests.has(p), next:out[0] ? out[0].donor : null });
      p = out[0] && out[0].guest;
    }
    frags.push(frag);
  }
  return PeptideDiagram.svg(frags, { fresh:fresh && where.get(fresh.host) });
}

/* A SEQUENCE TO BUILD. Dealt out of order, (2i+1) mod n for odd n, so the row
 * on the stage never already reads N to C and the student has to read the
 * target. The chain is checked against it residue by residue. */
const M = MolLib.MOLECULES;
const read = keys => keys.map(k => M[k].res).join('-');
function target(seq, done){
  const n = seq.length, dealt = seq.map((_, i) => seq[(2*i + 1) % n]);
  const gap = 13;
  return {
    // Backbone carboxyls only: a glutamate joined through its side chain is
    // glutathione's bond, not the next residue of this sequence.
    solve:(host, guest) => nearestSite(host, guest, [Peptide.pose(un(host), un(guest), 'carboxyl')]),
    monomers:dealt,
    home:dealt.map((_, i) => [(i - (n - 1)/2) * gap, i % 2 ? -9 : 9]),
    box:{ x:0, y:0, rxz:(n - 1)/2 * gap + 10, hy:17 },
    more:c => `${c.length} of ${n}. Build it N-terminus to C-terminus: <b>${read(seq)}</b>.`,
    done:(c, card, A) => c.length === n && c.every((p, i) => p.key === seq[i])
      ? done(c, card, A)
      : `That chain reads ${read(c.map(p => p.key))}, and the target is <b>${read(seq)}</b>. `
        + 'Same amino acids, different order, different molecule. Double-click a bond to break it.',
  };
}
// The first place two sequences differ, as 1-based positions.
const differ = (a, b) => a.map((k, i) => k !== b[i] ? i + 1 : 0).filter(Boolean);

const ENKEPHALIN = ['tyrosine', 'glycine', 'glycine', 'phenylalanine', 'methionine'];
// The first seven of the hemoglobin β chain, after the initiator Met is cut off.
const HBA = ['valine', 'histidine', 'leucine', 'threonine', 'proline', 'glutamate', 'glutamate'];
const HBS = HBA.map((k, i) => i === 5 ? 'valine' : k);
/* Both hormones end in an amidated glycine, –CONH₂ where the chain built here
 * has –COOH; the library has no glycinamide, and the claim is in the sequence. */
const OXYTOCIN    = ['cysteine', 'tyrosine', 'isoleucine', 'glutamine', 'asparagine',
                     'cysteine', 'proline', 'leucine', 'glycine'];
const VASOPRESSIN = ['cysteine', 'tyrosine', 'phenylalanine', 'glutamine', 'asparagine',
                     'cysteine', 'proline', 'arginine', 'glycine'];
const cysAt = seq => seq.map((k, i) => k === 'cysteine' ? i + 1 : 0).filter(Boolean);

const CARDS = [
  { ...PEPTIDE,
    key:'bond', n:1, title:'The peptide bond', sub:'which ends react',
    /* Proline is absent on purpose. Its ring pins phi near −65° where every
     * other residue here sits at −139°, so a chain with one in it bends, which
     * is true and is card 3's point, but as an unexplained kink here it reads
     * as a bug. */
    monomers:['glycine', 'alanine', 'serine', 'cysteine'],
    home:{ glycine:[-21, 9], alanine:[-7, -10], serine:[9, 9], cysteine:[22, -10] },
    box:{ x:0, y:0, rxz:30, hy:17 },
    lead:'Push two amino acids together. Only one pairing of ends reacts. '
       + 'Find it, and watch what leaves.',
    // The first bond is where the reaction gets named; after that, direction.
    more:(c, card, A) => A.sticks.length === 1
      ? 'That was <b>dehydration synthesis</b>. One amino acid&rsquo;s &ndash;COOH lost an '
        + '&ndash;OH, the next one&rsquo;s &ndash;NH<sub>2</sub> lost an H, and together '
        + 'they left as that water. What holds them now is a covalent <b>peptide bond</b>, &ndash;CO&ndash;NH&ndash;, '
        + 'boxed below.'
      : 'Each new amino acid joins at the end that still has its &ndash;COOH, so a chain has '
        + 'a direction: N-terminus to C-terminus.',
    done:c => {
      const kinds = new Set(c.map(p => p.key)).size;
      return `A <b>polypeptide</b> of ${c.length}. Each peptide bond has partial double-bond `
        + 'character, so it is flat and rigid; the chain can only turn at the bonds on either '
        + `side of each &alpha;-carbon. ${kinds} different amino acids, so it also has a `
        + '<b>sequence</b>. What would change if you built them in another order?';
    },
  },
  { ...PEPTIDE,
    /* GLUTATHIONE, and the choice that makes it. Cysteine will bond to either
     * of glutamate's carboxyls, and both products are real molecules, but only
     * the γ one is glutathione, and the γ bond is why no ordinary peptidase can
     * cut it. Nothing on the stage says which to use. */
    key:'glutathione', n:2, title:'Glutathione', sub:'γ-Glu-Cys-Gly',
    monomers:['glutamate', 'cysteine', 'glycine'],
    home:[[-20, 8], [4, -10], [24, 8]],
    box:{ x:2, y:-1, rxz:30, hy:16 },
    lead:'Glutamate has <b>two</b> &ndash;COOH: one on the backbone, one on the end of its '
       + 'side chain. Cysteine will take either. Only one of them makes glutathione.',
    done:(c, card, A) => {
      const g = A.sticks.find(s => s.donor === 'gamma');
      if(A.sticks.length < 2) return g
        ? 'The <b>&gamma;</b> bond, through the side chain. Now put glycine on the far end.'
        : 'That is the backbone &ndash;COOH: an ordinary dipeptide. Pull it apart '
          + '(double-click) and try the other one.';
      return g
        ? '<b>Glutathione.</b> The first bond is &gamma;, through the side chain. A peptidase '
          + 'reads backbone bonds and cannot see this one, so the cell can keep a lot of it, '
          + 'and the &ndash;SH in the middle is what does the work.'
        : 'All backbone bonds: an ordinary tripeptide, and any protease takes it apart. '
          + 'Glutathione is joined through glutamate&rsquo;s <b>side chain</b>.';
    },
    more:(c, card, A) => card.done(c, card, A),
  },
  { ...PEPTIDE,
    /* WHAT IS NOT DRAWN is the triple helix. Collagen is three of these wound
     * together, and glycine has to be every third residue because that position
     * faces the axis. One chain cannot show that, and the note says so. */
    key:'collagen', n:3, title:'Collagen', sub:'Gly-Pro-Pro',
    monomers:['glycine', 'proline', 'proline'],
    home:[[-22, 8], [2, -10], [22, 8]],
    box:{ x:0, y:-1, rxz:30, hy:16 },
    lead:'The collagen repeat: glycine, then two prolines, over and over. '
       + 'Watch what proline does to the chain.',
    done:c => c.length < 3
      ? `<b>${c.length}</b> of three. Proline's ring bends the chain where the others run straight.`
      : '<b>Gly-Pro-Pro</b>, and the bend is proline: its side chain loops back onto its own '
        + 'backbone nitrogen, so that bond cannot rotate to the extended angle the others take. '
        + 'Collagen is <b>three</b> of these wound together, and glycine has to be every third '
        + 'residue because that position faces the middle, where nothing bigger than an H fits.',
    more:(c, card) => card.done(c, card),
  },
  { ...PEPTIDE,
    key:'enkephalin', n:4, title:'Met-enkephalin', sub:'Tyr-Gly-Gly-Phe-Met',
    lead:`Five amino acids, one of the brain&rsquo;s own painkillers. Build it N to C: `
       + `<b>${read(ENKEPHALIN)}</b>.`,
    ...target(ENKEPHALIN, c => `<b>Met-enkephalin.</b> ${c.length} residues are a whole message: `
      + 'neurons release it and it fits the <b>opioid receptor</b>. Morphine fits the same '
      + 'receptor because part of it is shaped like the tyrosine ring at the N-terminus. '
      + 'Which residue would you change to switch the signal off?'),
  },
  { ...PEPTIDE,
    /* SICKLE CELL, ONE RESIDUE. What the swap does to the whole protein is
     * sickle-lab.html's; this card stops at the side chain. */
    key:'sickle', n:5, title:'Sickle cell', sub:'one residue, β6',
    builds:[
      { key:'hba', label:'Normal (HbA)', set:{
          lead:`The first ${HBA.length} amino acids of hemoglobin&rsquo;s &beta; chain. `
             + `Build them N to C: <b>${read(HBA)}</b>.`,
          ...target(HBA, () => {
            const k = differ(HBA, HBS)[0];
            return `<b>Normal &beta; chain.</b> Position ${k} is glutamate: its side chain ends `
              + 'in &ndash;COOH, which in blood has lost its H and carries a charge, so it sits '
              + 'happily in water on the protein&rsquo;s surface. Now build the sickle version.';
          }),
        } },
      { key:'hbs', label:'Sickle (HbS)', set:{
          lead:`The same seven, with one change. Build <b>${read(HBS)}</b>.`,
          ...target(HBS, () => {
            const k = differ(HBA, HBS)[0];
            return `<b>Sickle &beta; chain.</b> One DNA base changed, so position ${k} is now `
              + 'valine: a nonpolar side chain where a charged one was, a greasy patch on the '
              + 'outside of the protein. With no O<sub>2</sub> bound, it sticks into a pocket on the '
              + 'next hemoglobin, and they stack into fibres that bend the red cell. '
              + '<a href="sickle-lab.html">Watch it happen</a>.';
          }),
        } },
    ],
  },
  { ...PEPTIDE,
    /* THE DISULFIDE IS NOT BUILT. The two cysteines' –SH stay apart on the
     * stage, and the note says they close; a second kind of bond, made between
     * residues already in the chain, is not a reaction assembly.js knows. */
    key:'hormones', n:6, title:'Oxytocin', sub:'two hormones, nine residues',
    builds:[
      { key:'oxytocin', label:'Oxytocin', set:{
          lead:`A hormone of ${OXYTOCIN.length} amino acids. Build it N to C: <b>${read(OXYTOCIN)}</b>.`,
          ...target(OXYTOCIN, () => {
            const [i, j] = cysAt(OXYTOCIN);
            return `<b>Oxytocin.</b> The cysteines at ${i} and ${j} are where it closes: in the `
              + 'body their &ndash;SH groups join into one S&ndash;S <b>disulfide bond</b>, a '
              + `covalent bridge that turns residues ${i} to ${j} into a ring. Now build vasopressin.`;
          }),
        } },
      { key:'vasopressin', label:'Vasopressin', set:{
          lead:`Another hormone, also ${VASOPRESSIN.length} long. Build <b>${read(VASOPRESSIN)}</b>.`,
          ...target(VASOPRESSIN, () => {
            const d = differ(OXYTOCIN, VASOPRESSIN);
            return `<b>Vasopressin.</b> Same length, same ring, and only ${d.length} positions `
              + `differ (${d.join(' and ')}). Oxytocin drives labour and milk letdown; vasopressin `
              + 'tells the kidney to keep water. Each fits a different receptor, and those side '
              + 'chains are why. Next: <a href="helix-lab.html">folding a chain into a helix</a>.';
          }),
        } },
    ],
  },
];

MacroAssembly.create({ cards:CARDS, el:{
  canvas:document.getElementById('gl'),     stage:document.getElementById('stage'),
  note:document.getElementById('note'),     seq:document.getElementById('seq'),
  rail:document.getElementById('cards'),    choose:document.getElementById('choose'),
  reveal:document.getElementById('dim3d'),  reset:document.getElementById('reset'),
  diagram:document.getElementById('diagram') } });
</script>
</body>
</html>
