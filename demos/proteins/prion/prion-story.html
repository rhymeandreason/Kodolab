<!-- ===================================================================
     THE PRION PROTEIN, IN THE GLOSSARY SHAPE. dna-structure.html's page,
     as proteins/myoglobin/myoglobin-story.html wears it: one molecule
     fixed on the left, the parts scrolling past on the right.

     THREE VIEWS, ONE BOX, and they are the bench's three. The healthy fold
     (1QLZ, NMR) and one rung of the disease fibril (6LNI, cryo-EM) are
     the same human sequence, and the stack is the same 6LNI with all ten
     chains drawn. The bench (prion-test.html) settled which files; this
     page tells the story in them and nothing else.

     WHAT THIS PAGE CANNOT SHOW: the conversion. Both ends are deposited
     and the path between them has never been imaged, so the page says so
     rather than animating a guess.

     EVERY NUMBER IS READ FROM THE BAKE AT RENDER TIME: helix and strand
     fractions off the ss string, extents off the CA atoms, the rung
     spacing off consecutive chains of the stack.
     =================================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';

const ME = ProteinLib.byKey('prion');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

/* One box, re-fed. Each bake carries its own measured basis (a fibril has a
   convention, axis vertical, and the baker solves it), so no view is passed. */
const box = Proteinbox.create({
  mount: stage,
  orbit: true,
  stage: { ortho: false, turn: 'trackball' },
  pad: 1.15,
  sub: 10,
});
const TWEEN = 620;

const NOTES = Annot.create(THREE, stage, box.camera, { mode:'on' });
(function tick(){ NOTES.step(); requestAnimationFrame(tick); })();

const traces = {};
let shownId = null;

/* Where a CA atom is NOW, in world: the chain group carries the view basis,
   and the box moves its root, so the anchor is asked each frame. */
const worldAt = p => () => {
  const g = box.group;
  g.updateWorldMatrix(true, false);
  return g.localToWorld(new THREE.Vector3(p[0], p[1], p[2]));
};
const ch = t => t.chains[t.order[0]];
const centroid = P => [0, 1, 2].map(k => P.reduce((s, p) => s + p[k], 0) / P.length);

/* ---- measured off the bake ------------------------------------------------ */
const frac = (t, letter) => {
  const s = ch(t).ss;
  return Math.round(100 * [...s].filter(c => c === letter).length / s.length);
};
/* Runs of one ss letter, as [start, end] indices into CA: a helix is a run of
   H, and its label hangs on the CA at the middle of it. */
const runs = (t, letter) => {
  const out = [], s = ch(t).ss;
  for(let i = 0; i < s.length; i++){
    if(s[i] !== letter) continue;
    let j = i; while(j + 1 < s.length && s[j + 1] === letter) j++;
    out.push([i, j]); i = j;
  }
  return out;
};
const runMid = (t, [a, b]) => ch(t).CA[Math.round((a + b) / 2)];

/* Extents along the chain's own principal axes: a deposition's frame is
   wherever the depositor left it, so x, y, z would report orientation rather
   than shape. Three axes by power iteration, deflated in turn. */
function principal(P){
  const n = P.length, c = centroid(P);
  const Q = P.map(p => p.map((v, i) => v - c[i]));
  let C = [0, 1, 2].map(i => [0, 1, 2].map(j => Q.reduce((s, q) => s + q[i] * q[j], 0) / n));
  const out = [];
  for(let k = 0; k < 3; k++){
    let v = [1, 0.3, 0.1];
    for(let it = 0; it < 200; it++){
      const w = C.map(row => row.reduce((s, a, j) => s + a * v[j], 0));
      const m = Math.hypot(...w) || 1;
      v = w.map(x => x / m);
    }
    const proj = Q.map(q => q.reduce((s, x, i) => s + x * v[i], 0));
    out.push(Math.max(...proj) - Math.min(...proj));
    const lam = v.reduce((s, x, i) => s + x * C[i].reduce((t, a, j) => t + a * v[j], 0), 0);
    C = C.map((row, i) => row.map((a, j) => a - lam * v[i] * v[j]));
  }
  return out.sort((a, b) => b - a);
}
const extents = t => principal(ch(t).CA);

/* RUNG SPACING: the median centre-to-centre distance between consecutive
   chains. Median, because the deposition holds two protofilaments and the
   step from the last chain of one to the first of the other is not a rung. */
function rungs(t){
  const cs = t.order.map(id => centroid(t.chains[id].CA));
  const d = cs.slice(1).map((c, i) => Math.hypot(...c.map((v, k) => v - cs[i][k])));
  const gap = d.slice().sort((a, b) => a - b)[Math.floor(d.length / 2)];
  /* A step several rungs long is the jump from one protofilament to the next. */
  const stacks = 1 + d.filter(x => x > 3 * gap).length;
  return { gap, stacks, per: t.order.length / stacks };
}

const fileStats = (id, t) => {
  const v = ProteinLib.variantOf(ME, id), c = t.meta.counts[0];
  const per = t.order.length > 1 ? ` × ${t.order.length} chains` : '';
  return [
    [v.species, 'species'],
    [`${c.modelled} of ${c.declared}`, `residues${per}, ${Math.round(100 * c.modelled / c.declared)}%`],
    [t.meta.resolution ? t.meta.resolution.toFixed(1) + ' Å' : 'NMR', v.read.method],
  ];
};

/* =============================================================================
 *  THE PARTS
 * ========================================================================== */
const PARTS = [
  { key:'whole', id:'1QLZ', title:'Prion protein', sub:'one sequence, two shapes',
    deck:'Rendered from real data.',
    hint:'Scroll to examine each part',
    stats:t=>fileStats('1QLZ', t),
    note:t=>`A small protein that sits on the surface of nerve cells. Nobody `
      + `knows its normal job. What happens when it misfolds is the whole `
      + `story: <b>the same chain of amino acids can fold two ways</b>, and `
      + `the wrong way infects.\n\n This is the healthy fold, PrPᶜ. Three `
      + `α-helices pack into a tight bundle, ${frac(t, 'H')}% of the chain, `
      + `with a small β-sheet tucked against them. The chain's first `
      + `${ch(t).nums[0] - 1} residues stay too floppy to pin down, so the `
      + `model starts at residue ${ch(t).nums[0]}.`,
    notes:()=>[] },

  { key:'disease', id:'6LNI', title:'The disease fold', sub:'PrPˢᶜ, one rung',
    stats:t=>fileStats('6LNI', t),
    note:t=>{
      const e = extents(t);
      return `The same human sequence, refolded. Its helix count drops to `
      + `<b>${frac(t, 'H')}%</b>: every α-helix has unwound, and the chain now `
      + `lies flat as β-strands, ${e[0].toFixed(0)} Å long and ${e[2].toFixed(1)} Å `
      + `thick, one molecule deep.\n\n It lies flat because it can't stand `
      + `alone. This is one layer of a stack, and the copies above and below `
      + `it complete the sheet. Only the middle ${ch(t).nums.length} residues `
      + `hold still enough to see; the rest trails off the core as a `
      + `disordered fringe.`;
    },
    notes:t=>[
      { text:'N-terminus', card:`Residue ${ch(t).nums[0]}. Before this point the chain is too disordered to model.`,
        at:worldAt(ch(t).CA[0]), offset:[80, -70] },
      { text:'C-terminus', card:`Residue ${ch(t).nums.at(-1)}. Three helices flattened into this one strand.`,
        at:worldAt(ch(t).CA.at(-1)), offset:[80, 50] },
    ] },

  { key:'stack', id:'stack', title:'The fibril', sub:'a ladder that never ends',
    stats:t=>fileStats('stack', t),
    note:t=>{ const r = rungs(t);
      return `All ${t.order.length} chains from this file make ${r.stacks} stacks of `
      + `${r.per} rungs, lying side by side. Each rung sits ${r.gap.toFixed(1)} Å `
      + `above the one below it, the spacing of a β-sheet, and that sheet runs `
      + `the length of the fibre: <b>each molecule hydrogen-bonds to its `
      + `neighbours, not to itself.</b>\n\n The real fibre runs thousands of rungs long, `
      + `and nothing stops it growing: no cell machinery knows how to take it `
      + `apart.`; },
    notes:t=>[
      { text:'One rung', card:'The molecule from the previous part, in place. Its strands pair with the rungs above and below.',
        at:worldAt(centroid(t.chains[t.order[7]].CA)), offset:[100, -80] },
    ] },

  { key:'template', id:'stack', title:'Why it spreads', sub:'a shape that copies itself',
    note:()=>`A healthy protein that touches the fibre's end flips into the `
      + `disease fold and becomes the next rung. <b>The fibre is the `
      + `template. No gene, no enzyme, no virus: the shape itself carries `
      + `the information.</b>\n\n That's what makes a prion infectious, and `
      + `why the diseases it causes, Creutzfeldt-Jakob in people and BSE (Mad Cow Disease) in `
      + `cattle, can start three ways: people inherit it, it arises on its `
      + `own, or they catch it. Mad Cow is dangerous because it can jump to people who eat infected beef.`
+ `</b>\n\n Nobody has solved why the misfolding happens.`,
    notes:()=>[] },

  { key:'sources', id:'1QLZ', title:'An infectious protein', sub:'a new idea',
    note:()=>`Researchers solved the healthy fold by NMR in solution, where `
      + `the protein moves freely. They solved the fibril by cryo-electron `
      + `microscopy, grown in a test tube from the same human protein, not `
      + `pulled from a sick brain.\n\n Stanley Prusiner proposed that a `
      + `protein alone could infect, and the field resisted the idea for `
      + `years. He received a 1997 Nobel Prize for the work.`,
    dl:[
      ['https://doi.org/10.1073/pnas.97.1.145', 'Zahn et al., PNAS 97, 145 (2000)', 'The healthy human fold, 1QLZ, by NMR.'],
      ['https://doi.org/10.1038/s41594-020-0403-y', 'Glynn et al., Nat. Struct. Mol. Biol. 27, 417 (2020)', 'The human fibril, 6LNI, by cryo-EM.'],
      ['https://www.nobelprize.org/prizes/medicine/1997/prusiner/lecture/', 'Prusiner’s Nobel lecture (1997)', 'The prion hypothesis.'],
    ],
    notes:()=>[] },
];

const SAYS = {
  '1QLZ': 'the healthy fold',
  '6LNI': 'one rung of the disease fibril',
  'stack': 'the disease fibril, all ten chains',
};

let current = null;
function show(part){
  if(current === part) return;
  const first = current === null;
  current = part;
  const t = traces[part.id];
  const v = ProteinLib.variantOf(ME, part.id);

  NOTES.clear();
  const notes = () => { for(const n of part.notes(t)) if(n.at) NOTES.add(n); };
  for(const el of secs) el.setAttribute('aria-current', String(el.dataset.key === part.key));

  if(shownId !== part.id){
    /* ONE RUNG BECOMES THE STACK. The rung and the stack are one file in one
       frame, so the stack's other nine chains can start where the rung is
       and slide up into place, while the frame turns from the rung's face-on
       basis to the fibril's side-on one. */
    const stacking = shownId === '6LNI' && part.id === 'stack';
    const was = { r: box.cam.r, pos: box.root.position.clone() };
    shownId = part.id;
    /* Healthy against disease, in colour: rust is the disease side, the
       registry's call, so the bench and this page agree. */
    box.setData(t, { keep:true, colors: ProteinLib.colorsOf(ME, v) });
    $('specimen').innerHTML =
      `<span class="pdb">${v.source.id}</span> · ${SAYS[part.id]} · `
      + `<a href="${ProteinLib.urls(v).entry}" target="_blank" rel="noopener">at the PDB →</a>`;
    if(stacking){ stackUp(t, was, notes); return; }
  }
  box.focus(null, first ? 0 : TWEEN);
  notes();
}

/* =============================================================================
 *  THE STACK-UP
 * =============================================================================
 *  Three moves, one after another, the way myoglobin's site view changes:
 *  the rung TURNS from face-on to side-on at the distance it was seen at;
 *  the other chains APPEAR in place, bottom rung first; then the camera
 *  PULLS BACK to frame the fibril. setData has already put the stack on
 *  stage, so the page winds the frame back to the rung's and plays forward.
 *  Chains arrive one per frame while the box builds, so each is hidden the
 *  frame it appears, before it is drawn.
 * ========================================================================== */
const basisQ = b => new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().set(
  b[0][0], b[0][1], b[0][2], 0,  b[1][0], b[1][1], b[1][2], 0,
  b[2][0], b[2][1], b[2][2], 0,  0, 0, 0, 1));
let stackRun = 0;
function stackUp(t, was, done){
  const run = ++stackRun;
  const TURN = 900, STAGGER = 70, PAUSE = 200;
  const qFrom = basisQ(traces['6LNI'].view), qTo = basisQ(t.view);
  /* The rung's centre in the structure's own coordinates: the box parks root
     at minus the ROTATED centre, so the point has to be turned back out of
     the rung's basis and turned again by each frame's, or the rung swings
     off the stage as it turns. */
  const mid = was.pos.clone().negate().applyQuaternion(qFrom.clone().invert());

  const rung = t.order[0];
  const rank = {}; t.order.forEach((id, i) => { rank[id] = i; });
  const shown = new Set([rung]);
  const t0 = performance.now();
  (function step(){
    if(run !== stackRun) return;
    const now = performance.now() - t0;
    /* The rung's own framing, HELD: the box re-fits the camera for the whole
       stack as each chain lands, and the turn has to happen where the rung
       was seen from or the pull-back has already happened. */
    box.cam.r = was.r;
    // 1. the turn
    const k = Math.min(1, now / TURN), e = k * k * (3 - 2 * k);
    box.group.quaternion.copy(qFrom).slerp(qTo, e);
    box.root.position.copy(mid).applyQuaternion(box.group.quaternion).negate();
    // 2. the rungs, in order, once the turn is done
    const due = Math.floor((now - TURN - PAUSE) / STAGGER) + 1;
    for(const m of box.group.children){
      const id = m.userData && m.userData.chain;
      if(!id) continue;
      if(!shown.has(id) && rank[id] < due) shown.add(id);
      m.visible = shown.has(id);
    }
    box.applyCam();
    box.draw();
    if(box.building || shown.size < t.order.length) requestAnimationFrame(step);
    else { box.focus(null, TWEEN); done(); }     // 3. the pull-back
  })();
}

const claim = t => t.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean)
  .map(x => `<p class="claim">${x}</p>`).join('');
const tiles = st => !st ? '' : '<div class="measure">' + st.map(([n, l]) =>
  `<div><span class="n">${n}</span><span class="l">${l}</span></div>`).join('') + '</div>';
const terms = dl => !dl ? '' : '<dl>' + dl.map(([href, name, why]) =>
  `<dt><a href="${href}" target="_blank" rel="noopener">${name}</a></dt><dd>${why}</dd>`).join('') + '</dl>';

let secs = [];
const NEEDED = [...new Set(PARTS.map(p => p.id))];
Promise.all(NEEDED.map(id => {
  const v = ProteinLib.variantOf(ME, id);
  return fetch(`data/${v.read.baked}`).then(r => r.json()).then(t => { traces[id] = t; });
})).then(() => {
  const host = $('sections');
  secs = PARTS.map((part, i) => {
    const el = document.createElement('section');
    el.dataset.key = part.key;
    el.innerHTML =
      `<p class="num">${String(i + 1).padStart(2, '0')} / ${String(PARTS.length).padStart(2, '0')}</p>`
      + `<h3>${part.title}</h3>`
      + `<p class="gloss">${part.sub}</p>`
      + (part.deck ? `<p class="deck">${part.deck}</p>` : '')
      + claim(part.note(traces[part.id]))
      + tiles(part.stats && part.stats(traces[part.id]))
      + terms(part.dl)
      + (part.hint ? `<p class="hint">${part.hint}</p>` : '');
    host.appendChild(el);
    return el;
  });

  show(PARTS[0]);

  Story.scroll(secs, i => show(PARTS[i]));
});

window.page = { box, traces, get showing(){ return current && current.key; } };
</script>
