<!-- ===================================================================
     ATP SYNTHASE, IN THE GLOSSARY SHAPE. prion-story.html's page: one
     molecule fixed on the left, the parts scrolling past on the right.

     THREE FILES, the bench's three. The whole human enzyme (8H9S, cryo-EM)
     carries every part about the machine and the turn; two β subunits of
     one bovine crystal (1BMF, open and DP, superposed on the P-loop) carry
     the site. Different organism, different frame: the switch between them
     is a cut, never a tween.

     THE TURN IS A RIGID ROTATION of 8H9S's own rotor coordinates about the
     axis the baker measured. The head's shape change as it turns is the
     chemistry and is NOT animated; the page says so.

     EVERY NUMBER IS READ FROM THE BAKE AT RENDER TIME: subunit counts off
     `meta.roles`, what a site holds off `meta.bound`, the axis agreement
     off `spin`.
     =================================================================== -->

<script>
'use strict';

const ME = ProteinLib.byKey('atp-synthase');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

const box = Proteinbox.create({
  mount: stage,
  view: ProteinLib.viewOf(ME),
  orbit: true,
  stage: { ortho: false, turn: 'trackball' },
  pad: 1.15,
  sub: 10,
});
const TWEEN = 620;
/* The P-loop and what it holds, with the domain around it faded. */
const SITE_R = 13;
const GHOST = 0.18;

const NOTES = Annot.create(THREE, stage, box.camera, { mode:'on' });
(function tick(){ NOTES.step(); requestAnimationFrame(tick); })();

/* Callout tints are the ribbon's own role colours, written from the registry
   table the chains are painted from. */
{
  const hex = n => '#' + n.toString(16).padStart(6, '0');
  const el = document.createElement('style');
  el.textContent = Object.entries(ME.draw.byRole).map(([role, n]) =>
    `.annot-${role} .annot-dot{border-color:${hex(n)}}.annot-${role} .annot-label{color:${hex(n)}}`).join('');
  document.head.appendChild(el);
}

const traces = {};
let shownId = null, pocket = null, current = null;

/* ---- measured off the bake ------------------------------------------------ */
const roleOf = (t, id) => t.meta.roles[id];
const chainsOf = (t, subs) => {
  const want = new Set(subs.split(','));
  return t.order.filter(id => want.has(roleOf(t, id).subunit));
};
const count = (t, sub) => chainsOf(t, sub).length;
const centroidOf = (t, ids) => {
  const c = [0, 0, 0]; let n = 0;
  for(const id of ids) for(const p of t.chains[id].CA){ c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; n++; }
  return c.map(v => v / n);
};
const subunitKinds = t => new Set(t.order.map(id => roleOf(t, id).subunit)).size;

/* An anchor is an Object3D in the chain group, so it moves with whatever the
   box does to the group, and with the rotor's pivot if it is parented there. */
const V = new THREE.Vector3();
function anchorAt(p, parent){
  const a = new THREE.Object3D();
  a.userData.anchor = true;
  a.position.set(p[0], p[1], p[2]);
  (parent || box.group).add(a);
  return () => a.getWorldPosition(new THREE.Vector3());
}
const partAt = (t, subs) => anchorAt(centroidOf(t, chainsOf(t, subs)));
/* The middle CA of one chain: gamma's shaft, IF1's wedge. */
const midCA = (t, id) => { const P = t.chains[id].CA; return P[P.length >> 1]; };
const siteAt = (t, group, chain) => {
  const mine = a => a.group === group && (!chain || a.chain === chain);
  const i = t.site.atoms.findIndex(a => mine(a) && (group !== 'bound' || a.el === 'P'));
  const k = i < 0 ? t.site.atoms.findIndex(mine) : i;
  const mesh = pocket.group.children[k];
  return () => mesh.getWorldPosition(V.clone());
};
const siteCentre = t => {
  const g = t.site.atoms.filter(a => a.group === 'grip');
  return [0, 1, 2].map(k => g.reduce((s, a) => s + a.p[k], 0) / g.length);
};
/* A site with only the atoms `keep` passes, bonds re-indexed to match. */
function siteOnly(site, keep){
  const atoms = [], at = new Map();
  site.atoms.forEach((a, i) => { if(keep(a)){ at.set(i, atoms.length); atoms.push(a); } });
  return { atoms, bonds: site.bonds.filter(([i, j]) => at.has(i) && at.has(j)).map(([i, j]) => [at.get(i), at.get(j)]) };
}
const holding = (t, res) => [...new Set(t.site.atoms.filter(a => a.res === res).map(a => a.chain))];
const held = t => (t.meta.bound || []).filter(x => x !== 'MG').join(' + ');

const fileStats = (id, t) => {
  const v = ProteinLib.variantOf(ME, id), cs = t.meta.counts;
  const mod = cs.reduce((s, c) => s + c.modelled, 0), dec = cs.reduce((s, c) => s + c.declared, 0);
  const n = t.order.length;
  return [
    [n > 1 ? `${n}` : v.species, n > 1 ? `chains, ${subunitKinds(t)} kinds of subunit` : 'species'],
    [`${mod}`, `residues modelled, ${Math.floor(100 * mod / dec)}% of ${dec}`],
    [t.meta.resolution.toFixed(2) + ' Å', v.read.method],
  ];
};

/* =============================================================================
 *  THE PARTS
 * ========================================================================== */
const PARTS = [
  { key:'whole', id:'human', title:'ATP synthase', sub:'the motor that makes ATP',
    deck:'Rendered from real data.',
    hint:'Scroll to examine each part',
    stats:t=>fileStats('human', t),
    note:t=>`Your body turns over roughly its own weight in ATP every day, `
      + `almost all of it from this enzyme in the inner mitochondrial `
      + `membrane.\n\n It is a <b>rotary motor</b>: protons spin the bottom, `
      + `and the turning shaft squeezes ATP out of the top. The human enzyme, `
      + `${t.order.length} protein chains, coloured by job.`,
    notes:()=>[] },

  { key:'parts', id:'human', title:'Protons turn the rotor', sub:'rotor and stator',
    note:t=>`The electron transport chain pumps protons out of the matrix, `
      + `and they want back in. This is the only door.\n\n The <b>rotor</b>, `
      + `in blue, is a ring of ${count(t, 'c')} c-subunits in the membrane `
      + `with a shaft (γ) up its middle. A proton enters one half-channel in `
      + `<b>subunit a</b>, rides the ring almost a full circle, and leaves `
      + `through the other, pushing the ring one step. ${count(t, 'c')} `
      + `protons turn it once.\n\n Everything else is the <b>stator</b>: `
      + `the green head of ${count(t, 'α')} α and ${count(t, 'β')} β, and the `
      + `tan stalk that holds it still against the shaft.`,
    notes:t=>[
      { text:'head · α₃β₃', tone:'head', card:'Where ATP is made. It never turns.',
        at:partAt(t, 'α,β'), offset:[60, -40] },
      { text:`rotor · ${count(t, 'c')} c + γ`, tone:'rotor', card:'Turns as one rigid piece. Each c-subunit carries a proton on a glutamate.',
        at:partAt(t, 'c'), offset:[-170, 30] },
      /* b and d, not the whole stalk: OSCP caps the head, and averaging it
         in pulls the anchor onto the green. */
      { text:'stalk', tone:'stalk', card:'Without it the head would spin with the shaft.',
        at:partAt(t, 'b,d'), offset:[60, 10] },
      { text:'subunit a', tone:'membrane', card:'Two offset half-channels, one open to each side.',
        at:partAt(t, 'a'), offset:[70, 40] },
    ] },

  { key:'turn', id:'human', title:'The turn', sub:'three ATP per revolution', spin:true,
    note:t=>{
      const c = count(t, 'c'), b = count(t, 'β');
      return `The shaft is bent. As it turns inside the head it presses on `
      + `each of the ${b} β subunits in sequence, forcing its catalytic site `
      + `through three shapes: <b>open, gripping, releasing</b>. One full `
      + `turn makes ${b} ATP, from ${c} protons, about `
      + `${(c / b).toFixed(1)} protons per ATP.\n\n The real enzyme spins over `
      + `a hundred times a second; here it is slowed. Every third of a turn `
      + `one β site opens, releasing ATP and taking in ADP and phosphate. `
      + `The head's own flexing is not drawn. The next part shows it.`;
    },
    notes:t=>[
      { text:'γ shaft', tone:'rotor', card:'Off-centre, so each third of a turn deforms a different β.',
        at:anchorAt(midCA(t, chainsOf(t, 'γ')[0])), offset:[-150, -30] },
    ],
    /* The axis and how well it was measured are the baker's. */
    caption:t=>`rotor turned rigidly about an axis measured two ways, agreeing to ${t.spin.spread.degrees}°; protons and nucleotides drawn` },

  { key:'open', id:'open', close:true, title:'An empty site', sub:'one β subunit, up close',
    stats:t=>fileStats('open', t),
    note:t=>`Zoom in on one β subunit. The loop of backbone that grips a `
      + `nucleotide's phosphates, the <b>P-loop</b>, spans residues `
      + `${t.meta.grip[0]}–${t.meta.grip[1]}. Right now it holds `
      + `${t.meta.bound ? held(t) : '<b>nothing</b>'}.\n\n This is the open `
      + `state, waiting for ADP and phosphate. This is a cow's enzyme, whose `
      + `head is nearly identical to yours and was solved sharply enough to `
      + `see inside one site.`,
    notes:t=>[
      { text:'P-loop, empty', card:'The grip, with nothing to grip.',
        at:siteAt(t, 'grip'), offset:[60, -50] },
    ] },

  { key:'dp', id:'dp', close:true, title:'The hard part is letting go', sub:'binding change',
    note:t=>`A third of a turn later, the same site holds `
      + `<b>${held(t)}</b>. It is laid over the first on its P-loop, so the `
      + `site stays put and the rest of the subunit swings.\n\n The surprise: `
      + `inside a closed `
      + `site, ADP and phosphate join into ATP almost for free. <b>The `
      + `energy from the turn goes into prying the site open</b> so the `
      + `ATP can leave. Paul Boyer predicted this; John Walker's structure `
      + `showed it.`,
    notes:t=>[
      { text:held(t), tone:'phosphorus', card:'Product made and still held. The next push of the shaft releases it.',
        at:siteAt(t, 'bound'), offset:[60, -50] },
    ] },

  { key:'reverse', id:'human', title:'It runs backward', sub:'and needs a brake',
    note:t=>`Nothing in the motor decides its direction. The gradient does. `
      + `Cut off oxygen, the proton gradient collapses, and the enzyme turns `
      + `the other way: <b>it spends ATP to pump protons</b>, draining the `
      + `cell's supply.\n\n The violet chain is <b>IF1</b>, a separate `
      + `${t.chains[chainsOf(t, 'IF1')[0]].nums.length}-residue protein `
      + `that wedges into the head and jams the reverse direction only. `
      + `Bacteria use the same machine both ways on purpose.`,
    notes:t=>[
      { text:'IF1 · the brake', tone:'brake', card:'Blocks ATP-burning rotation, not ATP-making.',
        at:anchorAt(midCA(t, chainsOf(t, 'IF1')[0])), offset:[-160, -40] },
    ] },

  { key:'sources', id:'human', title:'Where the pictures come from', sub:'two structures, thirty years apart',
    note:()=>`The site views are X-ray crystallography of the enzyme's head `
      + `alone. The whole machine is cryo-electron microscopy, which can image `
      + `a particle this large with its membrane parts attached.\n\n Boyer `
      + `and Walker shared the 1997 Nobel Prize in Chemistry for how ATP `
      + `synthase works.`,
    dl:[
      ['https://doi.org/10.1038/370621a0', 'Abrahams et al., Nature 370, 621 (1994)', 'The bovine head, 1BMF, with its three sites in three states.'],
      ['https://doi.org/10.1016/j.molcel.2023.04.029', 'Lai et al., Mol. Cell 83, 2137 (2023)', 'The whole human enzyme, 8H9S, by cryo-EM.'],
      ['https://www.nobelprize.org/prizes/chemistry/1997/summary/', 'Nobel Prize in Chemistry (1997)', 'Boyer and Walker, for the mechanism.'],
    ],
    notes:()=>[] },
];

const SAYS = {
  human: 'the whole human enzyme',
  open: 'one β subunit, site empty',
  dp: 'the neighbouring β, holding product',
};

/* =============================================================================
 *  THE TURN
 * =============================================================================
 *  The bench's spin: rotor meshes, found by `userData.chain`, re-parented into
 *  a pivot on the measured axis. Harvested on a timer rather than rAF, since
 *  the box builds a chain per frame and rAF stops in a hidden tab.
 * ========================================================================== */
const DEG_PER_SEC = 30;
let pivot = null, angle = 0, turned = 0, drive = 0, lastT = 0;
const AXIS = new THREE.Vector3();

function collect(t){
  const P = t.spin.point;
  if(!pivot){
    for(const c of [...box.group.children]) if(c.userData && c.userData.pivot) box.group.remove(c);
    pivot = new THREE.Group();
    pivot.userData.pivot = true;
    pivot.position.set(P[0], P[1], P[2]);
    box.group.add(pivot);
  }
  const moving = new Set(t.spin.chains);
  for(const m of [...box.group.children]){
    if(m === pivot || !m.userData || !moving.has(m.userData.chain)) continue;
    m.position.set(-P[0], -P[1], -P[2]);
    pivot.add(m);
  }
}
setInterval(() => { if(shownId === 'human') collect(traces.human); }, 200);

/* =============================================================================
 *  THE FLOW: protons through the ring, ADP + Pi into the head, ATP out
 * =============================================================================
 *  DRAWN, NOT DEPOSITED. No map shows a proton and no file catches a
 *  nucleotide in transit, so both are clocked off the rotor angle. What they
 *  ride and where they go are the file's: each c-subunit's Glu58, subunit a,
 *  and each β's P-loop.
 *
 *  POSITIVE ANGLE IS SYNTHESIS. The baker's axis points from the c-ring to
 *  the head, and synthesis turns the rotor counterclockwise seen from the
 *  head: a right-handed turn about that axis.
 *
 *  WHICH SITE OPENS NEXT is inference. The β this file holds empty is the one
 *  that just let go, and the sites open in the direction of rotation.
 * ========================================================================== */
const GLU = 58, PLOOP = [160, 167];
const BOARD = 20, ALIGHT = 340;     // degrees past subunit a: the two half-channels
const FACE = 24;                    // Å either side of the ring's middle a proton is drawn from and to
const HOP = 0.9;                    // s, into or out of a half-channel
const DRIFT = 72;                   // Å a nucleotide travels from its site: far enough to clear the head
const OUT_S = 2.8, IN_S = 2.6, IN_DELAY = 0.6;

const flow = (() => {
  let geo = null;
  const live = [];
  const pools = {};
  const V3 = (p) => new THREE.Vector3(p[0], p[1], p[2]);

  function measure(t){
    const A = V3(t.spin.axis).normalize(), P = V3(t.spin.point);
    const rel = p => V3(p).sub(P);
    const flat = v => v.clone().addScaledVector(A, -v.dot(A));
    const aC = rel(centroidOf(t, chainsOf(t, 'a')));
    const u = flat(aC).normalize(), w = new THREE.Vector3().crossVectors(A, u);
    const az = v => (Math.atan2(v.dot(w), v.dot(u)) * 180 / Math.PI + 360) % 360;
    const mid = rel(centroidOf(t, chainsOf(t, 'c'))).dot(A);
    const glu = chainsOf(t, 'c').map(id => {
      const ch = t.chains[id], i = ch.nums.indexOf(GLU);
      return i < 0 ? null : { local: rel(ch.CA[i]), az: az(rel(ch.CA[i])) };
    }).filter(Boolean);
    const empty = new Set(holding(t, 'ADP').concat(holding(t, 'ATP')));
    let betas = chainsOf(t, 'β').map(id => {
      const ch = t.chains[id];
      const pts = ch.CA.filter((p, i) => ch.nums[i] >= PLOOP[0] && ch.nums[i] <= PLOOP[1]);
      const n = pts.length;
      const c = rel(pts.reduce((s, p) => [s[0] + p[0] / n, s[1] + p[1] / n, s[2] + p[2] / n], [0, 0, 0]));
      return { id, at: c, az: az(c), out: flat(c).normalize().addScaledVector(A, 0.35).normalize(), empty: !empty.has(id) };
    });
    const open = betas.find(b => b.empty) || betas[0];
    betas.sort((a, b) => ((a.az - open.az + 360) % 360) - ((b.az - open.az + 360) % 360));
    const edge = flat(aC);
    return { A, P, glu, betas,
      from: edge.clone().addScaledVector(A, mid - FACE).add(P),
      to:   edge.clone().addScaledVector(A, mid + FACE).add(P) };
  }

  const ease = k => k * k * (3 - 2 * k);
  const gluAt = (g, deg) => g.local.clone().applyAxisAngle(geo.A, deg * Math.PI / 180).add(geo.P);

  function take(kind, make){
    const pool = pools[kind] || (pools[kind] = []);
    let m = pool.find(x => !x.visible);
    if(!m){ m = make(); pool.push(m); box.group.add(m); }
    if(m.parent !== box.group) box.group.add(m);
    m.visible = true;
    return m;
  }
  /* Glu58 sits mid-membrane, buried between c-subunits, so a proton riding it
     is drawn through the ribbon or it cannot be seen at all. */
  const PROTON_R = 1.8, BADGE = 4, PILL = 6;   // Å
  const PROTON_GEO = new THREE.SphereGeometry(PROTON_R, 16, 12);
  const PROTON_MAT = new THREE.MeshStandardMaterial({ color: MolLib.PALETTE.respiration.proton,
    emissive: MolLib.PALETTE.respiration.proton, emissiveIntensity: .5, roughness: .4,
    depthTest: false, transparent: true, opacity: .95 });
  /* The membrane lesson's proton: a + badge in Parts' darkened steel. */
  const kit = AtomKit.create(THREE);
  const proton = () => take('H', () => {
    const m = new THREE.Mesh(PROTON_GEO, PROTON_MAT);
    m.renderOrder = 10;
    const b = kit.charge('+', Parts.ionBadge('H'), 'H', BADGE / .62);
    b.material.depthTest = false;
    b.position.set(PROTON_R * .8, PROTON_R * .8, 0);
    m.add(b);
    return m;
  });
  /* A name pill rides beside each nucleotide rather than inside its group,
     so it stays upright while the molecule tumbles. Words off the specs. */
  const NAME = { atp: MolLib.MOLECULES.atp.short, adp: MolLib.MOLECULES.atp.gly.spent.short,
                 pi: MolLib.MOLECULES.pi.short };
  function tagFor(g, kind){
    if(!g.userData.tag){
      g.userData.tag = kit.pill(NAME[kind], PILL);
      box.group.add(g.userData.tag);
    }
    return g.userData.tag;
  }
  /* A carrier spec is in scene units; the box is in ångströms. ADP is ATP
     without the γ phosphoryl, the four atoms the spec names. */
  function molecule(kind){
    return take(kind, () => {
      const spec = MolLib.MOLECULES[kind === 'pi' ? 'pi' : 'atp'];
      const g = Stage.buildMolecule(spec, { center: true });
      if(kind === 'adp'){
        const gone = new Set(spec.gly.gamma), nb = (spec.bonds || []).length;
        g.children.forEach((m, i) => {
          if(i < nb ? m.userData.pair.some(k => gone.has(k)) : gone.has(i - nb)) m.visible = false;
        });
      }
      /* Drawn through the head, as the protons are through the ring: a site
         opening on the far side is still the event. Cloned, since Stage
         shares its materials. */
      g.traverse(m => { if(m.material){ m.material = m.material.clone(); m.material.depthTest = false; m.renderOrder = 11; } });
      g.scale.setScalar(1 / MolLib.SCALE);
      g.userData.size = 1 / MolLib.SCALE;
      return g;
    });
  }
  const withTag = (kind) => { const m = molecule(kind); const tag = tagFor(m, kind); tag.visible = false; return { m, tag }; };

  function step(t, prev, now, dt){
    if(!geo) geo = measure(t);
    for(const g of geo.glu){
      const crossed = d => Math.floor((g.az + prev - d) / 360) < Math.floor((g.az + now - d) / 360);
      if(crossed(BOARD)) live.push({ kind: 'H', m: proton(), g, phase: 'in', clock: 0, at: now });
    }
    if(Math.floor(prev / 120) < Math.floor(now / 120)){
      const site = geo.betas[Math.floor(now / 120) % 3];
      const home = site.at.clone().add(geo.P);
      const side = new THREE.Vector3().crossVectors(geo.A, site.out).normalize();
      live.push({ kind: 'mol', ...withTag('atp'), from: home, to: home.clone().addScaledVector(site.out, DRIFT), clock: 0, delay: 0, dur: OUT_S, leaving: true });
      for(const [kind, off] of [['adp', 7], ['pi', -7]])
        live.push({ kind: 'mol', ...withTag(kind), to: home.clone().addScaledVector(side, off * .3),
          from: home.clone().addScaledVector(site.out, DRIFT).addScaledVector(side, off), clock: 0, delay: IN_DELAY, dur: IN_S });
    }
    for(let i = live.length - 1; i >= 0; i--){
      const x = live[i];
      x.clock += dt;
      let done = false;
      if(x.kind === 'H'){
        if(x.phase === 'in'){
          const k = Math.min(1, x.clock / HOP);
          x.m.position.copy(geo.from).lerp(gluAt(x.g, now), ease(k));
          if(k >= 1){ x.phase = 'ride'; x.at = now; }
        } else if(x.phase === 'ride'){
          x.m.position.copy(gluAt(x.g, now));
          if(now - x.at >= ALIGHT - BOARD){ x.phase = 'out'; x.clock = 0; x.start = x.m.position.clone(); }
        } else {
          const k = Math.min(1, x.clock / HOP);
          x.m.position.copy(x.start).lerp(geo.to, ease(k));
          x.m.scale.setScalar(k < .7 ? 1 : 1 - (k - .7) / .3 + 1e-3);
          done = k >= 1;
        }
      } else {
        const k = Math.max(0, Math.min(1, (x.clock - x.delay) / x.dur));
        x.m.visible = x.clock >= x.delay;
        x.m.position.copy(x.from).lerp(x.to, ease(k));
        x.m.rotation.y += dt * .7; x.m.rotation.x += dt * .3;
        const fade = x.leaving ? (k < .8 ? 1 : 1 - (k - .8) / .2) : (k < .85 ? Math.min(1, k * 6) : 1 - (k - .85) / .15);
        x.m.scale.setScalar(x.m.userData.size * Math.max(1e-3, fade));
        x.tag.visible = x.m.visible;
        x.tag.position.copy(x.m.position).addScaledVector(geo.A, PILL * 1.4);
        x.tag.scale.set(x.tag.scale.x / (x.tag.scale.y || 1) * PILL * Math.max(1e-3, fade), PILL * Math.max(1e-3, fade), 1);
        done = k >= 1;
      }
      if(done){ x.m.visible = false; if(x.tag) x.tag.visible = false; x.m.scale.setScalar(x.kind === 'H' ? 1 : x.m.userData.size); live.splice(i, 1); }
    }
  }

  function clear(){
    for(const x of live){ x.m.visible = false; if(x.tag) x.tag.visible = false; if(x.kind === 'H') x.m.scale.setScalar(1); }
    live.length = 0;
    for(const pool of Object.values(pools)) for(const m of pool){ m.visible = false; if(m.userData.tag) m.userData.tag.visible = false; }
  }
  /* setData empties the chain group, pooled meshes with it. */
  function reset(){
    clear();
    for(const pool of Object.values(pools)) for(const m of pool){
      if(m.userData.tag){ kit.forget(m.userData.tag); box.group.remove(m.userData.tag); }
      m.traverse(c => { if(c.isSprite) kit.forget(c); });
    }
    for(const k of Object.keys(pools)) delete pools[k];
  }
  return { step, clear, reset, get live(){ return live.length; } };
})();

/* One clock for the rotor and everything it carries, so a test can drive it
   where rAF does not run. The rotor does not glide: each proton through
   subunit a advances the ring one c-subunit, 360/c degrees, then it dwells
   until the next. `drive` is the steady clock; `turned` is where the rotor is. */
const MOVE = 0.3;   // fraction of each step spent moving
function advance(dt){
  if(!(current && current.spin && pivot)) return;
  const t = traces.human, prev = turned;
  drive += DEG_PER_SEC * dt;
  const stepDeg = 360 / count(t, 'c'), n = Math.floor(drive / stepDeg);
  const k = Math.min(1, (drive / stepDeg - n) / MOVE);
  turned = stepDeg * (n + k * k * (3 - 2 * k));
  angle = turned % 360;
  const s = t.spin.axis;
  AXIS.set(s[0], s[1], s[2]);
  pivot.setRotationFromAxisAngle(AXIS, angle * Math.PI / 180);
  flow.step(t, prev, turned, dt);
  box.draw();
}
(function spin(now){
  requestAnimationFrame(spin);
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  advance(dt);
})(0);

/* =============================================================================
 *  SHOWING A PART
 * ========================================================================== */
function show(part){
  if(current === part) return;
  const first = current === null;
  current = part;
  const t = traces[part.id];
  const v = ProteinLib.variantOf(ME, part.id);

  NOTES.clear();
  for(const el of secs) el.setAttribute('aria-current', String(el.dataset.key === part.key));

  if(shownId !== part.id){
    /* open and dp are superposed, so the camera stays; the human enzyme is
       another frame, so the box re-fits. */
    const sameFrame = shownId && v.group === ProteinLib.variantOf(ME, shownId).group;
    shownId = part.id;
    pivot = null; angle = 0; turned = 0; drive = 0;
    flow.reset();
    box.setData(t, { keep: !!sameFrame, colors: v.group === 'sites' ? null : ProteinLib.colorsOf(ME, v) });
  }
  if(!part.spin) flow.clear();
  /* During the turn the β sites are the animation's, so only α keeps what
     the file holds. */
  pocket = !t.site ? null : box.setPocket(part.spin
    ? siteOnly(t.site, a => roleOf(t, a.chain).subunit === 'α') : t.site);
  for(const c of [...box.group.children]) if(c.userData && c.userData.anchor) box.group.remove(c);

  $('specimen').innerHTML =
    `<span class="pdb">${v.source.id}</span> · ${part.caption ? part.caption(t) : SAYS[part.id]} · `
    + `<a href="${ProteinLib.urls(v).entry}" target="_blank" rel="noopener">at the PDB →</a>`;

  box.focus(part.close
    ? { at:siteCentre(t), radius:SITE_R, ghost:GHOST }
    : null, first ? 0 : TWEEN);
  for(const n of part.notes(t)) if(n.at) NOTES.add(n);
  box.draw();
}

const claim = t => t.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean)
  .map(x => `<p class="claim">${x}</p>`).join('');
const tiles = st => !st ? '' : '<div class="measure">' + st.map(([n, l]) =>
  `<div><span class="n">${n}</span><span class="l">${l}</span></div>`).join('') + '</div>';
const terms = dl => !dl ? '' : '<dl>' + dl.map(([href, name, why]) =>
  `<dt><a href="${href}" target="_blank" rel="noopener">${name}</a></dt><dd>${why}</dd>`).join('') + '</dl>';

let secs = [];
const NEEDED = [...new Set(PARTS.map(p => p.id))];
Promise.all(NEEDED.map(id => {
  const v = ProteinLib.variantOf(ME, id);
  return fetch(`data/${v.read.baked}`).then(r => r.json()).then(t => { traces[id] = t; });
})).then(() => {
  const host = $('sections');
  secs = PARTS.map((part, i) => {
    const el = document.createElement('section');
    el.dataset.key = part.key;
    el.innerHTML =
      `<p class="num">${String(i + 1).padStart(2, '0')} / ${String(PARTS.length).padStart(2, '0')}</p>`
      + `<h3>${part.title}</h3>`
      + `<p class="gloss">${part.sub}</p>`
      + (part.deck ? `<p class="deck">${part.deck}</p>` : '')
      + claim(part.note(traces[part.id]))
      + tiles(part.stats && part.stats(traces[part.id]))
      + terms(part.dl)
      + (part.hint ? `<p class="hint">${part.hint}</p>` : '');
    host.appendChild(el);
    return el;
  });

  show(PARTS[0]);
  Story.scroll(secs, i => show(PARTS[i]));
});

window.page = { box, traces, advance, flow, get showing(){ return current && current.key; } };
</script>
