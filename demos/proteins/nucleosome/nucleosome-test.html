<!-- ===================================================================
     SCRATCH. Not a lesson, not linked from anywhere but admin.html.

     WHY THIS ENTRY. It is the highest-value structure on the wishlist
     and it was the last one gated on engineering rather than on choice:
     eight histones and 146 base pairs, and until kit/nucleic.js existed
     the DNA baked as nothing at all. It is also the answer to a question
     a student asks and a textbook diagram dodges — two metres of DNA in
     a nucleus ten microns across, and this is the first fold of it.

     IT IS proteins/zif268/ AT TWENTY TIMES THE SIZE and NOT A NEW
     MECHANISM: one centre solved over both polymers, one frame, two
     vocabularies in one scene. Building the small one first is why this
     one is a content decision rather than three untested things at once.

     WHAT TO LOOK AT:

       the wrap           1.65 turns, and it should read as a spool
                          rather than as a tangle. The frame is SOLVED
                          here, unlike the duplexes: a nucleosome is a
                          disc, so its shortest axis is the superhelical
                          one and "shortest into the screen" is the
                          face-on view a textbook draws.
       the ladder at size 146 rungs. If base pairing stops reading at
                          this scale, the ladder is a card-sized idea and
                          a lesson would want the tube instead.
       what is missing    the tails. Every histone chain simply starts
                          late, and the two copies of one histone do not
                          start at the same residue — a fact about what
                          was ordered enough to see, not about the
                          protein. The tails carry the marks the whole of
                          chromatin regulation is about, so the file
                          holds the SPOOL and the page has to say the
                          rest is unseen.

     WHAT IT STILL DOES NOT TEST. An internal break in a NUCLEIC chain.
     Every chain here is contiguous with its missing residues at the
     termini, and no duplex or RNA in the repo has an unmodelled stretch
     in the middle, so kit/nucleic.js's `runs()` has never split a strand.
     The protein side of that question is long settled — ferritin,
     collagen, rnase and three others carry internal breaks, and
     kit/proteinbox.js's `runs()` draws them. Two functions with one
     name, and only one of them is untested.
     =================================================================== -->

<body>

<div id="app">
  <div id="stage"></div>
  <div class="panel">
    <h1>The nucleosome</h1>
    <p class="deck">146 base pairs wound 1.65 turns around eight histones —
      the first fold in getting two metres of DNA into a ten-micron nucleus.</p>

    <h2>what is drawn</h2>
    <div class="row"><label><input type="checkbox" id="protein" checked> protein</label></div>
    <div class="row"><label><input type="checkbox" id="dna" checked> DNA</label></div>
    <div class="row"><label><input type="checkbox" id="byhist" checked> colour by histone</label></div>
    <div class="row"><label>samples / nt</label><input type="range" id="sub" min="2" max="16" value="8"></div>
    <div id="tris"></div>

    <h2>colour</h2>
    <div id="legend"></div>

    <h2>the claim</h2>
    <p class="claim" id="lede">Loading…</p>

    <h2>measured, not typed</h2>
    <table id="facts"></table>

    <p class="src">
      <a id="d-rcsb" href="https://www.rcsb.org/" target="_blank" rel="noopener"><span id="d-rcsb-label">RCSB entry</span><svg class="ext" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2h5.5v5.5M10 2 4.5 7.5M8 9.5H2V3.5"/></svg></a>
      <a href="data/">what this page loads</a>
    </p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../lib/palette.js"></script>
<script src="../../lib/tokens-from-palette.js"></script>
<script src="../../lib/molecules.js"></script>
<script src="../../lib/scene.js"></script>
<script src="../../kit/card-stage.js"></script>
<script src="../../kit/ribbon.js"></script>
<script src="../../kit/nucleic.js"></script>
<script src="../nucleic-acids.js"></script>
<script>
'use strict';

/* ONE SCENE, TWO POLYMERS, ONE SCALE FAMILY. Both are real angstroms out of
   the same deposition, which is what lets them share a stage at all
   (MolecularGeometry.md 1.5). The bench builds its own CardStage rather than
   going through kit/proteinbox.js because that module has no nucleic branch
   yet — this page is the argument for giving it one, not a use of it. */
const box = CardStage.create({
  mount: document.getElementById('stage'),
  stage: { ortho: true, turn: 'trackball' },
  cam: { theta: 0, phi: Math.PI / 2, r: 90 },
  autoplay: false,
});

/* COLOUR COMES FROM lib/palette.js AND NOWHERE ELSE. The ribbon takes the
   house ss palette — the same three colours every other protein in the repo
   wears — and the ladder takes the base family. Two vocabularies, one source. */
const mats = {};
const mat = (key, color) => (mats[key] = mats[key] || new THREE.MeshStandardMaterial({
  color, roughness: 0.5, metalness: 0.0, side: THREE.DoubleSide }));
const baseMat = b => mat('base:' + b,
  MolPalette.bases[b] !== undefined ? MolPalette.bases[b] : MolPalette.bases.X);
const ssMat = c => mat('ss:' + c, MolPalette.ss[c]);

let trace = null;
const group = new THREE.Group();
box.root.add(group);

function clear() {
  for (const c of group.children.slice()) {
    group.remove(c);
    if (c.geometry) c.geometry.dispose();
  }
}

/* Contiguous runs on the numbers, the same rule kit/nucleic.js and
   kit/proteinbox.js both apply: a ribbon splined across an unmodelled stretch
   is indistinguishable from data at ribbon width. */
function runs(ch) {
  const out = [];
  let from = 0;
  for (let i = 1; i <= ch.nums.length; i++)
    if (i === ch.nums.length || ch.nums[i] !== ch.nums[i - 1] + 1) {
      out.push({ CA: ch.CA.slice(from, i), ss: ch.ss.slice(from, i) });
      from = i;
    }
  return out;
}

/* ONE GEOMETRY PER CONTIGUOUS RUN, COLOURED BY ITS OWN GROUPS. RibbonLib
   stamps geometry groups with material index 0/1/2 for coil, helix and strand,
   so three colours come out of one build and the caller passes an array.

   DO NOT SLICE THE CHAIN AND BUILD PER ELEMENT. It is the obvious way to get
   three colours and kit/ribbon.js's header says why not: the arrowhead logic
   re-runs on every slice, so every strand grows a duplicate head, and the
   bands come out as disconnected fragments with the coil between them missing.
   This page did it that way first and the protein rendered as scattered
   splinters around an intact duplex. */
const RIB_MATS = ['C', 'H', 'E'].map(c => ssMat(c));

/* EIGHT CHAINS OF FOUR PROTEINS, so the ss palette is the wrong question here:
   what a reader has to tell apart is WHICH HISTONE, and every one of them is
   the same fold. Same reason collagen overrides it, one polymer over. The two
   copies of a histone share a colour, because they are the same protein and
   the picture should say the octamer is four pairs. */
/* Keyed off the name COMPND gave the chain, so a file that calls them
   something else falls back rather than mislabelling one. */
const histMat = name => mat('hist:' + name,
  MolPalette.histones[String(name).replace('HISTONE ', '').trim()]
    !== undefined
    ? MolPalette.histones[String(name).replace('HISTONE ', '').trim()]
    : MolPalette.ss.C);

function drawProtein(ch, byHistone) {
  for (const seg of runs(ch)) {
    if (seg.CA.length < 4) continue;   // RibbonLib needs a spline's worth
    const pts = seg.CA.map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const geo = RibbonLib.build(THREE, pts, seg.ss.split(''), { sub: 8 });
    group.add(new THREE.Mesh(geo, byHistone && ch.molecule
      ? histMat(ch.molecule) : RIB_MATS));
  }
}

function draw() {
  if (!trace) return;
  clear();
  const sub = +document.getElementById('sub').value;

  if (document.getElementById('protein').checked)
    for (const id of trace.order)
      if ((trace.chains[id].kind || 'aa') === 'aa')
        drawProtein(trace.chains[id], document.getElementById('byhist').checked);

  if (document.getElementById('dna').checked) {
    /* NucleicLib walks the same `chains` object and skips anything that is not
       `kind:'na'`, so neither renderer has to know what else is in the file. */
    const parts = NucleicLib.build(THREE, trace, { sub });
    /* BY POSITION AMONG THE NUCLEIC STRANDS, not by position in `order`.
       Indexing into `order` works only when the DNA happens to come first: the
       nucleosome's order is eight histones and then I, J, so both strands
       failed that test and came out one colour — two backbones a reader cannot
       tell apart, which is the one thing the strand colours exist to prevent. */
    parts.strands.forEach((sd, i) => {
      group.add(new THREE.Mesh(sd.geo,
        mat('strand:' + sd.id, MolPalette.strands[i % 2 ? 'b' : 'a'])));
    });
    for (const [b, geo] of Object.entries(parts.rungs))
      group.add(new THREE.Mesh(geo, baseMat(b)));
    for (const [b, geo] of Object.entries(parts.stubs))
      group.add(new THREE.Mesh(geo, baseMat(b)));
  }

  reframe();
  document.getElementById('tris').textContent =
    NucleicLib.triangles(trace, { sub }).toLocaleString() + ' triangles (DNA only)';
  box.draw();
}

function reframe() {
  const e = trace.extents;
  Stage.frame(box.camera, box.cam,
    [{ x: 0, y: 0, rxz: e ? e[0] / 2 : trace.radius, hy: e ? e[1] / 2 : trace.radius }],
    { pad: 1.1 });
  box.applyCam();
}

function aim(v) {
  if (!v) return;
  group.setRotationFromMatrix(new THREE.Matrix4().set(
    v[0][0], v[0][1], v[0][2], 0,
    v[1][0], v[1][1], v[1][2], 0,
    v[2][0], v[2][1], v[2][2], 0, 0, 0, 0, 1));
}

/* EVERY NUMBER READ FROM THE BAKE. The helix and strand counts especially:
   they come from the deposited records, not from counting letters, because
   adjacent helices merge into one run of H. */
function facts() {
  const aa = trace.order.filter(id => (trace.chains[id].kind || 'aa') === 'aa');
  const na = trace.order.filter(id => trace.chains[id].kind === 'na');
  const nnt = na.reduce((k, id) => k + trace.chains[id].nums.length, 0);
  const nres = aa.reduce((k, id) => k + trace.chains[id].nums.length, 0);

  const rows = [
    ['Entry', trace.entry + ' — ' + trace.what],
    ['Method', (trace.method || '?') + (trace.resolution ? ', ' + trace.resolution + ' A' : '')],
    /* EIGHT CHAINS, FOUR PROTEINS, listed by what COMPND calls them rather
       than by letter: which chain is which histone is exactly the thing a
       typed map gets wrong in a way the render cannot show. */
    ['Histones', aa.map(id => id + ' ' + (trace.chains[id].molecule || '?')
      .replace('HISTONE ', '')).join(' · ')],
    ['Modelled', nres + ' residues across ' + aa.length + ' chains, ss '
      + trace.ssFrom + ' — every chain contiguous, the tails simply start late'],
    ['DNA', na.map(id => id + ' ' + trace.chains[id].nums.length + ' nt').join('   ')
      + '  (' + (nnt / 2) + ' positions)'],
    ['Base pairs', trace.pairs.length + '  — ' + trace.pairsFrom],
    ['Unpaired', (nnt / 2 - trace.pairs.length) + ' positions'],
    ['Extents', (trace.extents || []).join(' x ') + ' A'],
    ['Frame', trace.frame],
  ];
  document.getElementById('facts').innerHTML = rows
    .map(([k, v]) => '<tr><td>' + k + '</td><td class="n">' + v + '</td></tr>').join('');

  document.getElementById('lede').innerHTML =
    (nnt / 2) + ' base-pair positions wound 1.65 turns around eight histones, '
    + 'two copies each of four proteins. <b>' + trace.pairs.length + '</b> of '
    + 'those positions pair by the geometric test at this resolution; the '
    + '<b>' + (nnt / 2 - trace.pairs.length) + '</b> that do not are scattered '
    + 'rather than periodic, and at 2.8 Å this data cannot separate coordinate '
    + 'error from real distortion in sharply bent DNA — so the ladder is drawn '
    + 'with the gaps it actually found. What is NOT here is the tails: every '
    + 'histone chain starts late, and they carry the marks the whole of '
    + 'chromatin regulation is about.';

  /* The provenance link names the entry the bake came from, so a re-bake
     against a different deposition retargets it. */
  const rc = document.getElementById('d-rcsb');
  rc.href = 'https://www.rcsb.org/structure/' + trace.entry;
  document.getElementById('d-rcsb-label').textContent = 'RCSB ' + trace.entry;

  const seen = new Set();
  for (const id of na) for (const c of trace.chains[id].seq) seen.add(c);
  /* The legend follows what colour is CARRYING, which here is which histone
     rather than secondary structure — eight chains of one fold. */
    const hist = [...new Set(aa.map(id => trace.chains[id].molecule))];
  document.getElementById('legend').innerHTML =
    hist.map(h => '<span class="sw"><i style="background:'
      + '#' + histMat(h).color.getHexString() + '"></i>'
      + h.replace('HISTONE ', '') + '</span>').join('')
    + [...seen].sort().map(b => '<span class="sw"><i style="background:var(--base-'
      + b + ')"></i>' + b + '</span>').join('');
}

/* THE BAKE IS NAMED BY THE INDEX, not typed here. proteins/nucleic-acids.js
   is the one place that says which files this repo holds, and
   check-nucleic-acids.js fails a name that is not on disk — so a renamed bake
   is one edit there rather than a page that silently fetches nothing. */
fetch('data/' + NucleicAcids.defaultOf('nucleosome').read.baked)
  .then(r => r.json())
  .then(t => { trace = t; aim(t.view); facts(); draw(); })
  .catch(e => {
    document.getElementById('lede').textContent =
      'No bake. Run: node proteins/zif268/tools/prep.js  (' + e.message + ')';
  });

new ResizeObserver(() => { if (trace) { reframe(); box.draw(); } })
  .observe(document.getElementById('stage'));

for (const id of ['protein', 'dna', 'byhist', 'sub'])
  document.getElementById(id).addEventListener('input', draw);
</script>
</body>
</html>
