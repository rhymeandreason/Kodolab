<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="/demos/proteins/tools/">
<title>Bake the gallery's stills</title>

<!-- ===================================================================
     THE GALLERY'S FIRST FRAME, BAKED. proteins/index.html hands out a
     rationed pool of WebGL contexts, so a card is either live, showing
     the last frame it drew, or — before it has ever been live — empty.
     The empty case is the glitch: a reader scrolling a grid of blank
     rectangles cannot tell a slow page from a broken one.

     This bench draws every entry once, in the SAME box the gallery uses
     with the SAME registry colour and rotation, and POSTs each frame to
     the dev server, which writes proteins/stills/<key>.webp. One context,
     reused, so the browser's cap is never near.

     INTERNAL TOOL, DEV SERVER ONLY. /api/stills is local-only; the PNGs
     it writes are committed and deploy.
     =================================================================== -->

<style>
  body{font:14px/1.5 system-ui,-apple-system,sans-serif;margin:2rem;background:#faf8f4;color:#14161a}
  h1{font-size:1.2rem;margin:0 0 .4rem}
  p{color:#6d6f76;margin:0 0 1.2rem}
  button,select{font:inherit;padding:.45rem 1rem;border:1px solid #14161a;background:#fff;border-radius:3px;cursor:pointer}
  /* The mount is 2x a card's 330x230 box: the still is a background-image on
     a retina screen, and a 1x bake is visibly soft next to the live canvas. */
  #mount{width:660px;height:460px;margin:1.2rem 0;border:1px solid #e4e0d7;background:#faf8f4}
  #basis{font-family:ui-monospace,Menlo,monospace;font-size:12px;margin:0 0 1rem}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap}
  .bad{color:#c0392b}
</style>
</head>
<body>
<h1>Gallery stills</h1>
<p>Draws every protein once and writes <code>proteins/stills/&lt;key&gt;.webp</code>. Dev server only.</p>
<button id="go">Bake all</button>
<select id="pick"></select>
<button id="one">Bake selected</button>
<button id="copy">Copy this view</button>
<div id="mount"></div>
<p id="viewnote">Drag to turn. A still has to match its card, and the card's rotation is the
  registry's: copy the view, paste it into that protein's
  <code>view: {by:'human', basis}</code> in <code>proteins.js</code>, reload, then bake.</p>
<pre id="basis"></pre>
<div id="log"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../lib/palette.js"></script>
<script src="../../lib/tokens-from-palette.js"></script>
<script src="../../lib/molecules.js"></script>
<script src="../../lib/scene.js"></script>
<script src="../../folding/folding.js"></script>
<script src="../../kit/ribbon.js"></script>
<script src="../../kit/card-stage.js"></script>
<script src="../../kit/proteinbox.js"></script>
<script src="../../kit/nucleic.js"></script>
<script src="../proteins.js"></script>
<script src="../nucleic-acids.js"></script>
<script>
'use strict';

/* Every entry in the two registries, drawn in the frame its own registry
   states — which is how a still cannot show a molecule differently from the
   page that later replaces it with a live box.

   EVERY NUCLEIC STRUCTURE, NOT ONLY THE COMPLEXES. proteins/index.html shows
   `withProtein()` because a bare duplex on a gallery of proteins is a category
   error, but other pages draw the bare ones: the homepage's DNA card and the
   DNA lesson both open on dna-1BNA.json. A still they cannot have is the empty
   rectangle this bench exists to remove. */
const NA_KEYS = new Set(NucleicAcids.STRUCTURES.map(s => s.key));
const isNA = p => NA_KEYS.has(p.key);
const ENTRIES = [...ProteinLib.PROTEINS, ...NucleicAcids.STRUCTURES];
const defaultOf = p => isNA(p) ? NucleicAcids.defaultOf(p) : ProteinLib.defaultOf(p);
const dataOf = (p, file) => `../../${p.dir}/data/${file}`;

const mount = document.getElementById('mount');
const logEl = document.getElementById('log');
const say = (t, bad) => {
  const d = document.createElement('div');
  if (bad) d.className = 'bad';
  d.textContent = t; logEl.appendChild(d);
};

const wait = ms => new Promise(r => setTimeout(r, ms));

/* One live box, not one per entry. Picking a protein loads it here and
   leaves it up — the point of a picker is to LOOK before baking, and a box
   destroyed the instant its frame is captured never gave a human that
   chance. `liveKey` is what it currently holds, so `bake` below can skip
   the reload when the box on screen already IS the selection. */
let liveBox = null;
let liveKey = null;
let opened = null;      // pickView() as loaded, to tell whether it was turned

async function loadEntry(p) {
  if (liveBox) { liveBox.destroy(); liveBox = null; liveKey = null; }
  const v = defaultOf(p);
  const t = await fetch(dataOf(p, v.read.baked)).then(r => r.json());

  /* Same options as the card, plus a turn so a human can pick the rotation
     here. Everything else that decides what the frame LOOKS like — pad, sub,
     colour — has to match index.html or the still jumps when the live box
     replaces it, and the rotation does too: see `copy` below. */
  const box = Proteinbox.create({
    mount, orbit: true, pad: 1.15, sub: 8,
    stage: { ortho: false, turn: 'trackball' },
    /* The same chain list the card draws — see index.html. A still holding a
       chain the card hides is the contract above broken in the one direction
       nobody looks at. */
    chains: isNA(p) ? NucleicAcids.drawnOf(p, null, t) : null,
    colors: isNA(p) ? null : ProteinLib.colorsOf(p, ProteinLib.defaultOf(p)),
    /* THE SAME `viewOf` index.html ASKS, which is the whole contract above:
       everything deciding what the frame looks like has to match the card or
       the still jumps when the live box replaces it. Passing null for a
       nucleic entry was right while every nucleic bake carried its own solved
       basis, and wrong the moment one took a hand-picked rotation — the bake
       then carries no view at all, and this would bake the crystal's frame
       under a card drawing the chosen one. */
    view: (isNA(p) ? NucleicAcids : ProteinLib).viewOf(p),
    data: t,
  });
  if (box.setPocket && t.pocket) box.setPocket(t.pocket);

  /* Chains build one per animation frame (kit/proteinbox.js's "One chain per
     frame" note), so a fixed wait here baked big assemblies mid-build —
     atp-synthase's 28 chains needed ~28 frames and only ever got the ~14 a
     4x60ms wait affords. Poll box.building until the queue drains instead. */
  for (let i = 0; box.building && i < 300; i++) { box.draw(); await wait(16); }
  if (box.building) throw new Error(`${p.key}: chains never finished building`);

  // A few frames, not one: the fit runs off a resize and the pocket lands
  // after the ribbon, and a snapshot taken before either is the wrong frame.
  for (let i = 0; i < 4; i++) { box.draw(); await wait(60); }
  box.draw();

  liveBox = box; liveKey = p.key;
  opened = JSON.stringify(box.pickView());
  document.getElementById('basis').textContent = '';
  return box;
}

async function bake(p) {
  const box = (liveKey === p.key && liveBox) ? liveBox : await loadEntry(p);

  /* THE RIBBON ON NOTHING. The renderer's context is alpha and the still keeps
     it, so the card's paper shows through and a still is not pinned to one
     background colour. WebP because PNG at this size is 400 KB a card. */
  /* A TURN THE REGISTRY DOES NOT HOLD bakes a still the live card will not
     match, so the card jumps when it goes live. Baked anyway, since a human
     may be checking a candidate before pasting it, but said out loud. */
  if (JSON.stringify(box.pickView()) !== opened)
    say(`${p.key} — turned but not in proteins.js: the card will jump. Copy the view and paste it first.`, true);
  box.draw();                            // the buffer is only readable now
  const webp = box.canvas.toDataURL('image/webp', 0.85);
  /* A browser with no WebP ENCODER hands back a PNG under the name asked for,
     silently, and the bake would then write 400 KB files with the wrong
     extension. Checked rather than trusted; the fix is to run this in a
     browser that can, not to accept the PNG. */
  if (!/^data:image\/webp;/.test(webp)) {
    throw new Error('this browser will not encode WebP — run the bake in Chrome');
  }

  const r = await fetch('/api/stills', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: p.key, webp }),
  });
  const out = await r.json();
  if (!r.ok) throw new Error(out.error || r.status);
  return out.bytes;
}

const pickEl = document.getElementById('pick');
for (const p of ENTRIES) {
  const o = document.createElement('option');
  o.value = p.key; o.textContent = p.key;
  pickEl.appendChild(o);
}
const goEl = document.getElementById('go');
document.getElementById('copy').addEventListener('click', () => {
  if (!liveBox) return;
  /* kit/proteinbox.js's, because the answer needs the chain group's rotation
     as well as the camera's and only the box can see both. */
  const text = JSON.stringify(liveBox.pickView());
  navigator.clipboard && navigator.clipboard.writeText(text);
  document.getElementById('basis').textContent = `${liveKey}: ${text}`;
});
const oneEl = document.getElementById('one');

async function run(entries) {
  goEl.disabled = oneEl.disabled = pickEl.disabled = true;
  for (const p of entries) {
    try {
      const bytes = await bake(p);
      say(`${p.key} — ${Math.round(bytes / 1024)} KB`);
    } catch (e) {
      say(`${p.key} — ${e.message}`, true);
    }
  }
  say('done.');
  goEl.disabled = oneEl.disabled = pickEl.disabled = false;
}

goEl.addEventListener('click', () => { logEl.textContent = ''; run(ENTRIES); });
oneEl.addEventListener('click', () => {
  logEl.textContent = '';
  run([ENTRIES.find(p => p.key === pickEl.value)]);
});
/* Picking a protein loads it right away — the mount is not just where a bake
   happens to flash through, it is how you tell which entry you are about to
   bake before you commit to it. */
pickEl.addEventListener('change', () => {
  loadEntry(ENTRIES.find(p => p.key === pickEl.value))
    .catch(e => say(`${pickEl.value} — ${e.message}`, true));
});

/* ?key=<protein> preselects AND loads, so a card's own "rebake this one"
   link (or a bookmark) opens straight to that protein on screen. */
const wantKey = new URLSearchParams(location.search).get('key');
if (wantKey && ENTRIES.some(p => p.key === wantKey)) pickEl.value = wantKey;
pickEl.dispatchEvent(new Event('change'));   // load whatever ended up selected
</script>
</body>
</html>
