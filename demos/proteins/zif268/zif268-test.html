<!-- ===================================================================
     SCRATCH. Not a lesson, not linked from anywhere but admin.html.

     WHY THIS ENTRY. It is the first bake in the repo where a protein and
     a nucleic acid come out of ONE deposition and have to share ONE
     frame. 1BNA was a duplex alone and 1EHZ an RNA alone; both drew
     themselves in a scene with nothing else in it. Eight wishlist rows
     are mixed files, the nucleosome among them, and every one of them is
     this problem at a larger size.

     SO WHAT THIS BENCH IS FOR SETTLING:

       one frame          the protein and the duplex are centred on ONE
                          vector solved over both. If either had solved
                          its own, they would overlap at the origin —
                          each individually correct, the picture
                          nonsense. Look for the protein sitting IN the
                          major groove, not inside the DNA.
       one scale          real angstroms for both, so a 85-residue
                          protein and 11 base pairs come out at the sizes
                          they actually have relative to each other.
       two vocabularies   a ribbon says helix and strand; a ladder says
                          paired and unpaired. They have to read as two
                          KINDS of thing without either one looking like
                          a mistake.
       the zincs          three fingers, three zincs. A zinc finger does
                          not exist without them, so they are baked and
                          drawn rather than left as a caption.

     WHAT IT STILL DOES NOT TEST. An internal break in a NUCLEIC
     chain: chain C's two missing residues are terminal and neither
     duplex strand has a hole, so kit/nucleic.js's `runs()` has never
     split one. kit/proteinbox.js's `runs()` splits them routinely — same
     name, different function, and only one of the two is untested. The duplex does carry two unpaired 5'
     overhangs, which is the first stub drawn on a duplex rather than in
     a loop.
     =================================================================== -->

<style>
  /* The panel chrome is ../protein-test.css. What stays here is what this
     bench has and a single-structure page does not: two vocabularies in one
     frame, so it carries a colour legend, and a mesh-density control. */
  #stage { min-height: 0; }

  .row { display: flex; align-items: center; gap: var(--space-2);
         margin: 6px 0; font-size: 0.8rem; color: var(--h-ink); }
  .row label { display: flex; align-items: center; gap: 6px; flex: 1; }
  .row input[type=checkbox] { accent-color: var(--h-accent); }
  .row input[type=range] { width: 110px; accent-color: var(--h-accent); }

  /* The legend is the page's argument in miniature: three protein colours,
     then the bases. Two groups, so it wraps rather than scrolls. */

            margin: var(--space-2) 0 0; font-size: 0.75rem;
            color: var(--h-muted); }
  .sw { display: inline-flex; align-items: center; gap: .35em;
        font-variant-numeric: tabular-nums; }
  .sw i { width: .8em; height: .8em; border-radius: 2px; display: inline-block; }

  /* The figures here are sentences and sequences, not single numbers, so the
     value column reads left-aligned. Everything else is the shared table. */
  #facts td:last-child { text-align: left; font-weight: 400; font-size: 0.78rem;
                         padding-left: var(--space-3); overflow-wrap: anywhere; }
  #tris { color: var(--h-muted); font-variant-numeric: tabular-nums;

<body>

<div id="app">
  <div id="stage"></div>
  <div class="panel">
    <h1>Zif268</h1>
    <p class="deck">Three zinc fingers in the major groove. A protein and a
      duplex out of one deposition, in one frame at one scale.</p>

    <h2>what is drawn</h2>
    <div class="row"><label><input type="checkbox" id="protein" checked> protein</label></div>
    <div class="row"><label><input type="checkbox" id="dna" checked> DNA</label></div>
    <div class="row"><label><input type="checkbox" id="zinc" checked> zinc</label></div>
    <div class="row"><label>samples / nt</label><input type="range" id="sub" min="2" max="16" value="8"></div>
    <div id="tris"></div>

    <h2>colour</h2>
    <div id="legend"></div>

    <h2>the claim</h2>
    <p class="claim" id="lede">Loading…</p>

    <h2>measured, not typed</h2>
    <table id="facts"></table>

    <p class="src">
      <a id="d-rcsb" href="https://www.rcsb.org/" target="_blank" rel="noopener"><span id="d-rcsb-label">RCSB entry</span><svg class="ext" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2h5.5v5.5M10 2 4.5 7.5M8 9.5H2V3.5"/></svg></a>
      <a href="data/">what this page loads</a>
    </p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../lib/palette.js"></script>
<script src="../../lib/tokens-from-palette.js"></script>
<script src="../../lib/molecules.js"></script>
<script src="../../lib/scene.js"></script>
<script src="../../folding/folding.js"></script>
<script src="../../kit/card-stage.js"></script>
<script src="../../kit/ribbon.js"></script>
<script src="../../kit/nucleic.js"></script>
<script src="../../kit/proteinbox.js"></script>
<script src="../nucleic-acids.js"></script>
<script>
'use strict';

/* ONE SCENE, TWO POLYMERS, ONE SCALE FAMILY. Both are real angstroms out of
   the same deposition, which is what lets them share a stage at all
   (MolecularGeometry.md 1.5).

   THE BOX IS kit/proteinbox.js AND ITS NUCLEIC BRANCH. This page used to build
   its own CardStage and draw both polymers itself, from a time when the module
   had no way to draw DNA; it has one, `proteins/index.html` has been drawing
   every nucleic entry through it, and the comment here saying otherwise
   outlived the code by long enough to get copied into two new benches. What
   went with the conversion: a runs(), a ribbon build, the strand and base
   colours, and a hand-copied set of ball-and-stick constants.

   `sub:10` and `turn:'trackball'` on a full-height stage: the box's defaults
   are a card's, and both run out at this size. */
const box = Proteinbox.create({
  mount: document.getElementById('stage'),
  orbit: true, sub: 10,
  stage: { ortho: false, turn: 'trackball' },
});

let trace = null;

/* WHAT TO HAND THE BOX, given the checkboxes. `chains` is the box's own
   filter, so hiding a polymer is a re-feed rather than a second renderer here.

   THE ZINCS GO THROUGH setPocket. They are three lone metals rather than a
   heme, but they are the same KIND of thing — a handful of atoms drawn inside
   a ribbon — and the box already sizes a deposition-only metal as a multiple
   of carbon so it stays readable from across a 47 A complex. Drawn here it was
   a copy of that constant, which is how two pages come to disagree about how
   big a zinc is. */
function draw() {
  if (!trace) return;
  const want = trace.order.filter(id => trace.chains[id].kind === 'na'
    ? document.getElementById('dna').checked
    : document.getElementById('protein').checked);
  const sub = +document.getElementById('sub').value;
  if (want.length) box.setData(trace, { chains: want.join(','), sub });
  if (document.getElementById('zinc').checked)
    /* `ball:2` because these three are a group of one atom each. The box's
       proportions size a metal against the group it sits in — a heme's iron
       against its porphyrin — and a lone zinc has nothing to be sized against,
       so at the module's default it is under an angstrom across from a 47 A
       framing and disappears into the finger it holds together. Judged at the
       whole-protein framing, which is the only one this bench opens at. */
    box.setPocket({ atoms: trace.zinc.map(z => ({ el: 'Zn', p: z.xyz })), bonds: [] },
                  { ball: 2 });

  document.getElementById('tris').textContent =
    NucleicLib.triangles(trace, { sub }).toLocaleString() + ' triangles (DNA only)';
}

/* EVERY NUMBER READ FROM THE BAKE. The helix and strand counts especially:
   they come from the deposited records, not from counting letters, because
   adjacent helices merge into one run of H. */
function facts() {
  const aa = trace.order.filter(id => (trace.chains[id].kind || 'aa') === 'aa');
  const na = trace.order.filter(id => trace.chains[id].kind === 'na');
  const nnt = na.reduce((k, id) => k + trace.chains[id].nums.length, 0);
  const p = trace.chains[aa[0]];

  const rows = [
    ['Entry', trace.entry + ' — ' + trace.what],
    ['Method', (trace.method || '?') + (trace.resolution ? ', ' + trace.resolution + ' A' : '')],
    ['Protein', aa.join(', ') + '  (' + p.nums.length + ' residues, '
      + p.helices + ' helices, ' + p.strands + ' strands, ss ' + trace.ssFrom + ')'],
    ['DNA', na.map(id => id + ' ' + trace.chains[id].seq).join('   ')],
    ['Base pairs', trace.pairs.length + '  — ' + trace.pairsFrom],
    ['Unpaired', (nnt - trace.pairs.length * 2) + "  (5' overhangs)"],
    ['Zinc', trace.zinc.length],
    ['Extents', (trace.extents || []).join(' x ') + ' A'],
    ['Frame', trace.frame],
  ];
  document.getElementById('facts').innerHTML = rows
    .map(([k, v]) => '<tr><td>' + k + '</td><td class="n">' + v + '</td></tr>').join('');

  document.getElementById('lede').innerHTML =
    'Three zinc fingers gripping ' + trace.pairs.length + ' base pairs. The '
    + 'protein and the DNA come out of one deposition and are centred on one '
    + 'vector solved over both — centre them separately and each is correct '
    + 'while the picture puts the protein inside the duplex. Two vocabularies '
    + 'in one scene at one scale: a ribbon says helix and strand, a ladder says '
    + 'paired and unpaired.';

  /* The provenance link names the entry the bake came from, so a re-bake
     against a different deposition retargets it. */
  const rc = document.getElementById('d-rcsb');
  rc.href = 'https://www.rcsb.org/structure/' + trace.entry;
  document.getElementById('d-rcsb-label').textContent = 'RCSB ' + trace.entry;

  const seen = new Set();
  for (const id of na) for (const c of trace.chains[id].seq) seen.add(c);
  document.getElementById('legend').innerHTML =
    ['C', 'H', 'E'].map(c => '<span class="sw"><i style="background:var(--ss-'
      + c + ')"></i>' + ({ C: 'coil', H: 'helix', E: 'strand' })[c] + '</span>').join('')
    + [...seen].sort().map(b => '<span class="sw"><i style="background:var(--base-'
      + b + ')"></i>' + b + '</span>').join('');
}

/* THE BAKE IS NAMED BY THE INDEX, not typed here. proteins/nucleic-acids.js
   is the one place that says which files this repo holds, and
   check-nucleic-acids.js fails a name that is not on disk — so a renamed bake
   is one edit there rather than a page that silently fetches nothing. */
fetch('data/' + NucleicAcids.defaultOf('zif268').read.baked)
  .then(r => r.json())
  .then(t => { trace = t; facts(); draw(); })
  .catch(e => {
    document.getElementById('lede').textContent =
      'No bake. Run: node proteins/zif268/tools/prep.js  (' + e.message + ')';
  });

for (const id of ['protein', 'dna', 'zinc', 'sub'])
  document.getElementById(id).addEventListener('input', draw);
</script>
</body>
