<script>
/* The bench for membrane/membrane.js, written in the shape a generated page
   takes: one mounted component, controls that are set(), readouts that are
   state(). The module is judged on whether this file had to reach past its
   params, and the answer is the panel's last group. It runs on the lesson
   shell so the component is judged in the chrome a student sees it in. */

/* SAME PARTICLE COUNT PER SIDE, FEWER FREE WATERS WHERE THE SALT IS: the
   osmosis step's rule, so the only asymmetry is the headcount. The inside
   is the same cell in both waters: a salmon's blood does not change, which
   is the whole reason the gill has work to do.

   Real order of magnitude: seawater ~470 mM Na⁺, blood ~150 mM, a river
   under 1 mM. Drawn as a ratio the frame can hold, not as millimolar. */
const PARTICLES = 78;
const INSIDE = { K:20, NA:4, A:8 };            // solute 32, water 46
const OUTSIDE = {
  sea:   { NA:26, CL:26 },                     // solute 52, water 26: hypertonic
  fresh: { NA:2,  CL:2  },                     // solute 4,  water 74: hypotonic
};
const CLAIM = {
  sea:   'Seawater is saltier than the fish. Water leaves, salt leaks in, and the pump spends ATP throwing sodium back out.',
  fresh: 'The river is nearly pure water. Water floods in, salt leaks out, and the same pump is what holds the inside together.',
};
const solute = o => Object.values(o).reduce((a, b) => a + b, 0);

const shell = LessonShell.create({
  brand: 'Membrane', section: { label: 'library', href: '/library' },
  hint: 'Drag to orbit · Scroll to zoom',
  steps: [{
    eyebrow: 'membrane/membrane.js',
    title: 'A gill cell, seawater or freshwater',
    body: '<p>A Na⁺ leak, a K⁺ channel, the Na⁺/K⁺ pump and an aquaporin in one plasma membrane. Everything below is a <strong>set()</strong> and every number a <strong>state()</strong>.</p>',
    onEnter: bench,
  }],
});

/* The pump runs itself: a fish does not press a button. */
const m = Membrane.mount(shell.stage, {
  viewOffset: shell.viewOffset,
  proteins: { NA:{ x:-108 }, K:{ x:-36 }, pump:{ x:36 }, AQP:{ x:108 } },
  potential: 'nernst', pumpAuto: true, pumpOn: true,
});
window.membrane = m;

function bench(ctx) {
  const ui = ctx.ui;
  const $ = s => ui.q(s);
  ui.controls(`
    <div class="bench-group">
      <div class="bench-hd">the water outside</div>
      <div class="segmented" id="env" role="group">
        <button type="button" data-v="sea">seawater</button>
        <button type="button" data-v="fresh">freshwater</button>
      </div>
      <p class="claim" id="claim"></p>
      <label class="switch"><input type="checkbox" id="pumpOn" checked><span class="track"></span>the pump is paid for</label>
      <label class="switch"><input type="checkbox" id="shells"><span class="track"></span>draw hydration shells</label>
      <div class="slider"><div class="slider-head"><span class="label">speed</span><span class="value" id="sv"></span></div>
        <input id="speed" type="range" min="1" max="4" step="1" value="1"></div>
    </div>

    <div class="bench-group"><div id="panel"></div></div>

    <div class="bench-group">
      <div class="bench-hd">free water on each side</div>
      <div id="chart"></div>
    </div>

    <div class="bench-group">
      <div class="bench-hd">what the module says</div>
      <table class="rd" id="rd"></table>
    </div>

    <div class="bench-group">
      <div class="bench-hd">what this app had to reach for</div>
      <p class="foot">Nothing. The environment is one <code>contents</code> set(),
      and <code>scatter</code>'s anion default keeps the anions deep in the cytosol.
      Switching waters moves only the difference, so the water that already
      crossed stays where it went.</p>
    </div>`);

  /* The chart is the membrane's own `water` signal, which carries the label,
     the unit and the range, so nothing here knows how many particles there
     are. It subscribes on the sim's own clock: a backgrounded tab freezes the
     sim and the trace together. */
  const chart = Graph.mount($('#chart'), { live: { span: 120 }, height: 130, legend: false })
    .follow(m, 'water');

  let env = 'sea';
  /* The environment is one set(): the module adds and removes the difference. */
  function populate() {
    const out = OUTSIDE[env];
    m.set({ contents: {
      inside:  Object.assign({ water: PARTICLES - solute(INSIDE) }, INSIDE),
      outside: Object.assign({ water: PARTICLES - solute(out) }, out),
    } });
    m.reset();
    $('#claim').textContent = CLAIM[env];
    for (const b of ui.qa('#env > button')) b.setAttribute('aria-pressed', String(b.dataset.v === env));
    chart.clear();
  }
  for (const b of ui.qa('#env > button')) b.onclick = () => { env = b.dataset.v; populate(); };

  $('#pumpOn').onchange = e => m.set({ pumpOn: e.target.checked });
  $('#shells').onchange = e => m.set({ shells: e.target.checked });
  ui.range($('#speed'), v => { m.set({ timeScale: v }); $('#sv').textContent = '×' + v; });

  /* The component's own chips: point at, show, colours. Nothing here was written for this page. */
  CardStage.showPanel($('#panel'), m, { notes: ['channel.K', 'pump'], layers: ['shells', 'water'] });

  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  m.on('frame', s => {
    const w = s.counts.water || { inside:0, outside:0 };
    const na = s.counts.NA || { inside:0, outside:0 };
    const k = s.counts.K || { inside:0, outside:0 };
    $('#rd').innerHTML =
      row('water in / out', `${w.inside} / ${w.outside}`) +
      row('net water, recent', s.net === 'balanced' ? 'balanced' : s.net + ' the cell') +
      row('Na⁺ in / out', `${na.inside} / ${na.outside}`) +
      row('K⁺ in / out', `${k.inside} / ${k.outside}`) +
      row('membrane', s.mV.toFixed(0) + ' mV') +
      row('E_K (Nernst)', s.equilibrium.K.toFixed(0) + ' mV') +
      row('ATP spent', s.atpSpent) +
      row('pump', s.pumpRunning ? s.pumpPhase : 'idle');
  });

  populate();
}

shell.goTo(0);
</script>
