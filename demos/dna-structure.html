<!-- ===================================================================
     THE GLOSSARY. One finished molecule, 1BNA as deposited, held on the left
     while the writing that names its parts scrolls past on the right. It answers "what IS this" before any
     lesson asks the student to build one, which is the question dna-lab
     never stopped to answer.

     NOTHING HERE IS A LIST OF ATOM INDICES. Every part is a QUERY over the
     record's own atom names — the sugar is what the record calls C1′…O4′,
     the phosphate is P and its oxygens, a base is what is left. So a
     re-bake cannot leave a highlight pointing at the wrong spheres, and
     the numbers in the captions are measured off the same coordinates the
     spheres are drawn from.
     =================================================================== -->

<script>
"use strict";

const S = MolLib.SCALE;
const bdna = window.BDNA;
const stage = document.getElementById('stage');

// Side-on to the axis, and NO ORBIT: the drag spins the duplex about its own
// axis (below), which is the one turn that shows a helix what it is. A free
// orbit would let a student leave it end-on, where every part overlaps every
// other and the glossary names a tangle.
const L = Lesson.create(document.getElementById('gl'), {
  cam:{ theta:0, phi:1.5708, r:34 }, rMax:400, orbit:false,
  // Taller than the duplex: the caption takes the bottom of the stage, and a
  // helix running under it reads as cropped.
  boxes:()=>[VIEW.box],
  afterFrame:dt=>{ idle(dt); recentre(); NOTES.step(); },
});

/* =============================================================================
 *  THE MOLECULE
 * =============================================================================
 *  1BNA as deposited: twelve base pairs, each built from its own atoms and set
 *  at its own recorded placement, with the phosphodiester bonds drawn between
 *  them. Nothing is idealised and nothing moves — the winding is a lesson of
 *  its own (tests/ladder-helix-test.html), and this page is the finished thing.
 * ========================================================================== */
// TWO GROUPS, because they answer to different things. G carries the solved
// stand-up rotation, which is the record's business; SPIN carries the student's
// drag. One group would mean the drag overwriting the solve.
// FRAME translates, SPIN turns, G carries the solved stand-up. Three groups
// because they answer to three different things — the page's framing, the
// student's drag, and the record — and collapsing any two of them means one
// overwriting another.
const FRAME = new THREE.Group();
L.root.add(FRAME);
const SPIN = new THREE.Group();
FRAME.add(SPIN);
const G = new THREE.Group();
SPIN.add(G);

/* NAMES, NOT INDICES. `pair.index` maps the record's own atom name to its slot
 * ("A:C1′" → 7); inverted, it says what every sphere IS, and every part below
 * is a question asked of that. */
const rungs = bdna.pairs.map(p => {
  const names = [];
  for(const k in p.index) names[p.index[k]] = k;
  const spec = { name:p.seq, units:'scene', view:null,
    atoms: p.atoms.map(a => ({ el:a.el, pos:a.p.map(v => v * S) })),
    bonds: p.bonds };
  const mol = Stage.buildMolecule(spec, { center:false });
  mol.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
    ...p.basis.map(v => new THREE.Vector3(...v))));
  mol.position.set(...p.origin).multiplyScalar(S);
  G.add(mol);
  // buildMolecule adds every bond first, then every atom, in spec order — the
  // same order dna-lab's dimming relies on, and the only thing that connects a
  // mesh back to the atom it draws.
  const nb = (spec.bonds || []).length;
  const bondMesh = mol.children.slice(0, nb);
  const atomMesh = mol.children.slice(nb);
  return { p, mol, names, spec, bondMesh, atomMesh };
});

/* The rails. A phosphodiester bond runs between two pairs, so it belongs to
 * neither and is drawn here. Drawn once: nothing on this page moves. */
const linkGeo = new THREE.CylinderGeometry(0.16, 0.16, 1, 7);
const UP = new THREE.Vector3(0, 1, 0);
const atomAt = (r, ai) => new THREE.Vector3(...r.p.atoms[ai].p).multiplyScalar(S)
  .applyQuaternion(r.mol.quaternion).add(r.mol.position);
const linkMesh = bdna.links.map(lk => {
  const a = atomAt(rungs[lk.from.pair], lk.from.ai);
  const b = atomAt(rungs[lk.to.pair],   lk.to.ai);
  const d = b.clone().sub(a);
  const m = new THREE.Mesh(linkGeo, new THREE.MeshStandardMaterial(
    { color:0xbfae8e, roughness:.55 }));
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(UP, d.clone().normalize());
  m.scale.set(1, d.length(), 1);
  m.userData.link = lk;
  G.add(m);
  return m;
});

/* STAND IT UP, SOLVED. The crystallographers' cell points the axis wherever it
 * points, so a typed rotation is right for one bake and silently wrong for the
 * next. The axis is the line the pair origins climb; the rotation that carries
 * it to world +Y is read off that line. Then centre on those origins, so the
 * duplex hangs in the frame rather than growing out of one corner. */
{
  const axis = new THREE.Vector3(...bdna.pairs[bdna.n - 1].origin)
    .sub(new THREE.Vector3(...bdna.pairs[0].origin)).normalize();
  G.quaternion.setFromUnitVectors(axis, UP);
  const mid = new THREE.Vector3();
  for(const p of bdna.pairs) mid.add(new THREE.Vector3(...p.origin));
  mid.multiplyScalar(S / bdna.n).applyQuaternion(G.quaternion);
  G.position.sub(mid);
}

// Where an atom is NOW, on screen's terms: the model turns under the drag, and
// every callout anchor goes through here rather than caching a point.
const worldAt = (r, ai) => G.localToWorld(atomAt(r, ai));

/* THE HYDROGEN BONDS, DRAWN. The pairing rule is the one claim on this page a
 * reader cannot check by looking, because the bond has nothing to draw: no
 * shared electrons, and 1BNA has no hydrogens in it. So it is the dashes —
 * kit/hbond.js's, the same object water-lab draws, at the same navy — and the
 * page's job is only to say between which atoms. Inside G, because the atoms
 * are: the pair turns and they turn with it.
 *
 * Gap and radius are scaled to this molecule. The module's defaults are for a
 * scene built in ångströms; here every length has been through SCALE, and the
 * defaults would draw twenty dashes across one bond. */
const HB = HBond.create(THREE, { gap:0.95, radius:0.085, fill:0.55 });
G.add(HB.group);
HB.setVisible(false);

/* =============================================================================
 *  WHAT THE PARTS ARE
 * =============================================================================
 *  Asked of the record's names, never listed. The sugar is the ring and what
 *  hangs off it, the phosphate is P and its oxygens, and a base is whatever is
 *  left — which is exactly the split the chemistry makes, so a spec that gains
 *  an atom is classified without anyone editing this page.
 * ========================================================================== */
const chainOf = n => n[0];
const nameOf  = n => n.slice(2);
const isSugar = a => /^(C1'|C2'|C3'|C4'|C5'|O2'|O3'|O4'|O5')$/.test(a);
const isPhos  = a => /^(P|OP1|OP2|OP3)$/.test(a);
const isBase  = a => !isSugar(a) && !isPhos(a);
// The residue a sphere belongs to: a pair holds two, one per strand.
const strandOf = (r, i) => chainOf(r.names[i]) === 'A' ? 0 : 1;

// One residue, named the way the rest of the lesson names one: pair 5, strand 0
// is the adenine dna-lab's step 2 builds.
const SHOWN = { pair:5, strand:0 };
const inResidue = (r, i, res) => r.p.i === res.pair && strandOf(r, i) === res.strand;

/* =============================================================================
 *  THE HIGHLIGHT
 * =============================================================================
 *  The same treatment as molecule-viewer: the part keeps its element colours
 *  and everything else greys IN PLACE. Not opacity — a transparent atom still
 *  sorts against the ones behind it, and on a molecule twelve pairs deep that
 *  reads as a rendering fault rather than as "this is not the part".
 *
 *  A BOND IS IN THE PART ONLY IF BOTH ENDS ARE. One end in lights a stick
 *  reaching out of the group, which makes the part look bigger than it is.
 * ========================================================================== */
const GREY = new THREE.Color(0x9a9186);
const DIM = 0.88;              // how far towards grey; 1.0 loses the shape
for(const r of rungs){
  for(const m of r.atomMesh.concat(r.bondMesh)) m.userData.base = m.material.color.getHex();
}
for(const m of linkMesh) m.userData.base = m.material.color.getHex();

/* AND WHEN THE STAGE PULLS IN, THE REST GOES GHOSTLY AS WELL. Greying in place
 * is enough on the whole molecule, where the part is a region of it. On one
 * nucleotide it is not: half a duplex stands between the camera and the thing
 * being named, and a grey sphere in front of the part hides it just as well as
 * a coloured one. So a zoomed part also drops the rest to a ghost that does not
 * write depth — which is the same trick dna-lab's dimmed bases use, for the
 * same reason. */
function paint(part, ghost){
  const wants = part.atoms || (() => true);
  // `rails` is true for all of them or a question asked of one — a strand owns
  // half the backbone bonds, and lighting the other half would draw a strand
  // twice the width of the one being named.
  const railIn = typeof part.rails === 'function' ? part.rails : () => !!part.rails;
  const anyDim = !!part.atoms || !part.rails;
  for(const r of rungs){
    const on = r.spec.atoms.map((_, i) => wants(r, i));
    r.atomMesh.forEach((m, i) => tint(m, on[i]));
    r.bondMesh.forEach((m, k) => {
      const b = r.spec.bonds[k];
      tint(m, on[b[0]] && on[b[1]]);
    });
  }
  for(const m of linkMesh) tint(m, railIn(m.userData.link));

  function tint(m, on){
    m.material.color.setHex(m.userData.base);
    const dim = anyDim && !on;
    if(dim) m.material.color.lerp(GREY, DIM);
    m.material.transparent = dim && ghost;
    m.material.opacity = (dim && ghost) ? 0.18 : 1;
    m.material.depthWrite = !(dim && ghost);
  }
}

/* =============================================================================
 *  THE TWO GROOVES, MEASURED
 * =============================================================================
 *  The grooves are the one part with no atoms in it: they are the gaps LEFT
 *  between the rails, which is why they exist at all. So they are found rather
 *  than drawn — for every offset between the strands, how far apart the two
 *  backbones run. The offset that brings them closest is the minor groove; the
 *  next way round is the major, and their widths are what those distances say.
 *
 *  Phosphorus to phosphorus, which is what the atoms give. A textbook quotes
 *  the groove ~5.8 Å narrower, having subtracted two phosphate radii; saying
 *  which measurement this is costs a clause and keeps the number honest.
 * ========================================================================== */
const phosOf = (pairIndex, strand) => {
  const r = rungs[pairIndex];
  if(!r) return null;
  const i = r.p.index[(strand === 0 ? 'A' : 'B') + ':P'];
  return i == null ? null : { r, ai:i };
};
function grooves(){
  const runs = [];
  for(let k = -6; k <= 6; k++){
    let sum = 0, n = 0, mid = null;
    const mids = [];
    for(let i = 0; i < bdna.n; i++){
      const a = phosOf(i, 0), b = phosOf(i + k, 1);
      if(!a || !b) continue;
      sum += atomAt(a.r, a.ai).distanceTo(atomAt(b.r, b.ai)) / S; n++;
      mids.push({ i, a, b });
      if(!mid || Math.abs(i - bdna.n / 2) < Math.abs(mid.i - bdna.n / 2)) mid = { i, a, b };
    }
    if(n >= 4) runs.push({ k, d:sum / n, mid, mids });
  }
  // The two ways round the duplex are the two signs of the offset: each side's
  // closest approach is one groove, and the narrower of the two is the minor.
  const best = sign => runs.filter(x => Math.sign(x.k) === sign)
    .sort((p, q) => p.d - q.d)[0];
  const two = [best(-1), best(1)].filter(Boolean).sort((p, q) => p.d - q.d);
  return { minor:two[0], major:two[1] };
}
const GROOVE = grooves();
/* THE WIDTH OF A GROOVE, and it is not the phosphorus-to-phosphorus distance.
 * The convention is that distance less 5.8 Å — the two phosphate groups' van
 * der Waals diameters — because what has to fit into a groove is a protein, and
 * the atoms are in the way. Measured once, off the record: this is a fact about
 * the molecule, not about how the reader has turned it. */
const P_VDW = 5.8;
const grooveWidth = g => (g.d - P_VDW).toFixed(1) + ' Å';
/* WHERE A GROOVE IS, AND IT IS NOT HALFWAY BETWEEN THE PHOSPHATES. That
 * midpoint is a chord through the middle of the duplex: it lands on the stacked
 * bases in the core, which is the one place the groove is not, and the label
 * then points at the thing it is contrasted with. A groove is a dent in the
 * OUTSIDE. So the midpoint is carried out along its own radius to the radius
 * the backbone runs at, which puts the dot in the mouth of the gap.
 *
 * The radius is measured off the phosphorus atoms rather than typed, and the
 * axis is SPIN's own Y, because standing the duplex up put it there. */
const _sq = new THREE.Quaternion();
const P_RADIUS = (() => {
  L.root.updateMatrixWorld(true);       // measured off the matrices, so refresh them
  let sum = 0, n = 0;
  for(let i = 0; i < bdna.n; i++) for(const st of [0, 1]){
    const p = phosOf(i, st);
    if(!p) continue;
    const v = SPIN.worldToLocal(worldAt(p.r, p.ai));
    sum += Math.hypot(v.x, v.z); n++;
  }
  return n ? sum / n : 10;
})();
// The midpoint's own radial direction, in SPIN's frame: the way OUT of the
// duplex at that height.
function grooveRadial(g){
  const a = SPIN.worldToLocal(worldAt(g.mid.a.r, g.mid.a.ai));
  const b = SPIN.worldToLocal(worldAt(g.mid.b.r, g.mid.b.ai));
  const m = a.add(b).multiplyScalar(0.5);
  const rad = new THREE.Vector3(m.x, 0, m.z);
  if(rad.lengthSq() < 1e-9) rad.set(1, 0, 0);
  return { m, rad:rad.normalize() };
}
const grooveAt = g => () => {
  const { m, rad } = grooveRadial(g);
  return SPIN.localToWorld(new THREE.Vector3(
    rad.x * P_RADIUS, m.y, rad.z * P_RADIUS));
};
// And it fades when the groove turns to the back of the molecule, where a
// callout would be naming a gap the student cannot see.
const grooveFacing = g => () =>
  grooveRadial(g).rad.applyQuaternion(SPIN.getWorldQuaternion(_sq)).normalize();

/* HOW MANY HYDROGEN BONDS, COUNTED. A·T holds with two and G·C with three, and
 * that is the whole of the pairing rule — so it is counted off the record's own
 * atoms rather than looked up from the letters.
 *
 * MUTUAL NEAREST, NOT EVERYTHING UNDER A CUTOFF. Every nitrogen and oxygen on
 * one base has a neighbour on the other within a few ångströms, so a plain
 * distance test counts the pair's own crowding: it made G·C five bonds and A·T
 * three, both of which are wrong and neither of which looks it. Requiring each
 * atom to be the other's CLOSEST partner leaves exactly the Watson-Crick
 * contacts — 3 for every G·C in this molecule and 2 for every A·T, at 2.6 to
 * 3.3 Å. The cutoff is only there to stop a lone atom pairing with something
 * across the groove. */
function hbondPairs(r){
  const side = s => r.spec.atoms.map((_, i) => i)
    .filter(i => strandOf(r, i) === s && isBase(nameOf(r.names[i]))
                 && /^[NO]/.test(nameOf(r.names[i])));
  const A = side(0), B = side(1);
  if(!A.length || !B.length) return [];
  const d = (i, j) => atomAt(r, i).distanceTo(atomAt(r, j)) / S;
  const nearest = (i, list) => list.reduce((best, j) => d(i, j) < d(i, best) ? j : best, list[0]);
  const out = [];
  for(const i of A){
    const j = nearest(i, B);
    if(d(i, j) < 3.4 && nearest(j, A) === i) out.push([i, j]);
  }
  return out;
}
const hbonds = r => hbondPairs(r).length;

/* WHERE THE HYDROGEN BONDS ARE: the middle of the contacts themselves, which is
 * the gap between the two bases. The centre of either base is a point inside a
 * ring, and a label pointing there names the base rather than the bond. */
function hbondMid(pairIndex){
  const r = rungs[pairIndex];
  const contacts = hbondPairs(r);
  return () => {
    const c = new THREE.Vector3();
    if(!contacts.length) return c;
    for(const [i, j] of contacts) c.add(worldAt(r, i)).add(worldAt(r, j));
    return c.multiplyScalar(1 / (contacts.length * 2));
  };
}

/* =============================================================================
 *  THE CALLOUTS
 * =============================================================================
 *  annotate.js, with every anchor a FUNCTION: the duplex turns under the drag,
 *  so a point captured when the part was chosen comes adrift on the first
 *  frame. The label says what the part is; the card says why it matters.
 * ========================================================================== */
const NOTES = Annot.create(THREE, stage, L.camera, { mode:'on' });

// The atom a label hangs on, by name, in the residue this page shows off.
function at(pairIndex, strand, name){
  const r = rungs[pairIndex];
  const i = r.p.index[(strand === 0 ? 'A' : 'B') + ':' + name];
  return i == null ? null : () => worldAt(r, i);
}
// The middle of a set of atoms, for a label that names a GROUP rather than an
// atom — a sugar has no one sphere that is the sugar.
function midOf(pairIndex, strand, want){
  const r = rungs[pairIndex];
  const idx = r.spec.atoms.map((_, i) => i).filter(i =>
    strandOf(r, i) === strand && want(nameOf(r.names[i])));
  return () => {
    const c = new THREE.Vector3();
    for(const i of idx) c.add(worldAt(r, i));
    return c.multiplyScalar(1 / (idx.length || 1));
  };
}

/* =============================================================================
 *  THE PARTS
 * =============================================================================
 *  Each part is: which spheres are IT, what the callouts say, and the sentence
 *  the column carries beside it. Every number in a sentence is read at render time from the
 *  molecule on stage.
 * ========================================================================== */
const seqOf = i => bdna.pairs[i].seq.replace(/D/g, '').replace('-', '·');

const PARTS = [
  { key:'whole', title:'DNA: the double helix', sub:'two strands, wound',
    rails:true,
    deck:'Rendered from real data.',
    hint:'Scroll to examine each part',
    note:()=>`The two strands run in opposite directions, <b>antiparallel</b>, `
      + `which is what lets each one act as a template for the other.\n\n Wound `
      + `together, every rung turns ${bdna.twistDeg.toFixed(1)}° from the one `
      + `below it and rises ${bdna.rise.toFixed(1)} Å, so a full turn takes `
      + `${(360 / bdna.twistDeg).toFixed(1)} rungs.`,
    // NO CALLOUTS. The first part is the whole molecule, and naming the two
    // strands on it labels the thing the reader has not been shown a part of
    // yet; the next section is that.
    notes:()=>[] },

  { key:'strand', title:'One strand', sub:'a chain, on its own',
    atoms:(r, i)=>strandOf(r, i) === 0,
    rails:lk=>lk.strand === 0,
    note:()=>`One of the two chains, ${bdna.n} nucleotides long, and a single `
      + 'molecule: every atom in it is joined to the next by covalent bonds. '
      + '<b>This is what has to exist before pairing can happen.</b>\n\n It has a '
      + 'phosphate at one end and a free –OH at the other, so it also has a '
      + 'direction: <b>5′ to 3′</b>, and everything that copies DNA works along '
      + 'it that way.',
    notes:()=>[
      { text:"5′ end", card:'The phosphate end of the chain. Nothing is ever added here.',
        at:at(0, 0, "O5'") || at(0, 0, 'P'), offset:[-58, -18] },
      { text:"3′ end", card:'The free hydroxyl. Every new nucleotide is added onto this one, which is why a strand is only ever built 5′ to 3′.',
        at:at(bdna.n - 1, 0, "O3'"), offset:[58, 18] },
      { text:'One molecule, end to end', card:'Break a hydrogen bond and you separate two strands. Break a phosphodiester bond and you have cut a strand in half.',
        at:midOf(5, 0, isPhos), offset:[-68, -16] },
    ] },

  { key:'nucleotide', title:'One nucleotide', sub:'base + sugar + phosphate',
    atoms:(r, i)=>inResidue(r, i, SHOWN),
    note:()=>'The repeating unit, and the whole of it: a <b>base</b>, a '
      + '<b>deoxyribose sugar</b>, and a <b>phosphate</b>. The base is the only '
      + 'part that changes from one nucleotide to the next, so it is the only '
      + 'part that carries information.\n\n Chain millions of these together and the '
      + 'identical sugar-phosphate units become the backbone, with the bases '
      + 'pointing inward, where the code is read.',
    notes:()=>[
      { text:'Base', card:'Adenine here. The part that differs between the four nucleotides, and the only part that carries information.',
        at:midOf(SHOWN.pair, SHOWN.strand, isBase), offset:[118, -116] },
      { text:'Sugar (deoxyribose)', card:'A five-carbon ring. Its 3′ and 5′ carbons are where the next nucleotides attach.',
        at:midOf(SHOWN.pair, SHOWN.strand, isSugar), offset:[-148, 30] },
      { text:'Phosphate', card:'Negatively charged at cell pH, which is why DNA is an acid and why it sticks to positively charged proteins.',
        at:midOf(SHOWN.pair, SHOWN.strand, isPhos), offset:[-128, 122] },
    ] },

  { key:'backbone', title:'The backbone', sub:'sugar–phosphate, covalent',
    atoms:(r, i)=>{ const a = nameOf(r.names[i]); return isSugar(a) || isPhos(a); },
    rails:true,
    note:()=>'Sugar, phosphate, sugar, phosphate, all the way down, and '
      + 'identical whatever the sequence is.\n\n These bonds are <b>covalent</b> — '
      + 'the strongest thing in the molecule, and what makes a strand one '
      + 'molecule rather than a row of them.',
    notes:()=>[
      { text:'Phosphodiester bond', card:'Covalent bond. One phosphate bridging the 3′ carbon of one sugar and the 5′ carbon of the next. Made by dehydration sythesis.',
        at:at(6, 0, 'P'), offset:[60, -14] },
    ] },

  { key:'pair', title:'A base pair', sub:'held by hydrogen bonds',
    atoms:(r, i)=>r.p.i === SHOWN.pair && isBase(nameOf(r.names[i])),
    note:()=>{
      const r = rungs[SHOWN.pair];
      return `<b>Hydrogen bonds</b> hold base pairs together, and determine how pairs match.`
        + '\n\n A·T holds with two bonds and G·C with three. '
        + 'Nothing else fits both the shape and the '
        + 'charges, which is why each base only pairs with one partner.';
    },
    hbonds:()=>{
      const r = rungs[SHOWN.pair];
      return hbondPairs(r).map(([i, j]) => [atomAt(r, i), atomAt(r, j)]);
    },
    notes:()=>[
      { text:'Hydrogen bonds', card:'Weak. They break with heat or a helicase, which is how the two strands can be pulled apart and read.',
        at:hbondMid(SHOWN.pair), offset:[140, -104] },
    ] },

  { key:'bases', title:'The bases inside', sub:'stacked, and paired',
    atoms:(r, i)=>isBase(nameOf(r.names[i])),
    note:()=>`Every base points into the middle and stacks flat against the `
      + `ones above and below it, ${bdna.rise.toFixed(1)} Å apart, face to `
      + `face.\n\n Those faces are flat and greasy: water will not wet them, so `
      + `the surrounding water squeezes the stack together. `
      + `<b>That stacking, not the hydrogen bonding between base pairs, is most of what holds the `
      + `helix together.</b>`,
    notes:()=>[
      { text:'Stacked flat', card:'Rungs 3.4 Å apart, face to face. The ring faces are greasy, so water pushes them together.',
        at:midOf(6, 0, isBase), offset:[60, -18] },
    ] },

  { key:'grooves', title:'The two grooves', sub:'where a protein reads',
    atoms:(r, i)=>{ const a = nameOf(r.names[i]); return isSugar(a) || isPhos(a); },
    rails:true,
    note:()=>`Wind a ladder and the gap between the rails comes out in two `
      + `sizes. The brackets mark where each one runs; the widths are measured `
      + `across it, phosphorus to phosphorus, less the ${P_VDW} Å the two `
      + `phosphates themselves take up.\n\n A protein that reads a sequence without `
      + `opening the helix reaches into the wide one, where the edges of the `
      + `bases are exposed.`,
    /* NO CALLOUTS. The brackets name the grooves themselves — the name and the
     * width sit on the rule, where the measurement did — so a note here would
     * be a second marker for a place already marked. */
    notes:()=>[],
    /* THE MEASUREMENT IS THE POINT of this part, and two labelled dots do not
     * make one: a bracket is drawn ACROSS the gap, which is the only thing that
     * says the two grooves are different sizes. Each one spans the pair of
     * phosphates its width was read off, and prints that pair's own distance. */
    // The side is the bracket's own business: each groove crosses the model as
    // it turns, and so does the label hanging off it.
    spans:()=>[
      { g:GROOVE.minor, name:'Minor groove' },
      { g:GROOVE.major, name:'Major groove' },
    ].map(({ g, name }) => ({
      from:()=>worldAt(g.mid.a.r, g.mid.a.ai),
      to:  ()=>worldAt(g.mid.b.r, g.mid.b.ai),
      // Stood up beside the model, which is how a groove is dimensioned in
      // every textbook figure — and the axis it is measured along is the one
      // the duplex was stood up on, so the bracket and the number agree.
      axis:'y', side:'auto', gap:58,
      facing:grooveFacing(g),
      /* THE RULE MARKS WHERE THE GROOVE RUNS; the width beside its name is
       * measured ACROSS it, which is not the span drawn here. Saying which
       * groove it is keeps the number attached to a name rather than to the
       * length of the bracket. */
      text:`${name} · ${grooveWidth(g)}`,
    })) },

  { key:'significance', title:'The reference molecule', sub:'the Drew-Dickerson dodecamer',
    rails:true,
    note:()=>'This sequence, CGCGAATTCGCG, is <b>1BNA</b>: the first DNA ever solved at atomic resolution, in 1980. \n\n It killed the idea of "uniform" B-DNA. The idealized Watson-Crick model has constant twist and rise. Notice here how twist and roll change base-pair to base-pair, and the bases sit propeller-twisted relative to each other rather than flat. \n\n 1BNA is self-complementary (the sequence is a palindrome) and small, so it crystallizes easily. Thus it has become a standard reference for DNA structure.',
    notes:()=>[] },

];

/* =============================================================================
 *  FRAMING A PART
 * =============================================================================
 *  One nucleotide inside a 12-mer is forty spheres out of six hundred: greying
 *  the rest names it and does not SHOW it. So the stage moves to the part —
 *  centred on it and pulled in to its size — and comes back out for the parts
 *  that are the whole molecule.
 *
 *  THE CENTRE IS RE-READ EVERY FRAME, not captured when the part is chosen. The
 *  student can spin the duplex, and a part centred once would swing off the
 *  stage on the first drag. FRAME only translates, so the centre it is
 *  cancelling is measured inside SPIN and is unaffected by its own correction.
 * ========================================================================== */
// Whole-molecule framing, and the smallest a part may be zoomed to: closer than
// this and a single nucleotide fills the stage with no molecule around it to
// say where it sits.
const WHOLE = { rxz:16, hy:52 };
const MIN_R = 9;
const VIEW = { box:{ x:0, y:0, ...WHOLE }, u:1 };

/* THE VIEW ANGLE NEVER CHANGES WITH THE PART, only the framing. Tipping the
 * model to lay a base pair flat to the camera shows the pair better and costs
 * more than it buys: the student loses track of where they are in a molecule
 * they were just looking at, and every part after it has to re-establish which
 * way is up. One angle, chosen once; the drag is theirs. */

/* Which spheres the current part is, as live points in the frame FRAME's own
 * position is expressed in. Reading them there and taking FRAME's translation
 * back off (recentre) is what keeps the measurement free of the correction it
 * is about to make — and it needs no rotation of its own, which reading them in
 * SPIN's local frame did, wrongly, and left every zoomed part off to one side. */
function partPoints(part){
  const out = [];
  if(!part.atoms) return out;
  for(const r of rungs) r.spec.atoms.forEach((_, i) => {
    if(part.atoms(r, i)) out.push(() =>
      L.root.worldToLocal(worldAt(r, i)).sub(FRAME.position));
  });
  return out;
}
let focusPts = [];
function recentre(){
  const want = new THREE.Vector3();
  if(focusPts.length){
    for(const f of focusPts) want.add(f());
    want.multiplyScalar(1 / focusPts.length);
  }
  // Ease between "the part" and "the whole molecule" rather than snapping: the
  // page is answering a question about one object, and a cut makes it look like
  // a different one.
  FRAME.position.set(0, 0, 0).addScaledVector(want, -VIEW.u);
}

function frameFor(part){
  focusPts = partPoints(part);
  if(!focusPts.length){ return { box:{ x:0, y:0, ...WHOLE }, u:0 }; }
  const c = new THREE.Vector3();
  for(const f of focusPts) c.add(f());
  c.multiplyScalar(1 / focusPts.length);
  let r = 0;
  for(const f of focusPts) r = Math.max(r, f().distanceTo(c));
  r = Math.max(MIN_R, r * 1.45);
  // A part wider than the duplex is the duplex: frame the whole thing rather
  // than pulling in on something that is already everything.
  if(r >= WHOLE.rxz * 1.6) return { box:{ x:0, y:0, ...WHOLE }, u:0 };
  return { box:{ x:0, y:0, rxz:r, hy:r }, u:1 };
}

let current = null;
function show(part){
  if(current === part) return;
  current = part;
  const to = frameFor(part);
  paint(part, to.u === 1);
  const from = { box:{ ...VIEW.box }, u:VIEW.u };
  L.motion.cancel('frame');
  L.motion.seq([{ dur:0.55, ease:'inOutCubic', onUpdate:u=>{
    VIEW.u = from.u + (to.u - from.u) * u;
    VIEW.box = { x:0, y:0,
      rxz: from.box.rxz + (to.box.rxz - from.box.rxz) * u,
      hy:  from.box.hy  + (to.box.hy  - from.box.hy)  * u };
    L.fit();
  } }], { tag:'frame' });
  home();
  /* The bonds are the pair's own business, so they are drawn for the part that
   * makes the claim and hidden for the rest — on the whole duplex they are
   * twelve pairs of dashes buried in the core, which reads as noise. */
  const hb = part.hbonds ? part.hbonds() : null;
  HB.setVisible(!!hb);
  if(hb) HB.set(hb);

  NOTES.clear();
  // THE BRACKETS FIRST: a note may anchor to one of them (the grooves do), and
  // it can only do that if the bracket it points at already exists.
  const brackets = (part.spans ? part.spans() : []).map(b => NOTES.span(b));
  for(const n of part.notes(brackets)) if(n.at || n.atPx || n.atSpan) NOTES.add(n);
  for(const el of secs) el.setAttribute('aria-current', String(el.dataset.key === part.key));
}

/* =============================================================================
 *  THE COLUMN, AND SCROLLING AS THE CONTROL
 * =============================================================================
 *  One section per part, in the order the parts are in — so the reading order
 *  and the model's order cannot come apart. The section under the reading line
 *  is the part the model shows; there is no second control to keep in sync.
 *
 *  Every number and every callout is still the part's own, read at render time,
 *  so the prose here says what the spheres say.
 * ========================================================================== */
document.getElementById('specimen').innerHTML =
  `${bdna.n} base pairs of B-DNA — the Drew-Dickerson dodecamer, 1BNA.`;

const host = document.getElementById('sections');
/* A CLAIM IS PARAGRAPHS, split on a blank line. Four sentences in one block is
 * a wall a reader skims; the break is where the claim turns — from what the
 * part IS to what follows from it. Written as blank lines in the text rather
 * than as markup, so the data stays prose. */
const claim = t => t.split(/\n\s*\n|<br\s*\/?>\s*<br\s*\/?>/)
  .map(x => x.trim()).filter(Boolean)
  .map(x => `<p class="claim">${x}</p>`).join('');

const secs = PARTS.map((part, i) => {
  const el = document.createElement('section');
  el.dataset.key = part.key;
  el.innerHTML =
    `<p class="num">${String(i + 1).padStart(2, '0')} / ${String(PARTS.length).padStart(2, '0')}</p>`
    + `<h3>${part.title}</h3>`
    + `<p class="gloss">${part.sub}</p>`
    + (part.deck ? `<p class="deck">${part.deck}</p>` : '')
    + claim(part.note())
    + (part.hint ? `<p class="hint">${part.hint}</p>` : '');
  host.appendChild(el);
  return el;
});



/* TURNING IT IS THE POINT. A helix seen from one angle is a tangle of sticks;
 * the grooves only read as two different gaps once it moves. Yaw about the
 * screen's up axis, which is the duplex's own axis after standing it up, so the
 * drag spins it the way a model on a desk spins.
 * ========================================================================== */
const canvas = document.getElementById('gl');

/* WHERE IT STARTS, AND WHERE EVERY PART COMES BACK TO. Chosen at the stage
 * rather than solved: which face of a duplex reads best is a question about the
 * picture, not about the record. Every part's callout offsets were placed
 * against THIS angle, so a part shown at whatever angle the reader left the
 * model at is a part with its labels over its own spheres. */
const HOME = { yaw:1.145, pitch:0 };
SPIN.rotation.set(HOME.pitch, HOME.yaw, 0);

/* WHICH RUNG EACH GROOVE IS MEASURED AT, chosen so that at HOME it faces the
 * reader. A groove spirals, so it is on the near side at some heights and the
 * far side at others; measuring both at the middle rung puts one of them round
 * the back, where its bracket fades to nothing and the step that exists to
 * contrast two widths shows one. Read off HOME rather than typed, so moving
 * HOME moves these with it. */
{
  const q = new THREE.Quaternion().setFromEuler(
    new THREE.Euler(HOME.pitch, HOME.yaw, 0));
  const towards = m => {
    const g = { mid:m };
    return grooveRadial(g).rad.applyQuaternion(q).z;   // +Z is out of the screen
  };
  for(const g of [GROOVE.minor, GROOVE.major])
    if(g && g.mids && g.mids.length)
      g.mid = g.mids.reduce((best, m) => towards(m) > towards(best) ? m : best, g.mids[0]);
}

let turn = null, homing = false, drifting = true;

/* THE IDLE TURN. On the whole molecule only, and only until the reader takes
 * hold of it: a helix has to move once before it stops reading as a tangle of
 * sticks. A part that has been zoomed to holds still instead — its framing and
 * its labels were both placed against one angle. */
const DRIFT = 0.06;                    // rad/s — about a hundred seconds a turn
function idle(dt){
  if(!drifting || turn || homing || current !== PARTS[0]) return;
  SPIN.rotation.y += DRIFT * dt;
}

/* BACK TO THE DEFAULT VIEW WHEN THE PART CHANGES, from wherever the model is —
 * drifted, or dragged. The yaw takes the SHORT way round: the reader has spun
 * it three turns by then, and a tween to the raw stored angle unwinds all of
 * them. */
function home(){
  L.motion.cancel('spin');
  const y0 = SPIN.rotation.y, x0 = SPIN.rotation.x;
  const TAU = Math.PI * 2;
  let dy = (HOME.yaw - y0) % TAU;
  if(dy >  Math.PI) dy -= TAU;
  if(dy < -Math.PI) dy += TAU;
  const dx = HOME.pitch - x0;
  if(Math.abs(dy) < 0.01 && Math.abs(dx) < 0.01){ homing = false; return; }
  homing = true;
  L.motion.seq([
    { dur:0.8, ease:'inOutCubic', onUpdate:u=>{
      SPIN.rotation.y = y0 + dy * u;
      SPIN.rotation.x = x0 + dx * u;
    } },
    { dur:0, call:()=>{ homing = false; } },
  ], { tag:'spin' });
}

canvas.addEventListener('pointerdown', e => {
  // The model is theirs from here: the drift stops for good, and a tween still
  // running would fight the drag for the same two angles.
  drifting = false;
  L.motion.cancel('spin');
  homing = false;
  turn = { x:e.clientX, y:e.clientY };
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});

canvas.addEventListener('pointermove', e => {
  if(!turn) return;
  SPIN.rotation.y += (e.clientX - turn.x) * 0.008;
  // Tipping is CLAMPED. Past about a third of a turn the duplex is end-on,
  // where every part overlaps every other and the glossary names a tangle.
  SPIN.rotation.x = Math.max(-0.6, Math.min(0.6,
    SPIN.rotation.x + (e.clientY - turn.y) * 0.008));
  turn = { x:e.clientX, y:e.clientY };
});
addEventListener('pointerup', () => { turn = null; });

show(PARTS[0]);
L.resize(); L.fit(); L.start();

// After the first show(): lib/story.js's header.
Story.scroll(secs, i => show(PARTS[i]));

</script>
</body>
</html>
