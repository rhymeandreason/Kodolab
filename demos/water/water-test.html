<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/scene.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../kit/lesson-shell.js"></script>
<script src="../water/watersim.js"></script>
<script src="../water/watersim-mount.js"></script>
<script>
/* The bench for water/watersim.js through WaterSim.mount, the declarative box a
   generated page gets. Everything on stage is the module: the H-bond network,
   the ice Ih lattice, the hydration shells, the temperature continuum. Every
   control is a set() and every number a state(). Rulebook: docs/WaterSim.md.
   It runs on the lesson shell so the component is judged in the chrome a
   student sees it in. */

/* WaterSim.md §1: a water takes at most 4 H-bonds. §4: no atom overlap; two
   oxygens of radius 0.95 each may not come closer than 1.90. */
const MAX_HB = 4, O_CONTACT = 2 * 0.95, MERGE_TOL = 0.02;
const T0 = 22;

const shell = LessonShell.create({
  brand: 'WaterSim', section: { label: 'library', href: '/library' },
  hint: 'Drag to orbit · Scroll to zoom',
  steps: [{
    eyebrow: 'water/watersim.js',
    title: 'Water, with no lesson around it',
    body: '<p>The H-bond network, the ice I<sub>h</sub> lattice, hydration shells and the temperature continuum, mounted through <strong>WaterSim.mount</strong>. No steps, no callouts, no tabs.</p>',
    onEnter: bench,
  }],
});

const w = WaterSim.mount(shell.stage, { nWater: 16, temperature: T0, freeze: true, viewOffset: shell.viewOffset });
const sim = w.sim;                               // the invariants read the molecules themselves
/* The bench's console: `water.set({...})`, `water.state()`, `water.sim`. */
window.water = w;

function bench(ctx) {
  const ui = ctx.ui;
  ui.controls(`
    <div class="bench-group">
      <div class="bench-hd">the pool</div>
      <div class="row">
        <button class="btn secondary" type="button" id="addw">+ water</button>
        <button class="btn ghost" type="button" id="remw">− water</button>
      </div>
      <div class="row">
        <button class="btn secondary" type="button" id="adds">+ NaCl</button>
        <button class="btn ghost" type="button" id="clrs">Clear salt</button>
      </div>
    </div>

    <div class="bench-group">
      <div class="bench-hd">temperature</div>
      <div class="slider"><div class="slider-head"><span class="label">temperature</span><span class="value" id="tv"></span></div>
        <input id="t" type="range" min="-25" max="110" step="1" value="${T0}"></div>
      <label class="switch"><input type="checkbox" id="freeze" checked><span class="track"></span>let it freeze</label>
      <label class="switch"><input type="checkbox" id="hb" checked><span class="track"></span>draw hydrogen bonds</label>
    </div>

    <div class="bench-group">
      <div class="bench-hd">what the module says it did</div>
      <table class="rd" id="rd"></table>
    </div>

    <div class="bench-group">
      <div class="bench-hd">invariants</div>
      <p class="foot" id="inv"></p>
    </div>`);

  const $ = s => ui.q(s);
  const rd = $('#rd'), inv = $('#inv');

  $('#addw').onclick = () => w.set({ nWater: Math.min(60, w.params().nWater + 1) });
  $('#remw').onclick = () => w.set({ nWater: Math.max(1, w.params().nWater - 1) });
  $('#adds').onclick = () => w.set({ salt: 'nacl', nSalt: Math.min(4, w.params().nSalt + 1) });
  $('#clrs').onclick = () => w.set({ nSalt: 0 });
  ui.range($('#t'), v => w.set({ temperature: v }));
  $('#freeze').onchange = e => w.set({ freeze: e.target.checked });
  $('#hb').onchange = e => w.set({ hbonds: e.target.checked });

  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;

  /* Printed every frame rather than asserted once, because the failure is a
     transient: a lattice that passes at rest and buries a hydrogen mid-freeze. */
  function invariants() {
    const over = sim.mols.filter(m => (m.userData.hb || 0) > MAX_HB).length;
    let worst = 0;
    for (let i = 0; i < sim.mols.length; i++) for (let j = i + 1; j < sim.mols.length; j++) {
      const d = sim.mols[i].userData.oWorld().distanceTo(sim.mols[j].userData.oWorld());
      worst = Math.max(worst, O_CONTACT - d);
    }
    const bad = [];
    if (over) bad.push(`${over} molecule(s) over ${MAX_HB} H-bonds`);
    if (worst > MERGE_TOL) bad.push(`oxygens merged by ${worst.toFixed(2)}`);
    inv.classList.toggle('bad', bad.length > 0);
    inv.textContent = bad.length ? bad.join(' · ') : `≤${MAX_HB} H-bonds per molecule · no merged oxygens`;
  }

  w.on('frame', p => {
    $('#tv').textContent = w.params().temperature + '°C';
    rd.innerHTML =
      row('water', p.nWater) +
      row('ions', p.nIons) +
      row('hydrogen bonds', p.hbondCount) +
      row('bonds per molecule', p.nWater ? (p.hbondCount * 2 / p.nWater).toFixed(2) : '0') +
      row('frozen', p.fz.toFixed(2)) +
      row('escaping', p.escaping) +
      row('molality', p.molal.toFixed(2) + ' m') +
      row('freezes at', (-p.dTf).toFixed(1) + '°C') +
      row('boils at', (100 + p.dTb).toFixed(1) + '°C') +
      (sim.salt.length ? row('shells', sim.salt.map(s => s.userData.shellCount).join(' / ')) : '');
    invariants();
  });
}

shell.goTo(0);
</script>
</body>
