<!-- ===================================================================
     EVERY MOLECULE, GROUPED. library.html shows two rows of them and sends
     the reader here; this page is the whole of MolLib.MOLECULES.

     THE CARDS ARE READ FROM THE REGISTRY, so a new mol-*.js spec appears
     here by being registered. Every card is a baked still
     (media/molecules); a molecule becomes turnable in the modal, on the
     one live context this page makes, on the two views lib/molview.js
     offers: the model, and the same spheres slid onto the diagram's flat
     layout. `#key` in the URL opens that molecule, which is the link
     library.html's cards carry.
     =================================================================== -->

<script>
'use strict';
const $ = id => document.getElementById(id);
const MOLS = MolShelf.list();
const BY_KEY = new Map(MOLS.map(m => [m.key, m]));

/* One section per domain file, headed the way library.html heads one. */
const groups = $('mol-groups');
let grid = null, lastDomain = null;
for (const m of MOLS) {
  if (m.spec.domain !== lastDomain) {
    const sec = document.createElement('section');
    sec.className = 'unit';
    sec.innerHTML = '<div class="uhead"><h2></h2></div><div class="grid mols"></div>';
    sec.querySelector('h2').textContent = MolShelf.groupOf(m.spec.domain);
    groups.appendChild(sec);
    grid = sec.querySelector('.grid');
    lastDomain = m.spec.domain;
  }
  const el = MolShelf.card(m, document.createElement('article'));
  el.addEventListener('click', () => openModal(m));
  grid.appendChild(el);
}
$('tally').textContent = `${MOLS.length} molecules`;

/* ---- the molecule modal: lib/mol-card.js inside a backdrop ---------------- */
const modal = $('modal');
let open = null;

/* THE EMBED CODE, one sheet for every molecule. `layout=card` is this modal as
   a frame; the bare URL is the model alone, with its 3D/2D and hydrogens. */
const sheet = EmbedSheet.create({
  heading: 'Embed this molecule', pick: 'Molecule',
  items: MOLS.map(m => ({ key: m.key, title: m.spec.name, group: MolShelf.groupOf(m.spec.domain) })),
  views: [{ key: 'card', label: 'With description' }, { key: 'solo', label: 'Model only' }],
  resolve: (it, view) => ({
    src: `/embed/molecule/${it.key}` + (view === 'card' ? '?layout=card' : ''),
    lw: view === 'card' ? 960 : 0,
  }),
  credit: it => ({ href: `/molecules#${it.key}`, text: 'Open this molecule on Kodolab \u2192' }),
  size: { w: 960, h: 620 },
});

function openModal(m) {
  closeModal();
  /* Shown before the card is mounted: a box with no size cannot be fitted. */
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  open = MolCard.mount(modal, m, { onClose: closeModal, onEmbed: () => sheet.show(m.key),
    onImage: () => EmbedSheet.saveStill(MolCard.stillSrc(m.key), m.key) });
  open.el.setAttribute('aria-modal', 'true');
  open.el.querySelector('.x').focus();
}

function closeModal() {
  if (!open) return;
  open.destroy();
  open = null;
  modal.hidden = true;
  document.body.style.overflow = '';
}
modal.addEventListener('mousedown', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.isOpen()) closeModal();
});

/* library.html's shelf links here as /molecules#<key>. */
function openFromHash() {
  const m = BY_KEY.get(decodeURIComponent(location.hash.slice(1)));
  if (m) openModal(m);
}
window.addEventListener('hashchange', openFromHash);
openFromHash();
</script>
