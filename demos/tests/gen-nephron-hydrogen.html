<!doctype html>
<!-- requests
1. Show how a kidney nephron filters blood: the glomerulus pushes water and small solutes into the tubule, and most of it is reabsorbed along the way.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How a Nephron Filters Blood</title></head><body><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../kit/app.js" data-shell="steps" data-use="Scene"></script><script>Scene.define('nephron', { scale: { rung: 'organ', form: 'single', unit: null, exag: {} }, params: { pressure: 1, reabsorb: 0, flow: 1 }, glide: ['pressure', 'reabsorb', 'flow'], build(k) { const { THREE } = k; const matCap = k.material(0xc84b4b); const matWall = k.material(0xd8d2c4, { transparent: true, opacity: 0.34, side: THREE.DoubleSide }); const matProx = k.material(0xe3b868, { transparent: true, opacity: 0.45, side: THREE.DoubleSide }); const matLoop = k.material(0xd49a52, { transparent: true, opacity: 0.45, side: THREE.DoubleSide }); const matDist = k.material(0xc98249, { transparent: true, opacity: 0.45, side: THREE.DoubleSide }); const matDuct = k.material(0xb87650, { transparent: true, opacity: 0.5, side: THREE.DoubleSide }); const glomGroup = new THREE.Group(); const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.68, 0.14, 64, 10, 2, 3), matCap); glomGroup.add(knot); glomGroup.position.set(-4.2, 2.2, 0); const affCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(-6.4, 2.8, 0), new THREE.Vector3(-5.2, 2.5, 0.2), new THREE.Vector3(-4.5, 2.2, 0)]); glomGroup.add(new THREE.Mesh(new THREE.TubeGeometry(affCurve, 16, 0.19, 10, false), matCap)); k.part('glomerulus', glomGroup, { label: 'Glomerulus', card: 'A high-pressure knot of capillaries where water and small solutes are pushed out of the blood.', color: 0xc84b4b }); const capGeo = new THREE.SphereGeometry(1.32, 24, 18, 0.35, Math.PI * 1.45, 0.25, Math.PI - 0.5); const capMesh = new THREE.Mesh(capGeo, matWall); capMesh.position.set(-4.1, 2.2, 0); capMesh.rotation.z = -0.25; k.part('capsule', capMesh, { label: 'Bowman\'s capsule', card: 'Surrounds the glomerulus to catch filtrate while keeping blood cells and large proteins in the blood.', color: 0xd8d2c4 }); const tubPts = [new THREE.Vector3(-2.9, 2.0, 0), new THREE.Vector3(-1.8, 2.6, 0.5), new THREE.Vector3(-0.7, 1.7, -0.4), new THREE.Vector3(0.3, 2.2, 0.3), new THREE.Vector3(0.8, -0.5, 0.2), new THREE.Vector3(1.1, -3.1, 0), new THREE.Vector3(1.8, -3.2, 0), new THREE.Vector3(2.2, -0.5, -0.2), new THREE.Vector3(2.6, 2.0, 0), new THREE.Vector3(3.4, 2.5, 0.4), new THREE.Vector3(4.3, 1.8, -0.3), new THREE.Vector3(5.1, 2.0, 0), new THREE.Vector3(5.4, 0.0, 0), new THREE.Vector3(5.4, -3.3, 0)]; const tubCurve = new THREE.CatmullRomCurve3(tubPts); function segCurve(a, b, n) { const pts = []; for (let i = 0; i <= n; i++) pts.push(tubCurve.getPointAt(a + (b - a) * (i / n))); return new THREE.CatmullRomCurve3(pts); } k.part('proximal', new THREE.Mesh(new THREE.TubeGeometry(segCurve(0, 0.28, 28), 28, 0.26, 12, false), matProx), { label: 'Proximal tubule', card: 'Reabsorbs most filtered water, ions, and glucose back into the bloodstream.', color: 0xe3b868 }); k.part('loop', new THREE.Mesh(new THREE.TubeGeometry(segCurve(0.28, 0.62, 32), 32, 0.2, 12, false), matLoop), { label: 'Loop of Henle', card: 'Dips into the medulla to concentrate salts and reclaim additional water.', color: 0xd49a52 }); k.part('distal', new THREE.Mesh(new THREE.TubeGeometry(segCurve(0.62, 0.80, 20), 20, 0.23, 12, false), matDist), { label: 'Distal tubule', card: 'Fine-tunes salt and water balance before filtrate enters the collecting duct.', color: 0xc98249 }); k.part('duct', new THREE.Mesh(new THREE.TubeGeometry(segCurve(0.80, 1.0, 18), 18, 0.28, 12, false), matDuct), { label: 'Collecting duct', card: 'Carries the remaining fluid, now urine, out of the nephron.', color: 0xb87650 }); const periPts = [new THREE.Vector3(-3.8, 1.6, 0), new THREE.Vector3(-2.5, 1.2, -0.45), new THREE.Vector3(-1.1, 1.1, 0.55), new THREE.Vector3(0.2, 1.3, -0.35), new THREE.Vector3(0.5, -2.4, -0.45), new THREE.Vector3(2.4, -2.3, 0.45), new THREE.Vector3(2.8, 1.2, -0.35), new THREE.Vector3(4.1, 1.1, 0.45), new THREE.Vector3(5.9, 1.1, 0)]; const periCurve = new THREE.CatmullRomCurve3(periPts); k.part('capillary', new THREE.Mesh(new THREE.TubeGeometry(periCurve, 56, 0.15, 10, false), matCap), { label: 'Peritubular capillary', card: 'Runs beside the tubule to collect reabsorbed water and useful solutes.', color: 0xc84b4b }); const N_RBC = 28; const rbcMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.16, 10, 8), k.material(0xb82828), N_RBC); k.part('rbc', rbcMesh, { label: 'Red blood cells', card: 'Too large to cross the glomerulus, so they stay in the blood vessels.', color: 0xb82828, layer: true }); const N_WATER = 80; const waterMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.1, 8, 8), k.material(0x5a9fd6), N_WATER); k.part('filtrate', waterMesh, { label: 'Water & small solutes', card: 'Filtered at the glomerulus and mostly reabsorbed into the peritubular capillary.', color: 0x5a9fd6, layer: true }); const N_WASTE = 16; const wasteMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.11, 8, 8), k.material(0xe8c547), N_WASTE); k.part('waste', wasteMesh, { label: 'Wastes (urea)', card: 'Small enough to filter, not reabsorbed, and excreted in urine.', color: 0xe8c547, layer: true }); const dummy = new THREE.Object3D(); const tmpA = new THREE.Vector3(); const tmpB = new THREE.Vector3(); function bloodPos(u, target) { if (u < 0.18) return affCurve.getPointAt(u / 0.18, target); if (u < 0.34) { const a = ((u - 0.18) / 0.16) * Math.PI * 4; return target.set(-4.2 + 0.52 * Math.cos(a), 2.2 + 0.48 * Math.sin(a * 1.5), 0.35 * Math.sin(a)); } return periCurve.getPointAt((u - 0.34) / 0.66, target); } return { update() {}, step(dt, t) { const spd = 0.12 * k.params.flow; for (let i = 0; i < N_RBC; i++) { const u = (t * spd + i / N_RBC) % 1; bloodPos(u, tmpA); dummy.position.copy(tmpA); dummy.scale.set(1.1, 0.65, 1.1); dummy.updateMatrix(); rbcMesh.setMatrixAt(i, dummy.matrix); } rbcMesh.instanceMatrix.needsUpdate = true; const filtFrac = Math.min(0.88, 0.15 + 0.65 * k.params.pressure); const reabFrac = k.params.reabsorb * 0.92; for (let i = 0; i < N_WATER; i++) { const u = (t * spd * 1.1 + i / N_WATER) % 1; const frac = (i * 0.6180339887) % 1; const filters = frac < filtFrac; if (!filters || u < 0.22) { bloodPos(u, tmpA); } else { const tubU = (u - 0.22) / 0.78; const reabU = 0.12 + ((i % 9) / 9) * 0.45; const willReab = ((i * 0.381966) % 1) < reabFrac; if (!willReab || tubU < reabU) { tubCurve.getPointAt(Math.min(1, tubU), tmpA); } else if (tubU < reabU + 0.12) { const mix = (tubU - reabU) / 0.12; tubCurve.getPointAt(tubU, tmpA); periCurve.getPointAt(Math.min(1, tubU * 0.9), tmpB); tmpA.lerp(tmpB, mix); } else { periCurve.getPointAt(Math.min(1, tubU * 0.9), tmpA); } } dummy.position.copy(tmpA); dummy.scale.setScalar(1); dummy.updateMatrix(); waterMesh.setMatrixAt(i, dummy.matrix); } waterMesh.instanceMatrix.needsUpdate = true; for (let i = 0; i < N_WASTE; i++) { const u = (t * spd * 1.05 + i / N_WASTE) % 1; if (u < 0.22) { bloodPos(u, tmpA); } else { tubCurve.getPointAt(Math.min(1, (u - 0.22) / 0.78), tmpA); } dummy.position.copy(tmpA); dummy.scale.setScalar(k.params.pressure > 0.1 ? 1 : 0.001); dummy.updateMatrix(); wasteMesh.setMatrixAt(i, dummy.matrix); } wasteMesh.instanceMatrix.needsUpdate = true; }, state() { const gfrMlMin = Math.round(125 * k.params.pressure); const nephronReabsorbedPct = Math.round(k.params.reabsorb * 99); const excretedPct = 100 - nephronReabsorbedPct; return { gfrMlMin, nephronReabsorbedPct, excretedPct }; } }; } }); let N; function fmtStats() { const s = N.state(); if (!s) return; const g = document.querySelector('#stat-gfr'); if (g) g.textContent = s.gfrMlMin + ' mL/min'; const r = document.querySelector('#stat-reab'); if (r) r.textContent = s.nephronReabsorbedPct + '%'; const e = document.querySelector('#stat-excr'); if (e) e.textContent = s.excretedPct + '%'; } const shell = LessonShell.create({ brand: 'Kidney Nephron Filtration', hint: 'Drag to orbit · Scroll to zoom', ctx: { state: {} }, steps: [{ eyebrow: '1 · Filtration', title: 'Blood pressure pushes water and small solutes out', body: '<p class="lead"><strong>High pressure in the glomerulus forces water and small solutes into Bowman\'s capsule.</strong></p><p>Red blood cells and large proteins are too big to cross the capillary wall, so they stay inside the blood vessels.</p>', nextLabel: 'Next: Reabsorption', describe: () => { const s = N.state(); return 'A 3D kidney nephron showing blood flowing through the glomerulus at ' + (s ? s.gfrMlMin : 125) + ' mL per minute, pushing blue water and yellow waste particles into Bowman\'s capsule while red blood cells remain in the vessel.'; }, onEnter(ctx) { N.set({ pressure: 1, reabsorb: 0, flow: 1 }); N.notes(['glomerulus', 'capsule']); ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Filtration rate (GFR)</div><div class="stat-value" id="stat-gfr"></div></div></div><div id="panel-legend"></div>'); ctx.ui.showPanel(N, { only: ['legend'] }); fmtStats(); } }, { eyebrow: '2 · Reabsorption', title: 'Most of the filtrate returns to the blood', body: '<p class="lead"><strong>Almost all filtered water and useful solutes are reclaimed along the tubule.</strong></p><p>Cells lining the proximal tubule and loop of Henle move water, ions, and nutrients back into the peritubular capillaries.</p>', nextLabel: 'Next: Excretion', describe: () => { const s = N.state(); return 'Filtrate moves from Bowman\'s capsule through the proximal tubule and loop of Henle, where ' + (s ? s.nephronReabsorbedPct : 99) + ' percent of the water and small solutes cross back into the red peritubular capillary.'; }, onEnter(ctx) { N.set({ pressure: 1, reabsorb: 1, flow: 1 }); N.notes(['proximal', 'capillary']); ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Reabsorbed along tubule</div><div class="stat-value" id="stat-reab"></div></div></div><div id="panel-legend"></div>'); ctx.ui.showPanel(N, { only: ['legend'] }); fmtStats(); } }, { eyebrow: '3 · Excretion', title: 'Only wastes and excess water remain', body: '<p class="lead"><strong>The small fraction not reabsorbed continues to the collecting duct as urine.</strong></p><p>Filtering broadly and reclaiming what the body needs clears wastes like urea without losing water or nutrients.</p>', nextLabel: 'Try adjusting it', describe: () => { const s = N.state(); return 'Yellow waste particles and ' + (s ? s.excretedPct : 1) + ' percent of the filtered water continue through the distal tubule and exit down the collecting duct as urine.'; }, onEnter(ctx) { N.set({ pressure: 1, reabsorb: 1, flow: 1 }); N.notes(['distal', 'duct']); ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Excreted as urine</div><div class="stat-value" id="stat-excr"></div></div></div><div id="panel-legend"></div>'); ctx.ui.showPanel(N, { only: ['legend'] }); fmtStats(); } }, { eyebrow: '4 · Explore', title: 'Adjust filtration pressure and reabsorption', body: '<p><strong>Both filtration pressure and tubular reabsorption set how much water leaves the body.</strong></p><p>Drag the sliders to see how lower blood pressure or reduced reabsorption changes the stream.</p>', describe: () => { const s = N.state(); return 'Interactive nephron controls with filtration rate at ' + (s ? s.gfrMlMin : 125) + ' mL per minute and ' + (s ? s.nephronReabsorbedPct : 99) + ' percent reabsorbed.'; }, onEnter(ctx) { N.notes(false); ctx.ui.controls('<div class="slider"><div class="slider-head"><span class="label">Glomerular pressure</span><span class="value" id="val-p">1.0×</span></div><input type="range" id="sl-p" min="0.2" max="1.5" step="0.05" value="1"></div><div class="slider"><div class="slider-head"><span class="label">Tubular reabsorption</span><span class="value" id="val-r">100%</span></div><input type="range" id="sl-r" min="0" max="1" step="0.05" value="1"></div><div class="stats"><div class="stat"><div class="stat-label">Filtration rate</div><div class="stat-value" id="stat-gfr"></div></div><div class="stat"><div class="stat-label">Reabsorbed</div><div class="stat-value" id="stat-reab"></div></div></div><div id="panel-legend"></div>'); ctx.ui.range(ctx.ui.q('#sl-p'), v => { ctx.ui.q('#val-p').textContent = Number(v).toFixed(2) + '×'; N.set({ pressure: Number(v) }, { snap: true }); }); ctx.ui.range(ctx.ui.q('#sl-r'), v => { ctx.ui.q('#val-r').textContent = Math.round(Number(v) * 100) + '%'; N.set({ reabsorb: Number(v) }, { snap: true }); }); ctx.ui.showPanel(N, { only: ['legend'] }); fmtStats(); } }] }); N = Scene.mount(shell.stage, { scene: 'nephron', viewOffset: shell.viewOffset, pressure: 1, reabsorb: 0, flow: 1 }); N.on('frame', () => fmtStats()); shell.goTo(0);</script></body></html>
