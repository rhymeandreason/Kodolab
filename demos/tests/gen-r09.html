<!doctype html>
<!-- requests
1. plot how the proton gradient builds up while the pump runs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building the Proton Gradient</title>
<style>
  #graph-box { width: 100%; height: 130px; margin-top: 10px; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="ElectronTransport,Graph"></script>
<script>
let g = null;

const shell = LessonShell.create({
  brand: 'Mitochondrial Bioenergetics',
  hint: 'Drag to orbit · Scroll to zoom',
  steps: [
    {
      eyebrow: 'Electrochemical Equilibrium',
      title: 'Before the pumps start',
      body: '<p class="lead"><strong>Without fuel, proton concentrations remain balanced across the membrane.</strong></p><p>Protons sit on both sides of the inner mitochondrial membrane with no net voltage or pH difference. The proton-motive force (pmf) stays near zero.</p>',
      nextLabel: 'Start pumping',
      onEnter(ctx) {
        ET.set({
          fuel: null,
          proteins: { complex: { x: -40 }, synthase: null, leak: null },
          contents: { inside: { water: 30, H: 22 }, outside: { water: 30, H: 22 } }
        });
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton-motive force</div><div class="stat-value" id="pmf-val" data-live>0 mV</div></div></div><div id="graph-box"></div>');
        g = Graph.mount(ctx.ui.q('#graph-box'), { live: { span: 40 }, height: 120 }).follow(ET, 'pmf');
      },
      onExit() {
        if (g) { g.destroy(); g = null; }
      }
    },
    {
      eyebrow: 'Active Transport',
      title: 'Pumping protons against the gradient',
      body: '<p class="lead"><strong>Supplying NADH powers unidirectional proton translocation.</strong></p><p>The electron transport complex moves protons upward out of the matrix into the intermembrane space. Watch the live plot track the rapid surge in membrane potential and proton-motive force.</p>',
      nextLabel: 'Observe stall',
      onEnter(ctx) {
        ET.set({ fuel: 'NADH', fuelRate: 1 });
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton-motive force</div><div class="stat-value" id="pmf-val" data-live>-- mV</div><div class="stat-sub" id="h-count">Pumping in progress</div></div></div><div id="graph-box"></div>');
        g = Graph.mount(ctx.ui.q('#graph-box'), { live: { span: 40 }, height: 120 }).follow(ET, 'pmf');
      },
      onExit() {
        if (g) { g.destroy(); g = null; }
      }
    },
    {
      eyebrow: 'Steady State',
      title: 'Back-pressure limits the gradient',
      body: '<p class="lead"><strong>The electrochemical gradient exerts resistance against further pumping.</strong></p><p>As positive charge and proton concentration accumulate in the intermembrane space, the energy needed to pump each additional proton increases until the complex approaches its stall potential.</p>',
      nextLabel: 'Add ATP Synthase',
      onEnter(ctx) {
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton-motive force</div><div class="stat-value" id="pmf-val" data-live>-- mV</div><div class="stat-sub">Near stall limit</div></div></div><div id="graph-box"></div>');
        g = Graph.mount(ctx.ui.q('#graph-box'), { live: { span: 40 }, height: 120 }).follow(ET, 'pmf');
      },
      onExit() {
        if (g) { g.destroy(); g = null; }
      }
    },
    {
      eyebrow: 'Chemiosmosis',
      title: 'Spending the stored potential',
      body: '<p class="lead"><strong>ATP synthase taps the gradient to make ATP.</strong></p><p>Protons flow back down their electrochemical gradient through the synthase turbine. This establishes a steady-state current where pumping rate balances ATP synthesis rate.</p>',
      onEnter(ctx) {
        ET.set({
          proteins: { complex: { x: -60 }, synthase: { x: 40 }, leak: null },
          showATP: true
        });
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton-motive force</div><div class="stat-value" id="pmf-val" data-live>-- mV</div><div class="stat-sub" id="atp-val">ATP Made: 0</div></div></div><div id="graph-box"></div>');
        g = Graph.mount(ctx.ui.q('#graph-box'), { live: { span: 40 }, height: 120 }).follow(ET, 'pmf');
      },
      onExit() {
        if (g) { g.destroy(); g = null; }
      }
    }
  ]
});

const ET = ElectronTransport.mount(shell.stage, {
  viewOffset: shell.viewOffset,
  fuel: null,
  span: 'inner',
  proteins: { complex: { x: -40 }, synthase: null, leak: null },
  showATP: false,
  showFuel: true
});

ET.on('frame', s => {
  const pmfEl = document.querySelector('#pmf-val');
  if (pmfEl && s.pmf != null) {
    pmfEl.textContent = Math.round(s.pmf) + ' mV';
  }
  const atpEl = document.querySelector('#atp-val');
  if (atpEl && s.atpMade != null) {
    atpEl.textContent = 'ATP Made: ' + s.atpMade;
  }
});

shell.goTo(0);
</script>
</body>
</html>
