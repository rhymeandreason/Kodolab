<!doctype html>
<!-- requests
1. How does a plant turn sunlight into sugar?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photosynthesis: Sunlight to Sugar</title>
<link rel="stylesheet" href="../css/kodo.css">
<link rel="stylesheet" href="../css/lesson-shell.css">
<link rel="stylesheet" href="../graph/graph.css">
<style>
  .readout-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 12px 0;
  }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.16/dist/plot.umd.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/mol-small.js"></script>
<script src="../lib/scene.js"></script>
<script src="../lib/atomkit.js"></script>
<script src="../lib/annotate.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../membrane/parts.js"></script>
<script src="../membrane/pump.js"></script>
<script src="../membrane/chemiosmosis.js"></script>
<script src="../membrane/sheet.js"></script>
<script src="../chemiosmosis/circuit.js"></script>
<script src="../membrane/membrane.js"></script>
<script src="../graph/graph.js"></script>
<script src="../kit/lesson-shell.js"></script>

<script>
let liveGraph = null;
let unframe = null;

const shell = LessonShell.create({
  brand: 'Photosynthesis · Bio 101',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: { state: {} },
  steps: [
    {
      eyebrow: 'Step 1 · Thylakoid Membrane',
      title: 'Capturing photons to move protons',
      body: '<p><b>Light reactions transform solar energy into chemical gradients across the thylakoid membrane.</b> Photons excite electrons, powering the photosynthetic complexes to pump protons from the stroma into the thylakoid lumen.</p><p>Adjust sunlight intensity to observe how proton pumping responds to available light.</p>',
      nextLabel: 'Check the Gradient',
      onEnter(ctx) {
        m.set({
          fuel: 'light',
          fuelRate: 1,
          proteins: { complex: { x: -50 }, synthase: { x: 45 }, leak: null }
        });
        m.notes(['complex']);
        ctx.ui.controls(`
          <div class="slider">
            <div class="slider-head"><span class="label">Sunlight intensity</span><span class="value" id="light-val">100%</span></div>
            <input type="range" id="light-slider" min="0" max="1" step="0.05" value="1">
          </div>
          <div class="readout-grid stats">
            <div class="stat"><div class="stat-label">Proton motive force</div><div class="stat-value" id="pmf-stat">0 mV</div></div>
            <div class="stat"><div class="stat-label">Complex state</div><div class="stat-value" id="complex-stat">Pumping</div></div>
          </div>
        `);
        ctx.ui.showPanel(m, { notes: ['complex', 'synthase'], layers: ['ions', 'membrane'] });

        const slider = ctx.ui.q('#light-slider');
        ctx.ui.range(slider, v => {
          m.set({ fuelRate: v }, { snap: true });
          ctx.ui.q('#light-val').textContent = Math.round(v * 100) + '%';
        });

        unframe = m.on('frame', s => {
          const pmfEl = ctx.ui.q('#pmf-stat');
          const compEl = ctx.ui.q('#complex-stat');
          if (pmfEl && s) pmfEl.textContent = Math.round(s.pmf) + ' mV';
          if (compEl && s) compEl.textContent = s.complexLabel || (s.fuelRate > 0 ? 'Active' : 'Stalled');
        });
      },
      onExit() {
        if (unframe) { unframe(); unframe = null; }
      }
    },
    {
      eyebrow: 'Step 2 · Chemiosmosis',
      title: 'The electrochemical gradient',
      body: '<p><b>Protons concentrated in the thylakoid lumen create a strong proton-motive force.</b> The difference in proton concentration lowers the lumen pH and creates a positive charge inside.</p><p>Watch the live trace record the voltage and concentration gradient built by photon absorption.</p>',
      nextLabel: 'Harness the Turbine',
      onEnter(ctx) {
        m.notes(false);
        ctx.ui.controls(`
          <div class="readout-grid stats">
            <div class="stat"><div class="stat-label">Stroma pH</div><div class="stat-value" id="stroma-ph">7.5</div></div>
            <div class="stat"><div class="stat-label">Lumen pH</div><div class="stat-value" id="lumen-ph">5.5</div></div>
          </div>
          <div id="graph-box" style="height:130px; margin-top:8px;"></div>
        `);
        ctx.ui.showPanel(m, { notes: ['inside', 'outside'], layers: ['ions'] });

        const gBox = ctx.ui.q('#graph-box');
        if (gBox) {
          liveGraph = Graph.mount(gBox, { live: { span: 90 }, height: 130 }).follow(m, 'pmf');
        }

        unframe = m.on('frame', s => {
          if (!s) return;
          const sPh = ctx.ui.q('#stroma-ph');
          const lPh = ctx.ui.q('#lumen-ph');
          if (sPh) sPh.textContent = s.pH.inside.toFixed(1);
          if (lPh) lPh.textContent = s.pH.outside.toFixed(1);
        });
      },
      onExit() {
        if (unframe) { unframe(); unframe = null; }
        if (liveGraph) { liveGraph.destroy(); liveGraph = null; }
      }
    },
    {
      eyebrow: 'Step 3 · ATP Synthesis',
      title: 'Powering ATP synthase',
      body: '<p><b>Protons escape down their electrochemical gradient through ATP synthase.</b> The flow turns the molecular rotor, synthesizing ATP from ADP and inorganic phosphate in the stroma.</p><p>Every turn of the rotor drives catalytic cycles that release newly formed ATP into the stroma for the Calvin cycle.</p>',
      nextLabel: 'Synthesizing Sugars',
      onEnter(ctx) {
        m.notes(['synthase']);
        ctx.ui.controls(`
          <div class="readout-grid stats">
            <div class="stat"><div class="stat-label">ATP synthesized</div><div class="stat-value" id="atp-stat">0</div></div>
            <div class="stat"><div class="stat-label">Rotor turns</div><div class="stat-value" id="rotor-stat">0</div></div>
          </div>
          <div id="graph-box" style="height:130px; margin-top:8px;"></div>
        `);
        ctx.ui.showPanel(m, { notes: ['synthase', 'complex'], layers: ['ions'] });

        const gBox = ctx.ui.q('#graph-box');
        if (gBox) {
          liveGraph = Graph.mount(gBox, { live: { span: 90 }, height: 130 }).follow(m, 'atp');
        }

        unframe = m.on('frame', s => {
          if (!s) return;
          const atpEl = ctx.ui.q('#atp-stat');
          const rotEl = ctx.ui.q('#rotor-stat');
          if (atpEl) atpEl.textContent = s.atpMade;
          if (rotEl) rotEl.textContent = s.rotorTurns.toFixed(1);
        });
      },
      onExit() {
        if (unframe) { unframe(); unframe = null; }
        if (liveGraph) { liveGraph.destroy(); liveGraph = null; }
      }
    },
    {
      eyebrow: 'Step 4 · Calvin Cycle',
      title: 'Using ATP to make sugar',
      body: '<p><b>ATP and NADPH generated by the light reactions enter the Calvin cycle in the stroma.</b> The enzyme Rubisco fixes atmospheric CO₂ into 3-phosphoglycerate, which is reduced using ATP and NADPH into glyceraldehyde 3-phosphate (G3P) sugars.</p><p>Toggle light or uncouple the membrane below to see how ATP production ceases when the proton gradient collapses.</p>',
      nextLabel: 'Restart Lesson',
      onEnter(ctx) {
        m.notes(false);
        ctx.ui.controls(`
          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <button class="btn secondary" id="btn-toggle-light">Toggle Light</button>
            <button class="btn secondary" id="btn-toggle-leak">Add Proton Leak</button>
          </div>
          <div class="readout-grid stats">
            <div class="stat"><div class="stat-label">Total ATP Made</div><div class="stat-value" id="final-atp">0</div></div>
            <div class="stat"><div class="stat-label">Proton Motive Force</div><div class="stat-value" id="final-pmf">0 mV</div></div>
          </div>
        `);
        ctx.ui.showPanel(m, { notes: ['complex', 'synthase', 'leak'], layers: ['ions', 'membrane'] });

        let lightOn = true;
        let leakOn = false;

        ctx.ui.q('#btn-toggle-light').onclick = () => {
          lightOn = !lightOn;
          m.set({ fuelRate: lightOn ? 1 : 0 });
        };

        ctx.ui.q('#btn-toggle-leak').onclick = () => {
          leakOn = !leakOn;
          m.set({ proteins: { complex: { x: -50 }, synthase: { x: 45 }, leak: leakOn ? { x: 0 } : null } });
          ctx.ui.q('#btn-toggle-leak').textContent = leakOn ? 'Remove Leak' : 'Add Proton Leak';
        };

        unframe = m.on('frame', s => {
          if (!s) return;
          const atpEl = ctx.ui.q('#final-atp');
          const pmfEl = ctx.ui.q('#final-pmf');
          if (atpEl) atpEl.textContent = s.atpMade;
          if (pmfEl) pmfEl.textContent = Math.round(s.pmf) + ' mV';
        });
      },
      onExit() {
        if (unframe) { unframe(); unframe = null; }
      }
    }
  ],
  onStep(step) {}
});

const m = Membrane.mount(shell.stage, {
  viewOffset: shell.viewOffset,
  context: 'thylakoid',
  fuel: 'light',
  fuelRate: 1,
  complexSeconds: 5,
  proteins: { complex: { x: -50 }, synthase: { x: 45 }, leak: null },
  contents: { inside: { water: 30, H: 18 }, outside: { water: 30, H: 24 } },
  potential: 'nernst',
  units: 'mM'
});

shell.goTo(0);
</script>
</body>
</html>
