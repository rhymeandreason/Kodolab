<!doctype html>
<!-- requests
1. How does a plant turn sunlight into sugar?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photosynthesis: Light to Sugar</title>
<style>
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="Chloroplast,LightReactions"></script>
<script>
const shell = LessonShell.create({
  brand: 'Photosynthesis',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: { state: {} },
  steps: [
    {
      eyebrow: 'The Organelle',
      title: 'Where light energy is captured',
      scene: 'chloroplast',
      body: '<p class="lead"><strong>Photosynthesis takes place inside chloroplasts.</strong> Disc-shaped thylakoids stack into grana suspended in a fluid stroma.</p><p>Light strikes the thylakoid membrane, initiating the reactions that split water, generate oxygen, and yield high-energy carriers.</p>',
      nextLabel: 'Zoom to the membrane',
      onEnter(ctx) {
        cp.notes(['granum', 'stroma', 'lumen']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Thylakoid Stacks</div><div class="stat-value" id="grana-count" data-live>--</div></div><div class="stat"><div class="stat-label">Organelle Length</div><div class="stat-value" id="cp-len" data-live>--</div></div></div>');
        const u1 = cp.on('frame', s => {
          const gEl = ctx.ui.q('#grana-count');
          const lEl = ctx.ui.q('#cp-len');
          if (gEl && s.counts) gEl.textContent = s.counts.grana;
          if (lEl && s.lengthNm) lEl.textContent = Math.round(s.lengthNm) + ' nm';
        });
        ctx.cleanup = () => { u1(); cp.notes(false); };
      },
      onExit(ctx) { if (ctx.cleanup) ctx.cleanup(); }
    },
    {
      eyebrow: 'Photosystem II',
      title: 'Splitting water to extract electrons',
      scene: 'reactions',
      body: '<p class="lead"><strong>Light strips electrons from water at Photosystem II.</strong> This reaction releases molecular oxygen as a byproduct.</p><p>Every water molecule split contributes protons directly into the inner thylakoid lumen, beginning the proton gradient.</p>',
      nextLabel: 'Follow the gradient',
      onEnter(ctx) {
        lr.set({ fuel: 'light', fuelRate: 1, chain: 'split' });
        lr.notes(['psii', 'water.split', 'oxygen']);
        ctx.ui.controls('<div class="stats stat-grid"><div class="stat"><div class="stat-label">Waters Split</div><div class="stat-value" id="h2o-count" data-live>0</div></div><div class="stat"><div class="stat-label">O₂ Released</div><div class="stat-value" id="o2-count" data-live>0</div></div></div>');
        const u = lr.on('frame', s => {
          const h2oEl = ctx.ui.q('#h2o-count');
          const o2El = ctx.ui.q('#o2-count');
          if (h2oEl && s.light) h2oEl.textContent = s.light.waterSplit || 0;
          if (o2El && s.light) o2El.textContent = s.light.o2Released || 0;
        });
        ctx.cleanup = () => { u(); lr.notes(false); };
      },
      onExit(ctx) { if (ctx.cleanup) ctx.cleanup(); }
    },
    {
      eyebrow: 'Chemiosmosis',
      title: 'Pumping protons and turning ATP synthase',
      scene: 'reactions',
      body: '<p class="lead"><strong>Cytochrome b6f pumps protons into the lumen to drive ATP synthesis.</strong> Protons flow back down their gradient through ATP synthase into the stroma.</p><p>The catalytic head in the stroma uses this rotational energy to synthesize ATP from ADP and inorganic phosphate.</p>',
      nextLabel: 'Generate NADPH',
      onEnter(ctx) {
        lr.set({ fuel: 'light', fuelRate: 1, chain: 'split' });
        lr.notes(['b6f', 'synthase']);
        ctx.ui.controls('<div class="stats stat-grid"><div class="stat"><div class="stat-label">Proton Force (pmf)</div><div class="stat-value" id="pmf-val" data-live>0 mV</div></div><div class="stat"><div class="stat-label">ATP Made</div><div class="stat-value" id="atp-val" data-live>0</div></div></div>');
        const u = lr.on('frame', s => {
          const pmfEl = ctx.ui.q('#pmf-val');
          const atpEl = ctx.ui.q('#atp-val');
          if (pmfEl && s.pmf !== undefined) pmfEl.textContent = Math.round(s.pmf) + ' mV';
          if (atpEl && s.atpMade !== undefined) atpEl.textContent = s.atpMade;
        });
        ctx.cleanup = () => { u(); lr.notes(false); };
      },
      onExit(ctx) { if (ctx.cleanup) ctx.cleanup(); }
    },
    {
      eyebrow: 'Photosystem I & Summary',
      title: 'Reducing NADP+ to power sugar synthesis',
      scene: 'reactions',
      body: '<p class="lead"><strong>Photosystem I re-energizes electrons to form NADPH.</strong> Both ATP and NADPH are released into the stroma.</p><p>These two products enter the Calvin cycle in the stroma to fix CO₂ into glucose. Try adjusting the light level to see how photon supply governs both fuel carriers.</p>',
      nextLabel: 'Finish',
      onEnter(ctx) {
        lr.set({ fuel: 'light', fuelRate: 1, chain: 'split' });
        lr.notes(['psi', 'nadph']);
        ctx.ui.controls('<div class="slider"><div class="slider-head"><span class="label">Light Intensity</span><span class="value" id="light-val" data-live>100%</span></div><input type="range" id="light-slider" min="0" max="1" step="0.05" value="1"></div><div class="stats stat-grid"><div class="stat"><div class="stat-label">ATP Made</div><div class="stat-value" id="final-atp" data-live>0</div></div><div class="stat"><div class="stat-label">NADPH Made</div><div class="stat-value" id="final-nadph" data-live>0</div></div></div>');
        const slider = ctx.ui.q('#light-slider');
        ctx.ui.range(slider, v => {
          lr.set({ fuel: v > 0 ? 'light' : null, fuelRate: v }, { snap: true });
          const valEl = ctx.ui.q('#light-val');
          if (valEl) valEl.textContent = Math.round(v * 100) + '%';
        });
        const u = lr.on('frame', s => {
          const atpEl = ctx.ui.q('#final-atp');
          const nadphEl = ctx.ui.q('#final-nadph');
          if (atpEl && s.atpMade !== undefined) atpEl.textContent = s.atpMade;
          if (nadphEl && s.light) nadphEl.textContent = s.light.nadphMade || 0;
        });
        ctx.cleanup = () => { u(); lr.notes(false); };
      },
      onExit(ctx) { if (ctx.cleanup) ctx.cleanup(); }
    }
  ]
});

const cp = shell.scene('chloroplast', el => Chloroplast.mount(el, { viewOffset: shell.viewOffset, light: 0.8 }));
const lr = shell.scene('reactions', el => LightReactions.mount(el, {
  viewOffset: shell.viewOffset,
  chain: 'split',
  fuel: 'light',
  fuelRate: 1,
  showATP: true,
  showFuel: true
}));

shell.goTo(0);
</script>
</body>
</html>
