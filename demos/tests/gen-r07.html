<!doctype html>
<!-- requests
1. what happens at the inner mitochondrial membrane after you eat sugar?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>At the Inner Mitochondrial Membrane</title>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="ElectronTransport"></script>
<script>
const shell = LessonShell.create({
  brand: 'Cellular Respiration',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: { state: {} },
  steps: [
    {
      eyebrow: 'Harvested Fuel',
      title: 'Sugar arrives as electron carriers',
      body: '<p class="lead"><strong>Breaking down glucose fills the mitochondrial matrix with NADH.</strong></p><p>Glycolysis and the citric acid cycle strip high-energy electrons from digested sugars and load them onto electron carriers. In the matrix, NADH docks at the inner membrane machines to deliver its electron cargo.</p>',
      nextLabel: 'Start pumping',
      onEnter(ctx) {
        ET.set({
          chain: 'lumped',
          span: 'inner',
          fuel: null,
          oxygen: true,
          showATP: false,
          showFuel: true
        });
        ET.notes(['complex', 'matrix']);
        ctx.ui.controls('<div class="callout">Matrix fuel supply waiting. Click <strong>Feed NADH</strong> to watch one carrier drop off its electrons.</div><button class="btn primary" id="feed-btn">Feed NADH</button>');
        ctx.ui.q('#feed-btn').onclick = () => ET.feed('NADH');
      },
      onExit() {
        ET.notes(false);
      }
    },
    {
      eyebrow: 'Electron Transport',
      title: 'Electron transfer drives proton pumping',
      body: '<p class="lead"><strong>Complexes use electron energy to pump protons across the inner membrane.</strong></p><p>As electrons pass through the respiratory complexes to oxygen, protons (H⁺) are pumped out of the matrix into the intermembrane space.</p>',
      nextLabel: 'See the gradient',
      onEnter(ctx) {
        ET.set({
          chain: 'split',
          span: 'inner',
          fuel: 'NADH',
          fuelRate: 1,
          oxygen: true,
          showATP: false,
          showFuel: true
        });
        ET.notes(['complex.I', 'complex.III', 'complex.IV']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton-motive force</div><div class="stat-value" id="pmf-val" data-live>0 mV</div><div class="stat-sub">stored electrical & chemical potential</div></div></div>');
        const unbind = ET.on('frame', s => {
          const el = ctx.ui.q('#pmf-val');
          if (el) el.textContent = Math.round(s.pmf) + ' mV';
        });
        ctx.state.unbind = unbind;
      },
      onExit(ctx) {
        if (ctx.state.unbind) ctx.state.unbind();
        ET.notes(false);
      }
    },
    {
      eyebrow: 'Chemiosmosis',
      title: 'The electrochemical gradient',
      body: '<p class="lead"><strong>Protons cannot cross the lipid bilayer on their own.</strong></p><p>Because the inner membrane is impermeable to ions, pumped protons become trapped in the intermembrane space. This creates a steep concentration and electrical gradient known as the proton-motive force.</p>',
      nextLabel: 'Turn the turbine',
      onEnter(ctx) {
        ET.set({
          chain: 'lumped',
          span: 'inner',
          fuel: 'NADH',
          fuelRate: 1,
          oxygen: true,
          showATP: false
        });
        ET.notes(['synthase', 'H']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Intermembrane pH vs Matrix pH</div><div class="stat-value" id="dp-val" data-live>ΔpH 0.0</div><div class="stat-sub">concentration difference</div></div></div>');
        const unbind = ET.on('frame', s => {
          const el = ctx.ui.q('#dp-val');
          if (el) el.textContent = 'ΔpH ' + s.dpH.toFixed(2);
        });
        ctx.state.unbind = unbind;
      },
      onExit(ctx) {
        if (ctx.state.unbind) ctx.state.unbind();
        ET.notes(false);
      }
    },
    {
      eyebrow: 'ATP Synthesis',
      title: 'The turbine makes cellular energy',
      body: '<p class="lead"><strong>ATP synthase taps the gradient to synthesize ATP.</strong></p><p>Protons rush back down their gradient through ATP synthase, turning its central rotor like a turbine to join ADP and inorganic phosphate into ATP.</p>',
      nextLabel: 'Deliver to cell',
      onEnter(ctx) {
        ET.set({
          chain: 'lumped',
          span: 'inner',
          fuel: 'NADH',
          fuelRate: 1,
          oxygen: true,
          showATP: true
        });
        ET.notes(['synthase']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">ATP Synthesized</div><div class="stat-value" id="atp-val" data-live>0</div><div class="stat-sub">molecules released into matrix</div></div></div>');
        const unbind = ET.on('frame', s => {
          const el = ctx.ui.q('#atp-val');
          if (el) el.textContent = s.atpMade;
        });
        ctx.state.unbind = unbind;
      },
      onExit(ctx) {
        if (ctx.state.unbind) ctx.state.unbind();
        ET.notes(false);
      }
    },
    {
      eyebrow: 'Cellular Export',
      title: 'Powering the rest of the cell',
      body: '<p class="lead"><strong>ATP exits through specialized transporters to power cellular work.</strong></p><p>ADP/ATP translocases and outer membrane porins shuttle newly minted ATP into the cytosol, where it fuels vital processes like ion pumps.</p>',
      onEnter(ctx) {
        ET.set({
          chain: 'split',
          span: 'cell',
          fuel: 'NADH',
          fuelRate: 1,
          oxygen: true,
          showATP: true
        });
        ET.notes(['translocase', 'porin', 'pump']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">ATP Made</div><div class="stat-value" id="total-atp" data-live>0</div></div><div class="stat"><div class="stat-label">Cell Work (Pump Turns)</div><div class="stat-value" id="pump-spent" data-live>0</div></div></div>');
        const unbind = ET.on('frame', s => {
          const atpEl = ctx.ui.q('#total-atp');
          const spentEl = ctx.ui.q('#pump-spent');
          if (atpEl) atpEl.textContent = s.atpMade;
          if (spentEl && s.cell) spentEl.textContent = s.cell.atpSpent;
        });
        ctx.state.unbind = unbind;
      },
      onExit(ctx) {
        if (ctx.state.unbind) ctx.state.unbind();
        ET.notes(false);
      }
    }
  ]
});

const ET = ElectronTransport.mount(shell.stage, { viewOffset: shell.viewOffset });
shell.goTo(0);
</script>
</body>
</html>
