<!doctype html>
<!-- requests
1. How does a plant turn sunlight into sugar?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How Plants Turn Sunlight into Sugar</title>
<style></style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="Chloroplast,LightReactions"></script>
<script>
const shell = LessonShell.create({
  brand: 'Photosynthesis: Light to Sugar',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: {},
  steps: [
    {
      eyebrow: 'Organelle Scale',
      title: 'Where photosynthesis begins',
      scene: 'organelle',
      body: '<p class="lead"><strong>Sunlight is captured inside specialized organelles called chloroplasts.</strong></p><p>Surrounded by a double envelope, the interior is filled with fluid stroma and an interconnected thylakoid membrane folded into stacks called grana.</p>',
      onEnter(ctx) {
        organelle.notes(['granum', 'stroma']);
      },
      onExit(ctx) {
        organelle.notes(false);
      }
    },
    {
      eyebrow: 'Membrane Machines',
      title: 'Harvesting photons and splitting water',
      scene: 'membrane',
      body: '<p class="lead"><strong>Photosystem II absorbs light to extract high-energy electrons from water.</strong></p><p>Water molecules split on the lumen side, releasing oxygen gas as a byproduct and feeding electrons down the chain to Photosystem I to form NADPH.</p>',
      onEnter(ctx) {
        membrane.set({ chain: 'split', fuel: 'light', fuelRate: 1 });
        membrane.notes(['psii', 'psi', 'water.split']);
      },
      onExit(ctx) {
        membrane.notes(false);
      }
    },
    {
      eyebrow: 'Energy Storage',
      title: 'Building a proton gradient',
      scene: 'membrane',
      body: '<p class="lead"><strong>Electron transport pumps protons across the thylakoid membrane.</strong></p><p>Cytochrome b6f and water splitting pack protons into the narrow thylakoid lumen, generating a powerful electrochemical gradient across the bilayer.</p>',
      onEnter(ctx) {
        membrane.notes(['b6f']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton-Motive Force</div><div class="stat-value" id="pmf-val" data-live>--</div><div class="stat-sub">mV across membrane</div></div></div>');
        ctx._unsub = membrane.on('frame', s => {
          const el = ctx.ui.q('#pmf-val');
          if (el) el.textContent = Math.round(s.pmf) + ' mV';
        });
      },
      onExit(ctx) {
        if (ctx._unsub) ctx._unsub();
        membrane.notes(false);
      }
    },
    {
      eyebrow: 'Chemical Fuel',
      title: 'Synthesizing ATP to build sugars',
      scene: 'membrane',
      body: '<p class="lead"><strong>Protons exit through ATP synthase to produce ATP in the stroma.</strong></p><p>Together, newly made ATP and NADPH enter the stroma-based Calvin cycle, supplying the chemical energy and reducing power to convert CO₂ into glucose.</p>',
      onEnter(ctx) {
        membrane.notes(['synthase', 'nadph']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">ATP Synthesized</div><div class="stat-value" id="atp-val" data-live>0</div><div class="stat-sub">molecules made in stroma</div></div></div>');
        ctx._unsub = membrane.on('frame', s => {
          const el = ctx.ui.q('#atp-val');
          if (el) el.textContent = s.atpMade;
        });
      },
      onExit(ctx) {
        if (ctx._unsub) ctx._unsub();
        membrane.notes(false);
      }
    },
    {
      eyebrow: 'Interactive Bench',
      title: 'What happens when light changes?',
      scene: 'membrane',
      body: '<p class="lead"><strong>Photosynthesis halts without an incoming stream of photons.</strong></p><p>Dim or extinguish the light supply to watch how quickly proton pumping slows and ATP generation stalls.</p>',
      onEnter(ctx) {
        membrane.notes(false);
        ctx.ui.controls('<div class="slider"><div class="slider-head"><span class="label">Light Intensity</span><span class="value" id="light-val" data-live>100%</span></div><input type="range" id="light-slider" min="0" max="1" step="0.05" value="1"></div><div class="stats"><div class="stat"><div class="stat-label">Total ATP Made</div><div class="stat-value" id="atp-live" data-live>0</div></div></div>');
        ctx.ui.range(ctx.ui.q('#light-slider'), v => {
          membrane.set({ fuelRate: v, fuel: v > 0 ? 'light' : null });
          const label = ctx.ui.q('#light-val');
          if (label) label.textContent = Math.round(v * 100) + '%';
        });
        ctx._unsub = membrane.on('frame', s => {
          const el = ctx.ui.q('#atp-live');
          if (el) el.textContent = s.atpMade;
        });
      },
      onExit(ctx) {
        if (ctx._unsub) ctx._unsub();
      }
    }
  ]
});

const organelle = shell.scene('organelle', el => Chloroplast.mount(el, { viewOffset: shell.viewOffset }));
const membrane = shell.scene('membrane', el => LightReactions.mount(el, { viewOffset: shell.viewOffset, chain: 'split' }));

shell.goTo(0);
</script>
</body>
</html>
