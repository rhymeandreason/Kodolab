<!doctype html>
<!-- requests
1. How does a plant turn sunlight into sugar?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photosynthesis: Light to Sugar</title>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="Chloroplast,LightReactions"></script>
<script>
const shell = LessonShell.create({
  brand: 'Photosynthesis',
  hint: 'Drag to orbit · Scroll to zoom',
  steps: [
    {
      scene: 'chloroplast',
      eyebrow: 'Chloroplast Structure',
      title: 'Where light capture happens',
      body: '<p class="lead"><strong>Photosynthesis is organized across distinct compartments inside the chloroplast.</strong></p><p>Stacks of disc-shaped thylakoids called grana sit within the fluid stroma. The thylakoid membrane is a single continuous envelope surrounding one common interior lumen.</p>',
      nextLabel: 'Zoom into the membrane',
      onEnter(ctx) {
        chloro.notes(['granum', 'stroma', 'lumen']);
        ctx.ui.controls('<div class="slider"><div class="slider-head"><span class="label">Sunlight intensity</span></div><input type="range" id="sunlight" min="0" max="1" step="0.05" value="0.6"></div>');
        ctx.ui.range(ctx.ui.q('#sunlight'), v => chloro.set({ light: v }, { snap: true }));
      },
      onExit() {
        chloro.notes(false);
      }
    },
    {
      scene: 'membrane',
      eyebrow: 'Photosystem II',
      title: 'Splitting water to capture electrons',
      body: '<p class="lead"><strong>Light energy extracts high-energy electrons by splitting water.</strong></p><p>Photons strike Photosystem II (PSII), which pulls electrons from water molecules on the lumen side. Oxygen gas is released as a byproduct, and the freed protons accumulate directly in the lumen.</p>',
      nextLabel: 'See the gradient build',
      onEnter(ctx) {
        lr.set({ chain: 'split', fuel: 'light', fuelRate: 1 });
        lr.notes(['psii', 'water.split', 'oxygen']);
        ctx.ui.controls('<div class="stats"><div class="stat"><span class="stat-label">Oxygen released</span><span class="stat-value" id="o2-val" data-live>0</span><span class="stat-sub">molecules</span></div></div>');
        this._unsub = lr.on('frame', s => {
          const el = ctx.ui.q('#o2-val');
          if (el && s.light) el.textContent = s.light.o2Released;
        });
      },
      onExit() {
        lr.notes(false);
        if (this._unsub) this._unsub();
      }
    },
    {
      scene: 'membrane',
      eyebrow: 'Electron Transport',
      title: 'Pumping protons into the lumen',
      body: '<p class="lead"><strong>Electrons travel through cytochrome b6f to power a proton pump.</strong></p><p>Plastoquinone ferries electron pairs from PSII to the cytochrome b6f complex, which pumps protons across the membrane into the lumen, generating a strong proton-motive force.</p>',
      nextLabel: 'Make ATP & NADPH',
      onEnter(ctx) {
        lr.set({ chain: 'split', fuel: 'light', fuelRate: 1 });
        lr.notes(['b6f', 'plastoquinone']);
        ctx.ui.controls('<div class="stats"><div class="stat"><span class="stat-label">Proton-motive force</span><span class="stat-value" id="pmf-val" data-live>0 mV</span><span class="stat-sub">stored gradient</span></div></div>');
        this._unsub = lr.on('frame', s => {
          const el = ctx.ui.q('#pmf-val');
          if (el) el.textContent = Math.round(s.pmf) + ' mV';
        });
      },
      onExit() {
        lr.notes(false);
        if (this._unsub) this._unsub();
      }
    },
    {
      scene: 'membrane',
      eyebrow: 'ATP & NADPH Yield',
      title: 'Powering the synthesis of sugar',
      body: '<p class="lead"><strong>The gradient drives ATP synthase while PSI produces NADPH.</strong></p><p>Protons flowing back out into the stroma turn ATP synthase to generate ATP. Meanwhile, Photosystem I transfers electrons to NADP⁺, forming NADPH. Both energy-rich carriers drift into the stroma to fuel the Calvin cycle.</p>',
      onEnter(ctx) {
        lr.set({ chain: 'split', fuel: 'light', fuelRate: 1 });
        lr.notes(['synthase', 'psi', 'nadph']);
        ctx.ui.controls('<div class="stats"><div class="stat"><span class="stat-label">ATP synthesized</span><span class="stat-value" id="atp-val" data-live>0</span><span class="stat-sub">in stroma</span></div><div class="stat"><span class="stat-label">NADPH produced</span><span class="stat-value" id="nadph-val" data-live>0</span><span class="stat-sub">in stroma</span></div></div><div class="slider"><div class="slider-head"><span class="label">Light rate</span></div><input type="range" id="lr-dim" min="0" max="1" step="0.05" value="1"></div>');
        ctx.ui.range(ctx.ui.q('#lr-dim'), v => lr.set({ fuelRate: v, fuel: v > 0 ? 'light' : null }, { snap: true }));
        this._unsub = lr.on('frame', s => {
          const atpEl = ctx.ui.q('#atp-val');
          const nadphEl = ctx.ui.q('#nadph-val');
          if (atpEl) atpEl.textContent = s.atpMade;
          if (nadphEl && s.light) nadphEl.textContent = s.light.nadphMade;
        });
      },
      onExit() {
        lr.notes(false);
        if (this._unsub) this._unsub();
      }
    }
  ]
});

const chloro = shell.scene('chloroplast', el => Chloroplast.mount(el, { viewOffset: shell.viewOffset, light: 0.6 }));
const lr = shell.scene('membrane', el => LightReactions.mount(el, { viewOffset: shell.viewOffset, chain: 'split', fuel: 'light', fuelRate: 1 }));

shell.goTo(0);
</script>
</body>
</html>
