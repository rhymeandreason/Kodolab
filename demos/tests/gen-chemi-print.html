<!doctype html>
<!-- requests
1. How does a mitochondrion make ATP from a proton gradient? What does an uncoupler do?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proton Gradients & Uncouplers</title>
<style>
.readout-box { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="ElectronTransport"></script>
<script>
const shell = LessonShell.create({
  brand: 'Cellular Respiration',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: {
    updateReadouts: null
  },
  steps: [
    {
      eyebrow: 'Step 1: The Proton Gradient',
      title: 'Fuel oxidation pumps protons out of the matrix',
      body: '<p class="lead"><strong>Electron transport complexes act as proton pumps.</strong> As high-energy electrons pass from NADH to oxygen, complexes pump protons from the mitochondrial matrix into the intermembrane space.</p><p>This creates a steep electrochemical gradient across the inner membrane, storing potential energy as proton-motive force (PMF).</p>',
      nextLabel: 'Harvest the gradient',
      onEnter(ctx) {
        m.set({ fuel: 'NADH', fuelRate: 1, oxygen: true, proteins: { complex: { x: -60 }, synthase: { x: 50 }, leak: null } });
        m.notes(['complex']);
        ctx.ui.controls('<div class="readout-box"><div class="stat"><span class="stat-label">Proton-Motive Force</span><span class="stat-value" id="pmf-val" data-live>--</span></div><div class="stat"><span class="stat-label">ATP Synthesized</span><span class="stat-value" id="atp-val" data-live>0</span></div></div>');
        ctx.updateReadouts = s => {
          const pmfEl = ctx.ui.q('#pmf-val');
          const atpEl = ctx.ui.q('#atp-val');
          if (pmfEl && s.pmf != null) pmfEl.textContent = Math.round(s.pmf) + ' mV';
          if (atpEl && s.atpMade != null) atpEl.textContent = s.atpMade;
        };
      },
      onExit(ctx) {
        ctx.updateReadouts = null;
      }
    },
    {
      eyebrow: 'Step 2: Chemiosmosis',
      title: 'ATP synthase taps the gradient like a turbine',
      body: '<p class="lead"><strong>Protons return to the matrix exclusively through ATP synthase.</strong> The lipid bilayer is impermeable to ions, so protons must flow downhill through the channel in ATP synthase.</p><p>This proton flow turns the central rotor, driving the phosphorylation of ADP and inorganic phosphate into ATP.</p>',
      nextLabel: 'Introduce an uncoupler',
      onEnter(ctx) {
        m.notes(['synthase']);
        ctx.ui.controls('<div class="readout-box"><div class="stat"><span class="stat-label">Proton-Motive Force</span><span class="stat-value" id="pmf-val" data-live>--</span></div><div class="stat"><span class="stat-label">ATP Synthesized</span><span class="stat-value" id="atp-val" data-live>0</span></div></div>');
        ctx.updateReadouts = s => {
          const pmfEl = ctx.ui.q('#pmf-val');
          const atpEl = ctx.ui.q('#atp-val');
          if (pmfEl && s.pmf != null) pmfEl.textContent = Math.round(s.pmf) + ' mV';
          if (atpEl && s.atpMade != null) atpEl.textContent = s.atpMade;
        };
      },
      onExit(ctx) {
        ctx.updateReadouts = null;
      }
    },
    {
      eyebrow: 'Step 3: Uncoupling',
      title: 'An uncoupler provides a bypass pore',
      body: '<p class="lead"><strong>Uncouplers short-circuit the proton circuit.</strong> Molecules like DNP or thermogenin (UCP1) form a leak channel across the inner membrane.</p><p>Protons rush back into the matrix through the leak channel instead of passing through ATP synthase.</p>',
      nextLabel: 'Observe the outcome',
      onEnter(ctx) {
        m.set({ proteins: { complex: { x: -70 }, leak: { x: -10 }, synthase: { x: 50 } } });
        m.notes(['leak']);
        ctx.ui.controls('<div class="readout-box"><div class="stat"><span class="stat-label">Proton-Motive Force</span><span class="stat-value" id="pmf-val" data-live>--</span></div><div class="stat"><span class="stat-label">ATP Synthesized</span><span class="stat-value" id="atp-val" data-live>0</span></div></div>');
        ctx.updateReadouts = s => {
          const pmfEl = ctx.ui.q('#pmf-val');
          const atpEl = ctx.ui.q('#atp-val');
          if (pmfEl && s.pmf != null) pmfEl.textContent = Math.round(s.pmf) + ' mV';
          if (atpEl && s.atpMade != null) atpEl.textContent = s.atpMade;
        };
      },
      onExit(ctx) {
        ctx.updateReadouts = null;
      }
    },
    {
      eyebrow: 'Step 4: Metabolic Consequence',
      title: 'Energy dissipates as heat instead of ATP',
      body: '<p class="lead"><strong>Respiration continues, but ATP production stops.</strong> Because the proton gradient collapses, the ATP synthase turbine stalls.</p><p>Fuel is still consumed and oxygen is still reduced, but all the potential energy is lost directly as thermal heat.</p>',
      onEnter(ctx) {
        m.notes(false);
        ctx.ui.controls('<div class="readout-box"><div class="stat"><span class="stat-label">Protons Leaked</span><span class="stat-value" id="leaked-val" data-live>0</span></div><div class="stat"><span class="stat-label">Protons via Synthase</span><span class="stat-value" id="synth-val" data-live>0</span></div></div>');
        ctx.updateReadouts = s => {
          const leakEl = ctx.ui.q('#leaked-val');
          const synthEl = ctx.ui.q('#synth-val');
          if (leakEl && s.protonsLeaked != null) leakEl.textContent = s.protonsLeaked;
          if (synthEl && s.protonsThroughSynthase != null) synthEl.textContent = s.protonsThroughSynthase;
        };
      },
      onExit(ctx) {
        ctx.updateReadouts = null;
      }
    }
  ]
});

const m = ElectronTransport.mount(shell.stage, { viewOffset: shell.viewOffset });
m.on('frame', s => {
  if (shell.ctx && typeof shell.ctx.updateReadouts === 'function') {
    shell.ctx.updateReadouts(s);
  }
});

shell.goTo(0);
</script>
</body>
</html>
