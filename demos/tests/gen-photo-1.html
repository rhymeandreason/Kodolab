<!doctype html>
<!-- requests
1. How does a plant turn sunlight into sugar?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photosynthesis and Chemiosmosis</title>
<link rel="stylesheet" href="../css/kodo.css">
<link rel="stylesheet" href="../css/lesson-shell.css">
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/mol-small.js"></script>
<script src="../lib/scene.js"></script>
<script src="../lib/atomkit.js"></script>
<script src="../lib/annotate.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../membrane/parts.js"></script>
<script src="../membrane/pump.js"></script>
<script src="../membrane/chemiosmosis.js"></script>
<script src="../membrane/sheet.js"></script>
<script src="../chemiosmosis/circuit.js"></script>
<script src="../membrane/membrane.js"></script>
<script src="../kit/lesson-shell.js"></script>

<script>
let unsubs = [];
function clearSubs() {
  unsubs.forEach(fn => fn());
  unsubs = [];
}

const shell = LessonShell.create({
  brand: 'Photosynthesis: The Thylakoid Membrane',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: {},
  steps: [
    {
      eyebrow: 'Solar Powerhouse',
      title: 'How chloroplasts capture light',
      body: '<p><b>Plants convert radiant sunlight into stable chemical energy across the thylakoid membrane inside chloroplasts.</b> Light-harvesting complexes capture photons to energize electrons and pump protons across the lipid bilayer.</p><p>Explore the two compartments: the outer <em>stroma</em> where sugar synthesis occurs, and the inner <em>lumen</em> where protons collect.</p>',
      nextLabel: 'Shine light',
      onEnter(ctx) {
        clearSubs();
        m.notes(false);
        m.set({
          fuel: 'light',
          fuelRate: 0,
          proteins: { complex: { x: -60 }, synthase: { x: 50 }, leak: null }
        });
        ctx.ui.showPanel(m, { notes: ['complex', 'synthase', 'heads'], layers: ['water', 'ions'] });
      }
    },
    {
      eyebrow: 'Light Reactions',
      title: 'Building the proton gradient',
      body: '<p><b>Absorbed photons drive the photosynthetic complexes to pump protons into the thylakoid lumen.</b> As protons accumulate in the lumen, the pH drops and creates a powerful electrochemical proton-motive force.</p><p>Adjust the sunlight intensity below to see how rapidly the complexes pump protons.</p>',
      nextLabel: 'Harness the gradient',
      onEnter(ctx) {
        clearSubs();
        m.notes(false);
        m.note('complex');
        m.set({ fuel: 'light', fuelRate: 0.8 });

        ctx.ui.controls(`
          <div class="slider">
            <div class="slider-head"><span class="label">Sunlight intensity</span><span class="value" id="rate-val">80%</span></div>
            <input type="range" id="sunlight" min="0" max="1" step="0.05" value="0.8">
          </div>
          <div class="stats" style="margin-top:0.75rem;">
            <div class="stat"><span class="stat-label">Proton Force</span><span class="stat-value" id="stat-pmf">-- mV</span></div>
            <div class="stat"><span class="stat-label">Lumen pH</span><span class="stat-value" id="stat-ph">--</span></div>
          </div>
        `);

        const slider = ctx.ui.q('#sunlight');
        const rateVal = ctx.ui.q('#rate-val');
        ctx.ui.range(slider, v => {
          m.set({ fuelRate: v }, { snap: true });
          if (rateVal) rateVal.textContent = Math.round(v * 100) + '%';
        });

        const unsub = m.on('frame', s => {
          const pmfEl = ctx.ui.q('#stat-pmf');
          const phEl = ctx.ui.q('#stat-ph');
          if (pmfEl && s.pmf !== undefined) pmfEl.textContent = Math.round(s.pmf) + ' mV';
          if (phEl && s.pH) phEl.textContent = s.pH.outside !== undefined ? s.pH.outside.toFixed(1) : '--';
        });
        unsubs.push(unsub);
      }
    },
    {
      eyebrow: 'Turbine Power',
      title: 'ATP Synthase makes the fuel for sugar',
      body: '<p><b>Protons stream back into the stroma through ATP synthase, spinning its rotor to synthesize ATP.</b></p><p>This cellular ATP, alongside NADPH, provides the direct chemical energy consumed by the Calvin cycle to assemble carbon dioxide into sugars.</p>',
      nextLabel: 'Explore summary',
      onEnter(ctx) {
        clearSubs();
        m.notes(false);
        m.note('synthase');
        m.set({ fuel: 'light', fuelRate: 1 });

        ctx.ui.controls(`
          <div class="stats">
            <div class="stat"><span class="stat-label">ATP Synthesized</span><span class="stat-value" id="stat-atp">0</span></div>
            <div class="stat"><span class="stat-label">Protons / ATP</span><span class="stat-value" id="stat-stoich">--</span></div>
          </div>
        `);

        const unsub = m.on('frame', s => {
          const atpEl = ctx.ui.q('#stat-atp');
          const stoichEl = ctx.ui.q('#stat-stoich');
          if (atpEl && s.atpMade !== undefined) atpEl.textContent = s.atpMade;
          if (stoichEl && s.stoichiometry && s.stoichiometry.protonsPerATP) {
            stoichEl.textContent = s.stoichiometry.protonsPerATP.toFixed(1);
          }
        });
        unsubs.push(unsub);
      }
    }
  ]
});

const m = Membrane.mount(shell.stage, {
  context: 'thylakoid',
  fuel: 'light',
  fuelRate: 0,
  proteins: { complex: { x: -60 }, synthase: { x: 50 }, leak: null },
  contents: { inside: { water: 30, H: 22 }, outside: { water: 30, H: 22 } },
  potential: 'nernst',
  viewOffset: shell.viewOffset
});

shell.goTo(0);
</script>
</body>
</html>
