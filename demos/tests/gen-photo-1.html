<!doctype html>
<!-- requests
1. How does a plant turn sunlight into sugar?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Sunlight to Sugar</title>
<style>
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.75rem; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="Chloroplast,LightReactions"></script>
<script>
const shell = LessonShell.create({
  brand: 'Photosynthesis: Light to Sugar',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: {},
  steps: [
    {
      eyebrow: 'Organelle Scale',
      title: 'The chloroplast captures light',
      scene: 'organelle',
      body: '<p class="lead"><strong>Light reactions happen inside membrane-bound compartments called thylakoids.</strong></p><p>Chloroplasts contain discs stacked into grana suspended in a fluid called the stroma. The thylakoids enclose a continuous inner space known as the lumen.</p>',
      onEnter(ctx) {
        chloro.notes(['granum', 'stroma']);
        ctx.ui.controls('<div class="callout">Photosystems embedded in the thylakoid membranes convert photons into chemical energy.</div>');
      },
      onExit() {
        chloro.notes(false);
      }
    },
    {
      eyebrow: 'Thylakoid Membrane',
      title: 'Photosystem II splits water',
      scene: 'membrane',
      body: '<p class="lead"><strong>Sunlight drives the extraction of electrons by splitting water.</strong></p><p>Photons strike Photosystem II (PSII), exciting electrons that are passed down the transport chain. To replace them, PSII splits H₂O in the lumen, releasing O₂ as a byproduct and releasing protons.</p>',
      onEnter(ctx) {
        lightMem.set({ chain: 'split', fuel: 'light', fuelRate: 1 });
        lightMem.notes(['psii', 'water.split', 'oxygen']);
        ctx.ui.controls('<div class="callout">Water splitting directly enriches the thylakoid lumen with protons.</div>');
      },
      onExit() {
        lightMem.notes(false);
      }
    },
    {
      eyebrow: 'Proton Gradient',
      title: 'Pumping protons into the lumen',
      scene: 'membrane',
      body: '<p class="lead"><strong>Cytochrome b6f uses electron energy to pump protons across the membrane.</strong></p><p>Plastoquinone carries electrons from PSII to cytochrome b6f. As electrons pass through, b6f pumps additional protons from the stroma into the lumen, establishing a steep electrochemical proton gradient.</p>',
      onEnter(ctx) {
        lightMem.notes(['b6f', 'plastoquinone']);
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton-Motive Force</div><div class="stat-value" id="pmf-val" data-live>--</div><div class="stat-sub">mV across membrane</div></div></div>');
        const unsub = lightMem.on('frame', s => {
          const el = ctx.ui.q('#pmf-val');
          if (el && s.pmf != null) el.textContent = Math.round(s.pmf) + ' mV';
        });
        ctx.unsub = unsub;
      },
      onExit(ctx) {
        lightMem.notes(false);
        if (ctx.unsub) ctx.unsub();
      }
    },
    {
      eyebrow: 'Energy Storage',
      title: 'Making ATP and NADPH',
      scene: 'membrane',
      body: '<p class="lead"><strong>The proton gradient and Photosystem I produce high-energy molecules in the stroma.</strong></p><p>Photosystem I uses a second photon to load electrons onto NADP⁺ to form NADPH. Simultaneously, ATP synthase harnesses the outflow of protons to produce ATP.</p>',
      onEnter(ctx) {
        lightMem.notes(['psi', 'synthase', 'nadph']);
        ctx.ui.controls(`
          <div class="stat-grid">
            <div class="stat"><div class="stat-label">ATP Made</div><div class="stat-value" id="atp-val" data-live>0</div></div>
            <div class="stat"><div class="stat-label">NADPH Made</div><div class="stat-value" id="nadph-val" data-live>0</div></div>
          </div>
          <div class="slider" style="margin-top: 0.75rem;">
            <div class="slider-head"><span class="label">Light Intensity</span></div>
            <input type="range" id="dimmer" min="0" max="1" step="0.05" value="1">
          </div>
        `);
        ctx.ui.range(ctx.ui.q('#dimmer'), v => lightMem.set({ fuelRate: v }, { snap: true }));
        const unsub = lightMem.on('frame', s => {
          const atpEl = ctx.ui.q('#atp-val');
          const nadphEl = ctx.ui.q('#nadph-val');
          if (atpEl && s.atpMade != null) atpEl.textContent = s.atpMade;
          if (nadphEl && s.light && s.light.nadphMade != null) nadphEl.textContent = s.light.nadphMade;
        });
        ctx.unsub = unsub;
      },
      onExit(ctx) {
        lightMem.notes(false);
        if (ctx.unsub) ctx.unsub();
      }
    },
    {
      eyebrow: 'The Calvin Cycle',
      title: 'Synthesizing sugars in the stroma',
      scene: 'organelle',
      body: '<p class="lead"><strong>ATP and NADPH power the synthesis of sugar from carbon dioxide.</strong></p><p>The ATP and NADPH synthesized by the light reactions diffuse directly into the stroma. There, the Calvin cycle consumes them to fix CO₂ into three-carbon sugars, which are converted into glucose and stored as starch grains.</p>',
      onEnter(ctx) {
        chloro.notes(['starch', 'stroma']);
        ctx.ui.controls('<div class="callout">Light energy is now stored in stable covalent carbon bonds.</div>');
      },
      onExit() {
        chloro.notes(false);
      }
    }
  ]
});

const chloro = shell.scene('organelle', el => Chloroplast.mount(el, { viewOffset: shell.viewOffset, light: 0.8 }));
const lightMem = shell.scene('membrane', el => LightReactions.mount(el, { viewOffset: shell.viewOffset, chain: 'split', fuel: 'light', fuelRate: 1 }));

shell.goTo(0);
</script>
</body>
</html>
