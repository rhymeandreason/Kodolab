<style>
  /* ---------- goal cards, top-center: one per lesson, tabs styled as a dealt
     hand of cards (no outline, overlapping) so the strip reads as objects you
     could pick up rather than UI. Inactive cards stay visible, never hidden —
     the comparison across cards is the content. */
  #goals{position:absolute;top:var(--hdr);left:50%;transform:translateX(-50%);z-index:12;
    display:flex;gap:0;align-items:stretch;padding:10px 6px 12px}
  /* The reaction row, tucked under the build row and centred on it. Same cards,
     smaller: a second row of full-size cards would read as nine more lessons
     rather than as what the first row leads to. */
  #bonus{position:absolute;top:calc(var(--hdr) + 116px);left:50%;transform:translateX(-50%);z-index:12;
    display:flex;gap:0;align-items:stretch;padding:6px 6px 14px}
  #bonus .goal{min-width:150px;max-width:200px;padding:8px 12px 10px}
  #bonus .gname{font-size:16px}
  #bonus .gform{font-size:14px;margin-top:5px}
  /* Locked: face down. Kept the same SIZE and place as the card it will become,
     so unlocking turns a card over rather than making one appear — the student
     knows there is something there to earn, which is the only reason to show it
     at all. Paper goes flat and cool; no lift, no hover. */
  .goal.locked{background:var(--surface-page);box-shadow:0 1px 1px rgba(43,39,35,.10),
    0 2px 4px -2px rgba(43,39,35,.14);cursor:default}
  .goal.locked:hover{background:var(--surface-page);animation:none}
  .goal.locked .gname,.goal.locked .gform{visibility:hidden}
  .goal.locked::after{content:'???';position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-ui);font-weight:600;font-size:24px;
    color:var(--cream-600);letter-spacing:.12em}
  .goal.bonus{position:relative}
  /* The turn: it flips up onto its face once, so the unlock is something you
     SEE happen even if you were looking at the molecule when it did. */
  .goal.turning{animation:cardTurn .5s cubic-bezier(.32,.72,.4,1)}
  @keyframes cardTurn{
    0%  {transform:translateY(var(--dy)) rotate(var(--tilt)) rotateY(-90deg)}
    100%{transform:translateY(var(--dy)) rotate(var(--tilt)) rotateY(0)}}
  /* Paper is opaque; dimming an inactive card is done via its ink colour, not
     element opacity — a translucent card would show the molecule through it. */
  .goal{text-align:center;background:var(--surface-raised);border:none;
    border-radius:3px 4px 3px 4px;padding:10px 12px 12px;min-width:132px;max-width:176px;
    font-family:inherit;cursor:pointer;
    box-shadow:0 1px 1px rgba(43,39,35,.16), 0 3px 5px -2px rgba(43,39,35,.20),
      0 12px 20px -14px rgba(43,39,35,.55);
    transition:background .13s ease,transform .13s ease,box-shadow .13s ease}
  /* -14px ≈ corner radius + shadow, so each card still shows its edge */
  .goal + .goal{margin-left:-14px}
  .goal[data-lesson="nacl"]{margin-left:20px}   /* separates covalent set from ionic set */
  /* Staggered tilt/height so no two cards sit alike (values <5px, cycling every
     5). Custom properties rather than bare transforms so hover/lift can carry
     them along instead of flattening the card back to level. */
  .goal{--tilt:0deg;--dy:0px;transform:translateY(var(--dy)) rotate(var(--tilt))}
  .goal:nth-child(5n+1){--tilt:-0.7deg;--dy:2px}
  .goal:nth-child(5n+2){--tilt:0.5deg; --dy:4px}
  .goal:nth-child(5n+3){--tilt:-0.3deg;--dy:0px}
  .goal:nth-child(5n+4){--tilt:0.8deg; --dy:3px}
  .goal:nth-child(5n+5){--tilt:-0.5deg;--dy:1px}
  .goal:hover{background:var(--surface-card);z-index:2}   /* hover/live cards raise z so their corner shows over the neighbour to the right */
  /* Overshoot-then-settle on hover, like a hand lifting a light object; skipped
     on .on since the live card is already lifted. */
  .goal:not(.on):hover{animation:cardLift .26s cubic-bezier(.32,.72,.4,1) forwards}
  @keyframes cardLift{
    0%  {transform:translateY(var(--dy))              rotate(var(--tilt))}
    55% {transform:translateY(calc(var(--dy) - 7px))  rotate(var(--tilt))}
    100%{transform:translateY(calc(var(--dy) - 4px))  rotate(var(--tilt))}}
  .goal.on{background:var(--surface-card);z-index:3;   /* straightened + lifted off its own staggered height, so selecting never shifts it sideways */
    transform:translateY(calc(var(--dy) - 5px)) rotate(0deg);
    box-shadow:0 2px 2px rgba(43,39,35,.14), 0 8px 14px -6px rgba(43,39,35,.30),
      0 22px 30px -18px rgba(43,39,35,.55)}
  .goal .gname{font-family:var(--font-editorial);font-size:17px;line-height:1.15;
    color:var(--text-muted)}
  /* NOT the display face: Futura has no subscript digits, so H₂O comes out
     "H,O" — a formula is set in the face that actually carries U+2082. */
  .goal .gform{font-family:var(--font-ui);font-weight:600;font-size:14px;
    letter-spacing:.02em;color:var(--cream-600);margin-top:8px}
  .goal:hover .gname{color:var(--text-dim)}
  .goal.on .gname{color:var(--ink)}
  .goal.on .gform{color:var(--muted)}
  /* finished: the paper itself goes faintly green, since there is no longer an
     outline to recolour. Last, so it wins over the active card's ink */
  .goal.done{background:#f2f7f1}
  .goal.done.on{background:#f8fcf7}
  .goal.done .gname,.goal.done.on .gname{color:#2e8b57}

  /* ---------- notes: the test-answer keywords, revealed on completion ----
     Left rail rather than a card over the stage: it is reference material to
     glance at, not a thing that happened, so it should not compete with the
     molecule or move. Kept to keywords on purpose — the page teaches by what it
     draws, and this is only what a student would be asked to name. */
  #notes{position:absolute;left:26px;top:calc(var(--hdr) + 194px);z-index:11;width:206px;
    display:none;opacity:0;transition:opacity .25s ease}
  #notes.show{display:block;opacity:1}
  #notes .ntitle{font-family:var(--font-display);font-size:var(--cap-lg);
    font-weight:var(--cap-weight);text-transform:uppercase;
    letter-spacing:var(--cap-track);color:var(--text-muted);
    line-height:1.3;margin-bottom:10px}
  /* a second stage stacks under the first, hairline-separated: same molecule,
     next thing that happened to it */
  #notes .nblock + .nblock{margin-top:13px;padding-top:12px;
    border-top:1px solid var(--border-hair)}
  #notes .ntags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  #notes .ntag{font-weight:700;font-size:10px;
    letter-spacing:var(--cap-track);text-transform:uppercase;padding:3px 7px;
    border-radius:3px;border:1px solid var(--ink);background:#fff;color:var(--ink)}
  #notes .ntag.covalent{background:#e8e2d4}
  #notes .ntag.ionic{background:#f6dcb4}
  #notes .ntag.polar{background:#cfe4f2}
  #notes .ntag.nonpolar{background:#eceae4;color:var(--muted);border-color:var(--hair)}
  #notes .ntag.dative{background:#ded7f5}
  #notes .ntag.ion{background:#f6dcb4}
  /* Room-temperature state is a different kind of claim than the tags above it
     (bond type vs. what the substance is like on a bench) — dashed border keeps
     the two kinds of label visually distinct. Colours run cold → warm as the
     particles get freer. */
  #notes .ntag.solid,#notes .ntag.liquid,#notes .ntag.gas{border-style:dashed}
  #notes .ntag.solid{background:#e0dbcd}
  #notes .ntag.liquid{background:#cfe4f2}
  #notes .ntag.gas{background:#f7eddd}
  #notes ul{list-style:none;margin:0;padding:0}
  #notes li{font-family:var(--font-editorial);font-size:14px;line-height:1.45;
    color:var(--ink);padding-left:13px;position:relative;margin-bottom:4px}
  #notes li::before{content:'·';position:absolute;left:2px;top:-2px;color:var(--muted);
    font-weight:700;font-size:22px;line-height:1}
  #notes li b{font-weight:600}

  /* ---------- sticky note, right rail ----------
     Mirrors #notes but deliberately not the same object: notes are keywords
     earned by finishing, a sticky is a passing aside about the current state
     that leaves when that state does — hence paper + tilt + sticker instead of
     bare rail text. Sits lower than #notes (which tucks under the tab strip
     fine as bare text) since an opaque bordered card overlapping the strip
     would read as broken layout. */
  #sticky{position:absolute;right:26px;top:calc(var(--hdr) + 250px);z-index:11;width:224px;height:224px;
    background:linear-gradient(165deg,#fff6a8,#ffe985 92%);
    border:none;border-radius:0;box-sizing:border-box;overflow:visible;
    padding:20px;transform:rotate(1.6deg) translateY(6px);
    box-shadow:0 1px 1px rgba(0,0,0,.15),2px 3px 6px rgba(0,0,0,.18),
      6px 10px 16px -6px rgba(0,0,0,.35);
    display:none;opacity:0;transition:opacity .22s ease,transform .22s ease}
  #sticky.show{display:block;opacity:1;transform:rotate(1.6deg) translateY(0)}
  /* Dropped down the rail for a note whose subject is up in the top-right
     corner — the hydroxide drifts back to where the water was dealt, and the
     note explaining it must not be sitting on top of it. Opt-in per note
     (`place:'low'`), because it is a fact about that one molecule's path, not
     about stickies. */
  #sticky.low{top:calc(var(--hdr) + 474px)}
  /* sticker rides the top-left corner, half off the paper — reads as stuck on */
  #sticky .simg{position:absolute;left:-19px;top:-50px;width:80px;;
    transform:rotate(-13deg);pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  #sticky .stitle{font-family:var(--font-editorial);font-weight:600;font-size:19px;
    letter-spacing:-.01em;line-height:1.2;
    color:var(--ink);margin:2px 0 8px 13px}
  #sticky .sbody{font-family:var(--font-editorial);font-size:15px;line-height:1.45;
    color:var(--ink)}
  #sticky .sbody b{font-weight:600; font-style:italic;}
  /* A sticky is normally something to READ, so the one that can be acted on has
     to look like paper someone wrote a button onto rather than UI dropped on the
     note: marker face, hand-drawn ink border, and it sits at the bottom of the
     note where a "do it" belongs. Only ammonia has one — see `action` in the
     lesson table. */
  #sticky .sact{position:absolute;left:20px;right:20px;bottom:18px;
    font-family:var(--font-ui);font-weight:600;font-size:14px;line-height:1;
    padding:10px 10px 11px;cursor:pointer;color:var(--ink);
    background:#fffdf2;border:1px solid var(--ink);border-radius:var(--radius-md);
    transform:rotate(-0.8deg);
    box-shadow:1px 2px 0 rgba(43,39,35,.30);
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
  #sticky .sact:hover{background:#fff;transform:rotate(-0.8deg) translateY(-1px);
    box-shadow:1px 3px 0 rgba(43,39,35,.34)}
  /* pressed: down onto the paper, shadow gone — the only motion that reads as a
     button being pushed rather than a card being hovered */
  #sticky .sact:active{transform:rotate(-0.8deg) translateY(2px);box-shadow:0 0 0 rgba(0,0,0,0)}
  /* the body has to stop short of the button, or a long note runs under it */
  #sticky.acting .sbody{padding-bottom:46px}

  /* ---------- feedback toast ----------
     Sits above the dock rather than up top (wedged between tab strip and atoms,
     had to stay short) — down here it can run wide and rises up from near the
     controls that caused it. */
  #say{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:12;
    pointer-events:none;text-align:center;width:min(760px,86%);opacity:0;
    font-family:var(--font-editorial);font-size:19px;line-height:1.4;color:var(--text-muted)}
  #say b{font-weight:600;color:var(--ink)}
  #say.no b{color:#c0392b}
  #say.show{animation:sayFade 3.4s ease-out forwards}
  @keyframes sayFade{
    0%{opacity:0;transform:translateX(-50%) translateY(6px)}
    9%{opacity:1;transform:translateX(-50%) translateY(0)}
    78%{opacity:1;transform:translateX(-50%) translateY(0)}
    100%{opacity:0;transform:translateX(-50%) translateY(4px)}}
  /* a refused bond shakes rather than silently doing nothing */
  #stage.shake{animation:shk .34s ease}
  @keyframes shk{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}
    58%{transform:translateX(6px)}80%{transform:translateX(-3px)}}


  #dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;
    display:flex;align-items:center;gap:22px}
  #dock .dsep{display:none}
  /* Level with the .segmented--sm beside it: .pill--sm alone stands 2px taller. */
  #clearmol{padding-top:9px;padding-bottom:9px}
  /* view switch: electrons-vs-sticks follows the view rather than its own toggle */
  /* Hidden, the switch collapses to nothing and takes the dock's gap with it,
     so Reset alone is centred; armed, it opens and the pair is centred. Width
     animates with the fade, so Reset glides aside rather than jumping. */
  #dims{max-width:0;margin-right:-22px;border-width:0}
  #dims.armed{max-width:160px;margin-right:0;border-width:1px}
  #dims{opacity:0;pointer-events:none;transition:opacity .3s ease,max-width .3s ease,margin-right .3s ease}
  #dims.armed{opacity:1;pointer-events:auto}

  /* the PNG button and the dock both want the bottom strip — move it up */
  /* The shape is kodo.css's `.btn`, on the markup; this is the corner. It sits
     bottom-RIGHT here because the dock owns the bottom-left. */
  #savepng{position:absolute;bottom:22px;right:26px;left:auto;z-index:5}
  /* Room for the floating header above the goal cards. Framed, the header is
     hidden, so the cards return to the top. */
  :root{--hdr:72px}
  html.bare{--hdr:16px}
  .sitenav.floating{z-index:13}
</style>

<script>
"use strict";
/* =============================================================
 *  BUILD A MOLECULE — five tabs in three groups
 *
 *  H2O / CH4 ....... the same rule at two slot counts, so methane reads as
 *                    "the rule generalises" rather than as a new fact
 *  NH3 -> NH4+ ..... the bond one atom pays for (dative), and the acid/base
 *                    door: a further H is refused as an ATOM, accepted as a
 *                    PROTON
 *  NaCl / KCl ...... the same transfer from two metals, so KCl is the control
 *                    showing the behaviour belongs to metal + nonmetal, not
 *                    to sodium
 *
 *  Chemistry and feel live in covalent-drag.js (H2O, CH4, NH3) and
 *  ionic-drag.js (NaCl, KCl) — separate files because filling a valence slot
 *  and handing an electron over are different MECHANICS. This file is UI
 *  only: it narrates what the hands just did (name the pull, name the pair,
 *  count slots/electrons). Every rule is enforced in 3D, never in a dialog.
 *
 *  Angles per check-molecules.js: H2O 104.6°, NH3 106.8°, CH4/NH4+ 109.5°.
 *  The notes rail quotes textbook values (104.5°, 107°) instead — that's
 *  what a student writes down; the gap is spec rounding, not a second claim.
 *
 *  MODEL SIMPLIFICATIONS (deliberate, kept explicit):
 *   - `polar` weights are stylised, from electronegativity difference, not
 *     dipole moments (SCIENCE.md 2).
 *   - Ionic separations are roomier than any covalent bond (Na-Cl 2.55 vs.
 *     radii summing to 1.94), so the eye reads a SPACE between two ions
 *     rather than a join — nothing is shared across that gap.
 *   - Stick view still draws a stick for the ion pair (amber, the ion
 *     colour, never covalent grey), because stick view is the schematic the
 *     rest of the project speaks and switching to it should still show a
 *     bond. Electron view has none — there is no shared pair to draw.
 *   - Each covalent lesson ships exactly as many ligands as it has slots,
 *     shown by the open-slot counter and ghost markers rather than tested
 *     by a refusal.
 * ============================================================= */

/* 2D is a PROJECTION FOR COUNTING, not a claim about shape — water's lone pairs
   really do stick out of the H-O-H plane, methane really is a tetrahedron.
   Bond angles and slot geometry stay untouched; only the flat layout moves
   what would otherwise hide behind the core, and notes/teach text state the
   real angle (109.5°, not the flat cross's 90°) with 3D one click away.

   Both views are orthographic (Stage's `ortho:true`) — perspective was a lie
   on a page whose whole subject is comparing sizes: an atom off to the side
   read skewed, and a nearer hydrogen read BIGGER rather than closer. With no
   fov, apparent size comes from the frustum instead: cam.r is standing
   distance (must stay large enough no atom crosses the near plane), and
   ZOOM.k maps it to the half-height actually shown. */
const ZOOM={ min:30, max:130, k:0.08 };   // cam.r ⇒ world half-height on screen

const canvas=document.getElementById('gl');
let userSpun=false;
const {scene,camera,renderer,root,cam,applyCam,resize}=Stage.create(canvas,{
  ortho:true, cam:{theta:0.6,phi:1.15,r:62}, rMin:ZOOM.min, rMax:ZOOM.max,
  onZoom:()=>{ userZoomed=true; applyZoom(); },   // the wheel wins from then on
  onDrag:()=>{userSpun=true;}
});
/* An ortho camera's apparent size is its frustum, so zoom and resize both have
   to rewrite it — there is no fov and no distance for them to work through. */
function applyZoom(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if(!w||!h) return;
  const halfH=cam.r*ZOOM.k, a=w/h;
  camera.top=halfH; camera.bottom=-halfH;
  camera.left=-halfH*a; camera.right=halfH*a;
  camera.updateProjectionMatrix();
}
new ResizeObserver(applyZoom).observe(canvas);
/* One molecule fits at 62; the proton-transfer stages put a SECOND one on the
   bench, dealt out at the edge of the frame so it is not already inside the
   reaction, and at 62 that reagent lands half off the paper on a narrow window.
   80 is sized for the worst case rather than for this laptop: HCl's water
   reaches x≈7.4, so the frustum has to be ~9 wide at an aspect as low as 1.4.
   Eased rather than cut, because the student is looking at the molecule when it
   happens and a jump reads as the molecule shrinking, not the view widening. */
const R_ONE=62, R_TWO=80;
let rWant=R_ONE, userZoomed=false;
function wantZoom(r){ rWant=r; }

let key='water', L=LESSONS[key], sim=null;

/* ---------- feedback ---------- */
let sayTimer=null;
function say(html){
  elSay.innerHTML=html;
  elSay.classList.remove('show');
  void elSay.offsetWidth;              // restart the animation
  elSay.classList.add('show');
  clearTimeout(sayTimer);
  sayTimer=setTimeout(()=>elSay.classList.remove('show'),3400);
}

function card(){ return document.querySelector('.goal[data-lesson="'+key+'"]'); }

/* Takes a list: a lesson can put more than one card on the rail. A bonus card
   shows only its own — its reactant's notes were earned on the reactant's card. */
/* Once a lesson has been completed ONCE, its notes stay up for the rest of that
   lesson. They are the revision card — the keywords a student is meant to copy
   down — and having them appear at the win only to vanish the moment anything
   moves means the one thing worth writing down is the one thing that will not
   hold still.

   Recorded PER LESSON rather than as one flag, so the tab strip is a set of
   places you can leave and come back to rather than a set of things you can
   lose. Build water, go read the salt tab, come back — the water card is where
   you left it. Completing a molecule is a thing the student did, and switching
   tabs is not an undo. */
const earnedNotes={};
/* Finishing the REACTION on a bonus card. Written where the second-stage line
   fires, so it tracks the reaction rather than anything the rail shows. */
const earnedStage={};
let pinnedNotes=null;
function showNotes(list){
  if(!list){
    if(pinnedNotes) return;                 // earned already — leave it up
    elNotes.classList.remove('show'); elNotes.dataset.key=''; return;
  }
  pinnedNotes=earnedNotes[key]=list;
  /* Earning a molecule is what turns its reaction card over, and this is the
     moment that record is written — so the two can never disagree. */
  refreshLocks();
  /* `stamp`, not `key`: `key` is the current LESSON, read on the line above, and
     a local of that name would shadow it across the whole function. */
  const stamp=[].concat(list).map(n=>n.title).join('|');
  // titles are the identity: re-rendering identical HTML on every frame of a
  // completed state re-triggers the reveal transition
  if(elNotes.dataset.key===stamp) return;
  elNotes.dataset.key=stamp;
  elNotes.innerHTML=[].concat(list).map(n=>
    '<div class="nblock"><div class="ntitle">'+n.title+'</div><div class="ntags">'+
    n.tags.map(t=>'<span class="ntag '+t+'">'+t+'</span>').join('')+'</div><ul>'+
    n.facts.map(f=>'<li>'+f+'</li>').join('')+'</ul></div>').join('');
  elNotes.classList.add('show');
}

/* A sticky is a function of CURRENT state, re-evaluated every report and
   cleared when the state that earned it ends — unlike say()'s "this just
   happened" toast, it's "this is what you're looking at". Arrives a beat
   late (as if pinned after the fact); mid-build stickies land faster than
   completion ones so they don't lag behind the student reaching for the next
   atom. Leaving is never delayed. */
const STICKY_DELAY_STEP=350;   // mid-build
const STICKY_DELAY_WIN=900;    // completion
let stickyTimer=null, stickyPending=null;
function hideSticky(){
  clearTimeout(stickyTimer); stickyTimer=null; stickyPending=null;
  // the key is cleared on the way out, so peeling a bond off and rebuilding it
  // earns the note again rather than leaving a hidden div that thinks it is up
  elSticky.classList.remove('show'); elSticky.dataset.key='';
  // and the inline display the entrance set, or the stylesheet's display:none
  // stays overridden and an invisible card keeps sitting over the stage
  elSticky.style.display='';
}
function showSticky(note, delay){
  if(!note){ hideSticky(); return; }
  // Already up, or already on its way up. report() fires many times a second, so
  // without the pending check every one of them would restart the timer and the
  // note would keep being pushed into the future and never arrive.
  if(elSticky.dataset.key===note.title || stickyPending===note.title) return;
  hideSticky();                       // a DIFFERENT note: the old one is stale now
  stickyPending=note.title;
  stickyTimer=setTimeout(()=>{
    stickyTimer=null; stickyPending=null;
    elSticky.dataset.key=note.title;
    elSticky.innerHTML='<img class="simg" src="images/sticker_important.png" alt="">'+
      '<div class="stitle">'+note.title+'</div>'+
      '<div class="sbody">'+note.body+'</div>'+
      (note.action?'<button class="sact" type="button">'+note.action.label+'</button>':'');
    /* The handler is bound to the freshly written button rather than delegated,
       because innerHTML above throws the old one away every time a note changes
       — a delegated listener would have to re-find which lesson's action it is
       firing, which is exactly the state the note already carries. */
    elSticky.classList.toggle('acting', !!note.action);
    elSticky.classList.toggle('low', note.place==='low');
    if(note.action){
      elSticky.querySelector('.sact').addEventListener('click', ()=>note.action.run());
    }
    /* forced reflow so display:none→block and .show don't collapse into one frame and skip the fade */
    elSticky.style.display='block';
    void elSticky.offsetWidth;
    elSticky.classList.add('show');
  }, delay==null ? STICKY_DELAY_WIN : delay);   // default to the longer delay if a caller forgets
}

/* One-per-molecule, not a status light: pulling a bond apart re-arms it, so
   rebuilding earns the ring again (salt reports this twice — transfer, then landing). */
let rung=false;
/* `extra`: a lesson with a stage AFTER completion (ammonia's proton). Checked
   first so it isn't shadowed by the win line already earned. */
let saidExtra=false;
/* `after` is a second line that FOLLOWS a win rather than replacing it (unlike
   `extra`) — e.g. CO2's dipole-cancelling sentence about the same completion,
   after the ring/win-line/done-card have already fired. */
let saidAfter=false, afterTimer=null;
/* Set only for the duration of a fill() — a lesson re-opening already
   finished, not finishing now. win() reads it to skip one-time EVENTS. */
let restoring=false;
function report(s){
  // ahead of every early return: a sticky belongs to the state, not a branch, and win() returns before this function ends
  showSticky(L.sticky && L.sticky(s),
             s.complete ? STICKY_DELAY_WIN : STICKY_DELAY_STEP);
  const more=L.extra && L.extra(s);
  if(more){
    earnedStage[key]=true;
    if(!saidExtra){ saidExtra=true; say(more); showNotes(L.notes2?(L.bonus?[L.notes2]:[L.notes,L.notes2]):L.notes); }
    return;
  }
  saidExtra=false;
  if(s.complete){ win(s); return; }
  rung=false; saidAfter=false; spun=false;
  clearTimeout(afterTimer); spinTimer=clearTimeout(spinTimer);
  arm(false);      // pulled a bond apart — no finished molecule, no switch
  card().classList.remove('done');
  showNotes(null);
  const line=L.step(s); if(line) say(line);
}

function win(s){
  arm(true);
  card().classList.add('done');
  /* A bonus card's `notes` describe the molecule it was HANDED, which the
     student already earned on its own card — the rail carries only what this
     card teaches. */
  showNotes(L.bonus?null:L.notes);
  say(L.won);
  /* lands as the win line fades, not on top of it — 3.2s vs. say()'s 3.4s hold, so the toast never goes empty between them */
  if(L.after && !saidAfter && !restoring){
    saidAfter=true;
    clearTimeout(afterTimer);
    afterTimer=setTimeout(()=>say(L.after(s)), 3200);
  }
  /* covalent rings out from the anchor; ionic flashes/sparks instead, fired by
     ionic-drag.js at the arrival point. Centred on the lesson's anchor (not
     world origin) so a covalent ligand towing the molecule mid-drag doesn't
     leave the ring expanding over blank paper. */
  if(fx && !rung && L.ring && !restoring){
    rung=true;
    fx.spawnRing(sim.center(), L.ring(), sim.anchor && sim.anchor());
  }
  // once per completion — a student who returns to 2D on purpose shouldn't be auto-spun back to 3D
  if(flat && !spun && !restoring){ spun=true; spinTimer=setTimeout(()=>{ spinTimer=null; setView(false,true); }, 900); }
}
let spinTimer=null, spun=false;

/* tabs tear down the old lesson rather than hide it — both modules bind
   pointer handlers to the stage, and a hidden-but-live one keeps grabbing atoms */
let last=0;
/* Which cards are face down. A bonus card needs its reactant EARNED — the
   notes it left behind are the record of that, so `earnedNotes` is the same
   thing the green card reads from and there is no second source of truth. */
function locked(c){ return c.dataset.needs && !earnedNotes[c.dataset.needs]; }
function refreshLocks(){
  document.querySelectorAll('.goal.bonus').forEach(c=>{
    const was=c.classList.contains('locked'), now=locked(c);
    c.classList.toggle('locked', now);
    c.setAttribute('aria-disabled', now?'true':'false');
    /* Turned over, once. The unlock usually happens while the student is
       looking at the molecule they just finished, so it has to be visible as
       an EVENT out of the corner of the eye — a card that had silently changed
       by the next time they looked up would just be a card they had missed. */
    if(was && !now){
      c.classList.add('turning');
      setTimeout(()=>c.classList.remove('turning'), 520);
    }
  });
}

function load(k){
  if(sim) sim.destroy();
  rung=false; saidAfter=false; clearTimeout(afterTimer);
  spun=false; spinTimer=clearTimeout(spinTimer);
  key=k; L=LESSONS[k]; saidExtra=false;
  pinnedNotes=null; showNotes(null);
  showNotes(earnedNotes[k]||null);   // restores whatever this lesson had earned, or stays hidden
  showSticky(null);
  document.querySelectorAll('.goal').forEach(c=>
    c.classList.toggle('on', c.dataset.lesson===k));
  // uses viewState directly rather than arm(false): the old sim is gone and the new one doesn't exist yet, so setView has nothing to talk to
  document.getElementById('dims').classList.remove('armed');
  viewState(true);
  wantZoom(L.primed?R_TWO:R_ONE); userZoomed=false;   // a reaction card opens with two molecules
  sim=L.make();
  sim.setDim(flat?'2d':'3d');
  sim.setMode(modeFor());          // after setDim: the mode is derived from it
  /* A reaction card stands its reactant up ready-made and pours the water. Not
     a shortcut past the build — the build is the card ABOVE, and this one is
     unlocked by having done it. Silently, for the same reason a re-opened
     lesson is: the ring and the win line belong to the moment it was made. */
  if(L.primed){
    /* `restoring` spans the pour as well as the fill. offerWater() reports its
       own state change, which runs win() — and win() is where the automatic
       turn to 3D lives, so leaving the flag off for that one call opened every
       reaction card in the round view, which is the one view that does not draw
       electrons. The whole card is about which pair goes where. */
    restoring=true;
    sim.fill();
    sim.offerWater();
    /* …and if they have already done this one, it re-opens DONE, the same way a
       finished build card re-opens built. Coming back to a reaction you have
       run to find it waiting to be run again says the page forgot. Reset is
       there to do it over. */
    if(earnedStage[k]) sim.finishReaction();
    restoring=false;
    /* No opening line on a restored one: finishReaction() reports through to the
       second-stage line, which is the true caption for what is on screen — and
       "drag the water at the lone pair" written over a molecule that has already
       taken the proton is an instruction for a job that is done. */
    if(!earnedStage[k]) say(L.open);
    return;
  }
  /* A finished lesson re-opens finished (via fill()) rather than as a bare atom
     — `restoring` tells win() to skip the completion ring/auto-3D-turn (those
     are rewards for the moment of bonding, not for revisiting), while the done
     card, notes, and 3D toggle still arrive as plain state. No opening line
     either, since fill() runs win() and answers "start here" before it's read. */
  if(earnedNotes[k] && sim.fill){ restoring=true; sim.fill(); restoring=false; }
  else say(L.open);
}

document.querySelectorAll('.goal').forEach(c=>{
  c.addEventListener('click',()=>{
    if(locked(c)) return;                 // face down is not a tab
    if(c.dataset.lesson!==key) load(c.dataset.lesson);
  });
});
refreshLocks();

/* ---------- controls ----------
   electrons-vs-sticks follows the view rather than its own toggle: flat draws
   every valence electron since it exists to be counted, 3D draws bonds since
   a cloud of dots would hide the shape it exists to show. */
function modeFor(){ return flat ? 'electrons' : 'sticks'; }

let flat=true;   // 2D is the default (locked, countable); 3D is where you go to check the geometry
// switch only exists once the molecule is completed; un-arming returns to 2D
function arm(on){
  document.getElementById('dims').classList.toggle('armed', on);
  if(!on) setView(true,true);
}

/* Single place that changes the view so the button, auto-switch, and lesson
   change can't drift apart. Split from setView because load() must pick the
   view before the sim exists — this half sets the button lights and camera;
   setView adds the sim and toast. */
function viewState(toFlat){
  flat=toFlat;
  document.querySelectorAll('#dims .mode').forEach(o=>
    { const on=(o.dataset.dim==='2d')===flat; o.classList.toggle('is-on',on); o.setAttribute('aria-pressed',on); });
  if(flat){ userSpun=true; }        // no idle turntable behind a locked view
  // three-quarter camera, close enough to the flat one to read as a continuation before it turns
  else { cam.theta=0.3; cam.phi=1.4; applyCam(); userSpun=false; }
}
// `quiet` skips the toast on the automatic post-completion switch, since the win line is still the thing to read
function setView(toFlat,quiet){
  if(toFlat===flat) return;         // already there — a no-op, not a re-render
  viewState(toFlat);
  sim.setDim(flat?'2d':'3d');
  sim.setMode(modeFor());        // dots in the flat view, sticks in the round one
  if(!quiet) say(flat ? L.flatSay : 'Free view — drag the background to spin it.');
}
document.querySelectorAll('#dims .mode').forEach(b=>{
  b.addEventListener('click',()=>{ spinTimer=clearTimeout(spinTimer); setView(b.dataset.dim==='2d'); });
});

document.getElementById('clearmol').addEventListener('click',()=>{
  rung=false; saidExtra=false;
  spun=false; spinTimer=clearTimeout(spinTimer);
  arm(false);
  wantZoom(R_ONE);        // Reset takes the reagent away with everything else
  sim.reset();
  sim.setMode(modeFor());
  say(L.open);
});

document.getElementById('savepng').addEventListener('click',()=>{
  renderer.render(scene,camera);
  const a=document.createElement('a');
  a.download='molecule-builder.png';
  a.href=renderer.domElement.toDataURL('image/png');
  a.click();
});

/* ---------- frame loop ---------- */
function frame(now){
  requestAnimationFrame(frame);
  const dt=last?(now-last)/1000:0.016; last=now;
  // 2D lock re-asserted per frame rather than unbinding Stage's shared orbit handler
  if(flat){ cam.theta=0; cam.phi=Math.PI/2; applyCam(); }
  else if(!userSpun){ cam.theta+=0.0009; applyCam(); }   // slow idle turntable
  /* Eased here rather than tweened on a timer: this is the only place that
     knows the frame rate, and applyZoom() is cheap enough to call while it
     moves. Stops calling it once it has arrived. */
  if(!userZoomed && Math.abs(cam.r-rWant)>0.05){
    cam.r+=(rWant-cam.r)*(1-Math.pow(0.02, dt));
    applyZoom();
  }
  sim.step(dt);
  fx.step();
  renderer.render(scene,camera);
}
resize();
applyZoom();          // the frustum is the framing; nothing is shown until it is set
load('water');
requestAnimationFrame(frame);
</script>
</body>
</html>
