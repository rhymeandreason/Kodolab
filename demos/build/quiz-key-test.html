<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Answer key bench</title>
<base href="/demos/build/">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../css/kodo.css">
<link rel="stylesheet" href="build.css">
<link rel="stylesheet" href="shelf.css">
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  iframe { width: 100%; height: 100%; border: 0; }
  aside { border-left: 1px solid var(--border-hair); padding: 14px; overflow: auto; font-size: 13px; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: var(--surface-card); border: 1px solid var(--border-hair); padding: 6px; }
</style>
</head>
<body>
<div><iframe id="f" sandbox="allow-scripts allow-same-origin"></iframe></div>
<aside>
  <h3>Answer key bench</h3>
  <p>A generated page in a frame, answered as the builder answers it, and the builder's dialog. No database: Save applies the pairs here and reloads the frame.</p>
  <select id="page"><option>gen-quiz-test</option><option>gen-quiz-cell-test</option></select>
  <p id="stat"></p>
  <h4>Last save</h4><pre id="out">(nothing saved yet)</pre>
  <h4>Request box</h4><pre id="req">(empty)</pre>
</aside>
<dialog class="beta quizkey" id="quizModal" aria-label="Check the answer key"></dialog>
<script src="../quiz/quiz.js"></script>
<script src="quiz-key.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let src = '';
  const frame = () => {
    const h = /<head[^>]*>/i.exec(src), base = `<base href="${location.origin}/demos/build/">`;
    $('f').srcdoc = src.slice(0, h.index + h[0].length) + base + src.slice(h.index + h[0].length);
  };
  const key = QuizKey.create({
    dialog: $('quizModal'),
    source: () => src,
    save: async (edits, summary) => {
      let out = src;
      for (const p of edits) { if (out.split(p.find).length !== 2) throw new Error('not once'); out = out.replace(p.find, () => p.replace); }
      src = out; $('out').textContent = summary + '\n\n' + JSON.stringify(edits, null, 1); key.reset(); frame();
    },
    ask: t => { $('req').textContent = t; },
  });
  addEventListener('message', e => {
    const d = e.data; if (!d || !/^app-quiz/.test(d.type)) return;
    if (d.type === 'app-quiz-hello') return $('f').contentWindow.postMessage({ type: 'app-quiz-review', on: true }, '*');
    if (d.questions) { key.take(d); $('stat').textContent = `${d.questions.filter(q => q.passed).length} of ${d.questions.length} checked`; }
  });
  async function load() { src = await (await fetch(`../tests/${$('page').value}.html`)).text(); key.reset(); frame(); }
  $('page').addEventListener('change', load);
  load();
})();
</script>
</body>
</html>
