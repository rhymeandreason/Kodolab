<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Kodolab</title>
<script defer src="/demos/lib/site.js"></script>
<!-- Served at /login, /join and /join/<code> by vercel.json rewrites. -->
<base href="/demos/build/">
<link rel="stylesheet" href="../css/kodo.css">
<link rel="stylesheet" href="login.css">
<!-- =========================================================================
     THE ONE WAY IN. Two doors: a class code (a student, no account) and an
     account (everyone else).

     SIGNING IN IS NOT BEING ADMITTED, and this page only does the first. An
     account that still needs an invite is handed to /beta-invite, carrying its
     `next`: one page asks who you are, the other whether you may build, and a
     person who lands here already through goes straight on.

     THE ACCOUNT DOOR HAS TWO LATCHES, Google and a code mailed to an address,
     and they open the same account: the server matches on the address. The
     email form is a real <form> with autocomplete named, which is what lets a
     keychain fill the address and Safari offer the code straight from Mail.

     Pages that refuse someone send them here with ?next=<where they were>,
     and this page sends them back only when they now qualify for it: a
     signed-in non-teacher sent from /teach is asked for a teacher invite
     rather than bounced back to a page that will refuse them again.

     /join/<code> is a student's personal link: the code is read from the
     path, since a rewrite's query never reaches the browser, and joined at once.
     ========================================================================= -->
</head>
<body class="kodo">
<div class="page">
  <nav class="sitenav">
    <a class="mark" href="/"><img src="/kodolab-wordmark.svg" alt="kodolab"></a>
  </nav>

  <header class="pagehead">
    <h1>sign in</h1>
  </header>

  <p class="busy" id="busy" hidden></p>

  <main class="doors">
    <section class="door">
      <h2 class="cap">Students</h2>
      <p class="say">Type the class code your teacher gave you.</p>
      <form class="code" id="codeForm">
        <input id="classCode" aria-label="Class code" placeholder="abcd-efgh" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12">
        <button class="cta" type="submit">Join</button>
      </form>
      <p class="err" id="codeErr" hidden></p>
      <p class="sub" id="seatNow" hidden></p>
    </section>

    <section class="door">
      <h2 class="cap">Teachers and builders</h2>
      <div class="stack" id="out">
        <p class="say" id="firstTime">Beta access: The first time, enter your invite code after sign in.</p>
        <div class="gbtn" id="gbtn"></div>
        <p class="sub" id="noGoogle" hidden>Google sign-in is not set up on this server.</p>
        <p class="or"><span>or sign in with email</span></p>
        <form class="code" id="emailForm">
          <input id="email" type="email" name="email" inputmode="email" autocomplete="username"
                 aria-label="Email address" placeholder="you@school.edu"
                 autocapitalize="off" spellcheck="false" maxlength="254">
          <button class="cta" type="submit">Continue</button>
        </form>
        <form class="code" id="otpForm" hidden>
          <input id="otp" name="otp" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code"
                 aria-label="Sign-in code" placeholder="123456"
                 autocapitalize="off" spellcheck="false" maxlength="6">
          <button class="cta" type="submit">Sign in</button>
        </form>
        <p class="sub" id="otpSaid" hidden></p>
        <!-- Inside #out, so both go when they sign in: past that point the
             invite is the next page's business, not a warning. -->
        <p class="sub">No invite? <a href="https://forms.gle/D2yTAhtpUo5AaTvb7" target="_blank" rel="noopener">Join the waitlist</a>.</p>
      </div>
      <div class="stack" id="in" hidden>
        <p class="say" id="inLine"></p>
        <div class="line" id="go"></div>
      </div>
      <p class="err" id="acctErr" hidden></p>
    </section>
  </main>
</div>

<script src="apps-client.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = (id, text) => { $(id).textContent = text || ''; $(id).hidden = !text; };

  const params = new URLSearchParams(location.search);
  const next = Apps.safeNext(params.get('next'));
  const wantsTeach = Apps.wantsTeach(next);
  const home = user => next || Apps.page(user && user.teacher ? 'teach' : 'build');
  /* The invite page, told where this person was going, so redeeming lands them
     there and not on a generic home. */
  const invitePage = () => Apps.page('beta-invite') + (next ? '?next=' + encodeURIComponent(next) : '');

  const WHY = {
    invalid: 'That class code is not right. Check it against your card.',
    revoked: 'That class code has been turned off. Ask your teacher for a new one.',
    'not-class': 'That is an invite code, not a class code. Sign in with Google and enter it there.',
    disabled: 'This account has been turned off.',
  };
  // A refused class code is said under the Students door; a turned-off account under Google's.
  const why = params.get('why');
  if (WHY[why]) show(why === 'disabled' ? 'acctErr' : 'codeErr', WHY[why]);

  /* ---- the wait --------------------------------------------------------- *
   * Everything but the header goes, and one line says what is happening: a
   * form left on screen reads as one that did nothing. */
  function busy(text) {
    document.querySelector('.doors').hidden = !!text;
    $('busy').hidden = !text;
    $('busy').textContent = text || '';
  }
  function leave(url) {
    busy(/teach/.test(url) ? 'Opening your dashboard…' : 'Opening the builder…');
    location.replace(url);
  }

  /* ---- students --------------------------------------------------------- */
  async function join(code) {
    show('codeErr', '');
    Apps.codes.setSeat(code);
    busy('Joining…');
    try {
      const r = await Apps.api('../../api/build');
      // A wrong code with a testing link or an account beside it still answers 200, as that other admission.
      if (r.who && r.who.kind === 'seat') return leave(next && !wantsTeach ? next : Apps.page('build'));
      Apps.codes.setSeat(null); busy(''); show('codeErr', WHY[r.who && r.who.refused] || WHY.invalid);
    } catch (err) {
      Apps.codes.setSeat(null); busy('');
      show('codeErr', err.status === 401 ? err.message : 'Could not check the code: ' + err.message);
    }
  }
  $('codeForm').addEventListener('submit', e => {
    e.preventDefault();
    const code = $('classCode').value.trim();
    if (code) join(code);
  });

  const fromPath = (/^\/join\/([A-Za-z0-9-]+)\/?$/.exec(location.pathname) || [])[1];
  if (fromPath) { $('classCode').value = fromPath; join(fromPath); }
  else if (Apps.codes.seat()) {
    Apps.api('../../api/build').then(r => {
      if (!r.who || r.who.kind !== 'seat') return;
      $('seatNow').hidden = false;
      $('seatNow').innerHTML = `This browser is joined as <b>${esc(r.who.label)}</b> · ${esc(r.who.className)}. `
        + `<a href="${esc(Apps.page('build'))}">Continue</a> · <button class="textbtn" id="notMe" type="button">Not you?</button>`;
      $('notMe').addEventListener('click', () => { Apps.codes.setSeat(null); $('seatNow').hidden = true; $('classCode').focus(); });
    }).catch(() => {});
  }

  /* ---- accounts --------------------------------------------------------- */
  function paint(user) {
    Apps.account.note(user);
    if (!user) {
      $('out').hidden = false; $('in').hidden = true;
      Apps.account.button($('gbtn'), signedIn, () => busy('Signing in…'))
        .then(s => { if (!s.clientId) $('noGoogle').hidden = false; })
        .catch(err => show('acctErr', err.message));
      return false;
    }
    // Not admitted yet, or not the teacher the dashboard needs: that is the
    // invite page's question, and asking it here would be asking it twice.
    if (!user.admitted || (wantsTeach && !user.teacher)) { location.replace(invitePage()); return false; }

    $('out').hidden = true; $('in').hidden = false;
    $('inLine').innerHTML = `Signed in as <b>${esc(user.name)}</b>.`;
    $('go').innerHTML = user.teacher
      ? `<a class="cta" href="${esc(Apps.page('teach'))}">Dashboard</a><a class="cta cta--ghost" href="${esc(Apps.page('build'))}">Build</a>`
      : `<a class="cta" href="${esc(Apps.page('build'))}">Build</a>`;
    return true;
  }

  // The apps this browser made on a testing link move into the account before it leaves.
  async function signedIn(user, err) {
    if (err) { busy(''); return show('acctErr', err.message); }
    // Signing in is saying who you are: a class code left in this browser would outrank it on /build.
    Apps.codes.setSeat(null);
    if (!paint(user)) return busy('');
    await Apps.account.claimLocal();
    leave(home(user));
  }

  /* ---- the email door --------------------------------------------------- *
   * Two steps in one door, and the address is kept in a variable rather than
   * re-read from the field: it is what the code was sent to, and a person who
   * edits the box after asking would otherwise verify against the new text. */
  let sentTo = null;

  function otpStep(said) {
    $('emailForm').hidden = !!said;
    $('otpForm').hidden = !said;
    // Two codes on screen at once is the one confusion this door has to avoid:
    // while a sign-in code is being typed, the invite is not the subject.
    $('firstTime').hidden = !!said;
    show('otpSaid', said || '');
    if (said) { $('otp').value = ''; $('otp').focus(); } else { sentTo = null; $('email').focus(); }
  }

  async function sendCode(email) {
    show('acctErr', '');
    const btn = $('emailForm').querySelector('button');
    btn.disabled = true;
    try {
      const r = await Apps.account.codeSend(email);
      sentTo = email;
      otpStep(r.console
        ? `No mail provider here, so the code was printed in the dev server console. It lasts ${r.minutes} minutes.`
        : `Code sent to ${email}. It lasts ${r.minutes} minutes.`);
      $('otpSaid').insertAdjacentHTML('beforeend',
        ' <button class="textbtn" id="againBtn" type="button">Send again</button>'
        + ' · <button class="textbtn" id="otherBtn" type="button">Use a different address</button>');
      $('againBtn').addEventListener('click', () => sendCode(sentTo));
      $('otherBtn').addEventListener('click', () => otpStep(null));
    } catch (err) { show('acctErr', err.message); }
    finally { btn.disabled = false; }
  }

  $('emailForm').addEventListener('submit', e => {
    e.preventDefault();
    const email = $('email').value.trim();
    if (email) sendCode(email);
  });

  $('otpForm').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('otp').value.replace(/\D/g, '');
    if (!code || !sentTo) return;
    show('acctErr', '');
    busy('Signing in…');
    try { signedIn((await Apps.account.codeVerify(sentTo, code)).user); }
    catch (err) { busy(''); show('acctErr', err.message); $('otp').select(); }
  });

  Apps.account.state().then(s => {
    // Sent here by a page, and already let in: straight back.
    if (paint(s.user) && next) leave(next);
  });
})();
</script>
</body>
</html>
