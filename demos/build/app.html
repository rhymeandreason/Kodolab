<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App</title>
<!-- Analytics. Absolute src because of the <base> below. This body is not
     .kodo, so site.js injects no foot here — the analytics half runs anyway. -->
<script defer src="/demos/lib/site.js"></script>
<base href="/demos/build/">
<link rel="stylesheet" href="../css/kodo.css">
<link rel="stylesheet" href="build.css">
</head>
<body class="work viewer bare">
<header class="bar">
  <a class="mark" href="/"><img src="/kodolab-wordmark.svg" alt="kodolab"></a>
  <span class="title" id="title"></span>
  <span class="tools">
    <a class="btn" id="edit" hidden>Edit</a>
    <button class="btn btn--tint" id="remix" type="button" hidden>Remix</button>
  </span>
</header>
<div class="notice" id="notice" hidden></div>
<main class="split">
  <section class="preview"><iframe id="frame" title="the app" sandbox="allow-scripts"></iframe></section>
</main>
<script src="apps-client.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const notice = (t, bad) => { const n = $('notice'); n.hidden = !t; n.textContent = t || ''; n.classList.toggle('bad', !!bad); };
  let app = null;
  (async () => {
    // The public page has no bar. `?preview=1` (from the builder's edit-link modal) shows it.
    if (new URLSearchParams(location.search).get('preview')) document.body.classList.remove('bare');
    if (!Apps.ID) return notice('No app named. A link looks like /app/<id>.', true);
    try {
      const r = await Apps.api(`../../api/app?id=${Apps.ID}`);
      app = r;
      document.title = r.title || 'App';
      $('title').textContent = r.title || '';
      Apps.mount($('frame'), r.html);
      const token = Apps.tokenFor(r.id);
      if (token) { $('edit').hidden = false; $('edit').href = Apps.link('edit', r.id); }
      $('remix').hidden = false;
    } catch (err) { notice(err.message, true); }
  })();
  $('remix').addEventListener('click', async () => {
    try {
      const r = await Apps.api('../../api/app', { method: 'POST', body: { action: 'remix', id: app.id, visitorId: Apps.VISITOR } });
      Apps.remember(r.id, r.token, app.title);
      location.href = Apps.link('edit', r.id);
    } catch (err) { if (err.status === 401) Apps.beta(err); else notice(err.message, true); }
  });
})();
</script>
</body>
</html>
