<!-- ===================================================================
     THE CHART DRIVES THE STAGE. respiration/chart.html's flowchart sits in
     the shell's panel, made wide enough to read, and the panel's scroll is
     the only input: where the reader is on the chart says which scale is
     behind the glass. Cytoplasm is the animal cell; the split to two
     pyruvate flies to a mitochondrion; the mitochondrion zone swaps to the
     organelle; the carriers swap to the proton circuit with the whole cell
     stacked above it; the chain box zooms to the inner membrane.

     The chart is copied, not linked: it carries ids on the elements the
     scroll reads (#k-split #z-mito #k-carriers #k-etc), which chart.html
     does not need. A change to the chart's content is made twice for now.
     =================================================================== -->
<style>
  :root {
    --c-atp: var(--energy-atp);
    --c-o2:  var(--accent-cold);
    --c-co2: var(--text-dim);
    --c-nad: var(--energy-nad);
  }
  /* The panel is the right half of the window, a page beside the scene rather
     than glass over it: the chart wants a reading width, and the membrane
     stack wants a frame nothing covers. The stage is the left half, so the
     mounts centre in it with no offset. */
  .lshell .lshell-panel {
    left: auto; right: 0; top: 0; bottom: 0; width: 50vw; max-width: none;
    border-radius: 0; border: 0; border-left: 1px solid var(--border-hair);
    background: var(--surface-page); backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none;
  }
  .lshell .lshell-topbar { display: none; }
  .lshell .lshell-scroll { padding: 48px 40px 40vh; }
  .lshell-panel .eyebrow, .lshell-panel .title { text-align: center; }
  .lshell .lshell-stage { left: 0; right: 50vw; }
  .lshell-panel .body { font-family: var(--font-ui); }
  .lshell-panel .title { font-size: 26px; line-height: 1.1; letter-spacing: -.02em; }

  /* Scenes cross-fade. The shell hides a scene with `visibility`, which
     cuts; here a scene that is off keeps its last frame and fades, so the
     cell dissolves into the organelle rather than blinking. */
  .lshell .lshell-scene { transition: opacity 1.4s ease; opacity: 1; }
  .lshell .lshell-scene.is-off { visibility: visible; opacity: 0; pointer-events: none; }

  .lshell .lshell-panel .legend { display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: center; gap: var(--space-2) var(--space-5); margin: 0 0 var(--space-4); }
  .legend span { display: inline-flex; align-items: center; gap: var(--space-2) }
  .swatch { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--k) 45%, transparent), transparent 70%) }
  .sw-o2  { --k: var(--c-o2) }
  .sw-nad { --k: var(--c-nad) }
  .sw-co2 { --k: var(--c-co2) }

  figure { margin: 0 }
  svg.chart { display: block; width: 100%; height: auto; color: var(--text-strong) }
  .chart text { font-family: var(--font-ui); font-size: 12px; fill: var(--text-body) }
  .chart .ttl, .chart .tiny, .chart .zone-l {
    font-family: var(--font-display); font-weight: var(--cap-weight);
    letter-spacing: var(--cap-track); text-transform: uppercase;
  }
  .chart .ttl    { font-size: 15px; letter-spacing: .04em; fill: var(--text-strong) }
  .chart .tiny   { font-size: 12px; letter-spacing: .1em; fill: var(--text-muted) }
  .chart .zone-l { font-size: 18px; fill: var(--text-dim) }
  .chart .big    { font-family: var(--font-display); font-weight: 500; font-size: 36px; letter-spacing: -.02em }
  .chart .sub    { font-size: 15px; fill: var(--text-dim) }
  .chart .box  { fill: var(--surface-card); stroke: var(--border-hair); stroke-width: 1; filter: url(#lift) }
  .chart .rule { stroke: var(--border-hair); stroke-width: 1 }
  .chart .sub .n { fill: var(--text-strong); font-weight: 600; font-variant-numeric: tabular-nums }
  .chart .zone { fill: var(--surface-stage); stroke: var(--border-hair); stroke-width: 1 }
  .chart .flow { stroke: var(--text-strong); stroke-width: 1.5; fill: none }
  .chart .o2-l  { stroke: var(--text-strong); stroke-width: 1.5; fill: none }
  .chart .o2-t  { fill: var(--text-strong) }
  .chart .co2-l { stroke: var(--c-co2); stroke-width: 1.25; fill: none }
  .chart .co2-t { fill: var(--c-co2) }
  .chart .atp-t { fill: var(--c-atp); font-weight: 600 }
  .chart .atp-box { fill: var(--surface-card); stroke: var(--c-atp); stroke-width: 1.25; filter: url(#lift) }
  /* The zone the reader is in is lit: the one cue that the scene changed because of the scroll. */
  .chart .zone { transition: stroke .5s, fill .5s }
  .chart .zone.is-here { stroke: var(--accent) }
  /* Drawn in by stage: a button reveals one, top to bottom, each element on
     its own delay. Layout never changes, so the scroll marks hold. */
  .chart .s1, .chart .s2, .chart .s3 { opacity: 0; transition: opacity .5s ease }
  .chart .is-in { opacity: 1 }

  /* The step button sits in the chart's flow, where the next stage will
     draw: under the heading first, then in the blank the stage will fill. */
  figure { position: relative }
  .step { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; transition: opacity .5s }
  .etc-btns [hidden] { display: none }
  .etc-done { margin: 0; padding: var(--space-3) var(--space-6); border-radius: 999px; background: var(--surface-card); font-family: var(--font-display); font-size: var(--text-lg); color: var(--text-strong); }
  .etc-note { max-width: 46ch; margin: 0; font-size: var(--text-base); color: var(--text-muted); }
  .etc { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); margin-top: var(--space-6); text-align: center; }
  .etc[hidden] { display: none; }
  .reset-chain { position: absolute; right: var(--space-5); bottom: var(--space-5); z-index: 2; }
  .reset-view { position: absolute; bottom: var(--space-5); z-index: 2; }
  .etc-btns { display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }
  .tally { display: flex; gap: var(--space-5); font-family: var(--font-ui); color: var(--text-muted); }
  .tally b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 500; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .step-mol { width: min(440px, 80%); height: auto; }
  .lshell .lshell-panel .legend { opacity: 0; transition: opacity .5s ease; }
  .lshell .lshell-panel .legend.is-in { opacity: 1; }
  :root .step .step-mol-cap { margin-top: -16px; font-size: 16px; color: var(--text-strong); }
  .step-mol-cap[hidden] { display: none; }
  .step-mol-cap:not([hidden]) + .cta { margin-top: var(--space-6); }
  .step.is-done { opacity: 0; pointer-events: none }

  /* Side doors off the scene, opened by a badge. kit/modal.js needs only [hidden]. */
  .modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal[hidden] { display: none; }
  .modal .mback { position: absolute; inset: 0; background: rgba(20, 22, 26, .45); }
  .modal .mcard { position: relative; width: fit-content; max-width: 100%; padding: 22px; }
  .modal .mclose { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--text-muted); }
  /* kodo.css draws the sheet; these two only fit it to this page. */
  :root .modal:not(.modal-lesson) .mcard { padding: 28px; }
  /* The framed lesson owns its whole card, top bar included, so the close sits off the corner. */
  .modal-lesson { padding: 40px; }
  .modal-lesson .mcard { width: min(1400px, 100%); height: min(900px, 100%); padding: 0; overflow: visible; }
  .modal-lesson .lesson-frame { border-radius: inherit; overflow: hidden; }
  :root .modal.modal-lesson .mclose { top: -16px; right: -16px; }
  .lesson-frame, .lesson-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* On the chart the badge rides its card's stage: in when the card is. */
  figure .badge { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  figure .badge.is-in { opacity: 1; pointer-events: auto; }
  .synth { display: grid; grid-template-columns: min(760px, 80vh) minmax(0, 300px); gap: var(--space-6); align-items: center; }
  .synth-stage { position: relative; aspect-ratio: 1; background: var(--surface-stage); border-radius: 14px; overflow: hidden; }
  :root .modal .synth-text h2 { font-size: 34px; }
  .molctl { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-5); }
  #molhi[aria-pressed="true"] { background: var(--accent); color: var(--surface-page); border-color: var(--accent); }
  :root .modal .synth-text .msrc { font-size: 14px; color: var(--text-muted); margin-top: var(--space-4); }
  :root .modal .synth-text .msub { font-size: 20px; line-height: 1.45; margin: var(--space-3) 0 0; }
</style>
<link rel="stylesheet" href="kit/badge.css">
<style>
  /* The quiz door, at the panel's foot, shown once the chain is done. */
  .quiz-open[hidden] { display: none; }
  .panel-foot { position: absolute; right: 24px; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 10px; }
  #classslot:empty { display: none; }

  /* The quiz: one question at a time, then the survey, then the score. */
  /* One size for every step, so the card never jumps: the foot is pinned and
     the body scrolls if a question ever outgrows it. */
  .modal .mcard.quiz { --right: var(--accent); --wrong: var(--ember-500);
    width: min(580px, 90vw); height: min(560px, 88vh); box-sizing: border-box; display: flex; flex-direction: column; }
  .quiz .mkick { margin: 0; }
  .quiz h2 { margin: var(--space-2) 0 var(--space-4); font-size: 24px; line-height: 1.25; min-height: 2.5em; }
  #quizbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #quizbody > .main { flex: 1; min-height: 0; overflow-y: auto; }
  .quiz .choices { display: flex; flex-direction: column; gap: var(--space-2); margin: 0 0 var(--space-4); }
  .quiz .choices button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 14px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-page); color: var(--text-strong); font: inherit; cursor: pointer; opacity: 1; }
  .quiz .choices button:hover:not([disabled]) { border-color: var(--accent); }
  .quiz .choices button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .quiz .choices button[disabled] { cursor: default; }
  .quiz .choices .txt { flex: 1; }
  .quiz .choices .tag { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .quiz .choices.answered button { opacity: .45; }
  .quiz .choices button.ok  { opacity: 1; border-color: var(--right); box-shadow: inset 0 0 0 1px var(--right); background: color-mix(in srgb, var(--right) 12%, var(--surface-page)); }
  .quiz .choices button.ok .tag { color: var(--right); }
  .quiz .choices button.bad { opacity: 1; border-color: var(--wrong); box-shadow: inset 0 0 0 1px var(--wrong); background: color-mix(in srgb, var(--wrong) 10%, var(--surface-page)); }
  .quiz .choices button.bad .tag { color: var(--wrong); }
  .quiz .verdict { margin: 0 0 var(--space-4); padding: 10px 14px; border-left: 4px solid var(--vc); border-radius: 4px; background: color-mix(in srgb, var(--vc) 8%, transparent); font-size: 15px; line-height: 1.45; color: var(--text-strong); }
  .quiz .verdict[hidden] { display: none; }
  .quiz .verdict.right { --vc: var(--right); }
  .quiz .verdict.wrong { --vc: var(--wrong); }
  .quiz .verdict b { color: var(--vc); margin-right: 4px; }
  .quiz .dots { display: flex; gap: 6px; }
  .quiz .dots i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--text-muted) 25%, transparent); }
  .quiz .dots i.now { box-shadow: 0 0 0 2px var(--text-muted); background: var(--surface-page); }
  .quiz .dots i.right { background: var(--right); }
  .quiz .dots i.wrong { background: var(--wrong); }
  .quiz .donebox { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .quiz .donebox .why { font-size: 18px; color: var(--text-strong); }
  .quiz .thanks .lead { display: flex; align-items: center; gap: var(--space-3); margin: 0 0 var(--space-4); font-size: 18px; line-height: 1.4; color: var(--text-strong); }
  .quiz .thanks .tick { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--text-inverse); font-size: 18px; font-weight: 700; }
  .quiz .thanks .lead .score { flex: none; font-size: 44px; line-height: 1; }
  .quiz .thanks .lead .score small { font-size: 24px; color: var(--text-muted); }
  .quiz .thanks .lead p:not(.score) { margin: 0; }
  .quiz .review { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border-hair); }
  .quiz .review li { display: flex; gap: var(--space-3); padding: 7px 0; border-bottom: 1px solid var(--border-hair); }
  .quiz .review .mk { flex: none; display: grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; background: var(--text-muted); color: var(--text-inverse); font-size: 12px; font-weight: 700; }
  .quiz .review li.right .mk { background: var(--right); }
  .quiz .review li.wrong .mk { background: var(--wrong); }
  .quiz .review .qq { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.35; }
  .quiz .review .ans { margin: 1px 0 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .quiz .review .mine { color: var(--text-strong); }
  .quiz .review s.mine { font-weight: 400; color: var(--text-muted); text-decoration-color: var(--wrong); text-decoration-thickness: 2px; }
  .quiz .review .fix { color: var(--right); }
  .quiz .recap { margin: 0; border-top: 1px solid var(--border-hair); }
  .quiz .recap div { display: flex; align-items: baseline; gap: var(--space-4); padding: 9px 0; border-bottom: 1px solid var(--border-hair); }
  .quiz .recap dt { flex: 1; color: var(--text-muted); font-size: 15px; line-height: 1.35; }
  .quiz .recap dd { margin: 0; font-weight: 600; color: var(--text-strong); text-align: right; }
  .quiz .recap dd.long { flex: 1; font-weight: 400; font-style: italic; text-align: right; overflow-wrap: anywhere; }
  .quiz .why { min-height: 3.2em; margin: 0 0 var(--space-4); color: var(--text-muted); font-size: 15px; line-height: 1.45; }
  .quiz .foot { display: flex; align-items: center; gap: var(--space-3); margin-top: auto; padding-top: var(--space-3); }
  .quiz .foot .n { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .quiz .foot .spacer { flex: 1; }
  .quiz textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-page); color: var(--text-strong); resize: vertical; }
  .quiz .scale { display: flex; gap: var(--space-2); margin: 0 0 var(--space-4); }
  .quiz .scale button { flex: 1; padding: 8px 0; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-page); color: var(--text-strong); font: inherit; cursor: pointer; }
  /* Picked = solid fill and inverse text, plus a check where it fits: a
     lightness change, readable without telling green from white. */
  .quiz .scale button[aria-pressed="true"],
  .quiz .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--text-inverse); font-weight: 600; }
  .quiz .seg button[aria-pressed="true"]::before { content: '✓ '; }
  .quiz .q { font-weight: 600; color: var(--text-strong); margin: 0 0 var(--space-2); }
  .quiz .scale + .q { margin-top: var(--space-5); }
  .quiz .yn { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-hair); }
  .quiz .yn:last-child { border-bottom: 0; }
  .quiz .yn p { flex: 1; margin: 0; color: var(--text-strong); line-height: 1.35; }
  .quiz .seg { display: flex; gap: var(--space-2); }
  .quiz .seg button { width: 72px; padding: 7px 0; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-page); color: var(--text-strong); font: inherit; cursor: pointer; }
  .quiz .seg button:hover { border-color: var(--accent); }
  .quiz .score { font-family: var(--font-display); font-size: 44px; font-weight: 500; color: var(--text-strong); margin: 0; }
</style>
<!-- kodo.css is linked at the head's end, not left to kit/app.js: the wordmark sits above that
     script in the body and would draw at its natural size first. -->

<body>
<nav class="sitenav floating chrome-title">
  <a class="mark" href="/"><img src="/kodolab-wordmark.svg" alt="kodolab"></a>
</nav>

<div id="synthmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="synthtitle">
    <button class="mclose" aria-label="Close">&times;</button>
    <div class="synth">
      <div class="synth-stage" id="synthstage"></div>
      <div class="synth-text">
        <p class="mkick">The real protein</p>
        <h2 id="synthtitle">ATP synthase</h2>
        <p class="msub">Protons flowing back into the matrix turn the rotor. Each full turn makes 3 ATP in the head. The real enzyme spins over a hundred times a second</p>
      </div>
    </div>
  </div>
</div>

<div id="molmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="moltitle">
    <button class="mclose" aria-label="Close">&times;</button>
    <div class="synth">
      <div class="synth-stage" id="molstage"></div>
      <div class="synth-text">
        <p class="mkick">The molecule</p>
        <h2 id="moltitle"></h2>
        <p class="msub" id="molsub"></p>
        <div class="molctl">
          <div class="segmented segmented--sm" role="group" aria-label="View" id="molview">
            <button type="button" data-view="idealized" aria-pressed="true">Idealized</button>
            <button type="button" data-view="measured" aria-pressed="false">Measured</button>
          </div>
          <button type="button" class="cta cta--ghost cta--sm" id="molhi" aria-pressed="false">Highlight phosphates</button>
        </div>
        <p class="msrc" id="molsrc"></p>
      </div>
    </div>
  </div>
</div>

<div id="quizmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard quiz" role="dialog" aria-modal="true" aria-labelledby="quiztitle">
    <button class="mclose" aria-label="Close">&times;</button>
    <p class="mkick" id="quizkick">Quick check</p>
    <h2 id="quiztitle"></h2>
    <div id="quizbody"></div>
  </div>
</div>

<div id="lessonmodal" class="modal modal-lesson" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-label="Lesson">
    <button class="mclose" aria-label="Close">&times;</button>
    <div class="lesson-frame" id="lessonframe"></div>
  </div>
</div>

<template id="chart">
<div class="legend cap-sm">
  <span><i class="swatch sw-o2"></i> oxygen</span>
  <span><i class="swatch sw-nad"></i> carriers</span>
  <span><i class="swatch sw-co2"></i> carbon leaving</span>
</div>
<figure>
<svg class="chart" viewBox="-40 0 660 1548" role="img" aria-label="A tall vertical flowchart: glucose is split by glycolysis in the cytoplasm into two pyruvate molecules; each pyruvate runs its own lane through the link reaction and the Krebs cycle inside the mitochondrion, releasing carbon dioxide; both lanes hand their electron carriers to one electron transport chain, which makes about 26 ATP; oxygen feeds into the left of that chain as the final electron acceptor and leaves out the right side as water. The total is about 30 ATP per glucose.">
      <defs>
        <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
        </marker>
        <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--c-co2)"></path>
        </marker>
        <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
        </marker>
        <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--c-atp)"></path>
        </marker>
        <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2b2723" flood-opacity=".12"></feDropShadow>
        </filter>
        <radialGradient id="o2-glow">
          <stop offset="0" style="stop-color: var(--c-o2); stop-opacity: .3"></stop>
          <stop offset="1" style="stop-color: var(--c-o2); stop-opacity: 0"></stop>
        </radialGradient>
        <radialGradient id="atp-glow">
          <stop offset="0" style="stop-color: var(--c-atp); stop-opacity: .16"></stop>
          <stop offset="1" style="stop-color: var(--c-atp); stop-opacity: 0"></stop>
        </radialGradient>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kit/app.js" data-shell="steps" data-use="AnimalCell,Mitochondrion,ElectronTransport,Proteinbox,Molecule" data-mol="atp,atpSkel"></script>
<script src="proteins/atp-synthase/atp-synthase-scene.js"></script>

<script src="kit/badge.js"></script>
<script>
(function () {
  'use strict';
  const shell = LessonShell.create({
    hint: 'Drag to orbit',
    chrome: 'none',
    steps: [{
      eyebrow: 'Cellular respiration',
      title: 'How a cell turns sugar into usable energy',
      body: document.getElementById('chart').innerHTML,
    }],
  });

  const centred = () => ({ x: 0, y: 0 });
  const cell  = shell.scene('cell',  el => AnimalCell.mount(el, { motion: 1, flows: { glucose: 1, o2: 1, co2: 1 }, detail: 'auto', clickToFly: false, viewOffset: centred }));
  const mito  = shell.scene('mito',  el => Mitochondrion.mount(el, { flow: 0.6, cam: { theta: 2.6, phi: 0.7, r: 46 }, viewOffset: centred }));
  const PROTONS = { inside: { H: 50 }, outside: { H: 50 } };
  /* The real enzyme, mounted per open and destroyed on close: a second WebGL box left running behind the lesson costs every frame. */
  let synth = null;
  const synthModal = Modal.create({ el: 'synthmodal',
    onShow: () => { synth = ATPSynthase.mount(document.getElementById('synthstage'), { context: 'mitochondrion' }); },
    onHide: () => { if (synth) synth.destroy(); synth = null; } });
  /* Another lesson, framed per open and dropped on close: a second WebGL
     page left running behind this one costs every frame. show({ src, title }). */
  const frame = document.getElementById('lessonframe');
  const lessonModal = Modal.create({ el: 'lessonmodal',
    onShow: l => {
      frame.innerHTML = '';
      const f = document.createElement('iframe');
      f.src = l.src; f.title = l.title;
      frame.appendChild(f);
      frame.closest('.mcard').setAttribute('aria-label', l.title);
      SCENES[onStage].stop();
    },
    onHide: () => { frame.innerHTML = ''; SCENES[onStage].start(); } });
  /* One molecule per open: show({ views: { idealized, measured }, say }). The
     idealized skel build is held still; the deposited record turns. The name and where the coordinates came from are the
     component's, never typed here. */
  let mol = null, molOpen = null, molView = 'idealized', molHi = false;
  /* The phosphates, read off the spec's bonds: every P, the O on it, the H on those O. */
  function phosphateAtoms(key) {
    const sp = MolLib.MOLECULES[key], nb = sp.atoms.map(() => []);
    for (const [a, b] of sp.bonds) { nb[a].push(b); nb[b].push(a); }
    const out = new Set();
    sp.atoms.forEach((at, i) => {
      if (at.el !== 'P') return;
      out.add(i);
      for (const o of nb[i]) if (sp.atoms[o].el === 'O') {
        out.add(o);
        for (const h of nb[o]) if (sp.atoms[h].el === 'H') out.add(h);
      }
    });
    return [...out];
  }
  function molDraw() {
    const key = molOpen.views[molView];
    const opts = { molecule: key, spin: molView === 'measured', highlight: molHi ? phosphateAtoms(key) : null };
    if (!mol) mol = Molecule.mount(document.getElementById('molstage'), opts);
    else mol.set(opts);
    const st = mol.state();
    document.getElementById('moltitle').textContent = st.name;
    document.getElementById('molsrc').textContent = st.source;
    for (const b of document.querySelectorAll('#molview button')) b.setAttribute('aria-pressed', b.dataset.view === molView);
    document.getElementById('molhi').setAttribute('aria-pressed', molHi);
  }
  document.getElementById('molview').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (b) { molView = b.dataset.view; molDraw(); }
  });
  document.getElementById('molhi').addEventListener('click', () => { molHi = !molHi; molDraw(); });
  const molModal = Modal.create({ el: 'molmodal',
    onShow: m => {
      molOpen = m; molView = 'idealized'; molHi = false;
      document.getElementById('molsub').textContent = m.say;
      molDraw();
    },
    onHide: () => { if (mol) mol.destroy(); mol = null; } });
  const chemi = shell.scene('chemi', el => withBadge(el, ElectronTransport.mount(el, {
    fuel: 'NADH', span: 'cell', names: 'intro', o2Stock: 6, viewOffset: centred,
    /* Only what the chain moves: protons, carriers, O₂, ATP. The cytosol's ions and all the water are scenery here. */
    cellContents: { inside: {}, outside: {} },
    /* Denser than the default 30 a side, so complex I loads from protons already in frame. Equal on both sides, so the gradient still starts at zero. */
    contents: PROTONS,
  }).show('water', false)));
  {
    const b = document.createElement('button');
    b.className = 'btn reset-view'; b.type = 'button'; b.textContent = 'Reset view';
    b.addEventListener('click', () => PHASES.etc(true));
    chemi.box.canvas.parentElement.appendChild(b);
    const r = document.createElement('button');
    r.className = 'btn reset-chain'; r.type = 'button'; r.textContent = 'Reset';
    r.addEventListener('click', () => resetChain());
    chemi.box.canvas.parentElement.appendChild(r);
    /* Clear of the panel, wherever the shell has put the scene's box: only a
       panel that covers the box's left edge pushes the button in. */
    const place = () => {
      const host = b.parentElement.getBoundingClientRect(), panel = shell.el.querySelector('.lshell-panel').getBoundingClientRect();
      const over = panel.left <= host.left ? Math.max(0, panel.right - host.left) : 0;
      b.style.left = over + 20 + 'px';
    };
    place(); window.addEventListener('resize', place);
  }
  function withBadge(el, c) {
    const b = Badge.create({ host: el, camera: c.box.camera, canvas: c.box.canvas, at: () => c.at('synthase'),
      icon: 'more', label: 'See the real ATP synthase', offset: [34, 0], onClick: () => synthModal.show() });
    c.on('frame', b.update);
    return c;
  }
  shell.goTo(0);

  const scroller = shell.el.querySelector('.lshell-scroll');
  const chart = scroller.querySelector('svg.chart');
  const topOf = sel => {
    const n = typeof sel === 'string' ? chart.querySelector(sel) : sel;
    return n.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
  };

  /* ---- the chart fills in by stage ----
     Every drawn element is sorted into three stages by where it sits against
     two of the chart's own marks: above the mitochondrion zone is the
     cytoplasm's, above the chain box is the organelle's, the rest is the
     chain's. An arrow belongs to where it points, so a line is placed by its
     end and everything else by its top. Nothing in the SVG is tagged by hand. */
  {
    const mitoTop = chart.querySelector('#z-mito').getBoundingClientRect().top;
    const etcTop = chart.querySelector('#k-etc').getBoundingClientRect().top;
    for (const el of chart.querySelectorAll('rect, text, image, line, path, ellipse')) {
      if (el.closest('defs')) continue;
      const r = el.getBoundingClientRect();
      const y = (el.tagName === 'line' || el.tagName === 'path') ? r.bottom - 2 : r.top;
      el.classList.add(y < mitoTop ? 's1' : y < etcTop ? 's2' : 's3');
    }
  }
  function reveal(stage) {
    const els = [...chart.querySelectorAll('.s' + stage)]
      .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
    els.forEach((el, i) => { el.style.transitionDelay = (i * 30) + 'ms'; el.classList.add('is-in'); });
    /* The first stage is short, so the panel rolls down until the slot
       where the next button will sit is on screen at the bottom. */
    const next = [...chart.querySelectorAll('.s2')].reduce((a, b) => (topOf(b) < topOf(a) ? b : a));
    const top = stage === 1 ? topOf(next) + 120 - scroller.clientHeight : topOf(els[0]) - 72;
    scroller.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    cta.classList.add('is-done');
  }

  /* ElectronTransport's box orbits the origin, and with span:'cell' the inner
     membrane sits below it (the stack's INNER_Y). flyTo moves theta/phi/r
     only, so the target's y is tweened here, alongside. */
  let targetRaf = 0;
  function aimAt(box, y, dur = 1.1, x = 0) {
    cancelAnimationFrame(targetRaf);
    const t0 = performance.now(), y0 = box.cam.target.y, x0 = box.cam.target.x;
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    (function tick(now) {
      const k = Math.min(1, (now - t0) / (dur * 1000));
      box.cam.target.y = y0 + (y - y0) * ease(k);
      box.cam.target.x = x0 + (x - x0) * ease(k);
      box.applyCam();
      if (k < 1) targetRaf = requestAnimationFrame(tick);
    })(t0);
  }
  const INNER_Y = -85;
  /* Closer and more from above than the organelle's home, so the cut face
     and the folds fill the frame. */
  const MITO_VIEW = { theta: 2.6, phi: 0.7, r: 24 };
  const CRISTA_VIEW = { theta: 2.6, phi: 1.15, r: 8 };
  /* A mitochondrion in its neighbourhood: the cell's own click-flight lands
     2.6 radii out and centred, which is a portrait; this stops at four and
     looks past it, so it sits up and to the left with cytoplasm and the
     next organelles around it. */
  function frameMito() {
    /* The mitochondrion nearest the middle of the floor, so the flight stays
       inside the bowl: one against the wall puts the camera through it. */
    const mitos = cell.sim.organelles.filter(o => o.userData.organelle === 'mitochondrion' && o.parent);
    if (!mitos.length) return cell.lookAt('mitochondrion');
    const org = mitos.reduce((m, o) => (o.position.x ** 2 + o.position.z ** 2 < m.position.x ** 2 + m.position.z ** 2 ? o : m));
    if (cell.state().detail === 'auto') cell.sim.mitoDetail(org, true);
    const b = cell.sim.bounds(org);
    /* Looking steeply down, as the home view does, with the target moved
       right and toward the camera so the organelle sits up and to the left. */
    const dir = new THREE.Vector3(0.1, 0.85, 0.5).normalize();
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize();
    const toward = new THREE.Vector3(dir.x, 0, dir.z).normalize();
    const target = b.center.clone().addScaledVector(right, b.radius * 0.9).addScaledVector(toward, b.radius * 0.7);
    cell.flyTo(target.clone().addScaledVector(dir, b.radius * 3.6).toArray(), target.toArray(), 1.8);
  }


  /* The shell stops a scene the moment it is hidden, so it would fade out
     as a still. Keep the outgoing one running for the length of the fade. */
  const SCENES = { cell, mito, chemi };
  let onStage = 'cell';
  function show(name) {
    if (name === onStage) return;
    const prev = SCENES[onStage];
    onStage = name;
    shell.showScene(name);
    shell.el.querySelector('.lshell-hint').hidden = name === 'chemi';
    prev.start();
    setTimeout(() => { if (onStage !== name) return; prev.stop(); }, 1500);
  }
  const PHASES = {
    cell()  { show('cell');  cell.home(); },
    fly()   { show('cell');  frameMito(); },
    mito()  { show('mito');  mito.box.flyTo(MITO_VIEW); },
    chemi() {
      show('chemi');
      aimAt(chemi.box, 0); chemi.box.flyTo({ r: 412, phi: Math.PI / 2 - 0.09 });
    },
    etc(snap) {
      show('chemi');
      if (snap) {
        cancelAnimationFrame(targetRaf);
        Object.assign(chemi.box.cam, { r: 460, phi: Math.PI / 2 - 0.12 });
        chemi.box.cam.target.y = INNER_Y - 8; chemi.box.cam.target.x = -50;
        chemi.box.applyCam();
        return;
      }
      aimAt(chemi.box, INNER_Y - 8, 1.1, -50); chemi.box.flyTo({ r: 460, phi: Math.PI / 2 - 0.12 });
    },
  };
  const ZONE = { cell: '#z-cyto', fly: '#z-cyto', mito: '#z-mito', chemi: '#z-mito', etc: '#z-mito' };
  /* The phases in scroll order. The index is what the class log and the tutor
     get as the step (api/_targets.js's `at`), so progress compares across sessions. */
  const ORDER = ['cell', 'fly', 'mito', 'chemi', 'etc'];
  const SAID  = { cell: 'glycolysis in the cytoplasm', fly: 'pyruvate flying to a mitochondrion', mito: 'the link step and Krebs cycle inside the mitochondrion',
                  chemi: 'the carriers arriving at the inner membrane', etc: 'the electron transport chain, driven by hand' };
  /* The same phases said for a teacher, which is what the class dashboard
     prints. SAID is for the tutor and reads mid-sentence; these are headings. */
  const NAMED = { cell: 'Glycolysis', fly: 'Into the mitochondrion', mito: 'Link step & Krebs',
                  chemi: 'Carriers', etc: 'Electron transport' };
  let phase = null;
  function go(p, snap) {
    if (p === phase) return;
    phase = p;
    PHASES[p](snap);
    for (const z of chart.querySelectorAll('.zone')) z.classList.toggle('is-here', z.matches(ZONE[p]));
    if (window.Track) Track.step(ORDER.indexOf(p), ORDER.length, NAMED[p]);
  }

  /* ---- three buttons, then the scroll ----
     Each step is a flight and a fill: the scene moves first, the chart's next
     stage draws in behind it, and the panel scrolls to it. The last one hands
     over to the scroll, which reads the same marks the buttons did. */
  const cta = document.createElement('div');
  cta.className = 'step';
  cta.innerHTML = '<img class="step-mol" src="media/molecules/glucose.webp" alt="A glucose molecule"><span class="step-mol-cap cap-lg">1 glucose</span><button class="cta" type="button"></button>';
  const figure = chart.parentElement;

  /* See-more badges on chart cards, each opening that step's lesson (or `open`). A card
     with a lane of CO₂ beside it takes the badge on its corner, not its edge. */
  function chartBadge(sel, where, lesson) {
    const card = chart.querySelector(sel);
    const b = Badge.button({ icon: 'more', label: 'Open ' + lesson.title, onClick: lesson.open || (() => lessonModal.show(lesson)) });
    figure.appendChild(b);
    const place = () => {
      const r = card.getBoundingClientRect(), f = figure.getBoundingClientRect();
      b.style.left = (r.right - f.left + (where === 'edge' ? 24 : 8)) + 'px';
      b.style.top = (r.top - f.top + (where === 'edge' ? r.height / 2 : -8)) + 'px';
      b.classList.toggle('is-in', card.classList.contains('is-in'));
    };
    place();
    window.addEventListener('resize', place);
    new MutationObserver(place).observe(card, { attributes: true, attributeFilter: ['class'] });
  }
  chartBadge('#k-glyco', 'edge', { src: 'glycolysis-lab.html?view=inset', title: 'glycolysis' });
  chartBadge('#k-link', 'corner', { src: 'link-step.html?enzyme=off', title: 'link step' });
  chartBadge('#k-atp', 'corner', { title: 'ATP', open: () => molModal.show({ views: { idealized: 'atpSkel', measured: 'atp' },
    say: 'The cell spends it by breaking off the last phosphate, and makes it again the other way.' }) });
  chartBadge('#k-krebs', 'corner', { src: 'krebs-lab.html?view=cycle&view=inset', title: 'Krebs cycle' });
  figure.appendChild(cta);
  /* Where the next stage starts, in the figure's own coordinates. */
  const placeCta = () => {
    if (step >= STEPS.length) return;
    const first = [...chart.querySelectorAll('.s' + (step + 1))]
      .reduce((a, b) => (b.getBoundingClientRect().top < a.getBoundingClientRect().top ? b : a));
    cta.style.top = Math.round(first.getBoundingClientRect().top - figure.getBoundingClientRect().top + (step ? 10 : 0)) + 'px';
  };
  /* The chart is laid out whole but drawn in by stage, so until the last step
     the figure ends just under the next button: nothing to scroll to below it.
     Set on click, before the stage's scroll, so the scroll is not cut short.
     The shell's tall bottom padding, there so the last section can reach the
     top, shrinks to what reveal()'s scroll for the stage just drawn needs. */
  const clampFigure = () => {
    if (step >= STEPS.length) { figure.style.height = figure.style.overflowY = scroller.style.paddingBottom = ''; return; }
    scroller.style.paddingBottom = '0px';
    const first = [...chart.querySelectorAll('.s' + (step + 1))].reduce((a, b) => Math.min(a, b.getBoundingClientRect().top), Infinity);
    const top = first - chart.getBoundingClientRect().top;
    figure.style.height = Math.round(top + (step ? 10 + btn.offsetHeight : cta.offsetHeight) + 48) + 'px';
    figure.style.overflowY = 'clip';
    if (step > 1) {
      const want = Math.min(...[...chart.querySelectorAll('.s' + step)].map(topOf)) - 72;
      const short = want + scroller.clientHeight - scroller.scrollHeight;
      if (short > 0) scroller.style.paddingBottom = Math.ceil(short) + 'px';
    }
  };
  window.addEventListener('resize', placeCta);
  window.addEventListener('resize', () => clampFigure());
  const btn = cta.querySelector('button');
  const STEPS = [
    { label: 'Enter the cell', hold: 2200, run() { go('fly'); reveal(1); } },
    /* The organelle arrives wide and closes in over three seconds. */
    { label: 'Enter the mitochondria', hold: 3600, run() {
      go('mito'); mito.box.flyTo(MITO_VIEW, 3.2); reveal(2);
    } },
    /* Into the cristae first, so the membrane the next scene is cut from is
       the one on screen when it fades in. */
    { label: 'Electron transport chain', hold: 2600, run() {
      mito.box.flyTo(CRISTA_VIEW, 1.8); reveal(3);
      /* Lands on the chain's framing, no flight. A clean slate for the count: the chain ran before, and its leftover gradient would add ATP no carrier paid for. */
      setTimeout(() => { go('etc', true); chemi.set({ fuel: null }); chemi.reset(); chemi.set({ contents: PROTONS }); }, 2000);
    } },
  ];
  let step = 0;
  const arm = () => {
    for (const n of cta.querySelectorAll('.step-mol, .step-mol-cap')) n.hidden = step > 0;
    if (step < STEPS.length) { btn.textContent = STEPS[step].label; placeCta(); cta.classList.remove('is-done'); return; }
    cta.classList.add('is-done');
    etcArm();
    phase = phaseNow();
    scroller.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
  };
  btn.addEventListener('click', () => {
    const s = STEPS[step++];
    clampFigure();
    scroller.querySelector('.legend').classList.add('is-in');
    btn.disabled = true;
    s.run();
    setTimeout(() => { btn.disabled = false; arm(); }, s.hold);
  });
  arm();
  clampFigure();
  if (document.fonts) document.fonts.ready.then(clampFigure);
  chart.querySelector('image').addEventListener('load', clampFigure);
  cta.querySelector('img').addEventListener('load', clampFigure);

  /* ---- the chain, driven by hand ----
     The supply is off when the chain arrives, so nothing moves until the
     student sends a carrier. A button comes back when the sim says the beat
     is over, read off state(), never on a timer that could drift from it. */
  const etc = document.createElement('div');
  etc.className = 'etc';
  etc.hidden = true;
  etc.innerHTML = '<div class="tally"><span><b data-k="NADH">0</b> NADH used</span><span><b data-k="FADH2">0</b> FADH₂ used</span><span><b data-k="ATP">0</b> ATP made</span></div>'
    + '<div class="etc-btns"><button class="cta" type="button" data-fuel="NADH"></button><button class="cta" type="button" data-fuel="FADH2"></button><p class="etc-done" hidden>Completed!</p></div>'
    + '<p class="etc-note">* The last two NADH are from glycolysis, made in the cytosol.</p>';
  figure.after(etc);

  /* One glucose's carriers into the chain, 2 from the link step and 6 from Krebs at complex I; then glycolysis's 2 NADH last, which reach ubiquinone by the glycerol-phosphate shuttle (feed's `shuttle`, a turn of II); 2 FADH₂ from Krebs. 8×10 + 4×6 = 104 H⁺, 26 ATP. The chart says the same. */
  const GLUCOSE = { NADH: 10, FADH2: 2 }, SHUTTLED = 2;
  const NAME = { NADH: 'NADH', FADH2: 'FADH₂' };
  const shuttleNext = () => sent.NADH >= GLUCOSE.NADH - SHUTTLED;
  const doorOf = f => f === 'FADH2' || shuttleNext() ? 'II' : 'I';

  /* Counted from when the controls appear. A complex's turns reset whenever
     the chain is reset, so the tally adds deltas and
     treats a drop as a fresh start. One turn of I is one NADH; a turn of II is
     a Krebs FADH₂ or a shuttled glycolysis NADH*, told apart only for display. */
  const tally = { I: 0, II: 0, ATP: 0 };
  let seen = null;
  let completed = false;   // reported once: the chain reset does not un-complete a lesson
  /* Carriers put on stage. Each click is one molecule the student sees rise
     out of the matrix; the component queues it at its complex, and refuses
     one when the queue is full, which is when the button goes grey. */
  const sent = { NADH: 0, FADH2: 0 };
  function count() {
    const st = chemi.state();
    const now = { I: st.complexes ? st.complexes.I.turns : null, II: st.complexes ? st.complexes.II.turns : null, ATP: st.atpMade };
    if (seen) for (const k in tally) {
      if (now[k] == null) continue;
      const was = seen[k] == null || now[k] < seen[k] ? now[k] : seen[k];
      tally[k] += now[k] - was;
    }
    seen = now;
    /* II's turns beyond the FADH₂ sent were shuttled NADH* */
    const star = Math.min(Math.max(0, sent.NADH - (GLUCOSE.NADH - SHUTTLED)), Math.max(0, tally.II - sent.FADH2));
    const shown = { NADH: tally.I + star, FADH2: tally.II - star, ATP: tally.ATP };
    for (const b of etc.querySelectorAll('.tally b')) if (b.textContent !== String(shown[b.dataset.k])) b.textContent = shown[b.dataset.k];
    buttons(st, shown);
  }
  /* A glucose's ATP, read off the chain: protons from the carriers, over what one ATP costs to make and export. */
  function glucoseATP(st) {
    const pf = st.protonsPerFuel, so = st.stoichiometry;
    if (!pf || !so) return null;
    const protons = (GLUCOSE.NADH - SHUTTLED) * pf.NADH + (SHUTTLED + GLUCOSE.FADH2) * pf.FADH2;
    return Math.floor(protons / (so.protonsPerATP + so.protonsPerExport));
  }
  function buttons(st = chemi.state(), shown) {
    const w = st.waiting || {};
    const goal = glucoseATP(st);
    const done = !!shown && goal != null && shown.ATP >= goal && sent.NADH >= GLUCOSE.NADH && sent.FADH2 >= GLUCOSE.FADH2;
    const doneEl = etc.querySelector('.etc-done');
    if (doneEl.hidden === done) doneEl.hidden = !done;
    if (done && !completed) {
      completed = true; quizBtn.hidden = fbBtn.hidden = false;
      try { localStorage.setItem(DONE_KEY, '1'); } catch (e) { /* the button lasts this load */ }
      if (window.Track) Track.event('complete');
    }
    const note = etc.querySelector('.etc-note');
    if (note.hidden !== done) note.hidden = done;
    for (const b of etc.querySelectorAll('button[data-fuel]')) {
      const f = b.dataset.fuel, left = GLUCOSE[f] - sent[f];
      /* Written only on change: Safari drops a click whose button was rewritten between press and release, and count() runs every 250 ms. */
      const star = f === 'NADH' && shuttleNext() ? '*' : '';
      const text = `Send ${NAME[f]}${star} (${left} left)`, off = left <= 0 || (w[doorOf(f)] || 0) >= w.max;
      if (b.textContent !== text) b.textContent = text;
      if (b.disabled !== off) b.disabled = off;
      if (b.hidden !== done) b.hidden = done;
    }
  }
  /* Back to one glucose's worth: an empty chain, no gradient, nothing sent. */
  function resetChain() {
    chemi.set({ fuel: null }); chemi.reset(); chemi.set({ contents: PROTONS });
    for (const k in tally) tally[k] = 0;
    for (const k in sent) sent[k] = 0;
    seen = null;
    count();
  }
  etc.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-fuel]');
    if (!b || b.disabled) return;
    const f = b.dataset.fuel;
    chemi.set({ fuel: null });
    if (!chemi.feed(f, { shuttle: f === 'NADH' && shuttleNext() })) return;
    sent[f]++;
    buttons();
  });
  function etcArm() {
    etc.hidden = false;
    chemi.clearNotes(); chemi.note('synthase', { offset: [-70, 84] });
    count();
    setInterval(count, 250);
    const top = etc.offsetTop + etc.offsetHeight + 40 - scroller.clientHeight;
    scroller.scrollTo({ top: Math.max(scroller.scrollTop, top), behavior: 'smooth' });
  }

  /* Once every stage is drawn, a line 40% down the panel says where the
     reader is, and the phase is the last mark that line has passed, so
     scrolling back up walks the same stops in reverse. */
  const MARKS = [['fly', '#k-split'], ['mito', '#z-mito'], ['chemi', '#k-carriers'], ['etc', '#k-etc']];
  function phaseNow() {
    /* While the buttons are on screen the scene stays framed on the chain they drive. */
    if (!etc.hidden && etc.getBoundingClientRect().top < scroller.getBoundingClientRect().bottom) return 'etc';
    const line = scroller.scrollTop + scroller.clientHeight * 0.4;
    let p = 'cell';
    for (const [name, sel] of MARKS) if (line >= topOf(sel)) p = name;
    return p;
  }
  function sync() { go(phaseNow()); }

  /* The two scenes the reader has not reached are built while the cell is
     on screen, so each swap is a fade and not a hitch. */
  shell.showScene('cell');
  setTimeout(() => { for (const n of ['mito', 'chemi']) if (n !== onStage) { SCENES[n].state(); SCENES[n].stop(); } }, 1500);

  /* ---- the quiz ----
     Five questions, one at a time, each answered before the next and told why,
     then the score. App feedback is its own door on the same modal. Both are
     reported to the class log as
     `quiz` and `survey` when there is one (lib/track.js), else it is just a
     quiz. Every answer here is a claim the chart makes; keep them in step. */
  const QUIZ = [
    { q: 'Where in the cell does glycolysis happen?',
      choices: ['In the cytoplasm', 'In the mitochondrial matrix', 'Across the inner mitochondrial membrane', 'In the nucleus'], a: 0,
      why: 'Glycolysis runs in the cytoplasm. Only its product, pyruvate, enters the mitochondrion.' },
    { q: 'The CO₂ you breathe out comes mostly from which stages?',
      choices: ['Glycolysis', 'The link step and the Krebs cycle', 'The electron transport chain', 'ATP synthase'], a: 1,
      why: 'Each pyruvate loses one carbon at the link step and two more in the Krebs cycle. The chain moves electrons and protons, not carbon.' },
    { q: 'What do NADH and FADH₂ carry to the electron transport chain?',
      choices: ['ATP', 'Oxygen', 'High-energy electrons', 'Carbon dioxide'], a: 2,
      why: 'They are electron carriers. Their electrons pass down the chain, and that flow is what pumps protons.' },
    { q: 'Where is most of the ATP from one glucose made?',
      choices: ['Glycolysis', 'The Krebs cycle', 'By ATP synthase, powered by the proton gradient', 'The link step'], a: 2,
      why: 'Glycolysis and Krebs make four ATP between them. The rest comes from protons flowing back through ATP synthase.' },
    { q: 'What is the final electron acceptor at the end of the chain?',
      choices: ['NAD⁺', 'Oxygen', 'Glucose', 'ATP'], a: 1,
      why: 'Oxygen takes the electrons and picks up protons to become water. Without it the chain backs up and stops.' },
  ];
  /* Pages of the survey; ids are what /teach and beta.html label. `again` was
     "Would you use a lesson like this to study?" and is retired, so older
     rows keep their meaning. */
  const SURVEY = [
    { title: 'How clear was this lesson?', items: [
      { id: 'clear', kind: 'scale', need: true, labels: ['1 confusing', '2', '3', '4', '5 very clear'] },
      { id: 'confusing', q: 'What was confusing, if anything?', kind: 'text' } ] },
    { title: 'A few yes-or-no questions', items: [
      { id: 'textbook', q: 'Is this helpful compared to a textbook diagram?', kind: 'yesno', need: true },
      { id: 'video', q: 'Is this helpful compared to a video?', kind: 'yesno', need: true },
      { id: 'useAgain', q: 'Would you want to use this app again?', kind: 'yesno', need: true },
      { id: 'share', q: 'Would you share this app with a friend who is learning Biology?', kind: 'yesno', need: true } ] },
  ];
  const quizBody = document.getElementById('quizbody');
  const quizTitle = document.getElementById('quiztitle');
  const quizKick = document.getElementById('quizkick');
  let quizModal = null;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /* What this browser has done, so the buttons and a reopened modal can say so. */
  const QUIZ_KEY = 'ss.respiration.quiz', FEEDBACK_KEY = 'ss.respiration.feedback';
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* lasts this load */ } };
  const nOf = (k, of) => `<span class="n">${k} of ${of}</span>`;
  const markDots = marks => `<span class="dots" aria-hidden="true">${marks.map(m => `<i class="${m === true ? 'right' : m === false ? 'wrong' : m === 'now' ? 'now' : ''}"></i>`).join('')}</span>`;
  function runQuiz(mode) {
    if (mode === 'feedback') return askSurvey(0, { ...(load(FEEDBACK_KEY) || {}) });
    const prev = load(QUIZ_KEY);
    if (prev) return result(prev);
    const answers = [];
    let i = 0;
    const foot = (n, label, on) => `<div class="foot">${n}<span class="spacer"></span><button class="cta cta--sm" type="button" data-next ${on ? '' : 'disabled'}>${label}</button></div>`;
    const dots = () => markDots(QUIZ.map((_, k) => answers[k] ? answers[k].correct : k === i ? 'now' : null));
    function ask() {
      const item = QUIZ[i];
      quizKick.textContent = 'Quick check';
      quizTitle.textContent = item.q;
      quizBody.innerHTML = `<div class="main"><div class="choices">${item.choices.map((c, k) => `<button type="button" data-k="${k}" aria-pressed="false"><span class="txt">${esc(c)}</span><span class="tag"></span></button>`).join('')}</div>`
        + `<p class="verdict" role="status" hidden></p></div>` + foot(dots() + nOf(i + 1, QUIZ.length), i + 1 < QUIZ.length ? 'Next' : 'See score', false);
      quizBody.querySelector('.choices').addEventListener('click', ev => {
        const b = ev.target.closest('button[data-k]'); if (!b || answers[i]) return;
        const k = Number(b.dataset.k), correct = k === item.a;
        answers[i] = { q: item.q, answer: item.choices[k], correct, k };
        quizBody.querySelector('.choices').classList.add('answered');
        for (const c of quizBody.querySelectorAll('.choices button')) {
          const right = Number(c.dataset.k) === item.a;
          c.disabled = true;
          c.classList.toggle('ok', right);
          c.classList.toggle('bad', c === b && !correct);
          c.querySelector('.tag').textContent = right ? (c === b ? '✓ Your answer' : '✓ Correct answer') : c === b ? '✗ Your answer' : '';
        }
        const v = quizBody.querySelector('.verdict');
        v.className = 'verdict ' + (correct ? 'right' : 'wrong');
        v.innerHTML = `<b>${correct ? 'Correct.' : 'Not quite.'}</b>${esc(item.why)}`;
        v.hidden = false;
        quizBody.querySelector('.dots').outerHTML = dots();
        quizBody.querySelector('[data-next]').disabled = false;
      });
      quizBody.querySelector('[data-next]').addEventListener('click', () => {
        i++;
        if (i < QUIZ.length) return ask();
        const score = answers.filter(a => a.correct).length;
        if (window.Track) Track.event('quiz', { score, total: QUIZ.length, answers });
        const r = { score, total: QUIZ.length, marks: answers.map(a => a.correct), picks: answers.map(a => a.k) };
        save(QUIZ_KEY, r);
        paintButtons();
        result(r);
      });
    }
    ask();
  }
  function result(r) {
    const all = r.score === r.total;
    quizKick.textContent = 'Quiz done';
    quizTitle.textContent = all ? 'All five.' : r.score >= 3 ? 'Most of it.' : 'Worth another pass.';
    const fb = !load(FEEDBACK_KEY);
    // A result saved before picks were kept shows its marks without the answers.
    const row = (item, k) => {
      const ok = (r.marks || [])[k], pick = (r.picks || [])[k];
      const mine = pick != null ? `<s class="mine">${esc(item.choices[pick])}</s> ` : '';
      const ans = ok ? `<span class="mine">${esc(item.choices[item.a])}</span>` : `${mine}<span class="fix">→ ${esc(item.choices[item.a])}</span>`;
      return `<li class="${ok ? 'right' : ok === false ? 'wrong' : ''}"><span class="mk" aria-label="${ok ? 'right' : 'wrong'}">${ok ? '✓' : '✗'}</span><div><p class="qq">${esc(item.q)}</p><p class="ans">${ans}</p></div></li>`;
    };
    quizBody.innerHTML = `<div class="main thanks"><div class="lead"><p class="score">${r.score}<small> / ${r.total}</small></p>`
      + `<p>${all ? 'Every one right. You can follow the carbon and the electrons all the way through.' : `Go back to the ${r.total - r.score > 1 ? 'stages' : 'stage'} you missed, then retake the quiz.`}</p></div>`
      + `<ol class="review">${QUIZ.map(row).join('')}</ol></div>`
      + `<div class="foot"><span class="spacer"></span>`
      + `<button class="cta cta--ghost cta--sm" type="button" data-retake>Retake</button>`
      + (fb ? `<button class="cta cta--sm" type="button" data-fb>Give feedback</button>` : `<button class="cta cta--sm" type="button" data-close>Close</button>`) + `</div>`;
    quizBody.querySelector('[data-retake]').addEventListener('click', () => { try { localStorage.removeItem(QUIZ_KEY); } catch (e) {} runQuiz('quiz'); });
    const f = quizBody.querySelector('[data-fb]');
    if (f) f.addEventListener('click', () => askSurvey(0, {}));
    const c = quizBody.querySelector('[data-close]');
    if (c) c.addEventListener('click', () => quizModal.hide());
  }
  function askSurvey(j, survey) {
    const page = SURVEY[j];
    quizKick.textContent = 'App Feedback';
    quizTitle.textContent = page.title;
    const opts = (item, vals, labels) => vals.map((v, k) => `<button type="button" data-id="${item.id}" data-v="${esc(v)}" aria-pressed="${survey[item.id] === v}">${esc(labels[k])}</button>`).join('');
    const html = item => {
      if (item.kind === 'scale') return `<div class="scale">${opts(item, item.labels.map((_, k) => k + 1), item.labels)}</div>`;
      if (item.kind === 'yesno') return `<div class="yn"><p>${esc(item.q)}</p><div class="seg">${opts(item, ['Yes', 'No'], ['Yes', 'No'])}</div></div>`;
      return `<p class="q">${esc(item.q)}</p><textarea data-id="${item.id}" rows="3" maxlength="500" placeholder="Optional">${esc(survey[item.id] || '')}</textarea>`;
    };
    const ready = () => page.items.every(it => !it.need || survey[it.id] != null);
    const last = j + 1 === SURVEY.length;
    /* Listener on this page's own wrapper, which innerHTML replaces: one on
       quizBody would outlive the page and answer the next one too. */
    quizBody.innerHTML = `<div class="main sq">${page.items.map(html).join('')}</div>`
      + `<div class="foot">${nOf(j + 1, SURVEY.length)}<span class="spacer"></span>`
      + (j ? `<button class="cta cta--ghost cta--sm" type="button" data-back>Back</button>` : '')
      + `<button class="cta cta--sm" type="button" data-next ${ready() ? '' : 'disabled'}>${last ? 'Send' : 'Next'}</button></div>`;
    const next = quizBody.querySelector('[data-next]');
    const sq = quizBody.querySelector('.sq');
    sq.addEventListener('click', ev => {
      const b = ev.target.closest('button[data-v]'); if (!b) return;
      const item = page.items.find(it => it.id === b.dataset.id);
      for (const c of sq.querySelectorAll(`button[data-id="${item.id}"]`)) c.setAttribute('aria-pressed', c === b);
      survey[item.id] = item.kind === 'scale' ? Number(b.dataset.v) : b.dataset.v;
      next.disabled = !ready();
    });
    sq.addEventListener('input', ev => { if (ev.target.dataset.id) survey[ev.target.dataset.id] = ev.target.value.trim().slice(0, 500); });
    const back = quizBody.querySelector('[data-back]');
    if (back) back.addEventListener('click', () => askSurvey(j - 1, survey));
    next.addEventListener('click', () => last ? thanks(survey) : askSurvey(j + 1, survey));
  }
  function thanks(survey) {
    if (window.Track) Track.event('survey', { answers: survey });
    save(FEEDBACK_KEY, survey);
    paintButtons();
    quizKick.textContent = 'App Feedback';
    quizTitle.textContent = 'Thank you.';
    const items = SURVEY.flatMap(pg => pg.items);
    const val = it => it.kind === 'scale' ? (survey[it.id] ? `${survey[it.id]} of 5` : '—') : survey[it.id] || '—';
    const label = it => it.kind === 'scale' ? SURVEY[0].title : it.q;
    quizBody.innerHTML = `<div class="main thanks"><p class="lead"><span class="tick" aria-hidden="true">✓</span>Your feedback is saved. It helps decide what gets built next.</p>`
      + `<dl class="recap">${items.map(it => `<div><dt>${esc(label(it))}</dt><dd${it.kind === 'text' ? ' class="long"' : ''}>${esc(val(it))}</dd></div>`).join('')}</dl></div>`
      + `<div class="foot"><span class="spacer"></span><button class="cta cta--ghost cta--sm" type="button" data-edit>Edit answers</button><button class="cta cta--sm" type="button" data-close>Close</button></div>`;
    quizBody.querySelector('[data-edit]').addEventListener('click', () => askSurvey(0, { ...survey }));
    quizBody.querySelector('[data-close]').addEventListener('click', () => quizModal.hide());
  }
  quizModal = Modal.create({ el: 'quizmodal', onShow: runQuiz });
  const quizBtn = document.createElement('button');
  const fbBtn = document.createElement('button');
  quizBtn.type = fbBtn.type = 'button';
  quizBtn.className = fbBtn.className = 'cta cta--ghost cta--sm quiz-open';
  /* A finished one carries a check, so it reads as done without colour. */
  function paintButtons() {
    const q = load(QUIZ_KEY), f = load(FEEDBACK_KEY);
    quizBtn.textContent = q ? `✓ Quiz ${q.score}/${q.total}` : 'Quiz';
    fbBtn.textContent = f ? '✓ Feedback' : 'Feedback';
  }
  paintButtons();
  // Until the chain has made a glucose's worth of ATP, once, on this browser.
  const DONE_KEY = 'ss.respiration.done';
  quizBtn.hidden = fbBtn.hidden = !(() => { try { return localStorage.getItem(DONE_KEY); } catch (e) { return false; } })();
  quizBtn.addEventListener('click', () => quizModal.show('quiz'));
  fbBtn.addEventListener('click', () => quizModal.show('feedback'));
  /* Beside it, a slot lib/track.js fills with the class gear when this browser is in a class. */
  const foot = document.createElement('div');
  foot.className = 'panel-foot';
  foot.appendChild(quizBtn);
  foot.appendChild(fbBtn);
  const classslot = document.createElement('div');
  classslot.id = 'classslot';
  foot.appendChild(classslot);
  shell.panel.appendChild(foot);
})();
</script>
</body>
</html>
