<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellular respiration — Kodolab</title>
<script defer src="/demos/lib/site.js"></script>
<!-- ===================================================================
     THE CHART DRIVES THE STAGE. respiration/chart.html's flowchart sits in
     the shell's panel, made wide enough to read, and the panel's scroll is
     the only input: where the reader is on the chart says which scale is
     behind the glass. Cytoplasm is the animal cell; the split to two
     pyruvate flies to a mitochondrion; the mitochondrion zone swaps to the
     organelle; the carriers swap to the proton circuit with the whole cell
     stacked above it; the chain box zooms to the inner membrane.

     The chart is copied, not linked: it carries ids on the elements the
     scroll reads (#k-split #z-mito #k-carriers #k-etc), which chart.html
     does not need. A change to the chart's content is made twice for now.
     =================================================================== -->
<style>
  :root {
    --c-atp: var(--energy-atp);
    --c-o2:  var(--accent-cold);
    --c-co2: var(--text-dim);
    --c-nad: var(--energy-nad);
  }
  /* The panel is the left half of the window, a page beside the scene rather
     than glass over it: the chart wants a reading width, and the membrane
     stack wants a frame nothing covers. The stage is the right half, so the
     mounts centre in it with no offset. */
  .lshell .lshell-panel {
    left: 0; top: 0; bottom: 0; width: 50vw; max-width: none;
    border-radius: 0; border: 0; border-right: 1px solid var(--border-hair);
    background: var(--surface-page); backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none;
  }
  .lshell .lshell-scroll { padding: 84px 40px 32vh; }
  .lshell .lshell-stage { left: 50vw; }
  .lshell-panel .body { font-family: var(--font-ui); }
  .lshell-panel .title { font-size: 26px; line-height: 1.1; letter-spacing: -.02em; }

  /* Scenes cross-fade. The shell hides a scene with `visibility`, which
     cuts; here a scene that is off keeps its last frame and fades, so the
     cell dissolves into the organelle rather than blinking. */
  .lshell .lshell-scene { transition: opacity .8s ease; opacity: 1; }
  .lshell .lshell-scene.is-off { visibility: visible; opacity: 0; pointer-events: none; }

  .legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); margin: 0 0 var(--space-4); }
  .legend span { display: inline-flex; align-items: center; gap: var(--space-2) }
  .swatch { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--k) 45%, transparent), transparent 70%) }
  .sw-o2  { --k: var(--c-o2) }
  .sw-nad { --k: var(--c-nad) }
  .sw-co2 { --k: var(--c-co2) }

  figure { margin: 0 }
  svg.chart { display: block; width: 100%; height: auto; color: var(--text-strong) }
  .chart text { font-family: var(--font-ui); font-size: 12px; fill: var(--text-body) }
  .chart .ttl, .chart .tiny, .chart .zone-l {
    font-family: var(--font-display); font-weight: var(--cap-weight);
    letter-spacing: var(--cap-track); text-transform: uppercase;
  }
  .chart .ttl    { font-size: var(--cap-lg); fill: var(--text-strong) }
  .chart .tiny   { font-size: var(--cap-sm); fill: var(--text-muted) }
  .chart .zone-l { font-size: 18px; fill: var(--text-dim) }
  .chart .big    { font-family: var(--font-display); font-weight: 500; font-size: 36px; letter-spacing: -.02em }
  .chart .sub    { fill: var(--text-dim) }
  .chart .box  { fill: var(--surface-card); stroke: var(--border-hair); stroke-width: 1; filter: url(#lift) }
  .chart .rule { stroke: var(--border-hair); stroke-width: 1 }
  .chart .sub .n { fill: var(--text-strong); font-weight: 600; font-variant-numeric: tabular-nums }
  .chart .zone { fill: var(--surface-stage); stroke: var(--border-hair); stroke-width: 1 }
  .chart .flow { stroke: var(--text-strong); stroke-width: 1.5; fill: none }
  .chart .o2-l  { stroke: var(--text-strong); stroke-width: 1.5; fill: none }
  .chart .o2-t  { fill: var(--text-strong) }
  .chart .co2-l { stroke: var(--c-co2); stroke-width: 1.25; fill: none }
  .chart .co2-t { fill: var(--c-co2) }
  .chart .atp-t { fill: var(--c-atp); font-weight: 600 }
  .chart .atp-box { fill: var(--surface-card); stroke: var(--c-atp); stroke-width: 1.25; filter: url(#lift) }
  /* The zone the reader is in is lit: the one cue that the scene changed because of the scroll. */
  .chart .zone { transition: stroke .5s, fill .5s }
  .chart .zone.is-here { stroke: var(--accent) }
</style>
</head>
<body>

<template id="chart">
<div class="legend cap-sm">
  <span><i class="swatch sw-o2"></i> oxygen</span>
  <span><i class="swatch sw-nad"></i> carriers</span>
  <span><i class="swatch sw-co2"></i> carbon leaving</span>
</div>
<figure>
<svg class="chart" viewBox="-40 0 660 1460" role="img" aria-label="A tall vertical flowchart: glucose is split by glycolysis in the cytoplasm into two pyruvate molecules; each pyruvate runs its own lane through the link reaction and the Krebs cycle inside the mitochondrion, releasing carbon dioxide; both lanes hand their electron carriers to one electron transport chain, which makes about 26 ATP; oxygen feeds into the left of that chain as the final electron acceptor and leaves out the right side as water. The total is about 30 ATP per glucose.">
      <defs>
        <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
        </marker>
        <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--c-co2)"></path>
        </marker>
        <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
        </marker>
        <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--c-atp)"></path>
        </marker>
        <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2b2723" flood-opacity=".12"></feDropShadow>
        </filter>
        <radialGradient id="o2-glow">
          <stop offset="0" style="stop-color: var(--c-o2); stop-opacity: .3"></stop>
          <stop offset="1" style="stop-color: var(--c-o2); stop-opacity: 0"></stop>
        </radialGradient>
        <radialGradient id="atp-glow">
          <stop offset="0" style="stop-color: var(--c-atp); stop-opacity: .16"></stop>
          <stop offset="1" style="stop-color: var(--c-atp); stop-opacity: 0"></stop>
        </radialGradient>
        <radialGradient id="nad-glow">
          <stop offset="0" style="stop-color: var(--c-nad); stop-opacity: .26"></stop>
          <stop offset="1" style="stop-color: var(--c-nad); stop-opacity: 0"></stop>
        </radialGradient>
        <radialGradient id="co2-glow">
          <stop offset="0" style="stop-color: var(--c-co2); stop-opacity: .3"></stop>
          <stop offset="1" style="stop-color: var(--c-co2); stop-opacity: 0"></stop>
        </radialGradient>
      </defs>

      <!-- ===== compartments ===== -->
      <rect id="z-cyto" class="zone" x="-30" y="24" width="640" height="524" rx="12"></rect>
      <text class="zone-l" x="-10" y="54">CYTOPLASM</text>
      <g transform="translate(0,34)">

      <!-- ===== glucose ===== -->
      <text class="ttl" x="288" y="76" text-anchor="middle">GLUCOSE</text>
      <text class="sub" x="288" y="92" text-anchor="middle">6 carbons</text>
      <image href="media/molecules/glucose.webp" x="208" y="96" width="160" height="104"></image>
      <g transform="translate(0,104)">
      <line class="flow" x1="288" y1="100" x2="288" y2="128" marker-end="url(#m)"></line>

      <!-- ===== glycolysis ===== -->
      <rect class="box" x="178" y="130" width="220" height="90" rx="8"></rect>
      <text class="ttl" x="288" y="158" text-anchor="middle">GLYCOLYSIS</text>
      <line class="rule" x1="194" y1="169" x2="382" y2="169"></line>
      <text class="sub" x="288" y="186" text-anchor="middle">splits the sugar in half</text>
      <text class="sub" x="288" y="204" text-anchor="middle">net <tspan class="atp-t">2 ATP</tspan> · <tspan class="n">2</tspan> NADH</text>

      <!-- ===== the split ===== -->
      <g transform="translate(0,16)">
      <path class="flow" d="M288,220 V240 H188 V258" marker-end="url(#m)"></path>
      <path class="flow" d="M288,220 V240 H388 V258" marker-end="url(#m)"></path>
      <image href="media/molecules/pyruvate.webp" x="133" y="294" width="110" height="72"></image>
      <image href="media/molecules/pyruvate.webp" x="333" y="294" width="110" height="72"></image>
      <text id="k-split" class="ttl" x="188" y="284" text-anchor="middle">PYRUVATE</text>
      <text class="ttl" x="388" y="284" text-anchor="middle">PYRUVATE</text>
      <g transform="translate(0,74)">
      <rect id="z-mito" class="zone" x="-30" y="332" width="640" height="676" rx="12"></rect>
      <text class="zone-l" x="-10" y="362">MITOCHONDRION</text>
      <g transform="translate(0,36)">

      <!-- ===== into the mitochondrion ===== -->
      <line class="flow" x1="188" y1="290" x2="188" y2="368" marker-end="url(#m)"></line>
      <line class="flow" x1="388" y1="290" x2="388" y2="368" marker-end="url(#m)"></line>

      <!-- ===== link step ===== -->
      <rect class="box" x="123" y="370" width="130" height="84" rx="8"></rect>
      <rect class="box" x="323" y="370" width="130" height="84" rx="8"></rect>
      <text class="ttl" x="188" y="396" text-anchor="middle">LINK STEP</text>
      <line class="rule" x1="137" y1="407" x2="239" y2="407"></line>
      <text class="sub" x="188" y="424" text-anchor="middle">→ acetyl-CoA</text>
      <text class="sub" x="188" y="442" text-anchor="middle"><tspan class="n">1</tspan> NADH</text>
      <text class="ttl" x="388" y="396" text-anchor="middle">LINK STEP</text>
      <line class="rule" x1="337" y1="407" x2="439" y2="407"></line>
      <text class="sub" x="388" y="424" text-anchor="middle">→ acetyl-CoA</text>
      <text class="sub" x="388" y="442" text-anchor="middle"><tspan class="n">1</tspan> NADH</text>
      <line class="co2-l" x1="121" y1="412" x2="62" y2="412" marker-end="url(#mc)"></line>
      <ellipse cx="28" cy="405" rx="40" ry="28" fill="url(#co2-glow)"></ellipse>
      <image href="media/molecules/co2.webp" x="-2" y="385" width="60" height="38"></image>
      <text class="co2-t tiny" x="28" y="435" text-anchor="middle">1 CO₂</text>
      <line class="co2-l" x1="455" y1="412" x2="514" y2="412" marker-end="url(#mc)"></line>
      <ellipse cx="548" cy="405" rx="40" ry="28" fill="url(#co2-glow)"></ellipse>
      <image href="media/molecules/co2.webp" x="518" y="385" width="60" height="38"></image>
      <text class="co2-t tiny" x="548" y="435" text-anchor="middle">1 CO₂</text>

      <line class="flow" x1="188" y1="454" x2="188" y2="484" marker-end="url(#m)"></line>
      <line class="flow" x1="388" y1="454" x2="388" y2="484" marker-end="url(#m)"></line>

      <!-- ===== krebs ===== -->
      <g transform="translate(0,22)">
      <rect class="box" x="123" y="464" width="130" height="84" rx="8"></rect>
      <rect class="box" x="323" y="464" width="130" height="84" rx="8"></rect>
      <text class="ttl" x="188" y="490" text-anchor="middle">KREBS CYCLE</text>
      <line class="rule" x1="137" y1="501" x2="239" y2="501"></line>
      <text class="sub" x="188" y="518" text-anchor="middle"><tspan class="atp-t">1 ATP</tspan> · <tspan class="n">3</tspan> NADH</text>
      <text class="sub" x="188" y="536" text-anchor="middle"><tspan class="n">1</tspan> FADH₂</text>
      <text class="ttl" x="388" y="490" text-anchor="middle">KREBS CYCLE</text>
      <line class="rule" x1="337" y1="501" x2="439" y2="501"></line>
      <text class="sub" x="388" y="518" text-anchor="middle"><tspan class="atp-t">1 ATP</tspan> · <tspan class="n">3</tspan> NADH</text>
      <text class="sub" x="388" y="536" text-anchor="middle"><tspan class="n">1</tspan> FADH₂</text>
      <line class="co2-l" x1="121" y1="506" x2="62" y2="506" marker-end="url(#mc)"></line>
      <ellipse cx="28" cy="499" rx="40" ry="28" fill="url(#co2-glow)"></ellipse>
      <image href="media/molecules/co2.webp" x="-2" y="479" width="60" height="38"></image>
      <text class="co2-t tiny" x="28" y="529" text-anchor="middle">2 CO₂</text>
      <line class="co2-l" x1="455" y1="506" x2="514" y2="506" marker-end="url(#mc)"></line>
      <ellipse cx="548" cy="499" rx="40" ry="28" fill="url(#co2-glow)"></ellipse>
      <image href="media/molecules/co2.webp" x="518" y="479" width="60" height="38"></image>
      <text class="co2-t tiny" x="548" y="529" text-anchor="middle">2 CO₂</text>

      <!-- ===== lanes rejoin ===== -->
      <g transform="translate(0,22)">
      <path class="flow" d="M188,526 V542 H288 V578" marker-end="url(#m)"></path>
      <path class="flow" d="M388,526 V542 H288 V578"></path>

      <!-- ===== carriers handed to the chain, per glucose (glycolysis 2 + link 2 + Krebs 6 NADH; Krebs 2 FADH2) ===== -->
      <ellipse id="k-carriers" cx="186" cy="643" rx="96" ry="66" fill="url(#nad-glow)"></ellipse>
      <ellipse cx="390" cy="643" rx="96" ry="66" fill="url(#nad-glow)"></ellipse>
      <image href="media/molecules/nadhSkel.webp" x="96" y="580" width="180" height="126"></image>
      <image href="media/molecules/fadh2.webp" x="300" y="580" width="180" height="126"></image>
      <text class="ttl" x="186" y="720" text-anchor="middle">10 NADH</text>
      <text class="ttl" x="390" y="720" text-anchor="middle">2 FADH₂</text>
      <line class="flow" x1="288" y1="728" x2="288" y2="764" marker-end="url(#m)"></line>

      <g transform="translate(0,182)">

      <!-- ===== electron transport chain ===== -->
      <rect id="k-etc" class="box" x="166" y="584" width="244" height="110" rx="8"></rect>
      <text class="ttl" x="288" y="612" text-anchor="middle">ELECTRON TRANSPORT</text>
      <text class="ttl" x="288" y="628" text-anchor="middle">CHAIN</text>
      <line class="rule" x1="182" y1="639" x2="394" y2="639"></line>
      <text class="sub" x="288" y="657" text-anchor="middle">H⁺ gradient spins ATP synthase</text>
      <text class="sub" x="288" y="676" text-anchor="middle"><tspan class="atp-t">≈26 ATP</tspan> — the big payout</text>

      <!-- ===== oxygen feeds IN ===== -->
      <ellipse cx="39" cy="639" rx="62" ry="54" fill="url(#o2-glow)"></ellipse>
      <text class="ttl o2-t" x="39" y="615" text-anchor="middle">OXYGEN</text>
      <image href="media/molecules/o2.webp" x="11" y="619" width="56" height="44"></image>
      <text class="sub" x="39" y="675" text-anchor="middle">6 O₂</text>
      <line class="o2-l" x1="86" y1="639" x2="164" y2="639" marker-end="url(#mo)"></line>
      <text class="tiny o2-t" x="39" y="697" text-anchor="middle">FINAL ELECTRON</text>
      <text class="tiny o2-t" x="39" y="709" text-anchor="middle">ACCEPTOR</text>

      <!-- ===== water leaves, same grammar as the CO₂ side arrows ===== -->
      <line class="o2-l" x1="412" y1="639" x2="496" y2="639" stroke-width="1.3" marker-end="url(#mo)"></line>
      <ellipse cx="534" cy="641" rx="50" ry="44" fill="url(#o2-glow)"></ellipse>
      <image href="media/molecules/water.webp" x="506" y="609" width="56" height="44"></image>
      <text class="tiny o2-t" x="534" y="667" text-anchor="middle">6 H₂O</text>

      <!-- ===== total ===== -->
      <line class="flow" x1="288" y1="694" x2="288" y2="778" marker-end="url(#ma)" stroke="var(--accent)"></line>
      <rect class="atp-box" x="88" y="780" width="400" height="176" rx="10"></rect>
      <ellipse cx="288" cy="842" rx="96" ry="52" fill="url(#atp-glow)"></ellipse>
      <image href="media/molecules/atpSkel.webp" x="218" y="800" width="140" height="80"></image>
      <text class="big atp-t" x="288" y="914" text-anchor="middle">≈30 ATP</text>
      <text class="tiny" x="288" y="938" text-anchor="middle">PER GLUCOSE · 6 CO₂ OUT · 6 H₂O MADE</text>
      </g>
      </g>
      </g>
      </g>
      </g>
      </g>
      </g>
      </g>
    </svg>
</figure>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kit/app.js" data-shell="steps" data-use="AnimalCell,Mitochondrion,Chemiosmosis"></script>
<script>
(function () {
  'use strict';
  const shell = LessonShell.create({
    brand: 'Cellular respiration',
    hint: 'Scroll the chart · Drag to orbit',
    chrome: 'none',
    steps: [{
      eyebrow: 'One glucose, top to bottom',
      title: 'How a cell turns sugar into usable energy',
      body: document.getElementById('chart').innerHTML,
    }],
  });

  const centred = () => ({ x: 0, y: 0 });
  const cell  = shell.scene('cell',  el => AnimalCell.mount(el, { motion: 1, detail: 'auto', viewOffset: centred }));
  const mito  = shell.scene('mito',  el => Mitochondrion.mount(el, { flow: 0.6, viewOffset: centred }));
  const chemi = shell.scene('chemi', el => Chemiosmosis.mount(el, {
    context: 'mitochondrion', fuel: 'NADH', chain: 'lumped', span: 'cell', viewOffset: centred,
  }));
  shell.goTo(0);

  /* ---- the scroll reads the chart ----
     A line 40% down the panel is where the reader is. The phase is the last
     mark that line has passed, so scrolling back up walks the same stops in
     reverse. Marks are the chart's own elements, measured in the scroller's
     coordinates, so a wider panel or a re-flowed chart moves them with it. */
  const scroller = shell.el.querySelector('.lshell-scroll');
  const chart = scroller.querySelector('svg.chart');
  const MARKS = [
    ['fly',   '#k-split'],
    ['mito',  '#z-mito'],
    ['chemi', '#k-carriers'],
    ['etc',   '#k-etc'],
  ];
  const topOf = sel => {
    const n = chart.querySelector(sel);
    return n.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
  };
  function phaseNow() {
    const line = scroller.scrollTop + scroller.clientHeight * 0.4;
    let p = 'cell';
    for (const [name, sel] of MARKS) if (line >= topOf(sel)) p = name;
    return p;
  }

  /* Chemiosmosis's box orbits the origin, and with span:'cell' the inner
     membrane sits below it (the stack's INNER_Y). flyTo moves theta/phi/r
     only, so the target's y is tweened here, alongside. */
  let targetRaf = 0;
  function aimAt(box, y, dur = 1.1) {
    cancelAnimationFrame(targetRaf);
    const t0 = performance.now(), y0 = box.cam.target.y;
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    (function tick(now) {
      const k = Math.min(1, (now - t0) / (dur * 1000));
      box.cam.target.y = y0 + (y - y0) * ease(k);
      box.applyCam();
      if (k < 1) targetRaf = requestAnimationFrame(tick);
    })(t0);
  }
  const INNER_Y = -85;

  const PHASES = {
    cell()  { shell.showScene('cell');  cell.home(); },
    fly()   { shell.showScene('cell');  cell.lookAt('mitochondrion'); },
    mito()  { shell.showScene('mito');  mito.home(); },
    chemi() {
      shell.showScene('chemi');
      chemi.set({ chain: 'lumped' });
      aimAt(chemi.box, 0); chemi.box.flyTo({ r: 412, phi: Math.PI / 2 - 0.09 });
    },
    etc() {
      shell.showScene('chemi');
      chemi.set({ chain: 'split' });
      aimAt(chemi.box, INNER_Y); chemi.box.flyTo({ r: 300, phi: Math.PI / 2 - 0.14 });
    },
  };
  const ZONE = { cell: '#z-cyto', fly: '#z-cyto', mito: '#z-mito', chemi: '#z-mito', etc: '#z-mito' };

  let phase = null;
  function sync() {
    const p = phaseNow();
    if (p === phase) return;
    phase = p;
    PHASES[p]();
    for (const z of chart.querySelectorAll('.zone')) z.classList.toggle('is-here', z.matches(ZONE[p]));
  }
  scroller.addEventListener('scroll', sync, { passive: true });
  window.addEventListener('resize', sync);
  sync();

  /* Build the two scenes the reader has not reached yet while the cell is
     still on screen, so the first swap is a fade and not a hitch. */
  setTimeout(() => { mito.state(); chemi.state(); }, 1500);
})();
</script>
</body>
</html>
