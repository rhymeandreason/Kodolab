<script src="../tree/tree-steps.js"></script>
<script>
/* The lesson is three things wired together: the shell (panel, steps,
   progress), the Tree scene in the shell's stage, and the steps' content.
   This file is the wiring, and it is the shape a generated step-through
   app takes. */
const shell = LessonShell.create({
  brand: 'The Mass of a Tree',
  hint: 'Drag to orbit · Scroll to zoom',
  steps: TreeSteps.steps,
  ctx: { state: { guess: null, grown: false, year: 0, diameter: 60, flows: { co2: true, h2o: false, o2: false }, sunOn: true } },
  onStep(step) {
    const cam = (shell.narrow() && step.cameraPortrait) || step.camera;
    if (cam) T.flyTo(cam.pos, cam.target);
  },
});

const T = Tree.mount(shell.stage, {
  growth: 0.02,
  viewOffset: shell.viewOffset,          // centred in the room the panel leaves
});
T.on('night', on => shell.theme('is-night', on));

/* The steps talk to the scene through ctx, by the names they were written with. */
Object.assign(shell.ctx, {
  tree: T.sim.tree, sapling: T.sim.sapling, flows: T.sim.flows, piles: T.sim.piles, tweens: T.sim.tweens,
  setDaylight: T.sim.setDaylight, setTreeOpacity: T.sim.setTreeOpacity,
  showPotScene: T.sim.showPotScene, flowsOff: T.sim.flowsOff, flyTo: T.flyTo,
});

shell.goTo((() => {
  const m = /[?&]step=(\d+)/.exec(location.search);
  return m ? Math.max(1, Math.min(TreeSteps.steps.length, +m[1])) - 1 : 0;
})());
</script>
