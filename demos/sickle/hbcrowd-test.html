<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="../lib/tokens-from-palette.js"></script>

<script src="../kit/ribbon.js"></script>
<script src="../kit/tube.js"></script>
<script src="../kit/surface.js"></script>
<script src="../sickle/sickle-fibre.js"></script>
<script src="../sickle/hbcrowd.js"></script>
<script>
/* The bench for sickle/hbcrowd.js: one crowd, every control live. On the
   lesson shell so the component is judged in the chrome a student sees. */
const shell = LessonShell.create({
  brand: 'Hemoglobin crowd', section: { label: 'library', href: '/library' },
  hint: 'Drag to orbit · Scroll to zoom',
  steps: [{ eyebrow: 'sickle/hbcrowd.js', title: 'A crowd that assembles itself', onEnter: bench }],
});
const C = HbCrowd.mount(shell.stage, { variant: 'HbS', stick: true, base: '../', viewOffset: shell.viewOffset });
/* The console is part of the bench: `crowd.play()`, `crowd.box.pump()` drive
   a frame when a backgrounded tab has paused rAF. */
window.crowd = C;

function bench(ctx) {
  const ui = ctx.ui;
  ui.controls(`
    <div class="bench-group">
      <div class="bench-hd">molecule</div>
      <div class="segmented" id="variant">
        <button type="button" data-v="HbA">HbA</button>
        <button type="button" data-v="HbS" class="is-on">HbS</button>
      </div>
      <div class="slider"><div class="slider-head"><span class="label">molecules</span><span class="value" id="nv"></span></div>
        <input type="range" id="n" min="8" max="${HbCrowd.MAX}" step="1" value="${HbCrowd.MAX}"></div>
    </div>
    <div class="bench-group">
      <div class="bench-hd">the attraction</div>
      <div class="row">
        <button class="btn secondary" type="button" id="play">Switch it on</button>
        <button class="btn ghost" type="button" id="intro">Way in</button>
        <button class="btn ghost" type="button" id="reset">Reset</button>
      </div>
      <p class="foot" id="facts"></p>
    </div>
    <div class="bench-group">
      <div class="bench-hd">point at</div>
      <div id="panel"></div>
    </div>`);

  for (const b of ui.qa('#variant button')) b.onclick = () => {
    ui.qa('#variant button').forEach(o => o.classList.toggle('is-on', o === b));
    C.set({ variant: b.dataset.v, stick: b.dataset.v === 'HbS' });
  };
  ui.range(ui.q('#n'), v => { ui.q('#nv').textContent = v; if (C.state().n !== v) C.set({ n: v }); });
  ui.q('#play').onclick = () => C.play();
  ui.q('#intro').onclick = () => { C.reset(); C.intro(3.4); };
  ui.q('#reset').onclick = () => C.reset();
  CardStage.showPanel(ui.q('#panel'), C, { notes: ['patch', 'chain'] });

  /* Read off the component. Every number here is the simulation's own count
     or the crystal's own repeat; the bench prints them rather than typing
     them, and the run is different every time. */
  C.on('frame', s => {
    ui.q('#facts').textContent = !s.running
      ? `${s.n} molecules, none bonded. Switch the attraction on.`
      : s.biggest < 2
        ? `${s.n} molecules, nothing holding yet.`
        : `Biggest: ${s.biggest} molecules, ${s.repeats} repeat${s.repeats === 1 ? '' : 's'}, `
          + `${s.lengthNm.toFixed(0)} nm at ${s.measured.axialA.toFixed(1)} Å a repeat `
          + `(${s.measured.source}). ${s.bodies} bodies, ${s.free} still free.`;
  });
}
shell.goTo(0);
</script>
</body>
