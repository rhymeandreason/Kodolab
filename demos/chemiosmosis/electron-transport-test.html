  .bench-group:first-child { padding-top: 0; border-top: 0; }

  .bench-sub { font-family: var(--display); font-size: 13px; color: var(--ink-2); margin-bottom: -6px; }

<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="../membrane/pump.js"></script>
<script src="../membrane/chemiosmosis.js"></script>
<script src="../membrane/sheet.js"></script>
<script src="../chemiosmosis/circuit.js"></script>

<script src="../membrane/membrane.js"></script>

<script>
const FUELS = ['NADH', 'FADH2'];
const fuelName = f => ({ FADH2: 'FADH₂' })[f] || f;

const shell = LessonShell.create({
  brand: 'ElectronTransport · component bench',
  hint: 'Drag to orbit · Scroll to zoom',
  steps: [{
    eyebrow: 'chemiosmosis/electron-transport.js',
    title: 'Pump out, turn back in',
    body: '<p>NADH pays to pump protons out of the matrix; ATP synthase lets them back down and turns.</p>',
    onEnter: bench,
  }],
});

const m = ElectronTransport.mount(shell.stage, { viewOffset: shell.viewOffset });
m.start();
window.chemi = m;

function bench(ctx) {
  const ui = ctx.ui;
  const seg = (id, opts) => `<div class="segmented" id="${id}" role="group">${
    opts.map(([v, t]) => `<button type="button" data-v="${v}">${t}</button>`).join('')}</div>`;
  ui.controls(`
    <div class="bench-group">
      <div class="bench-hd">how far out</div>
      <div>${seg('span', [['inner', 'inner membrane'], ['mitochondrion', '+ outer'], ['cell', '+ cell']])}</div>
    </div>

    <div class="bench-group">
      <div class="bench-hd">fuel</div>
      <div class="bench-sub">continuous supply</div>
      <div id="fuel-seg"></div>
      <div class="slider"><div class="slider-head"><span class="label">pump rate</span><span class="value" id="rv"></span></div>
        <input id="rate" type="range" min="0" max="1" step="0.01" value="1"></div>
      <div class="row" id="feeds"></div>
      <p class="foot" id="feedfoot"></p>
    </div>

    <div class="bench-group">
      <div class="bench-hd">conditions</div>
      <label class="switch"><input type="checkbox" id="o2" checked><span class="track"></span>oxygen</label>
      <label class="switch"><input type="checkbox" id="leak"><span class="track"></span>uncoupler in the membrane</label>
    </div>

    <div class="bench-group">
      <div class="bench-hd">what the chain is doing</div>
      <p class="phase" id="phase"></p>
      <p class="foot" id="phasecap" style="min-height:3em"></p>
    </div>

    <div class="bench-group">
      <div class="bench-hd">the ledger</div>
      <table class="rd" id="rd"></table>
      <p class="foot" id="verdict"></p>
    </div>

    <div class="bench-group">
      <div class="row">
        <button class="btn secondary" type="button" id="notes" aria-pressed="false">Show labels</button>
        <button class="btn ghost" type="button" id="reset">Reset</button>
      </div>
    </div>`);

  const S = { span: 'inner', fuel: 'NADH' };
  const $ = s => ui.q(s);
  const mark = (id, v) => { for (const b of ui.qa(`#${id} > button`)) b.setAttribute('aria-pressed', String(b.dataset.v === v)); };

  /* A layout that fits the span: the component spreads `complex` into I–IV
     and makes room itself, so only the uncoupler needs placing here. */
  function layout() {
    const wide = S.span !== 'inner';
    const p = wide ? { complex:{ x:-95 }, synthase:{ x:45 }, translocase:{ x:105 } } : { complex:{ x:-70 }, synthase:{ x:70 } };
    if ($('#leak').checked) p.leak = { x: wide ? 150 : 125 };
    return p;
  }
  const apply = () => { m.set({ span: S.span, fuel: S.fuel,
    oxygen: $('#o2').checked, proteins: layout() }); if (labelsOn) showLabels(); sync(); };

  $('#fuel-seg').innerHTML = seg('fuel', FUELS.map(f => [f, fuelName(f)]).concat([['', 'none']]));
  $('#feeds').innerHTML = FUELS.map(f => `<button class="btn secondary" type="button" data-feed="${f}">Send one ${fuelName(f)}</button>`).join('');
  for (const b of ui.qa('#fuel > button')) b.onclick = () => { S.fuel = b.dataset.v || null; m.set({ fuel: S.fuel }); sync(); };
  for (const b of ui.qa('[data-feed]')) b.onclick = () => m.feed(b.dataset.feed);

  function sync() {
    mark('span', S.span); mark('fuel', S.fuel || '');
    $('#rate').disabled = !S.fuel;
    $('#feedfoot').textContent = !$('#o2').checked ? 'No oxygen at the end of the chain: the carrier docks, and the chain backs up behind complex IV.'
      : S.fuel ? 'One carrier, one trip, on top of the supply. Clearer with the supply set to none.'
      : 'Supply off: each press goes round the chain once and stops.';
  }

  for (const id of ['span']) for (const b of ui.qa(`#${id} > button`)) b.onclick = () => {
    if (S[id] === b.dataset.v) return;
    S[id] = b.dataset.v;
    apply();
  };
  $('#o2').onchange = () => { m.set({ oxygen: $('#o2').checked }); sync(); };
  $('#leak').onchange = apply;
  ui.range($('#rate'), v => { m.set({ fuelRate: v }); $('#rv').textContent = Math.round(v * 100) + '%'; });

  let labelsOn = false;
  function showLabels() {
    const s = m.state();
    const names = ['complex.I', 'complex.II', 'complex.III', 'complex.IV', 'quinone', 'cytc']
      .concat(['synthase'], $('#leak').checked ? ['leak'] : [], s.span !== 'inner' ? ['translocase', 'porin'] : [], s.span === 'cell' ? ['pump.atp'] : []);
    m.clearNotes(); m.notes(names);
  }
  $('#notes').onclick = () => {
    labelsOn = !labelsOn;
    $('#notes').setAttribute('aria-pressed', String(labelsOn));
    $('#notes').textContent = labelsOn ? 'Hide labels' : 'Show labels';
    labelsOn ? showLabels() : m.clearNotes();
  };
  $('#reset').onclick = () => {
    m.reset();
    m.set({ contents: { inside:{ water:30, H:30 }, outside:{ water:30, H:30 } } });
    if (labelsOn) showLabels();
  };

  /* EVERY NUMBER HERE IS READ FROM state(), the per-fuel worth included: the
     panel cannot claim a ratio the chain's table does not hold. */
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  m.on('frame', s => {
    $('#phase').textContent = s.complexLabel || '';
    $('#phasecap').textContent = s.complexCaption || '';
    let rows =
      row(`H⁺ in ${s.sides.outside}`, (s.counts.H || {}).outside | 0) +
      row(`H⁺ in ${s.sides.inside}`, (s.counts.H || {}).inside | 0) +
      row('proton-motive force', s.pmf.toFixed(0) + ' mV') +
      row('protons pumped out', s.complexTurns);
    for (const k of Object.keys(s.complexes)) rows += row(`complex ${k}: ${s.complexes[k].turns} turns × ${s.complexes[k].pumpsPerTurn}`, s.complexes[k].pumped);
    rows += row('per NADH / per FADH₂', `${s.protonsPerFuel.NADH} / ${s.protonsPerFuel.FADH2}`);
    rows += row('ubiquinol · loaded cyt c', `${s.shuttles.ubiquinol} · ${s.shuttles.cytcLoaded}`);
    if (s.o2Left != null) rows += row('O₂ left', s.o2Left);
    if (s.protonsLeaked || $('#leak').checked) rows += row('protons down the uncoupler', s.protonsLeaked);
    if (s.stoichiometry.protonsPerExport) rows += row('protons spent on export', s.protonsForExport);
    rows += row(`ATP (${s.stoichiometry.protonsPerTurn} H⁺ per ${s.stoichiometry.atpPerTurn}, c${s.stoichiometry.ringSubunits} ring)`, s.atpMade);
    if (s.cell) rows += row('pump turns bought', s.cell.atpSpent) + row('cell membrane voltage', s.cell.mV.toFixed(0) + ' mV');
    $('#rd').innerHTML = rows;
    $('#verdict').textContent =
      !s.oxygen && s.shuttles.cytcLoaded ? 'No oxygen: the cytochromes are waiting loaded at complex IV, so III has nowhere to send electrons, and I stops behind it.'
      : s.pmf <= 2 ? 'No gradient, so the rotor is stopped. The synthase is a turbine and there is nothing to turn it.'
      : s.protonsLeaked > 0 ? `${s.protonsLeaked} of the ${s.protonsLeaked + s.protonsThroughSynthase} protons home came down the hole and made nothing. That fuel still burned, and all of it came out as heat.`
      : `The gradient is holding at ${s.pmf.toFixed(0)} mV, and every ${s.stoichiometry.protonsPerATP.toFixed(1)} protons back through the synthase is one ATP.`;
  });

  apply();
}

shell.goTo(0);
</script>
