<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hemoglobin — molecular surface test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/bench.css">
<link rel="stylesheet" href="../proteins/protein-test.css">
<style>
  /* The shared chrome is ../proteins/protein-test.css. What stays here is the
     control shapes this bench needs and the gallery does not: two segmented
     switches, two colour wells and two sliders. They take their colours from
     the house tokens, so nothing here declares a hue. */
  #stage{display:block}
  #gl{display:block;width:100%;height:100%}

  .panel label{display:grid;gap:3px;font-size:0.78rem;color:var(--h-muted)}
  .panel output{font-variant-numeric:tabular-nums;color:var(--h-ink);font-weight:600}
  .panel input[type=range]{width:100%;accent-color:var(--h-accent)}

  /* Segmented control: one border around the group, hairlines between,
     so the choices read as one choice rather than several buttons. */
  #seg,#var{display:flex;border:1px solid var(--h-line);border-radius:var(--radius-sm);
    overflow:hidden}
  #seg button,#var button{flex:1;border:0;border-left:1px solid var(--h-line);
    border-radius:0;padding:8px 0;font:inherit;font-family:var(--h-ui);
    font-size:0.8rem;color:var(--h-ink);background:transparent;cursor:pointer;
    transition:background var(--dur-fast) var(--ease-out),
               color var(--dur-fast) var(--ease-out)}
  #seg button:first-child,#var button:first-child{border-left:0}
  #seg button:hover,#var button:hover{color:var(--h-accent)}
  #seg button[aria-pressed=true],#var button[aria-pressed=true]{
    background:var(--h-accent);color:#faf8f4}

  #diff{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.72rem;
    color:var(--h-muted);line-height:1.6;white-space:pre;margin:var(--space-3) 0 0}
  #diff b{color:var(--h-ink);font-weight:600}

  /* The swatch only means anything in plain mode, so it dims out of it —
     but stays live, because picking a colour switches back to plain. */
  #swatch{display:flex;align-items:center;gap:var(--space-2);transition:opacity .15s;
    margin-top:var(--space-2)}
  #swatch.off{opacity:.45}
  input[type=color]{width:34px;height:26px;padding:0;cursor:pointer;flex:none;
    background:none;border:1px solid var(--h-line);border-radius:var(--radius-sm)}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
  #plainHex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:0.75rem;color:var(--h-muted)}

  #b6row{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-2) 0}
  /* `chem` is a latch, not an action, so it takes the pressed styling the
     segmented controls use rather than looking like a button you poke. */
  #b6chem{flex:1;margin:0;justify-content:center}
  #b6.chem #b6col{opacity:.45}
  #b6res{color:var(--h-spark);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="gl"></canvas>
  </main>
  <div class="panel">
    <h1>Hemoglobin</h1>
    <p class="deck">A baked solvent-excluded surface laid over the ribbon.
      Swap normal hemoglobin for sickle and watch the &beta;6 patch, not the
      silhouette.</p>

    <h2>molecule (v)</h2>
    <div id="var"></div>
    <div id="diff"></div>

    <h2>surface</h2>
    <button class="mode" id="toggle">hide surface (s)</button>
    <label>colour by (c)
      <div id="seg"></div>
    </label>
    <div id="swatch">
      <input type="color" id="plainCol" value="#cccfd4">
      <code id="plainHex">#cccfd4</code>
    </div>
    <label style="margin-top:var(--space-3)">opacity <output id="ov"></output>
      <input id="op" type="range" min="5" max="100" value="28"></label>

    <h2>&beta;6 patch <span id="b6res"></span></h2>
    <div id="b6" class="chem">
      <div id="b6row">
        <input type="color" id="b6col" value="#d94f1e">
        <button type="button" class="mode" id="b6chem" aria-pressed="true">follow chemistry</button>
      </div>
      <label>patch opacity <output id="b6ov"></output>
        <input id="b6op" type="range" min="0" max="100" value="100"></label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/scene.js"></script>
<script src="../kit/ribbon.js"></script>
<script src="../kit/surface.js"></script>
<script src="../sickle/sickle.js"></script>
<!-- hbfold.js is gone: this page loaded an 800 KB folding trajectory for one
     secondary-structure string, which bake-quaternary.js now writes as
     `foldedSS`. It also had to, once there were two molecules — there is no
     folding trajectory for 2HBS and there should not be one. -->
<script>
'use strict';
/* =====================================================================
 *  surface-test.html — is a baked SES worth it, and does it read?
 *
 *  Two questions, and they are separate. Whether the mesh is CORRECT is
 *  settled offline — tools/ses.js checks itself against an analytic
 *  sphere and against a two-atom pair whose crevice only an SES bridges,
 *  and bake-surface.js refuses to write a mesh that is not closed. What
 *  is left for a page is whether a translucent skin over a ribbon
 *  actually reads: whether the ribbon stays legible through it, what
 *  opacity that needs, and whether colouring the surface says anything
 *  the ribbon does not.
 *
 *  Not a lesson. The prose above describes the render, not a molecule.
 *
 * ---------------------------------------------------------------------
 *  DRAWING TRANSLUCENT OVER OPAQUE
 * ---------------------------------------------------------------------
 *  A closed transparent mesh containing an opaque one is the awkward
 *  case in a z-buffered renderer, and the naive version looks wrong in a
 *  specific way: with depthWrite on, the near wall of the surface writes
 *  depth and CULLS THE RIBBON BEHIND IT, so the ribbon vanishes exactly
 *  where the skin covers it — which is everywhere. The molecule reads as
 *  an empty shell.
 *
 *  So the surface draws with depthWrite off and renderOrder 1: opaque
 *  geometry lays down depth first, the skin is composited over it after,
 *  and the ribbon shows through. The cost is that the surface does not
 *  self-sort — its own far wall is not reliably drawn under its near
 *  wall. DoubleSide with that cost is worse than it sounds, so the skin
 *  is FrontSide: you see the near wall only. That is also the honest
 *  picture, because the near wall is the part of the molecule facing
 *  you, and the reference figures do the same thing.
 *
 * ---------------------------------------------------------------------
 *  COLOURS ARE A VERTEX ATTRIBUTE, NOT A SECOND MESH
 * ---------------------------------------------------------------------
 *  Every vertex carries the residue nearest it (baked in), so recolouring
 *  is one Float32Array written into the existing geometry — no rebuild,
 *  no second upload of 128 000 triangles. That is the mechanism the
 *  sickle lesson would need: flipping beta6 Glu->Val must change the
 *  colour of one patch and move NOTHING, because the claim is that the
 *  fold does not move.
 * ===================================================================== */

const PAL = MolLib.PALETTE;
const CHAIN_COLOR = { alpha: 0xb07a24, beta: 0x8a5a9e };
const IRON_COLOR = 0xa8321a, IRON_R = 1.1;

const canvas = document.getElementById('gl');
const { scene, camera, renderer, root, cam, applyCam, resize } =
  Stage.create(canvas, { cam:{ theta:0.6, phi:1.15, r:110 }, rMin:20, rMax:260 });

/* THE DECODER NOW LIVES IN surface.js, as SurfLib.decode. It moved the
   moment a second page wanted a baked surface: a format reader is the worst
   thing in this repo to have two of, because a copy that drifts from the
   writer does not crash — it draws something subtly wrong. The format
   itself is still specified in bake-surface.js's header, which is where it
   belongs, next to the code that writes it. */

/* ------------------------------------------------------------------ *
 *  ribbon, exactly as the lessons draw it
 * ------------------------------------------------------------------ */
function addChain(parent, CA, ss, color) {
  /* RibbonLib.build reads .x/.y/.z off its points, not [0][1][2]. */
  const geo = RibbonLib.build(THREE, CA.map(p => new THREE.Vector3(p[0], p[1], p[2])), ss, {});
  parent.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, roughness: .55, metalness: .05, side: THREE.DoubleSide,
  })));
}
const ironMat = new THREE.MeshStandardMaterial({ color: IRON_COLOR, roughness: .35, metalness: .35 });
function addHeme(parent, h) {
  const fe = h.atoms.find(a => a.el === 'FE').p;
  const m = new THREE.Mesh(new THREE.SphereGeometry(IRON_R, 12, 8), ironMat);
  m.position.set(fe[0], fe[1], fe[2]);
  parent.add(m);
}

/* ------------------------------------------------------------------ *
 *  what the surface is coloured by
 * ------------------------------------------------------------------ */
/* `key` drives colourFor; `label` is what fits in a third of the panel.
   Kept as one table so the two can never drift apart. */
const MODES = [
  { key: 'plain',          label: 'plain' },
  { key: 'chain',          label: 'chain' },
  { key: 'hydrophobicity', label: 'hydro' },
  { key: 'beta6',          label: 'β6'  },
];

/* ------------------------------------------------------------------ *
 *  the two molecules
 * ------------------------------------------------------------------ *
 *  Both are built up front and both stay in the scene; swapping is one
 *  `visible` flag per group. That is not laziness about memory — it is
 *  what makes the comparison trustworthy. Rebuilding on each press would
 *  put a rebuild between the two pictures, and the eye cannot compare
 *  across a gap it has to wait through. Two groups toggled on the same
 *  frame is a blink comparator, which is the instrument for exactly this
 *  job: anything that moves, moved.
 *
 *  `align` is applied here and ONLY here — a matrix on the group, read
 *  out of the bake. See bake-hbs.js for why it is not in the coordinates.
 */
const VARIANTS = [
  { key: 'hba', label: 'normal',
    quat: 'data/2HHB-quaternary.json', surf: 'data/2HHB.surf.bin',
    baker: 'bake-quaternary.js' },
  { key: 'hbs', label: 'sickle',
    quat: 'data/2HBS-T1-quaternary.json', surf: 'data/2HBS-T1.surf.bin',
    baker: 'bake-hbs.js' },
];
let variant = 0;
let mode = 0, surf = null, surfMat = null, S = null;

/* The swatch is the single source of truth for the plain colour — there
   is no JS constant shadowing it, so the picker and the render cannot
   disagree. Picking switches back to plain mode, because a swatch that
   silently does nothing while you are in `hydro` is worse than one that
   moves you to where its effect is visible. */
const plainCol = document.getElementById('plainCol');
plainCol.oninput = () => {
  document.getElementById('plainHex').textContent = plainCol.value;
  mode = MODES.findIndex(m => m.key === 'plain');
  if (surf) paint();
};

/* Built from MODES rather than written out in the HTML, so adding a
   fourth way to colour the skin is one line in the table above. */
const seg = MODES.map((m, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = m.label;
  b.setAttribute('aria-pressed', String(i === mode));
  b.onclick = () => { if (surf) { mode = i; paint(); } };
  document.getElementById('seg').appendChild(b);
  return b;
});

/* Kyte-Doolittle, straight off SickleLib — the same scale sickle-lab
   colours its residues with, so a greasy patch is greasy in both.
   HEM is NOT on that scale and must not be given a value on it:
   SickleLib.hydro answers 0 for anything it does not know, which would
   paint the four hemes "averagely greasy" — a number the scale never
   made. Membership of KD is the test, and off-scale draws neutral. */
const NEUTRAL = new THREE.Color(0.62, 0.62, 0.66);

/* ------------------------------------------------------------------ *
 *  the beta6 patch
 * ------------------------------------------------------------------ *
 *  The mutation is TWO SIDE CHAINS out of 4 550 atoms — at tetramer scale
 *  a patch a few pixels across — so whatever marks it cannot be a subtle
 *  tint, and it must not be stuck at the skin's opacity. The skin wants to
 *  be at 0.28 so you can see the ribbon through it. A marker at 0.28 is
 *  invisible. Those are opposite requirements on one number.
 *
 *  WHICH IS WHY THE PATCH IS ITS OWN MESH. A single mesh has a single
 *  material and a single `opacity`; per-vertex alpha would only ever
 *  MULTIPLY that, so the patch could be made fainter than the skin and
 *  never bolder — exactly backwards. Splitting the beta6 triangles into a
 *  second geometry buys two genuinely independent materials, and lets the
 *  marker draw solid over a translucent skin, which is what every figure
 *  that points at a residue actually does.
 *
 *  It costs nothing to draw: the two meshes SHARE their position and
 *  normal attributes and differ only in the index, so nothing is uploaded
 *  twice. The patch is a few hundred triangles out of 128 000.
 *
 *  BOTH beta chains are marked. The substitution is in the gene, so every
 *  beta chain in the tetramer carries it; marking one would imply a
 *  heterozygote, which is a different molecule and a different lesson.
 */
const BETA = new Set(['B', 'D']);

/* Triangles ALL THREE of whose vertices sit on beta6. "Any vertex" would
   drag in every triangle straddling the boundary and puff the patch out
   over its neighbours by a whole triangle in each direction — on a mark
   this small that is most of its apparent size, and it would make the
   patch look bigger than the residue is. All-three under-draws by a hair
   instead, which is the honest direction to err. */
function patchOf(S) {
  const isB6 = new Uint8Array(S.head.residues.length);
  S.head.residues.forEach(([chain, num], i) => {
    if (num === 6 && BETA.has(chain)) isB6[i] = 1;
  });
  const src = S.geo.getIndex().array;
  const keep = [];
  for (let t = 0; t < src.length; t += 3)
    if (isB6[S.res[src[t]]] && isB6[S.res[src[t+1]]] && isB6[S.res[src[t+2]]])
      keep.push(src[t], src[t+1], src[t+2]);
  if (!keep.length) throw new Error('no beta6 triangles — is residue 6 buried, or mis-tagged?');

  const geo = new THREE.BufferGeometry();
  /* The SAME attribute objects, not copies — three uploads each buffer
     once and both meshes draw out of it. */
  geo.setAttribute('position', S.geo.getAttribute('position'));
  geo.setAttribute('normal', S.geo.getAttribute('normal'));
  geo.setIndex(keep);
  geo.computeBoundingSphere();

  /* The residue name, read off the mesh rather than assumed, so the panel
     and the `follow chemistry` colour both come from the data. */
  const names = [...new Set(S.head.residues
    .filter(([c, n]) => n === 6 && BETA.has(c)).map(r => r[2]))];
  return { geo, tris: keep.length / 3, name: names.join('/') };
}
const B6_MUTED = new THREE.Color(0.88, 0.88, 0.90);
function colourFor(m, resName, chain, num) {
  if (m === 'chain')
    return new THREE.Color(chain === 'A' || chain === 'C' ? CHAIN_COLOR.alpha : CHAIN_COLOR.beta);
  if (m === 'hydrophobicity')
    return (resName in SickleLib.KD) ? new THREE.Color(SickleLib.colour(resName)) : NEUTRAL;
  /* beta6 mode mutes EVERYTHING, the patch included. It does not colour the
     patch, because the patch is not painted here any more — it is its own
     mesh with its own material, so that it can carry an opacity independent
     of the skin. This mode's only job is to take the rest of the molecule
     out of the way. */
  if (m === 'beta6') return B6_MUTED;
  /* Whatever the swatch says. It starts near-neutral, barely cool — the
     reference figure's skin. An earlier version was bluer and it competed
     with the beta chains' violet: at 0.28 opacity a tinted skin does not
     read as a tint, it reads as a change to the colour of whatever is
     underneath it. That is the thing to keep an eye on while picking, and
     the reason this is a knob rather than a constant.

     r128 has no colour management, so setStyle just divides by 255 —
     the hex in the swatch is the number in the shader. */
  return new THREE.Color().setStyle(plainCol.value);
}

function paint() {
  const m = MODES[mode].key;
  const col = new Float32Array(S.nVert * 3);
  /* One colour per RESIDUE, looked up once, then splatted per vertex —
     578 lookups rather than 63 924. */
  const table = S.head.residues.map(([chain, num, name]) => colourFor(m, name, chain, num));
  for (let v = 0; v < S.nVert; v++) {
    const c = table[S.res[v]];
    col[v*3] = c.r; col[v*3+1] = c.g; col[v*3+2] = c.b;
  }
  S.geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  surfMat.vertexColors = true;
  surfMat.color.set(0xffffff);
  surfMat.needsUpdate = true;
  seg.forEach((b, i) => b.setAttribute('aria-pressed', String(i === mode)));
  document.getElementById('swatch').classList.toggle('off', m !== 'plain');
}

/* ------------------------------------------------------------------ *
 *  switching
 * ------------------------------------------------------------------ *
 *  EVERY SETTING IS OWNED BY THE PAGE, NOT BY THE VARIANT. Opacity, the
 *  colour mode, the plain swatch, whether the skin is shown at all, and
 *  the camera — all of them live out here and are re-applied to whichever
 *  molecule is on screen. If any one of them belonged to the mesh, then
 *  pressing `v` would change two things at once and the page would stop
 *  being able to answer its own question.
 */
let surfaceOn = true, b6chem = true;

function show(i) {
  variant = i;
  built.forEach((b, k) => b.group.visible = (k === i));
  const b = built[i];
  S = b.S; surf = b.surf; surfMat = b.surfMat;

  surf.visible = surfaceOn;
  surfMat.opacity = op.value / 100;
  paint();
  paintB6();

  vseg.forEach((btn, k) => btn.setAttribute('aria-pressed', String(k === i)));
  btn.textContent = (surfaceOn ? 'hide' : 'show') + ' surface (s)';
}

/* ------------------------------------------------------------------ *
 *  the patch's own colour and opacity
 * ------------------------------------------------------------------ *
 *  `follow chemistry` is the default and is the scientifically loaded
 *  setting: the patch takes its colour from Kyte-Doolittle, so pressing
 *  `v` flips it from Glu's charged blue to Val's greasy orange and the
 *  COLOUR CHANGE IS THE FINDING. That is the one thing on this page that
 *  actually differs between the two molecules.
 *
 *  Turning it off pins one colour across both. That sounds like throwing
 *  the lesson away, and it is the other half of it: with the colour held
 *  fixed you are asking a different question — does the patch MOVE, or
 *  change shape? (It does not.) Two questions, one switch, and neither is
 *  answerable while the other is confounding it.
 *
 *  The patch is deliberately NOT tied to `s`. Hiding the skin to look at
 *  the ribbon and keeping the marker is a view worth having — it puts the
 *  mutation on the fold rather than on the surface. It hides at 0.
 */
/* Applied to BOTH molecules, not just the visible one. Under `follow
   chemistry` the two land on different colours by design, and settling
   that at the moment of the switch would mean the first frame after `v`
   still carried the old molecule's colour — a flash of the wrong answer,
   on the one transition the page exists to show. */
const chemHex = b => '#' + new THREE.Color(SickleLib.colour(b.b6name.split('/')[0])).getHexString();

function paintB6() {
  if (!built.length) return;
  const usable = b => b6chem && (b.b6name.split('/')[0] in SickleLib.KD);
  built.forEach(b => {
    b.b6mat.color.set(usable(b) ? chemHex(b) : b6col.value);
    b.b6mat.opacity = b6op.value / 100;
    b.b6.visible = +b6op.value > 0;
  });

  const b = built[variant];
  const chem = usable(b);
  const hex = chem ? chemHex(b) : b6col.value;

  /* The swatch shows the colour actually in use even when it is not the
     one driving it, so `follow chemistry` is legible as a colour and not
     just as a latch — and turning the latch off starts from what you were
     already looking at rather than jumping to some stored value. */
  if (chem) b6col.value = hex;
  document.getElementById('b6').classList.toggle('chem', b6chem);
  document.getElementById('b6chem').setAttribute('aria-pressed', String(b6chem));
  document.getElementById('b6res').textContent = `· β6 = ${b.b6name} · ${b.b6tris} tris`;
  b6ov.textContent = (b6op.value / 100).toFixed(2);
}

/* The readout is the point of the exercise, so every number in it is read
   off the two bakes at render time — none of it is typed. The deltas are
   what the toggle is asking about, and putting them in figures next to a
   comparison you are making by eye is what stops "I think it looks a bit
   bigger" from being the finding. */
function diff() {
  const [a, s] = built;
  const pct = (x, y) => ((y - x) / x * 100).toFixed(1).replace(/^(?!-)/, '+');
  /* Read off the SURFACE's own residue table, which both bakes carry, so
     the two sides of the arrow come from the same place by the same rule.
     2HBS's bake also writes a `beta6` field, but using it for one side and
     something else for the other is how a readout ends up comparing two
     different facts and looking like it agrees with itself. */
  const b6 = b => [...new Set(b.S.head.residues
    .filter(([ch, num]) => num === 6 && BETA.has(ch))
    .map(([, , name]) => name))].join('/');
  document.getElementById('diff').innerHTML =
    [`β6      <b>${b6(a)}</b> → <b>${b6(s)}</b>`,
     `atoms   ${a.S.head.atoms} → ${s.S.head.atoms}  (${s.S.head.atoms - a.S.head.atoms})`,
     `area    ${a.S.head.area.toFixed(0)} → ${s.S.head.area.toFixed(0)} Å²  (${pct(a.S.head.area, s.S.head.area)}%)`,
     `volume  ${a.S.head.volume.toFixed(0)} → ${s.S.head.volume.toFixed(0)} Å³  (${pct(a.S.head.volume, s.S.head.volume)}%)`,
     `fit     ${s.quat.align.rmsd} Å rmsd over ${s.quat.align.n} Cα`,
    ].join('\n');
}

/* WHAT THE AREA DELTA IS NOT. It is a few percent, and the mutation is four
   atoms — 0.09% of the molecule — so the two numbers do not explain each
   other and it would be wrong to let the panel imply they do. The delta is
   measured, and it is not a grid artifact: re-baking 2HBS in 2HHB's own
   orientation moves its area by 0.04%, so the anisotropy of an axis-aligned
   marching-cubes grid is two orders of magnitude too small to account for
   it. What is left is that these are two different crystals of the same
   protein — 2.05 A against 1.74 A, different packing, different surface
   rotamers — and side-chain rotamers are what surface area is most
   sensitive to. So: a real difference between two deposited models, and
   NOT the fingerprint of Glu6Val. Volume, which rotamers barely move,
   agrees to 0.2%, and that is the number that says the molecule is the
   same size. */


const vseg = VARIANTS.map((v, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = v.label;
  b.setAttribute('aria-pressed', String(i === variant));
  b.onclick = () => { if (built.length) show(i); };
  document.getElementById('var').appendChild(b);
  return b;
});

/* ------------------------------------------------------------------ */

const grab = (url, how, fix) => fetch(url).then(r => {
  if (!r.ok) throw new Error(`${url} — HTTP ${r.status} (run: node hemoglobin/tools/${fix})`);
  return how === 'json' ? r.json() : r.arrayBuffer();
});

/* One molecule: ribbon group, surface, and everything the panel says about
   it. The surface material is PER VARIANT but its settings are not — see
   `sync` below, which is the whole reason this returns a record instead of
   just adding things to the scene. */
function build(V) {
  return Promise.all([
    grab(V.quat, 'json', V.baker),
    grab(V.surf, 'bin',  V.baker === 'bake-hbs.js' ? V.baker : 'bake-surface.js'),
  ]).then(([quat, surfBuf]) => {
    const group = new THREE.Group();

    /* THE ALIGNMENT, applied as a transform and nowhere else. 2HHB's bake
       carries no `align` and needs none — it IS the frame everything else
       is brought to — so an absent field means identity, not an error. */
    const A = quat.align;
    if (A) group.matrixAutoUpdate = false, group.matrix.set(
      A.R[0][0], A.R[0][1], A.R[0][2], A.t[0],
      A.R[1][0], A.R[1][1], A.R[1][2], A.t[1],
      A.R[2][0], A.R[2][1], A.R[2][2], A.t[2],
      0, 0, 0, 1);

    /* The folded chain's ss comes from the SAME HELIX records as the other
       three (bake-quaternary.js writes `foldedSS`), not from the folding
       trajectory this page used to load an 800 KB file for. Two chains
       assigned two different ways differ at every helix end, and on a
       page whose job is spotting differences that is poison. */
    addChain(group, quat.foldedTrace, quat.foldedSS.split(''), CHAIN_COLOR.beta);
    quat.order.forEach(id => {
      const c = quat.chains[id];
      addChain(group, c.CA, c.ss.split(''), c.kind === 'alpha' ? CHAIN_COLOR.alpha : CHAIN_COLOR.beta);
    });
    Object.values(quat.heme).forEach(h => addHeme(group, h));

    const S = SurfLib.decode(THREE, surfBuf);
    const surfMat = new THREE.MeshStandardMaterial({
      roughness: .35, metalness: .0,
      transparent: true, opacity: 0.28,
      /* See "drawing translucent over opaque" above — every one of these
         three is load-bearing and the failure each prevents is different. */
      depthWrite: false, side: THREE.FrontSide,
    });
    const surf = new THREE.Mesh(S.geo, surfMat);
    surf.renderOrder = 1;
    group.add(surf);

    /* renderOrder 2: after the skin, so the marker composites ON TOP of it
       rather than fighting it. depthWrite stays off for the same reason the
       skin's does — see "drawing translucent over opaque". */
    const P = patchOf(S);
    const b6mat = new THREE.MeshStandardMaterial({
      roughness: .3, metalness: .0, transparent: true, opacity: 1,
      depthWrite: false, side: THREE.FrontSide,
    });
    const b6 = new THREE.Mesh(P.geo, b6mat);
    b6.renderOrder = 2;
    group.add(b6);

    root.add(group);

    /* Centroid in the PAGE's frame, so the two agree on where to look —
       the group transform has to be applied to it, or the sickle variant
       would compute its camera target in the crystal's frame and the
       molecule would sit off-centre the moment you switched to it. */
    let c = new THREE.Vector3(), n = 0;
    quat.foldedTrace.concat(...quat.order.map(id => quat.chains[id].CA))
      .forEach(p => { c.x += p[0]; c.y += p[1]; c.z += p[2]; n++; });
    c.divideScalar(n).applyMatrix4(group.matrix);

    return { V, quat, S, group, surf, surfMat, b6, b6mat, b6name: P.name,
             b6tris: P.tris, centre: c, bytes: surfBuf.byteLength };
  });
}

let built = [];
Promise.all(VARIANTS.map(build)).then(bs => {
  built = bs;

  /* One camera target for BOTH. Averaging rather than taking the active
     variant's own centroid: they are 0.58 A apart, so the difference is
     invisible, but recentring on switch would nudge every pixel and that
     is the one thing a blink comparator must never do. */
  const t = new THREE.Vector3();
  bs.forEach(b => t.add(b.centre));
  cam.target.copy(t.divideScalar(bs.length));
  applyCam();

  /* THE COMPARISON'S ONE PRECONDITION, CHECKED OUT LOUD. Two SES meshes are
     only comparable if they were built on the same grid at the same probe:
     a 1.1 A skin next to a 0.7 A one is visibly smoother and reads several
     percent low on area, and every bit of that would be mistaken for the
     mutation. sickle/data/2HBS-T1.surf.bin is exactly such a mesh — same
     atoms, coarser grid, one directory away — so pointing this page at the
     wrong file is a real mistake somebody will make. Nothing offline can
     catch it, because the pairing only exists here. Failing loudly beats
     drawing a confident wrong answer. */
  const [a, s] = bs;
  for (const k of ['spacing', 'probe'])
    if (a.S.head[k] !== s.S.head[k])
      throw new Error(`${a.quat.source} and ${s.quat.source} were baked at ` +
        `different ${k} (${a.S.head[k]} vs ${s.S.head[k]}) — they are not ` +
        `comparable. Re-run: node hemoglobin/tools/bake-hbs.js --spacing ${a.S.head[k]}`);

  diff();
  show(variant);
}).catch(e => {
  const d = document.createElement('div');
  d.style = 'position:absolute;left:16px;bottom:16px;color:#a33;font-family:monospace;z-index:9';
  d.textContent = 'could not start — ' + e.message;
  document.body.appendChild(d);
});

/* ---- controls ---- */
const btn = document.getElementById('toggle'), op = document.getElementById('op'),
      ov = document.getElementById('ov'),
      b6col = document.getElementById('b6col'), b6op = document.getElementById('b6op'),
      b6ov = document.getElementById('b6ov');
/* surfaceOn rather than reading surf.visible back: the flag has to outlive
   the mesh it was last applied to, or switching molecules with the skin
   hidden would bring it back. */
function toggle() {
  if (!surf) return;
  surfaceOn = !surfaceOn;
  surf.visible = surfaceOn;
  btn.textContent = (surfaceOn ? 'hide' : 'show') + ' surface (s)';
}
function cycle() { if (surf) { mode = (mode + 1) % MODES.length; paint(); } }
function swap() { if (built.length) show((variant + 1) % built.length); }
btn.onclick = toggle;
op.oninput = () => {
  ov.textContent = (op.value / 100).toFixed(2);
  if (surfMat) surfMat.opacity = op.value / 100;
};
ov.textContent = (op.value / 100).toFixed(2);

/* Picking a colour turns `follow chemistry` off, because otherwise the
   picker would visibly do nothing — the same rule the plain swatch above
   follows, for the same reason. */
b6col.oninput = () => { b6chem = false; paintB6(); };
document.getElementById('b6chem').onclick = () => { b6chem = !b6chem; paintB6(); };
b6op.oninput = paintB6;

addEventListener('keydown', e => {
  if (e.key === 's') toggle();
  if (e.key === 'c') cycle();
  if (e.key === 'v') swap();
});

new ResizeObserver(resize).observe(canvas);
(function loop(){ requestAnimationFrame(loop); renderer.render(scene, camera); })();
</script>
</body>
</html>
